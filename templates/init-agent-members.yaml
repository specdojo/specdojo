# yaml-language-server: $schema=../docs/specdojo/schemas/v1/agent-members.schema.yaml
# Agent definitions used by `specdojo init --exec`.
# The init command selects only the members whose provider was requested, and only the
# aliases whose target member was selected.
#
# The roster has two levels (PJR-ZM1K):
#   members : concrete agents named after the model family (sonnet-executor, terra-executor, ...).
#             Each member carries the provider, model, and role. The model version is written
#             only in `model`, so replacing a model touches one place.
#   aliases : the earlier names (claude-executor, codex-executor, ...). Each alias points at a
#             concrete member, so Jobs, routines, documents, and user settings keep working.
# Events and results record the concrete member name, so the model that actually ran is kept.
version: 1
members:
  - nickname: sonnet-executor
    display_name: Claude Sonnet Executor
    email: null
    roles: []
    type: agent
    provider: claude
    model: sonnet
    mode: edit
    stage_role: executor
    capabilities: [web_search]
    proficiency: normal
    priority: 2
    persona: task-executor
    scheduler_strategy: critical-first
  - nickname: sonnet-review-executor
    display_name: Claude Sonnet Review Executor
    email: null
    roles: []
    type: agent
