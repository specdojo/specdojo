# Antigravity CLI（agy）agent 定義のスニペット。
# members の要素をリポジトリ共通の .specdojo/agent-members.yaml へコピーして使う。
# project ごとの pm-members.yaml は人間専用なので、agent は記載しない。
# 起動コマンドは member には書かず、.specdojo/exec-defaults.yaml の
# providers.antigravity.command_template で定義する（exec-defaults-snippet.yaml を参照）。
# モデルの差し替えは command_params.by_nickname で行う。
# 既定では disabled にしてある。使う member だけ disabled を外す。

version: 1
members:
  - nickname: agy-executor
    disabled: true
    priority: 4
    display_name: Antigravity Executor
    email: null
    roles: []
    type: agent
    provider: antigravity
    mode: edit
    proficiency: normal
    persona: task-executor
    capabilities: []

  - nickname: agy-expert-executor
    disabled: true
    priority: 3
    display_name: Antigravity Expert Executor
    email: null
    roles: []
    type: agent
    provider: antigravity
    mode: edit
    proficiency: expert
    persona: task-executor
    capabilities: []

  - nickname: agy-expert-review-executor
    disabled: true
    priority: 3
    display_name: Antigravity Expert Review Executor
    email: null
    roles: []
    type: agent
    provider: antigravity
    mode: review
    proficiency: expert
    persona: reviewer
    capabilities: []

  - nickname: agy-reporter
    disabled: true
    priority: 4
    display_name: Antigravity Reporter
    email: null
    roles: []
    type: agent
    provider: antigravity
    mode: report
    proficiency: normal
    persona: reporter
    capabilities: []
