# yaml-language-server: $schema=../docs/specdojo/schemas/v1/exec-defaults.schema.yaml
# exec-defaults.yaml
# specdojo exec run の共通実行設定。
#
# エージェント選択に使う作業要件（mode / capabilities / proficiency）は
# sch-strategy-<track>.yaml の phase に定義する。
#
# rate_limit_detection / rate_limit_policy は全 provider 共通のグローバル既定値。
# 検出シグナル・終了コード・待機時間は provider ごとに異なるため、provider 別の
# 上書きは providers.<provider> に置く（キーは pm-members[].provider に対応）。
# member ごとに、対応する provider ブロックがあればそれを、なければ下のグローバル
# 既定を使う。検出は候補ごとに provider で解決し、retry/backoff の policy は最優先
# 候補（candidates[0]）の provider で解決する。

# executor の sandbox では実行できない検証を、executor 成功後・reporter 起動前に
# SpecDojo 親プロセスが固定許可リストから実行する。設定できるのは ID だけで、agent の
# evidence や設定ファイルから任意の command / 引数を注入することはできない。
pipeline:
  # 2 本にすると agent 4 本と重なって負荷で短い制限のテストが時間切れになったため、1 本ずつに戻す（2026-11-14 indie の依頼）。
  parent_validation_concurrency: 1
  parent_validations:
    # lint は短時間で終わるため先に実行し、executor が残した ESLint・frontmatter・Markdown の
    # エラーを統合前に検出する（PJR-K1Z5）。
    # paths を書いた検証は、executor が変えたファイルに合うときだけ流す（PJR-T01P）。
    # 軽い lint は parallel: true で並べて流し、test は 1 本ずつにする（PJR-50RQ）。
    - id: lint-ts # npm run lint:ts
      paths: ["{src,tests,tools,packages}/**/*.{ts,js,mjs,cjs}", "eslint.config.js"]
    # 変えた Markdown だけに流す。lint の規則や設定を変えた run では下の全体の lint を流す（PJR-50RQ）。
    - { id: lint-md-changed, parallel: true } # npm run lint:md:changed
    - { id: lint-fm-changed, parallel: true } # npm run lint:fm:changed
    - id: lint-md # npm run lint:md
      paths: ["packages/docs-lint/**", ".markdownlint*", "package.json"]
      parallel: true
    - id: lint-fm # npm run lint:fm
      paths: ["packages/docs-lint/**", ".remarkrc*", "package.json"]
      parallel: true
    # Mermaid の構文エラーは docs:build まで分からないため、統合前に検出する（PJR-B5TY）。
    - { id: lint-mermaid, parallel: true } # npm run lint:mermaid
    - { id: lint-d2, parallel: true } # npm run lint:d2
    # 実際の文書を読むテストは unit・integration から分けて、文書を変えた run で流す（PJR-50RQ）。
    - id: test-docs # npm run test:docs
      paths: ["docs/ja/specdojo/**", "docs/specdojo/**"]
    # sandbox 内では tsx の IPC ソケット作成、Vitest の終了、git の子プロセス終了が
    # 成立せず、成果物と無関係に failed となるため親プロセスで実行する（PJR-QVGX）。
    - id: test-integration # npm run test:integration（shell を介さず固定 argv で実行）
      paths: ["{src,tests,tools,scripts,packages}/**", "vitest.*", "tsconfig*.json"]
    - validate-schema # npm run validate:schema
    # 型エラーは Vitest では検出できず、統合時の pre-commit hook まで持ち越されるため、
    # test-unit の前に親検証として実行する（PJR-W66B）。docs-site の .vitepress も対象（PJR-C8J8）。
    - id: typecheck # npm run typecheck
      paths:
        [
          "{src,tests,scripts,tools}/**",
          "packages/docs-lint/**",
          "packages/docs-site/**",
          "tsconfig*.json",
        ]
    # 実際の文書を読むテストを test-docs に分けたため、コードを変えた run だけで流す（PJR-50RQ）。
    - id: test-unit # npm run test:unit
      paths: ["{src,tests,tools,scripts,packages}/**", "vitest.*", "tsconfig*.json"]
  # 親の検証が passed のとき、統合の commit で同じ hook を流し直さない（PJR-T01P）。
  commit_hook_skips:
    - { hook: typecheck, covered_by: [typecheck] }
    - { hook: test, covered_by: [test-unit, test-integration] }
  # 決まった形の edit result は reporter の agent を起こさず runner が作る（PJR-T01P）。
  mechanical_result: true
  # src を変えた統合の後に親が dist を作り直し、次の run が古い dist で止まらないようにする（PJR-8KXJ）。
  # 失敗しても統合は戻さず、dist/.specdojo-build-failed を置いて次の exec を止める。
  post_integration:
    - id: build-dist
      paths: ["src/**", "tsconfig*.json"]

# register 項目は失敗時の変更と再開用 checkpoint を隔離するため、既定で task worktree
# を使う。短時間の軽微な作業を現在の作業ツリーで行う場合だけ --in-place を明示する。
run:
  register_execution: worktree

# register 項目の難しさ（個票の difficulty）ごとの agent の振り分け（PJR-5HYP）。
# exec run --register と orchestrator night が使い、CLI の --executor-by などの指定が優先する。
# difficulty のない個票は、従来どおり stage_role と priority で選ぶ。
# - hard: Claude の opus。代わりは Claude の sonnet。
# - medium: Claude の sonnet。代わりは Claude の opus。
# - easy: ローカルの qwen。docs・src・tests の外を触らない小さな作業に限る。代わりは Claude の sonnet。
# codex（sol）は 2026-11-21 から使えないため、routing から外した（indie の依頼）。
routing:
  hard:
    executor_by: opus-executor
    reporter_by: gemma26-reporter
    on_rate_limit: fallback
    fallback_executor_by: sonnet-executor
    fallback_reporter_by: sonnet-reporter
  medium:
    executor_by: sonnet-executor
    reporter_by: gemma26-reporter
    on_rate_limit: fallback
    fallback_executor_by: opus-executor
    fallback_reporter_by: sonnet-reporter
  easy:
    executor_by: qwen-executor
    reporter_by: gemma26-reporter
    on_rate_limit: fallback
    fallback_executor_by: sonnet-executor
    fallback_reporter_by: sonnet-reporter

rate_limit_detection:
  # exit_codes は最小限にする。多くの agent CLI は通常失敗と agent 自身の block も
  # exit 1 で返すため、素の exit 1 は rate limit と区別できない。通常失敗を利用制限
  # として延期しないよう、共通既定では exit code 単独の検出を行わない。
  exit_codes: []
  # stderr_patterns は既定で「プロセスが非ゼロ終了した場合のみ」rate limit とみなす
  # （stderr_requires_nonzero_exit の既定は true）。成果物本文に "rate limit" 等の
  # 語が含まれ、agent が成功（exit 0）したままその差分を stderr に出力しても誤検出
  # しない。終了コードに依らず stderr のみで判定したい場合は false を明示する。
  stderr_patterns:
    - "rate limit"
    - "429"

rate_limit_policy:
  # provider 出力に reset / retry-after が無い一時的な rate limit だけ、明示した
  # cooldown を再開時刻として使用する。quota_exhausted は自動再開しない。
  cooldown_seconds:
    rate_limit: 900
  on_non_critical:
    action: skip # cpm.slack > 0: block イベントを記録して次のタスクへ
  on_critical:
    action: try_next # cpm.slack == 0: candidates 配列の次の agent へ
    retry:
      max_attempts: 3
      initial_wait_seconds: 60
      backoff_multiplier: 3 # 60s -> 180s -> 540s
      max_wait_seconds: 600
    on_exhausted: block # 全候補試行後はブロックして人間に委ねる

# provider 別の設定。command_template は agent の起動コマンドで、member 属性
# （{nickname} / {model} / {mode} / {proficiency} と command_params の変数）で展開する。
# {model} は実体の member の model（PJR-ZM1K・PJR-YK1C）。{nickname} には別名ではなく実体の名前が入る。
# member 側の command はテンプレートを持たない構成（provider: custom 等）専用の上書き。
#
# 検出・ポリシー上書きは、各 provider ブロックの rate_limit_detection を
# 与えた場合、その provider の member ではグローバル rate_limit_detection を完全に
# 置き換える（exit_codes を省略すれば exit code 起因の誤検出を避けられる）。
#
# limit の種類は provider ごとに異なる（rate limit / session limit / 週次・月次 quota）。
# reset horizon により retryable と回復戦略が変わるため、詳細は各 provider 設計書の
# limit 表を参照する。stderr の実文言は CLI バージョンで変わりうるため、下記 pattern は
# 実際の出力で検証してから確定する。
providers:
  claude:
    # Claude の週の枠に余裕があるため、2026-11-17 1:00 まで opus を 3 本まで使う（indie の依頼）。
    max_concurrency: 3
    # 役割の定義は .claude/agents/ の役割ごとの 1 ファイル（PJR-TSP6）を mode で選び、
    # モデルは実体の member の model を --model で渡す。permission は mode 別 settings で分離する。
    command_template: "claude -p --verbose --agent {agent} --model {model} --settings .specdojo/claude/settings.{mode}.json"
    command_params:
      # frontier（PJR-DGRZ）は名前指定のときだけ使う。model と役割は member と mode から決まる。
      by_proficiency:
        frontier: {}
      by_mode:
        edit: { agent: claude-executor }
        review: { agent: claude-review-executor }
        report: { agent: claude-reporter }
    # Anthropic API: 429 / rate limit に加え、モデル高負荷時の overloaded を検出。
    # session limit は logs/exec-auto.log で実観測:
    #   "You've hit your session limit · resets 4:10am (UTC)"
    # （rate limit / 429 を含まないため exit 1 ではなくこの文言で検出する必要がある）
    rate_limit_detection:
      stderr_patterns:
        - "rate limit"
        - "429"
        - "overloaded"
        - "session limit"

  copilot:
    # edit / review とも同一の許可リスト方式（shell は読み取り系・検証系のみ、git の
    # 変更系は deny）。write はパス単位に絞れないため許可し、成果物変更の境界は
    # specdojo CLI の commit 許可リストで作る。プレースホルダは不要のため使わない。
    # model は auto（Copilot の自動モデル選択）で常に最新・最適なモデルへ追従する。
    # ローカル config に persist された model 設定に依存しないよう明示する。
    command_template: >-
      copilot -p "$(cat)" --no-color --no-ask-user --model auto
      --no-remote --no-remote-export --disable-builtin-mcps
      --allow-tool write
      --allow-tool 'shell(git status)' --allow-tool 'shell(git diff)'
      --allow-tool 'shell(git log)' --allow-tool 'shell(git show)'
      --allow-tool 'shell(npm run)' --allow-tool 'shell(npm test)'
      --allow-tool 'shell(specdojo:*)'
      --deny-tool 'shell(git add)' --deny-tool 'shell(git commit)'
      --deny-tool 'shell(git push)' --deny-tool 'shell(git reset)'
    # Copilot: 429 / rate limit に加え、quota / premium request 上限の文言を検出。
    rate_limit_detection:
      stderr_patterns:
        - "rate limit"
        - "429"
        - "quota"
        - "premium request"

  codex:
    # 同時に走らせる codex の agent を 2 本までにする（2026-11-13 indie の依頼。当時は codex と agy を 2 本ずつ並べていた）。
    max_concurrency: 2
    # codex exec には worker 名を選択するオプションがないため {nickname} は使わない。
    # モデルは実体の member の model、reasoning effort は proficiency で切り替える。--ephemeral は rollout
    # ファイルを保存しない（実行履歴の正本は SpecDojo の event・plan・result）。
    # sandbox_workspace_write.network_access=false は sandbox 内からの直接の
    # ネットワークアクセスを遮断する（web_search はモデル側ツールのため影響しない）。
    command_template: 'codex exec --ephemeral --sandbox workspace-write -c approval_policy="never" -c sandbox_workspace_write.network_access=false --model {model} -c model_reasoning_effort="{effort}"'
    command_params:
      by_proficiency:
        normal: { effort: medium }
        expert: { effort: high }
        frontier: { effort: xhigh }
    # OpenAI: 429 / rate limit（API）に加え、ChatGPT プランの 5時間枠（session limit）
    # と週次上限（weekly / usage limit）がスタックする。
    rate_limit_detection:
      stderr_patterns:
        - "rate limit"
        - "429"
        - "session limit"
        - "weekly limit"
        - "usage limit"

  opencode:
    # 役割の定義は .opencode/agents/ の役割ごとの 1 ファイル（PJR-TSP6）を mode で選び、
    # モデルは実体の member の model を --model で渡す。役割に収まらない agent
    # （翻訳、thinking を有効にした executor）は by_nickname で定義を指定する。
    command_template: "opencode run --agent {agent} --model {model}"
    command_params:
      by_mode:
        edit: { agent: opencode-executor }
        review: { agent: opencode-review-executor }
        report: { agent: opencode-reporter }
      by_nickname:
        gemma26-translator: { agent: gemma26-translator }
        qwen-expert-executor: { agent: opencode-expert-executor }
        gemma-expert-executor: { agent: opencode-expert-executor }
        qwen-expert-review-executor: { agent: opencode-expert-review-executor }
        gemma-expert-review-executor: { agent: opencode-expert-review-executor }
    # 同一ホストの単一 Ollama モデルを共有するため、複数の opencode agent を同時起動
    # するとメモリ競合・モデルロード待ちで不安定になる。1 ラウンドで同時に走る opencode
    # を 1 つに制限する（他 provider のグローバル --parallel は下げない）。
    max_concurrency: 1
    # ローカル Ollama: API rate limit より、モデルロード待ち・メモリ不足・接続
    # タイムアウトが主な失敗要因。exit 1 は実失敗なので exit_codes は空にする。
    rate_limit_detection:
      exit_codes: []
      stderr_patterns:
        - "timeout"
        - "out of memory"
        - "model is loading"
    # Ollama が止まっているなど、つながらないときは指定した代わりの agent へ切り替える（PJR-DKD8）。
    connection_error_detection:
      stderr_patterns:
        - "Cannot connect to API"
        - "ECONNREFUSED"
        - "connection refused"
    # 同一ホストの OpenCode provider を共有するため、別 member への try_next でも
    # モデル切替・メモリ不足は解消しないことがある。復旧は wait+backoff を優先する。
    rate_limit_policy:
      on_non_critical:
        action: skip
      on_critical:
        action: try_next
        retry:
          max_attempts: 3
          initial_wait_seconds: 120 # モデル再ロード/メモリ解放に時間がかかるため長め
          backoff_multiplier: 2 # 120s -> 240s -> 480s
          max_wait_seconds: 600
        on_exhausted: block
