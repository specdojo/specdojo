      の判定は英語で出力する（日本語での出力より判定が厳しく、中国語の字体が混ざらない）。finding の精度が grade
      に使える水準に届かないため無効にした（PJR-VQB5、2026-10-07）。モデル・サンプリング・権限は
      .opencode/agents/ornith-expert-executor.md と opencode.json で定義。
