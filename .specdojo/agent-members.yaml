      Claude Code CLI を使用する pipeline reporter。ファイルや外部情報へアクセスせず、渡された evidence
      から指定スキーマの構造化結果だけを返す（result への反映は runner が行う）。edit/review どちらの executor の後段にも使う。mode は
      command_template の {mode} を reporter 専用 profile に解決するための report とし、権限は Edit/Write と git
      add/commit を deny する .specdojo/claude/settings.report.json で定義する。モデル・ツールは
      .claude/agents/claude-reporter.md で定義。
