# yaml-language-server: $schema=../../../../specdojo/schemas/v1/dct.schema.yaml
id: prj-0001:dct-kata
type: project
status: draft
title: 成果物カタログ（実践の型）
rulebook: specdojo:dct-rulebook
project_id: prj-0001
domain: kata
base_path: /docs/ja/specdojo

# 実践の型（rulebook・sample）を成果物として整える段の対象を載せる（PJR-6998）。
# 代表は sample そのもの（駄菓子屋の共通サンプル文脈）で、rulebook は対応する型を指す。
# done_criteria は型に共通の 3 条件に、grade のし直し（run id regrade-kata-2026-11-21）の
# 大きい指摘から拾った型に固有の条件を足す。depends_on はテストの型の上下関係
# （tsp-index → 各 *-index → 対象別）に合わせ、上位の完成例と食い違わないよう順に整える。

groups:
  - name: サンプル
    base_path: samples
    deliverables:
      - local_id: tsp-index-sample
        name: テスト戦略・方針の完成例
        kind: work
        depends_on: []
        overview: 駄菓子屋の販売管理システムを題材に、テスト戦略・方針の完成例を示す
        path: tsp-index-sample.md
        rulebook: specdojo:tsp-index-rulebook
        done_criteria:
          - text: rulebook の章立てと必須の表に沿っていること
            roles: [QE]
            viewpoint: vp-qe-omissions-consistency
          - text: Sample 記述標準と共通サンプル文脈（駄菓子屋のプロジェクト）に沿っていること
            roles: [QE]
            viewpoint: vp-qe-kata-conformance
          - text: rulebook の禁止事項に当たらないこと
            roles: [QE]
            viewpoint: vp-qe-kata-conformance
          - text: 何を書くかの説明ではなく、テストレベル一覧・スコープ・体制・環境を値で埋めた成果物の実例になっていること
            roles: [QE]
            viewpoint: vp-qe-kata-conformance
          - text: 入口／出口条件（品質ゲート）を、失敗件数や重大度の上限など pass / fail を判定できる基準で示していること
            roles: [QE]
            viewpoint: vp-qe-verifiability
          - text: rulebook に完成例の章を残さず、完成例の正本が sample だけになっていること
            roles: [ARC]
            viewpoint: vp-arc-conciseness

      - local_id: utc-index-sample
        name: 単体テスト（全体構成）の完成例
        kind: work
        depends_on:
          - tsp-index-sample
        overview: 駄菓子屋の販売管理システムを題材に、単体テストの全体構成の完成例を示す
        path: utc-index-sample.md
        rulebook: specdojo:utc-index-rulebook
        done_criteria:
          - text: rulebook の章立てと必須の表に沿っていること
            roles: [QE]
            viewpoint: vp-qe-omissions-consistency
          - text: Sample 記述標準と共通サンプル文脈（駄菓子屋のプロジェクト）に沿っていること
            roles: [QE]
            viewpoint: vp-qe-kata-conformance
          - text: rulebook の禁止事項に当たらないこと
            roles: [QE]
            viewpoint: vp-qe-kata-conformance
          - text: H1 が rulebook の定めるタイトル形式で、Frontmatter の `based_on` に直接の根拠（tsp-index）を持つこと
            roles: [QE]
            viewpoint: vp-qe-kata-conformance
          - text: 受け入れ基準と合否の判定基準が、観測できる条件と期待値で書かれていること
            roles: [QE]
            viewpoint: vp-qe-verifiability

