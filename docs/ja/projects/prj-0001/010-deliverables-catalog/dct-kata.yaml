            viewpoint: vp-qe-kata-conformance
          - text: H1 が rulebook の定めるタイトル形式で、Frontmatter の `based_on` に tsp-index と utc-index を持つこと
            roles: [QE]
            viewpoint: vp-qe-kata-conformance
          - text: rulebook にない独自の必須観点を置かず、観点とケース表の列が rulebook の用語に一致していること
            roles: [QE]
            viewpoint: vp-ux-language-consistency
          - text: ケースごとに前提・入力・判定できる期待値があり、テストコードを書く手掛かりになること
            roles: [DEV]
            viewpoint: vp-dev-testability

