        note: *sac-ac-note
        done_criteria: *sac-done-criteria

      - local_id: sac-security-safety
        name: システム受入条件（機密性・安全性）
        kind: work
        depends_on:
          - nfr-security-safety
          - prj-success-criteria-and-acceptance-criteria
        overview: 不正利用防止・セキュリティ（認証・認可・アクセス制御等）に関するシステム全体としての合格基準を定義する
        path: sac-security-safety.md
