id: prj-0001:dct-system-acceptance-criteria
type: project
status: draft
title: 成果物カタログ（システム受入条件）
rulebook: specdojo:dct-rulebook
project_id: prj-0001
domain: system-acceptance-criteria
base_path: /docs/ja/product/070-system-acceptance-criteria

# sac-rulebook.md は「1ファイル=1受入対象（合格基準のまとまり）」を想定する。sac には
# bes-index のような一覧hubが無いため、既に作成済みの nfr-*（8カテゴリ固定）と1:1対応させ、
# depends_on・based_on（成果物frontmatter側）は対応する nfr-* を参照する。

groups:
  - deliverables:
      - local_id: sac-reliability
        name: システム受入条件（信頼性）
        kind: work
        depends_on:
          - nfr-reliability
          - prj-success-criteria-and-acceptance-criteria
        overview: 障害抑止・誤動作防止に関するシステム全体としての合格基準を定義する
        path: sac-reliability.md
        rulebook: specdojo:sac-rulebook
        recipe: not-needed
        sample: specdojo:sac-sample
        template: not-needed
        note: &sac-ac-note 根拠はAC-02（技術的受入：ID・参照関係・生成物の検証、支出・作業時間・判断者の追跡可能性）
        done_criteria: &sac-done-criteria
          - text: 業務機能・非機能の受入条件が業務観点で記述されていること
            roles: [BA]
            viewpoint: vp-ba-requirements-completeness
          - text: システム受入基準を承認できること
            roles: [PO]
            viewpoint: vp-po-decision-readiness
          - text: 技術的受入条件が実装と整合していること
            roles: [ARC]
            viewpoint: vp-arc-technical-constraints
          - text: 受入テスト設計・合格判定の基礎として活用できること
            roles: [QE]
            viewpoint: vp-qe-verifiability
          - text: 実装完了の判定基準として参照できること
            roles: [DEV]
            viewpoint: vp-dev-implementation-readiness

      - local_id: sac-availability
        name: システム受入条件（可用性）
        kind: work
        depends_on:
          - nfr-availability
          - prj-success-criteria-and-acceptance-criteria
        overview: システム稼働の継続性（稼働率・RTO/RPO・フェイルオーバー等）に関するシステム全体としての合格基準を定義する
        path: sac-availability.md
        rulebook: specdojo:sac-rulebook
        recipe: not-needed
        sample: specdojo:sac-sample
        template: not-needed
        note: *sac-ac-note
        done_criteria: *sac-done-criteria

      - local_id: sac-maintainability
        name: システム受入条件（保守性）
        kind: work
        depends_on:
          - nfr-maintainability
          - prj-success-criteria-and-acceptance-criteria
        overview: 変更容易性・復旧容易性に関するシステム全体としての合格基準を定義する
        path: sac-maintainability.md
        rulebook: specdojo:sac-rulebook
        recipe: not-needed
        sample: specdojo:sac-sample
        template: not-needed
        note: *sac-ac-note
        done_criteria: *sac-done-criteria

      - local_id: sac-integrity
        name: システム受入条件（完全性）
        kind: work
        depends_on:
          - nfr-integrity
          - prj-success-criteria-and-acceptance-criteria
        overview: データ正確性・改ざん防止に関するシステム全体としての合格基準を定義する
