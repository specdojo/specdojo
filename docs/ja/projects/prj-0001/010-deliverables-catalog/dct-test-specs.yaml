id: prj-0001:dct-test-specs
type: project
status: draft
title: 成果物カタログ（テスト）
rulebook: specdojo:dct-rulebook
project_id: prj-0001
domain: test-specs
base_path: /docs/ja/product/080-test-specs

# utc/itc は src/ の実構造（フラットな約65ファイル、prefixで9系統）を根拠にサブシステム単位で
# 対象を分割する。etc は dct-external-interface-specs.yaml の ifx-index（2連携）と対応させる。
# stc/atc は dct-business-acceptance-criteria.yaml の bac-*（cdfd-overview.md の10プロセス領域）
# と同じ粒度・命名を再利用する。

groups:
  - name: テスト戦略・方針
    base_path: 010-test-strategy-and-policy
    deliverables:
      - local_id: tsp-index
        name: テスト戦略・方針
        kind: work
        depends_on: []
        overview: テストレベル・スコープ・品質目標・体制・環境・ツール・入出口条件を定義する
        path: tsp-index.md
        rulebook: specdojo:tsp-index-rulebook
        recipe: undecided
        sample: specdojo:tsp-index-sample
        template: undecided
        done_criteria:
          - text: テストスコープと品質目標が業務観点で確認できること
            roles: [BA]
            viewpoint: vp-ba-requirements-completeness
          - text: テスト全体方針を承認できること
            roles: [PO]
            viewpoint: vp-po-decision-readiness
          - text: テスト技術選定・自動化方針が識別できること
            roles: [ARC]
            viewpoint: vp-arc-technical-constraints
          - text: テストレベル・入出口条件・体制が実施可能な粒度で記述されていること
            roles: [QE]
            viewpoint: vp-qe-verifiability
          - text: テスト環境構築・CI連携の前提として参照できること
            roles: [DEV]
            viewpoint: vp-dev-implementation-readiness

  - name: 単体テストカタログ
    base_path: 020-unit-test-catalog
    deliverables:
      - local_id: utc-index
        name: 単体テスト（全体構成）
        kind: work
        depends_on:
          - tsp-index
        overview: 単体テストとして確認する観点・条件と分配を定義する
        path: utc-index.md
        rulebook: specdojo:utc-index-rulebook
        recipe: undecided
        sample: specdojo:utc-index-sample
        template: undecided
        done_criteria: &utc-index-done-criteria
          - text: 単体テストの対象範囲・除外・モック方針が合意できること
            roles: [BA]
            viewpoint: vp-ba-requirements-completeness
          - text: 単体テスト方針を承認できること
            roles: [PO]
            viewpoint: vp-po-decision-readiness
          - text: テストフレームワーク・自動化方針が確認できること
            roles: [ARC]
            viewpoint: vp-arc-technical-constraints
          - text: テスト観点・合格基準・エビデンス方針が記述されていること
            roles: [QE]
            viewpoint: vp-qe-verifiability
          - text: 実装時のテスト作成方針として参照できること
            roles: [DEV]
            viewpoint: vp-dev-implementation-readiness
      - local_id: utc-catalog
        name: 単体テスト（成果物カタログ）
        kind: work
        depends_on:
          - utc-index
        overview: catalog*.ts／deliverable*.ts／kata.ts の単体テスト観点・条件を定義する
        path: utc-catalog.md
        rulebook: specdojo:utc-rulebook
        recipe: undecided
        sample: specdojo:utc-sample
        template: undecided
        evidence_refs:
          - kind: implementation
            path: src/catalog.ts
            purpose: 成果物カタログの読込・検証の中核処理
          - kind: implementation
            path: src/catalog-build.ts
            purpose: カタログ検証・表示ビュー生成
          - kind: implementation
            path: src/deliverable.ts
            purpose: 成果物本体の読込・雛形生成
        done_criteria: &utc-target-done-criteria
          - text: 個別対象の範囲・観点・代表条件が記述されていること
            roles: [QE]
            viewpoint: vp-qe-verifiability
          - text: 実装時のテストコード作成の基礎として参照できること
            roles: [DEV]
            viewpoint: vp-dev-implementation-readiness
      - local_id: utc-schedule
        name: 単体テスト（Schedule）
        kind: work
        depends_on:
          - utc-index
        overview: schedule.ts／schedule-build.ts／schedule-phase-sets.ts の単体テスト観点・条件を定義する
        path: utc-schedule.md
        rulebook: specdojo:utc-rulebook
        recipe: undecided
        sample: specdojo:utc-sample
        template: undecided
        evidence_refs:
          - kind: implementation
            path: src/schedule.ts
            purpose: sch-track読込・タスクID導出
          - kind: implementation
            path: src/schedule-build.ts
            purpose: sch-strategyからのsch-track生成
        done_criteria: *utc-target-done-criteria
      - local_id: utc-exec-core
        name: 単体テスト（exec中核）
        kind: work
        depends_on:
          - utc-index
        overview: exec.ts／exec-run.ts／exec-plans.ts／exec-results.ts／exec-events.ts等の単体テスト観点・条件を定義する
        path: utc-exec-core.md
        rulebook: specdojo:utc-rulebook
        recipe: undecided
        sample: specdojo:utc-sample
        template: undecided
        evidence_refs:
          - kind: implementation
            path: src/exec-run.ts
            purpose: タスク選択・claim・agent起動・完了処理の中核
          - kind: implementation
            path: src/exec-plans.ts
            purpose: plan frontmatterの生成・scaffold規則
          - kind: implementation
            path: src/exec-results.ts
            purpose: result frontmatter・必須節のscaffold・記入検証
        done_criteria: *utc-target-done-criteria
      - local_id: utc-exec-schedule
        name: 単体テスト（exec-schedule）
        kind: work
        depends_on:
          - utc-index
        overview: exec-schedule*.ts（CPM・timeline・ready等）の単体テスト観点・条件を定義する
        path: utc-exec-schedule.md
        rulebook: specdojo:utc-rulebook
        recipe: undecided
        sample: specdojo:utc-sample
        template: undecided
        evidence_refs:
          - kind: implementation
            path: src/exec-schedule-cpm.ts
            purpose: CPM・クリティカルパス・slackの算出
          - kind: implementation
            path: src/exec-schedule-ready.ts
            purpose: Ready task算出
        done_criteria: *utc-target-done-criteria
      - local_id: utc-exec-worktree
        name: 単体テスト（exec-worktree）
        kind: work
        depends_on:
          - utc-index
        overview: exec-worktree*.ts の単体テスト観点・条件を定義する
        path: utc-exec-worktree.md
        rulebook: specdojo:utc-rulebook
        recipe: undecided
        sample: specdojo:utc-sample
        template: undecided
        evidence_refs:
          - kind: implementation
            path: src/exec-worktree.ts
            purpose: worktree・branchの命名規則・配置
          - kind: implementation
            path: src/exec-worktree-ops.ts
            purpose: worktreeの作成・削除・同期操作
        done_criteria: *utc-target-done-criteria
      - local_id: utc-register
        name: 単体テスト（登録簿）
        kind: work
        depends_on:
          - utc-index
        overview: register*.ts の単体テスト観点・条件を定義する
        path: utc-register.md
        rulebook: specdojo:utc-rulebook
        recipe: undecided
        sample: specdojo:utc-sample
        template: undecided
        evidence_refs:
          - kind: implementation
            path: src/register.ts
            purpose: 登録項目の状態遷移・派生ビュー更新
          - kind: implementation
            path: src/register-item.ts
            purpose: 登録項目個票のフィールド定義・生成
        done_criteria: *utc-target-done-criteria
      - local_id: utc-routine-job
        name: 単体テスト（定期処理・Job）
        kind: work
        depends_on:
          - utc-index
        overview: routine.ts／job.ts の単体テスト観点・条件を定義する
        path: utc-routine-job.md
        rulebook: specdojo:utc-rulebook
        recipe: undecided
        sample: specdojo:utc-sample
        template: undecided
        evidence_refs:
          - kind: implementation
            path: src/routine.ts
            purpose: 定期処理定義のdue判定・実行委譲
          - kind: implementation
            path: src/job.ts
            purpose: Job Run生成・実行・checkpoint更新
        done_criteria: *utc-target-done-criteria
      - local_id: utc-index-build
        name: 単体テスト（索引・派生生成）
        kind: work
        depends_on:
          - utc-index
        overview: index-command.ts／doc-index.ts／watch.ts／build-command.ts／yaml-pages*.ts の単体テスト観点・条件を定義する
        path: utc-index-build.md
        rulebook: specdojo:utc-rulebook
        recipe: undecided
        sample: specdojo:utc-sample
        template: undecided
        evidence_refs:
          - kind: implementation
            path: src/doc-index.ts
            purpose: 文書ID索引の構造・生成規則
          - kind: implementation
            path: src/build-command.ts
            purpose: 一括再生成（exec→catalog→register→yaml-pages→index）の順序制御
        done_criteria: *utc-target-done-criteria
      - local_id: utc-cli-config
        name: 単体テスト（CLI・構成）
        kind: work
        depends_on:
          - utc-index
        overview: specdojo.ts／specdojo-config.ts／spawn-self.ts等の単体テスト観点・条件を定義する
        path: utc-cli-config.md
        rulebook: specdojo:utc-rulebook
        recipe: undecided
        sample: specdojo:utc-sample
        template: undecided
        evidence_refs:
          - kind: implementation
            path: src/specdojo.ts
            purpose: CLIエントリポイント・サブコマンド登録
          - kind: implementation
            path: src/specdojo-config.ts
            purpose: プロジェクト構成の読込・検証・既定値解決
        done_criteria: *utc-target-done-criteria

  - name: 内部結合テストカタログ
    base_path: 030-internal-integration-test-catalog
    deliverables:
      - local_id: itc-index
        name: 内部結合テスト（全体構成）
        kind: work
        depends_on:
          - tsp-index
        overview: 内部コンポーネント間の連携を確認する観点・条件を定義する
        path: itc-index.md
        rulebook: specdojo:itc-index-rulebook
        recipe: undecided
        sample: specdojo:itc-index-sample
        template: undecided
        done_criteria: &itc-index-done-criteria
          - text: 結合テストの対象コンポーネントと結合範囲が確認できること
            roles: [BA]
            viewpoint: vp-ba-requirements-completeness
          - text: 内部結合テスト方針を承認できること
            roles: [PO]
            viewpoint: vp-po-decision-readiness
          - text: 結合テストの技術方針（API/イベント/DB）が確認できること
            roles: [ARC]
            viewpoint: vp-arc-technical-constraints
          - text: 主要フロー・例外・トランザクション・整合性の観点が記述されていること
            roles: [QE]
            viewpoint: vp-qe-verifiability
      - local_id: itc-catalog-schedule
        name: 内部結合テスト（成果物カタログ→Schedule展開）
        kind: work
        depends_on:
          - itc-index
        overview: 成果物カタログからSchedule展開までの連携を確認する
        path: itc-catalog-schedule.md
        rulebook: specdojo:itc-rulebook
        recipe: undecided
        sample: specdojo:itc-sample
        template: undecided
        evidence_refs:
          - kind: implementation
            path: src/catalog-build.ts
            purpose: 成果物カタログの検証・確定
          - kind: implementation
            path: src/schedule-build.ts
            purpose: 検証済みカタログからのsch-track生成
        done_criteria: &itc-target-done-criteria
          - text: 個別結合範囲・テスト条件・合格基準が記述されていること
            roles: [QE]
            viewpoint: vp-qe-verifiability
          - text: 実装時のテストコード作成の基礎として参照できること
            roles: [DEV]
            viewpoint: vp-dev-implementation-readiness
      - local_id: itc-schedule-exec
        name: 内部結合テスト（Schedule→exec refresh/ready）
        kind: work
        depends_on:
          - itc-index
        overview: Schedule展開からexec refresh・Ready算出までの連携を確認する
        path: itc-schedule-exec.md
        rulebook: specdojo:itc-rulebook
        recipe: undecided
        sample: specdojo:itc-sample
        template: undecided
        evidence_refs:
          - kind: implementation
            path: src/exec-schedule.ts
            purpose: Schedule検証・状態再計算のexec側処理
          - kind: implementation
            path: src/exec-schedule-ready.ts
            purpose: Ready task算出
        done_criteria: *itc-target-done-criteria
      - local_id: itc-exec-register
        name: 内部結合テスト（exec↔登録簿）
        kind: work
        depends_on:
          - itc-index
        overview: 登録簿連携タスク（AI Agentによる対応・調査）の実行連携を確認する
        path: itc-exec-register.md
        rulebook: specdojo:itc-rulebook
        recipe: undecided
        sample: specdojo:itc-sample
        template: undecided
        evidence_refs:
          - kind: implementation
            path: src/exec-register.ts
            purpose: 登録項目に紐づくexecタスクの実行連携
          - kind: implementation
            path: src/register.ts
            purpose: 登録項目の状態遷移
        done_criteria: *itc-target-done-criteria
      - local_id: itc-exec-worktree
        name: 内部結合テスト（exec↔worktree分離）
        kind: work
        depends_on:
          - itc-index
        overview: exec実行とworktree分離・統合の連携を確認する
        path: itc-exec-worktree.md
        rulebook: specdojo:itc-rulebook
        recipe: undecided
        sample: specdojo:itc-sample
        template: undecided
        evidence_refs:
          - kind: implementation
            path: src/exec-run.ts
            purpose: claim時のworktree割当・完了時の統合制御
          - kind: implementation
            path: src/exec-worktree-ops.ts
            purpose: worktreeの作成・削除操作
        done_criteria: *itc-target-done-criteria
      - local_id: itc-routine-exec
        name: 内部結合テスト（routine→exec自動実行）
        kind: work
        depends_on:
          - itc-index
        overview: routineからのexec自動実行（exec-auto／exec-cycle等）の連携を確認する
        path: itc-routine-exec.md
        rulebook: specdojo:itc-rulebook
        recipe: undecided
        sample: specdojo:itc-sample
        template: undecided
        evidence_refs:
          - kind: implementation
            path: src/routine.ts
            purpose: action.kind別（exec-auto/exec-resume/exec-cycle）の委譲規則
          - kind: implementation
            path: src/exec-run.ts
            purpose: routineから委譲された実行の処理
        done_criteria: *itc-target-done-criteria
      - local_id: itc-build-index
        name: 内部結合テスト（build→索引・派生生成）
        kind: work
        depends_on:
          - itc-index
        overview: build実行からindex・yaml-pages等の派生生成までの連携を確認する
        path: itc-build-index.md
        rulebook: specdojo:itc-rulebook
        recipe: undecided
        sample: specdojo:itc-sample
        template: undecided
        evidence_refs:
          - kind: implementation
            path: src/build-command.ts
            purpose: 一括再生成（exec→catalog→register→yaml-pages→index）の順序制御
          - kind: implementation
            path: src/doc-index.ts
            purpose: 文書索引の再構築
        done_criteria: *itc-target-done-criteria

  - name: 外部結合テストカタログ
    base_path: 040-external-integration-test-catalog
    deliverables:
      - local_id: etc-index
        name: 外部結合テスト（全体構成）
        kind: work
        depends_on:
          - tsp-index
        overview: 外部システム連携を含む結合観点・条件を定義する
        path: etc-index.md
        rulebook: specdojo:etc-index-rulebook
        recipe: undecided
        sample: specdojo:etc-index-sample
        template: undecided
        done_criteria: &etc-index-done-criteria
          - text: 外部I/Fテストの対象と観点が業務観点で確認できること
            roles: [BA]
            viewpoint: vp-ba-requirements-completeness
          - text: 外部結合テスト方針を承認できること
            roles: [PO]
            viewpoint: vp-po-decision-readiness
          - text: 外部I/F契約・エラー処理・セキュリティの観点が記述されていること
            roles: [ARC]
            viewpoint: vp-arc-technical-constraints
          - text: 正常・異常・タイムアウト・冪等・性能観点が記述されていること
            roles: [QE]
            viewpoint: vp-qe-verifiability
      - local_id: etc-provider-cli
        name: 外部結合テスト（AI provider CLI）
        kind: work
        depends_on:
          - etc-index
        overview: AI provider CLI（Claude Code／Codex／opencode等）との連携（ifx-index対応）を確認する
        path: etc-provider-cli.md
        rulebook: specdojo:etc-rulebook
        recipe: undecided
        sample: specdojo:etc-sample
        template: undecided
        evidence_refs:
          - kind: implementation
            path: src/exec-agent-config.ts
            purpose: AI provider CLIの起動コマンド解決・非対話実行
        done_criteria: &etc-target-done-criteria
          - text: I/Fごとのテスト条件・前提・合格基準が記述されていること
            roles: [QE]
            viewpoint: vp-qe-verifiability
          - text: テストスタブ・モック設計の参照として使えること
            roles: [DEV]
            viewpoint: vp-dev-implementation-readiness
      - local_id: etc-git-github
        name: 外部結合テスト（Git／GitHub）
        kind: work
        depends_on:
          - etc-index
        overview: Git／GitHub（gh CLI）との連携（ifx-index対応）を確認する
        path: etc-git-github.md
        rulebook: specdojo:etc-rulebook
        recipe: undecided
        sample: specdojo:etc-sample
        template: undecided
        evidence_refs:
          - kind: implementation
            path: src/exec-worktree.ts
            purpose: Git操作（worktree作成・commit・push等）の実行箇所
        done_criteria: *etc-target-done-criteria

  - name: 総合テストカタログ
    base_path: 050-system-test-catalog
    deliverables:
      - local_id: stc-index
        name: 総合テスト（全体構成）
        kind: work
        depends_on:
