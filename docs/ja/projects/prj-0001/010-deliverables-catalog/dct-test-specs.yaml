        kind: work
        depends_on:
          - itc-index
        overview: exec実行とworktree分離・統合の連携を確認する
        path: itc-exec-worktree.md
        rulebook: specdojo:itc-rulebook
        done_criteria: *itc-target-done-criteria
      - local_id: itc-routine-exec
        name: 内部結合テスト（routine→exec自動実行）
        kind: work
        depends_on:
          - itc-index
        overview: routineからのexec自動実行（exec-auto／exec-cycle等）の連携を確認する
        path: itc-routine-exec.md
        rulebook: specdojo:itc-rulebook
        done_criteria: *itc-target-done-criteria
      - local_id: itc-build-index
        name: 内部結合テスト（build→索引・派生生成）
        kind: work
        depends_on:
          - itc-index
        overview: build実行からindex・yaml-pages等の派生生成までの連携を確認する
        path: itc-build-index.md
        rulebook: specdojo:itc-rulebook
