        done_criteria: &stc-target-done-criteria
          - text: 個別シナリオの前提・データ準備・テスト条件・期待結果が記述されていること
            roles: [QE]
            viewpoint: vp-qe-verifiability
          - text: 業務シナリオとして正しく成立することが業務観点で確認できること
            roles: [BA]
            viewpoint: vp-ba-requirements-completeness
      - local_id: stc-register-lifecycle
        name: 総合テスト（登録簿ライフサイクル）
        kind: work
        depends_on: [stc-index, bac-register-lifecycle]
        overview: 登録簿ライフサイクルのエンドツーエンドシナリオを定義する
        path: stc-register-lifecycle.md
        rulebook: specdojo:stc-rulebook
        recipe: undecided
        sample: specdojo:stc-sample
        template: undecided
        evidence_refs: &evidence-register-lifecycle
          - kind: implementation
            path: src/register.ts
            purpose: 登録項目の状態遷移・派生ビュー更新
          - kind: implementation
            path: src/register-item.ts
            purpose: 登録項目個票のフィールド定義
          - kind: implementation
            path: src/exec-register.ts
            purpose: 登録項目に紐づくexecタスクの実行連携
        done_criteria: *stc-target-done-criteria
      - local_id: stc-catalog-planning
        name: 総合テスト（計画展開）
        kind: work
        depends_on: [stc-index, bac-catalog-planning]
