id: prj-0001:dct-data-model-bdd
type: project
status: draft
title: 成果物カタログ（データモデル／業務データ辞書）
rulebook: specdojo:dct-rulebook
project_id: prj-0001
domain: data-model
base_path: /docs/ja/product/010-business-specs/020-data-model

# data-model ドメインの物理分割ファイル（bdd 部分）。domain キーは分割前と同じ data-model を保つ。
# local_id は cdfd-overview.md および領域別 CDFD（cdfd-init.md 等）の「個別プロセス主要入出力」表に
# 現れるデータストア・エンティティを根拠に、単一領域（SpecDojo運用）を複数項目へ分割するパターンB
# （dct-rulebook.md「業務領域テンプレートの反復方針」参照）で列挙する。

groups:
  - name: 業務データ辞書
    groups:
      - name: 立ち上げ・構成
        deliverables:
          - local_id: bdd-project-config
            name: 業務データ辞書（プロジェクト構成）
            kind: work
            overview: プロジェクト構成・設定情報（specdojo.config.json）のエンティティ・属性を定義する
            path: bdd-project-config.yaml
            rulebook: specdojo:bdd-rulebook
            done_criteria:
              - text: エンティティ・属性の業務的定義が正確に記述されていること
                roles: [BA]
                viewpoint: vp-ba-requirements-completeness
              - text: データスコープとエンティティ境界を承認できること
                roles: [PO]
                viewpoint: vp-po-purpose-alignment
              - text: DB設計・システム設計の入力として参照できること
                roles: [ARC]
                viewpoint: vp-arc-technical-constraints
              - text: データ検証ルール・制約が確認できること
                roles: [QE]
                viewpoint: vp-qe-verifiability
              - text: 実装（テーブル設計・モデル定義）の基礎として参照できること
