# yaml-language-server: $schema=../../../../specdojo/schemas/v1/dct.schema.yaml
id: prj-0001:dct-system-functions
type: project
status: draft
title: 成果物カタログ（システム化機能）
rulebook: specdojo:dct-rulebook
project_id: prj-0001
domain: system-functions
base_path: /docs/ja/product/010-business-specs/050-system-functions
groups:
  - name: システム化機能
    deliverables:
      - local_id: sf-index
        name: システム化機能一覧（全体構成）
        kind: work
        depends_on:
          - bps-init-required
          - bps-register-required
          - bps-planning-catalog-strategy-update
          - bps-task-selection-preparation
          - bps-routine-required
          - bps-parallel-required
          - bps-config-change-evaluation
          - bps-derived-project-scoped
          - bps-reporting-monitoring-detection
          - bps-deprecation-process
          - clis-index
        overview: システムで実現する機能の全体構成と一覧を定義する。行ごとに業務プロセス仕様（bps-*）・CLI仕様（clis-index配下のCLIコマンド群）を要約参照する
        path: sf-index.md
        rulebook: specdojo:sf-index-rulebook
        note: 業務仕様の種類ごとに代表を1件作る方針（PJR-2GD6）に基づき、タスク実行の機能（sf-task-execution）を代表として個別作成する。その他の個別機能はsf-indexの一覧行で要約し、詳細化が必要になった時点で個別追加を検討する。sf-index-rulebookとsf-rulebookは別ドキュメントとして整備する（sf-rulebookは個別sf-<term>用に使用）
        evidence_refs:
          - kind: implementation
            path: src/specdojo.ts
            purpose: CLIサブコマンド一覧（機能一覧の行と対応させる根拠）
        done_criteria:
          - text: 機能一覧が業務仕様と対応し、スコープが網羅されていること
            roles: [BA]
            viewpoint: vp-ba-requirements-completeness
          - text: システム化機能のスコープを承認できること
            roles: [PO]
            viewpoint: vp-po-purpose-alignment
          - text: 機能分割・コンポーネント設計の入力として参照できること
            roles: [ARC]
            viewpoint: vp-arc-technical-constraints
          - text: テスト対象機能の網羅性が確認できること
            roles: [QE]
            viewpoint: vp-qe-omissions-consistency
          - text: 実装スコープ・機能境界の参照として使えること
            roles: [DEV]
            viewpoint: vp-dev-implementation-readiness
      - local_id: sf-task-execution
        name: システム化機能（タスク実行）
        kind: work
        depends_on:
          - sf-index
          - bps-task-selection-preparation
        overview: タスク実行機能（タスク選択・claim・agent実行・検証・完了処理・worktree隔離と統合）の入出力、処理要件、外部連携を定義する
        path: sf-task-execution.md
        rulebook: specdojo:sf-rulebook
        evidence_refs:
          - kind: implementation
            path: src/exec/run/agent-pipeline.ts
            purpose: タスク実行パイプライン（executor実行・親検証バッチ・reporter実行・スナップショット管理）の実装
        done_criteria:
          - text: タスク実行機能の入出力・処理要件が業務プロセス仕様と整合していること
            roles: [BA]
            viewpoint: vp-ba-requirements-completeness
          - text: タスク実行機能の機能スコープと振る舞いを承認できること
            roles: [PO]
            viewpoint: vp-po-purpose-alignment
          - text: タスク実行コンポーネント設計・アーキテクチャ境界の入力として参照できること
            roles: [ARC]
            viewpoint: vp-arc-technical-constraints
          - text: タスク実行機能のテスト観点・検証可能性が確認できること
            roles: [QE]
            viewpoint: vp-qe-verifiability
          - text: 実装スコープ・機能境界の参照として使えること
            roles: [DEV]
            viewpoint: vp-dev-implementation-readiness
