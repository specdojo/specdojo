          - kind: implementation
            path: docs/specdojo/schemas/v1/pm-members.schema.yaml
            purpose: 人の名簿
          - kind: implementation
            path: docs/specdojo/schemas/v1/pm-roles.schema.yaml
            purpose: ロール
          - kind: implementation
            path: docs/specdojo/schemas/v1/exec-defaults.schema.yaml
            purpose: provider と実行の既定
        done_criteria:
          - text: 領域の主要用語が洗い出され、定義・別名・分類が正確に記述されていること
