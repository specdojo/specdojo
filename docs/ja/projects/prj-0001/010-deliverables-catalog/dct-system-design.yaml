        template: not-needed
        note: 既存文書のretrofit。rulebook参照をspecdojo:sysd-rulebook（PJR-ZP0Bで新設）へ更新する
        evidence_refs:
          - kind: implementation
            path: src/exec-agent-config.ts
            purpose: providers.codexのcommand_template解決規則
        done_criteria: *sysd-term-done-criteria

      - local_id: sysd-opencode-agent-settings
        name: システム設計（opencodeエージェント設定）
        kind: work
        depends_on:
          - sysd-agent-settings
          - tsd-ollama-opencode
        overview: opencode（Ollama等ローカルLLM含む）固有の認証・モデル選択・エージェント定義・起動コマンド解決を定義する
        path: sysd-opencode-agent-settings.md
        rulebook: specdojo:sysd-rulebook
        recipe: not-needed
        sample: not-needed
        template: not-needed
        note: 既存文書のretrofit。rulebook参照をspecdojo:sysd-rulebook（PJR-ZP0Bで新設）へ更新する
        evidence_refs:
          - kind: implementation
            path: src/exec-agent-config.ts
            purpose: providers.opencodeのcommand_template解決規則
        done_criteria: *sysd-term-done-criteria

      - local_id: sysd-github-copilot-agent-settings
        name: システム設計（GitHub Copilotエージェント設定）
        kind: work
        depends_on:
          - sysd-agent-settings
        overview: GitHub Copilot固有の認証・モデル選択・エージェント定義・起動コマンド解決を定義する
        path: sysd-github-copilot-agent-settings.md
        rulebook: specdojo:sysd-rulebook
        recipe: not-needed
        sample: not-needed
        template: not-needed
        note: 既存文書のretrofit。rulebook参照をspecdojo:sysd-rulebook（PJR-ZP0Bで新設）へ更新する
        evidence_refs:
          - kind: implementation
            path: src/exec-agent-config.ts
            purpose: providers.copilotのcommand_template解決規則
        done_criteria: *sysd-term-done-criteria

      - local_id: sysd-orchestrator-agent-settings
        name: システム設計（対話型オーケストレーターエージェント設定）
        kind: work
        depends_on:
          - sysd-agent-settings
        overview: 人との対話からSpecDojoコマンドを提案し、承認後に実行するオーケストレーターの責務・権限・起動構成を定義する
        path: sysd-orchestrator-agent-settings.md
        rulebook: specdojo:sysd-rulebook
        recipe: not-needed
        sample: not-needed
