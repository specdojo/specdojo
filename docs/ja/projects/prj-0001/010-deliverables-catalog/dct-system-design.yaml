id: prj-0001:dct-system-design
type: project
status: draft
title: 成果物カタログ（システム設計）
rulebook: specdojo:dct-rulebook
project_id: prj-0001
domain: system-design
base_path: /docs/ja/product/040-system-design

# PJR-ZP0Bでsysd-<term> rulebook、全体index、重要フロー、横断ルールを整備し、
# sysd-agent-settingsをprovider別・orchestrator設計へのhubへ再構成した。

groups:
  - name: 全体構成・重要フロー・横断ルール
    deliverables:
      - local_id: sysd-index
        name: システム設計（全体構成・リンク集）
        kind: work
        depends_on: []
        overview: システム設計のSSOT（OpenAPI・AsyncAPI・migrationファイル・agent実行構成等）への導線を1箇所に集約する
        path: sysd-index.md
        rulebook: specdojo:sysd-index-rulebook
        recipe: not-needed
        sample: specdojo:sysd-index-sample
        template: not-needed
        note: PJR-ZP0Bで新設。Configurations種別にagent実行構成のSSOTを登録済み
        done_criteria:
          - text: 設計情報の参照先（API定義・DBスキーマ・設定スキーマ）へのリンクが揃っていること
            roles: [ARC]
            viewpoint: vp-arc-document-structure
          - text: 設計のSSOT所在が確認できること
            roles: [DEV]
            viewpoint: vp-dev-implementation-readiness
          - text: テスト設計に必要な設計SSOTへのリンクが確認できること
            roles: [QE]
            viewpoint: vp-qe-verifiability
          - text: 運用・監視設定の参照先が確認できること
            roles: [OPS]
            viewpoint: vp-ops-operability

      - local_id: sysd-critical-flows
        name: システム設計（重要フロー）
        kind: work
        depends_on:
          - sysd-index
          - cdfd-task-execution
          - cdfd-register-lifecycle
          - cdfd-multi-project
        overview: 事故や仕様誤解の原因になりやすい重要フローのみを可視化する（最大5フロー）
        path: sysd-critical-flows.md
        rulebook: specdojo:sysd-critical-flows-rulebook
        recipe: not-needed
        sample: specdojo:sysd-critical-flows-sample
        template: not-needed
        note: PJR-ZP0Bで要否を再評価し、PR承認、worktree統合、register ID衝突復旧、agent並列処理、利用制限後の延期再開の5件を重要フローとして採用した
        done_criteria:
          - text: 重要フローの選定理由と業務影響が確認できること
            roles: [BA]
            viewpoint: vp-ba-business-value
          - text: 重要フローの内容を承認できること
            roles: [PO]
            viewpoint: vp-po-decision-readiness
          - text: フローの境界・永続化点・再実行性・失敗時挙動が定義されていること
            roles: [ARC]
            viewpoint: vp-arc-technical-constraints
          - text: 重要フローのテストシナリオ設計に活用できること
            roles: [QE]
            viewpoint: vp-qe-verifiability
          - text: フロー実装の共通理解として参照できること
            roles: [DEV]
            viewpoint: vp-dev-implementation-readiness

      - local_id: sysd-cross-cutting-policy
        name: システム設計（横断ルール）
        kind: work
        depends_on:
          - sysd-index
        overview: 実装全体に影響する共通ルール（エラー・タイムアウト・冪等・トレーシング・設定上書き階層・モジュール境界等）をSSOT化する
        path: sysd-cross-cutting-policy.md
        rulebook: specdojo:sysd-cross-cutting-policy-rulebook
        recipe: not-needed
        sample: specdojo:sysd-cross-cutting-policy-sample
        template: not-needed
        note: PJR-ZP0Bで新設。旧sysd-agent-settings.mdの規範をscp-<カテゴリ>-<連番>形式へ再構成済み
        evidence_refs:
          - kind: implementation
            path: src/exec-agent-config.ts
            purpose: rate limit検出・retry/fallback方針、command_template解決の共通規則
          - kind: implementation
            path: src/exec-worktree.ts
            purpose: worktree分離のライフサイクル規則
          - kind: implementation
            path: src/exec-events.ts
            purpose: append-onlyイベント・reopenの遷移規則
        done_criteria:
          - text: 横断ルールが実装上の制約として確認できること
            roles: [ARC]
            viewpoint: vp-arc-technical-constraints
          - text: エラー処理・冪等・タイムアウト・ログ方針が記述されていること
            roles: [DEV]
            viewpoint: vp-dev-implementation-readiness
          - text: 横断ルールのテスト・検証方針が確認できること
            roles: [QE]
            viewpoint: vp-qe-verifiability
          - text: 監視・トレーシング・セキュリティの運用観点が確認できること
            roles: [OPS]
            viewpoint: vp-ops-operability

  - name: 個別設計トピック（`sysd-<term>`）
    deliverables:
      - local_id: sysd-agent-settings
        name: システム設計（エージェント実行・共通設計）
        kind: work
        depends_on:
          - sysd-cross-cutting-policy
        overview: SpecDojo CLIと外部エージェントCLIを組み合わせたマルチエージェント実行の全体像と、provider別詳細設計への導線を示す
        path: sysd-agent-settings.md
        rulebook: specdojo:sysd-rulebook
        recipe: not-needed
        sample: not-needed
        template: not-needed
        note: 既存文書のretrofit。横断ルールと運用手順を移設し、4providerとorchestrator設計へのhubへ縮小済み
        evidence_refs:
          - kind: implementation
            path: src/specdojo-config.ts
            purpose: AgentProvider（opencode/claude/codex/copilot/custom）の型定義
          - kind: implementation
            path: src/exec-agent-config.ts
            purpose: member選択・起動コマンド解決（command_template/command_params）の共通規則
          - kind: implementation
            path: src/exec-run.ts
            purpose: 3層（SpecDojo CLI／agent／exec run）の責務分担、非対話実行・worktree割当の制御
        done_criteria: &sysd-term-done-criteria
          - text: 設計トピックの採用理由・制約が業務要件と整合していること
            roles: [BA]
            viewpoint: vp-ba-requirements-completeness
          - text: 設計方針を承認できること
            roles: [PO]
            viewpoint: vp-po-decision-readiness
          - text: 技術的制約・依存関係が識別できること
            roles: [ARC]
            viewpoint: vp-arc-technical-constraints
          - text: テスト設計・検証観点の参照として使えること
            roles: [QE]
            viewpoint: vp-qe-verifiability
          - text: 実装の基礎として参照できること
            roles: [DEV]
            viewpoint: vp-dev-implementation-readiness

      - local_id: sysd-claude-agent-settings
        name: システム設計（Claude Codeエージェント設定）
        kind: work
        depends_on:
          - sysd-agent-settings
        overview: Claude Code固有の認証・モデル選択・エージェント定義・起動コマンド解決を定義する
        path: sysd-claude-agent-settings.md
        rulebook: specdojo:sysd-rulebook
        recipe: not-needed
        sample: not-needed
        template: not-needed
        note: 既存文書のretrofit。rulebook参照をspecdojo:sysd-rulebook（PJR-ZP0Bで新設）へ更新する
        evidence_refs:
          - kind: implementation
            path: src/exec-agent-config.ts
            purpose: providers.claudeのcommand_template解決規則
        done_criteria: *sysd-term-done-criteria

      - local_id: sysd-codex-agent-settings
        name: システム設計（Codexエージェント設定）
        kind: work
        depends_on:
          - sysd-agent-settings
        overview: Codex固有の認証・モデル選択・エージェント定義・起動コマンド解決を定義する
        path: sysd-codex-agent-settings.md
        rulebook: specdojo:sysd-rulebook
        recipe: not-needed
