        note: PJR-ZP0Bでhub配下の個別設計トピックとしてcatalogへ追加
        evidence_refs:
          - kind: implementation
            path: .claude/agents/specdojo-orchestrator.md
            purpose: 対話型オーケストレーターの責務・承認フロー
          - kind: implementation
            path: .codex/agents/specdojo-orchestrator.toml
            purpose: Codexでのオーケストレーター起動構成
        done_criteria: *sysd-term-done-criteria

      - local_id: sysd-job-execution
        name: システム設計（Job実行設計）
        kind: work
        depends_on: []
        overview: 同じ作業定義から実行単位を繰り返し生成するJob実行モデル（Job Definition／Job Run）を定義する
        path: sysd-job-execution.md
        rulebook: specdojo:sysd-rulebook
        recipe: not-needed
        sample: not-needed
        template: not-needed
        note: 既存文書のretrofit（現状status=ready）。rulebook参照をspecdojo:sysd-rulebook（PJR-ZP0Bで新設）へ更新する
        evidence_refs:
          - kind: implementation
            path: src/job.ts
            purpose: Job Definition／Job Runの概念モデル・生成・実行フロー
          - kind: implementation
            path: src/routine.ts
            purpose: action.kind＝jobによるJob Run起動の委譲規則
        done_criteria: *sysd-term-done-criteria
