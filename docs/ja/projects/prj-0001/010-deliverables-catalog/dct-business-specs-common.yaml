id: prj-0001:dct-business-specs-common
type: project
status: draft
title: 成果物カタログ（業務仕様共通）
rulebook: specdojo:dct-rulebook
project_id: prj-0001
domain: business-specs-common
base_path: /docs/ja/product/010-business-specs/050-common
groups:
  - name: システム化機能一覧
    deliverables:
      - local_id: sf-index
        name: システム化機能一覧（全体構成）
        kind: work
        overview: システムで実現する機能の全体構成と一覧を定義する
        path: sf-index.md
        rulebook: specdojo:sf-rulebook
        done_criteria:
          - text: 機能一覧が業務仕様と対応し、スコープが網羅されていること
            roles: [BA]
            viewpoint: vp-ba-requirements-completeness
          - text: システム化機能のスコープを承認できること
            roles: [PO]
            viewpoint: vp-po-purpose-alignment
          - text: 機能分割・コンポーネント設計の入力として参照できること
            roles: [ARC]
            viewpoint: vp-arc-technical-constraints
          - text: テスト対象機能の網羅性が確認できること
            roles: [QE]
            viewpoint: vp-qe-omissions-consistency
          - text: 実装スコープ・機能境界の参照として使えること
            roles: [DEV]
            viewpoint: vp-dev-implementation-readiness
      - local_id: sf-specdojo
        name: システム化機能一覧（個別）
        kind: work
        overview: 個別のシステム化機能の概要・関連仕様を定義する
        path: sf-specdojo.md
        rulebook: specdojo:sf-rulebook
        note: specdojo は対象機能名の略称（kebab-case）
        done_criteria:
          - text: 機能概要・関連プロセス・関連仕様が業務観点で記述されていること
            roles: [BA]
            viewpoint: vp-ba-requirements-completeness
          - text: 機能の業務的妥当性を承認できること
            roles: [PO]
            viewpoint: vp-po-purpose-alignment
          - text: 機能実装・コンポーネント設計の参照として使えること
            roles: [DEV]
            viewpoint: vp-dev-implementation-readiness
        depends_on:
          - sf-index
  - name: 用語集
    deliverables:
      - local_id: gl-specdojo
        name: 用語集
        kind: work
        overview: 業務・システムで使用する用語の意味を統一的に定義する
        path: gl-specdojo.md
        rulebook: specdojo:gl-rulebook
        note: specdojo は対象業務領域の略称（kebab-case）
        done_criteria:
          - text: 業務上の主要用語の定義・別名・分類が正確に記述されていること
            roles: [BA]
            viewpoint: vp-ba-requirements-completeness
          - text: 用語スコープと定義の妥当性を承認できること
            roles: [PO]
            viewpoint: vp-po-purpose-alignment
          - text: 技術実装・API命名・DBカラム名の参照として使えること
            roles: [ARC]
            viewpoint: vp-arc-cross-document-consistency
          - text: ドキュメント間の用語の一貫性が確認できること
            roles: [QE]
            viewpoint: vp-qe-omissions-consistency
