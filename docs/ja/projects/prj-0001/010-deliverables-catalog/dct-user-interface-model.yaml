# yaml-language-server: $schema=../../../../specdojo/schemas/v1/dct.schema.yaml
id: prj-0001:dct-user-interface-model
type: project
status: draft
title: 成果物カタログ（ユーザーインターフェースモデル）
rulebook: specdojo:dct-rulebook
project_id: prj-0001
domain: user-interface-model
base_path: /docs/ja/product/010-business-specs/040-user-interface-model
groups:
  - deliverables:
      - local_id: clis-index
        name: CLI仕様（全体構成）
        kind: work
        overview: SpecDojoが提供するCLIコマンド群の全体構成、利用目的、操作の流れ、入力と出力の要点を、command-referenceや運用ガイドへの導線としてまとめる
        path: clis-index.md
        note: 業務仕様の種類ごとに代表を1件作る方針（PJR-2GD6）に基づき、exec コマンド群（clis-exec-commands）を代表として個別作成する。その他のコマンド群は clis-index から command-reference・各運用ガイドへリンクする。索引専用の rulebook（clis-index-rulebook）は未整備のため、個別成果物用の rulebook は流用せず未宣言とする
        done_criteria:
          - text: CLIコマンド群の利用目的・操作の流れ・入力と出力の要点・エラー時の次の手が業務観点で記述されていること
            roles: [BA]
            viewpoint: vp-ba-requirements-completeness
          - text: CLIコマンド群のスコープと利用フローを承認できること
            roles: [PO]
            viewpoint: vp-po-purpose-alignment
          - text: CLI実装・コマンド体系設計の入力として参照できること
            roles: [ARC]
            viewpoint: vp-arc-technical-constraints
          - text: CLIテスト・受入テスト設計に活用できること
            roles: [QE]
            viewpoint: vp-qe-verifiability
          - text: 開発者・運用者が操作しやすい表現・構成になっていること
            roles: [UX]
            viewpoint: vp-ux-readability
      - local_id: clis-exec-commands
        name: CLI仕様（exec コマンド群）
        kind: work
        depends_on:
          - clis-index
        overview: exec コマンド群の利用目的、操作の流れ、コマンドリファレンスへの参照、入力情報と出力情報の要点、終了コード、エラー表示、および利用者の次の手を定義する
        path: clis-exec-commands.md
        rulebook: specdojo:clis-rulebook
        evidence_refs:
          - kind: implementation
            path: src/exec/commands.ts
            purpose: exec サブコマンド群（run・plan・review・worktree等）のコマンド定義・対話出力・エラー表示を処理するCLI操作部
        done_criteria:
          - text: exec コマンド群の利用目的・操作の流れ・入力情報と出力情報の要点・利用者の次の手が業務観点で記述されていること
            roles: [BA]
            viewpoint: vp-ba-requirements-completeness
          - text: exec コマンド群のスコープと利用フローを承認できること
            roles: [PO]
            viewpoint: vp-po-purpose-alignment
          - text: CLI 実装・コマンド体系設計の入力として参照できること
            roles: [ARC]
            viewpoint: vp-arc-technical-constraints
          - text: CLI テスト・受入テスト設計に活用できること
            roles: [QE]
            viewpoint: vp-qe-verifiability
          - text: 開発者・運用者が操作しやすい表現・構成になっていること
            roles: [UX]
            viewpoint: vp-ux-readability
      - local_id: bds-index
        name: 帳票仕様（全体構成）
        kind: work
        overview: SpecDojoが生成する出力物（timeline・CPM・Ready一覧・登録簿ビュー・カタログ表示等）の利用目的・表示項目の要点を、既存guide/rulebookへの導線としてまとめる
        path: bds-index.md
        note: 出力物の多くは pjr-rulebook（台帳ビュー）・dct-rulebook（カタログ表示）が構造を規定済みのため重複記述はしない。専用rulebookが無い gantt-chart・CPM・critical-path・Ready一覧のみ要点を記述し、詳細はschedule-design-guide・schedule-operation-guideへリンクする。gantt-chartは元timelineから改名した生成物であり、新設のtml-（トラック順序計画）とは別物のため対象外とする。個別帳票（bds-<term>）は作成しない
        done_criteria:
          - text: 利用目的・表示項目・出力タイミングが業務観点で記述されていること
            roles: [BA]
            viewpoint: vp-ba-requirements-completeness
          - text: 帳票のスコープと業務的妥当性を承認できること
            roles: [PO]
            viewpoint: vp-po-purpose-alignment
          - text: 帳票生成・PDF/印刷設計の入力として参照できること
            roles: [ARC]
            viewpoint: vp-arc-technical-constraints
          - text: 帳票テスト設計に活用できること
            roles: [QE]
            viewpoint: vp-qe-verifiability
