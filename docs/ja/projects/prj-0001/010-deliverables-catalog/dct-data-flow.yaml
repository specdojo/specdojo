            roles: [BA]
            viewpoint: vp-ba-requirements-completeness
          - text: 引き渡し条件を満たさない場合の戻り先がグループ単位で示され、グループ内部の例外を扱っていないこと
            roles: [QE]
            viewpoint: vp-qe-omissions-consistency
          - text: レビューによる確定と grade による評価の責務分担が引き渡し条件として区別できること
            roles: [ARC]
            viewpoint: vp-arc-cross-document-consistency
