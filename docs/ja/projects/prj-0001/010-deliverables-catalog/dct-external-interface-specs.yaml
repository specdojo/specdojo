# yaml-language-server: $schema=../../../../specdojo/schemas/v1/dct.schema.yaml
id: prj-0001:dct-external-interface-specs
type: project
status: draft
title: 成果物カタログ（外部I/F仕様）
rulebook: specdojo:dct-rulebook
project_id: prj-0001
domain: external-interface-specs
base_path: /docs/ja/product/020-external-interface-specs

# SpecDojo自身の外部連携は AI provider CLI（Claude Code / Codex CLI / opencode 等）と
# Git/GitHub（gh CLI）が中心で、いずれもCLIプロセス起動型のため、
# ESIL の interfaces[].kind には「コマンド」を使用する。個別の ifx-cmd-<term> 詳細仕様は
# 未作成のため、spec_ref は TBD とする。ifx-api/ifx-file/ifx-msg の詳細仕様は、
# 対応する形式の連携が具体的に必要になった時点で追加する。

groups:
  - deliverables:
      - local_id: ifx-index
        name: 外部システムI/F一覧
        kind: work
        depends_on: []
        overview: 外部システムとの連携を一覧（YAML）で定義する。SpecDojo自身の連携はAI provider CLIとGit/GitHubが中心
        path: ifx-index.yaml
        rulebook: specdojo:ifx-index-rulebook
        note: interfaces の kind はコマンドを使用し、個別の ifx-cmd-<term> 詳細仕様が未作成の間は spec_ref を TBD とする
        evidence_refs:
          - kind: implementation
            path: src/exec-agent-config.ts
            purpose: AI provider CLIの起動コマンド解決・非対話実行
          - kind: implementation
            path: src/exec-worktree.ts
            purpose: Git操作（worktree作成・commit・push等）の実行箇所
        done_criteria:
          - text: 外部連携の一覧・連携方式・タイミングが業務観点で整理されていること
            roles: [BA]
            viewpoint: vp-ba-requirements-completeness
          - text: 外部連携のスコープと方式を承認できること
            roles: [PO]
            viewpoint: vp-po-purpose-alignment
          - text: 外部システム連携設計（プロトコル・認証・エラー処理）の入力として参照できること
            roles: [ARC]
            viewpoint: vp-arc-technical-constraints
          - text: 外部結合テストの対象が識別できること
            roles: [QE]
            viewpoint: vp-qe-verifiability
          - text: 外部I/F実装スコープの参照として使えること
            roles: [DEV]
            viewpoint: vp-dev-implementation-readiness
