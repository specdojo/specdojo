id: prj-0001:dct-business-model-bps
type: project
status: draft
title: 成果物カタログ（業務モデル／業務プロセス仕様）
rulebook: specdojo:dct-rulebook
project_id: prj-0001
domain: business-model
base_path: /docs/ja/product/010-business-specs/030-business-model

# business-model ドメインの物理分割ファイル（bps 部分）。domain キーは分割前と同じ business-model を保つ。
# bps-rulebook.md は「1ファイル=1プロセス」を想定するため、cdfd-overview.md の10プロセス領域
# それぞれの「4. 概念データフロー」節が示す名前付きフロー単位（ひとまとまりの起動条件を持つ
# プロセス群）を1 bps として列挙する。個々の P-XX-YY はその bps 内の処理ステップとして記述する。

groups:
  - name: 業務プロセス仕様
    groups:
      - name: 初期セットアップ（P-01）
        deliverables:
