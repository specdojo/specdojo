# yaml-language-server: $schema=../../../../specdojo/schemas/v1/dct.schema.yaml
id: prj-0001:dct-business-model-bps
type: project
status: draft
title: 成果物カタログ（業務モデル／業務プロセス仕様）
rulebook: specdojo:dct-rulebook
project_id: prj-0001
domain: business-model
base_path: /docs/ja/product/010-business-specs/030-business-model

# business-model ドメインの物理分割ファイル（bps 部分）。domain キーは分割前と同じ business-model を保つ。
# bps-rulebook.md の「一文書は一つのプロセス領域に属する」に従い、cdfd-overview.md の現行14領域で
# グループを分ける。既存29件の local_id と path は参照の安定性のため維持し、各 overview から
# 現行の領域内プロセスを特定できるようにする。P-08 と P-11 は先行作成済みの BPS 2件を登録する。

groups:
  - name: 業務プロセス仕様
    groups:
      - name: 初期セットアップ（P-01）
        deliverables:
          - local_id: bps-init-required
            name: 業務プロセス仕様（初期セットアップ・必須プロセス）
            kind: work
            depends_on: [bes-index]
            overview: 導入条件の確定・Kataの配置・稼働構成の初期化からなる必須フロー（P-01-01〜03）を定義する
            path: bps-init-required.md
            rulebook: specdojo:bps-rulebook
            done_criteria: &bps-done-criteria
              - text: トリガー・前提・入力・処理・出力が業務観点で正確に記述されていること
                roles: [BA]
                viewpoint: vp-ba-requirements-completeness
              - text: プロセスのスコープと業務的妥当性を承認できること
                roles: [PO]
                viewpoint: vp-po-purpose-alignment
              - text: システム設計・機能設計の入力として参照できること
                roles: [ARC]
                viewpoint: vp-arc-technical-constraints
              - text: テストシナリオ設計・受入条件との対応が確認できること
                roles: [QE]
                viewpoint: vp-qe-verifiability
              - text: 実装設計（サービス・ユースケース）の基礎として参照できること
                roles: [DEV]
                viewpoint: vp-dev-implementation-readiness
          - local_id: bps-init-optional
            name: 業務プロセス仕様（初期セットアップ・条件付きプロセス）
            kind: work
            depends_on: [bes-index]
            overview: provider選択や既存構成の保護などの条件差を含む初期セットアップのフロー（P-01-01〜03）を定義する
            path: bps-init-optional.md
            rulebook: specdojo:bps-rulebook
            done_criteria: *bps-done-criteria
      - name: 登録簿定義（P-02）
        deliverables:
          - local_id: bps-register-required
            name: 業務プロセス仕様（登録簿・必須プロセス）
            kind: work
            depends_on: [bes-index]
            overview: 判明事項・判断・計画要求を登録項目または決定記録として残す必須フロー（P-02-01）を定義する
            path: bps-register-required.md
            rulebook: specdojo:bps-rulebook
            done_criteria: *bps-done-criteria
          - local_id: bps-register-response
            name: 業務プロセス仕様（登録簿・対応・調査）
            kind: work
            depends_on: [bes-index]
            overview: 登録項目への対応・調査結果を追跡可能な記録へ反映するフロー（P-02-01）を定義する
            path: bps-register-response.md
            rulebook: specdojo:bps-rulebook
            done_criteria: *bps-done-criteria
          - local_id: bps-register-resume-audit
            name: 業務プロセス仕様（登録簿・再開・監査・ID復旧）
            kind: work
            depends_on: [bes-index]
            overview: 登録項目の再開・履歴監査・ID競合や参照の復旧を正本へ記録するフロー（P-02-01）を定義する
            path: bps-register-resume-audit.md
            rulebook: specdojo:bps-rulebook
            done_criteria: *bps-done-criteria
      - name: 成果物カタログ定義（P-03）
        deliverables:
          - local_id: bps-planning-catalog-strategy-update
            name: 業務プロセス仕様（成果物カタログ定義）
            kind: work
            depends_on: [bes-index]
            overview: 成果物ID・依存・完了条件・根拠参照を検証済みの成果物カタログにするフロー（P-03-01）を定義する
            path: bps-planning-catalog-strategy-update.md
            rulebook: specdojo:bps-rulebook
            done_criteria: *bps-done-criteria
      - name: スケジュール計画展開（P-04）
        deliverables:
          - local_id: bps-planning-schedule-event-update
            name: 業務プロセス仕様（スケジュール計画展開）
            kind: work
            depends_on: [bes-index, bps-planning-catalog-strategy-update]
            overview: スケジュール戦略定義・Schedule展開・実行計画生成のフロー（P-04-01〜03）を定義する
            path: bps-planning-schedule-event-update.md
            rulebook: specdojo:bps-rulebook
            done_criteria: *bps-done-criteria
      - name: 定期実行定義（P-05）
        deliverables:
          - local_id: bps-routine-required
            name: 業務プロセス仕様（定期実行定義）
            kind: work
            depends_on: [bes-index, bps-routine-job-run]
            overview: 周期・条件・対象ジョブ・次回判定情報を持つ定期実行定義を作るフロー（P-05-01）を定義する
            path: bps-routine-required.md
            rulebook: specdojo:bps-rulebook
            done_criteria: *bps-done-criteria
      - name: ジョブ定義（P-06）
        deliverables:
          - local_id: bps-routine-job-run
            name: 業務プロセス仕様（ジョブ定義）
            kind: work
            depends_on: [bes-index]
            overview: 定型処理の実行主体・委譲要否・成功条件を再利用可能なジョブ定義にするフロー（P-06-01）を定義する
            path: bps-routine-job-run.md
            rulebook: specdojo:bps-rulebook
            done_criteria: *bps-done-criteria
      - name: タスク実行（P-07）
        deliverables:
          - local_id: bps-task-selection-preparation
            name: 業務プロセス仕様（実行受入）
            kind: work
            depends_on: [bes-index, bps-planning-schedule-event-update]
            overview: 実行対象・基準・実行主体・権限を対応付けて遂行可否と隔離方法を決めるフロー（P-07-01）を定義する
            path: bps-task-selection-preparation.md
            rulebook: specdojo:bps-rulebook
            done_criteria: *bps-done-criteria
          - local_id: bps-task-edit
            name: 業務プロセス仕様（タスク遂行）
            kind: work
            depends_on: [bes-index, bps-task-selection-preparation]
            overview: Kata・実行計画・条件付きのジョブ定義に従って成果候補を作るフロー（P-07-02）を定義する
            path: bps-task-edit.md
            rulebook: specdojo:bps-rulebook
            done_criteria: *bps-done-criteria
          - local_id: bps-task-review-finalize
            name: 業務プロセス仕様（成果検証）
            kind: work
            depends_on: [bes-index, bps-task-edit]
            overview: 成果候補を実行計画の完了条件に照らして検証し、evidenceと統合可否をそろえるフロー（P-07-03）を定義する
            path: bps-task-review-finalize.md
            rulebook: specdojo:bps-rulebook
            done_criteria: *bps-done-criteria
          - local_id: bps-task-judgment-integration
            name: 業務プロセス仕様（成果統合・実行結果記録）
            kind: work
            depends_on: [bes-index, bps-task-review-finalize]
            overview: 検証済み変更を条件付きで統合し、成果・検証結果・実行状態を記録するフロー（P-07-04・05）を定義する
            path: bps-task-judgment-integration.md
            rulebook: specdojo:bps-rulebook
            done_criteria: *bps-done-criteria
          - local_id: bps-parallel-required
            name: 業務プロセス仕様（並行実行受入）
            kind: work
            depends_on: [bes-index, bps-planning-schedule-event-update]
            overview: 複数タスクの実行主体とworktree隔離の要否を確定する並行実行の受入フロー（P-07-01）を定義する
            path: bps-parallel-required.md
            rulebook: specdojo:bps-rulebook
            done_criteria: *bps-done-criteria
          - local_id: bps-parallel-isolation-work
            name: 業務プロセス仕様（分離と作業）
            kind: work
            depends_on: [bes-index, bps-parallel-required]
            overview: 割り当てたworktreeでタスクを遂行し、分離された成果候補を作るフロー（P-07-02）を定義する
            path: bps-parallel-isolation-work.md
            rulebook: specdojo:bps-rulebook
            done_criteria: *bps-done-criteria
          - local_id: bps-parallel-sync-integration
            name: 業務プロセス仕様（並行成果の検証・統合）
            kind: work
            depends_on: [bes-index, bps-parallel-isolation-work]
            overview: worktreeの成果を検証し、承認済みの変更を統合ブランチへ反映するフロー（P-07-03・04）を定義する
            path: bps-parallel-sync-integration.md
            rulebook: specdojo:bps-rulebook
            done_criteria: *bps-done-criteria
          - local_id: bps-parallel-main-promotion
            name: 業務プロセス仕様（並行成果の記録・後片付け）
            kind: work
            depends_on: [bes-index, bps-parallel-sync-integration]
            overview: 統合結果と実行状態を記録し、不要になったworktreeとbranchを後片付けするフロー（P-07-05）を定義する
            path: bps-parallel-main-promotion.md
            rulebook: specdojo:bps-rulebook
            done_criteria: *bps-done-criteria
      - name: 成果物評価（P-08）
        deliverables:
          - local_id: bps-deliverable-evaluation
            name: 業務プロセス仕様（成果物評価）
            kind: work
            depends_on: [bes-index, bps-task-judgment-integration]
            overview: 評価対象・基準確定、独立runnerによる根拠照合、QEによる評価結果確定のフロー（P-08-01〜03）を定義する
            path: bps-deliverable-evaluation.md
            rulebook: specdojo:bps-rulebook
            done_criteria: *bps-done-criteria
      - name: 進捗可視化報告（P-09）
        deliverables:
          - local_id: bps-reporting-monitoring-detection
            name: 業務プロセス仕様（報告対象確定・進捗集計）
            kind: work
            depends_on: [bes-index]
            overview: 報告時点と対象範囲を固定し、計画・実行・評価の情報から進捗と判断事項を集計するフロー（P-09-01・02）を定義する
            path: bps-reporting-monitoring-detection.md
            rulebook: specdojo:bps-rulebook
            done_criteria: *bps-done-criteria
          - local_id: bps-reporting-consistency-delegation
            name: 業務プロセス仕様（進捗報告確定）
            kind: work
            depends_on: [bes-index, bps-reporting-monitoring-detection]
            overview: 正本間の不一致の扱いを決め、PMが進捗報告を確定してActionへ渡すフロー（P-09-03）を定義する
            path: bps-reporting-consistency-delegation.md
            rulebook: specdojo:bps-rulebook
            done_criteria: *bps-done-criteria
          - local_id: bps-reporting-conditional
            name: 業務プロセス仕様（条件付き報告）
            kind: work
            depends_on: [bes-index, bps-reporting-monitoring-detection]
            overview: 対応・エスカレーション・会議情報を進捗集計へ含め、確認済み報告にする条件付きフロー（P-09-02・03）を定義する
            path: bps-reporting-conditional.md
            rulebook: specdojo:bps-rulebook
            done_criteria: *bps-done-criteria
      - name: 派生生成閲覧提供（P-10）
        deliverables:
          - local_id: bps-derived-project-scoped
            name: 業務プロセス仕様（project構成依存の派生生成）
            kind: work
            depends_on: [bes-index, bes-derived-content-requested]
            overview: project構成に依存する派生生成の対象確定・生成・閲覧提供フロー（P-10-01〜03）を定義する
            path: bps-derived-project-scoped.md
            rulebook: specdojo:bps-rulebook
            done_criteria: *bps-done-criteria
          - local_id: bps-derived-document-wide
            name: 業務プロセス仕様（文書全体対象の派生生成）
            kind: work
            depends_on: [bes-index, bes-derived-content-requested]
            overview: YAML表示ページや文書索引の対象確定・生成・閲覧提供フロー（P-10-01〜03）を定義する
            path: bps-derived-document-wide.md
            rulebook: specdojo:bps-rulebook
            done_criteria: *bps-done-criteria
          - local_id: bps-derived-standalone
            name: 業務プロセス仕様（一括再生成の外で起動する派生生成）
            kind: work
            depends_on: [bes-index, bes-derived-content-requested]
            overview: 個別要求または変更検知で起動する派生生成の対象確定・生成・閲覧提供フロー（P-10-01〜03）を定義する
            path: bps-derived-standalone.md
            rulebook: specdojo:bps-rulebook
            done_criteria: *bps-done-criteria
      - name: タスク完了（P-11）
        deliverables:
          - local_id: bps-task-completion
            name: 業務プロセス仕様（タスク完了）
            kind: work
            depends_on: [bes-index, bps-deliverable-evaluation]
            overview: 最新のgrade・findingと完了条件を照合して完了可否を判断し、完了を記録するフロー（P-11-01・02）を定義する
            path: bps-task-completion.md
            rulebook: specdojo:bps-rulebook
            done_criteria: *bps-done-criteria
      - name: 稼働構成管理（P-12）
        deliverables:
          - local_id: bps-config-change-evaluation
            name: 業務プロセス仕様（構成変更・変更要件評価）
            kind: work
            depends_on: [bes-index]
            overview: 稼働構成の変更必要性・影響・承認範囲を評価するフロー（P-12-01）を定義する
            path: bps-config-change-evaluation.md
            rulebook: specdojo:bps-rulebook
            done_criteria: *bps-done-criteria
          - local_id: bps-config-change-proposal-approval
            name: 業務プロセス仕様（構成案作成・承認）
            kind: work
            depends_on: [bes-index, bps-config-change-evaluation]
            overview: 構成案と権限安全境界を確認し、人間が構成変更を承認するフロー（P-12-01）を定義する
            path: bps-config-change-proposal-approval.md
            rulebook: specdojo:bps-rulebook
            done_criteria: *bps-done-criteria
          - local_id: bps-config-change-apply-verify
            name: 業務プロセス仕様（設定変更・検証）
            kind: work
            depends_on: [bes-index, bps-config-change-proposal-approval]
            overview: 承認済み変更を稼働構成・Kata・成果物カタログへ反映し、利用可能性を検証するフロー（P-12-02）を定義する
            path: bps-config-change-apply-verify.md
            rulebook: specdojo:bps-rulebook
            done_criteria: *bps-done-criteria
      - name: 非推奨化保管（P-13）
        deliverables:
          - local_id: bps-deprecation-process
            name: 業務プロセス仕様（非推奨化）
            kind: work
            depends_on: [bes-index]
            overview: 文書の非推奨化を人間が判断し、文書と成果物カタログへ反映するフロー（P-13-01・02）を定義する
            path: bps-deprecation-process.md
            rulebook: specdojo:bps-rulebook
            done_criteria: *bps-done-criteria
          - local_id: bps-deprecation-storage
            name: 業務プロセス仕様（保管）
            kind: work
            depends_on: [bes-index, bps-deprecation-process]
            overview: 非推奨化を反映した文書を現行文書と区別できる保管庫へ移すフロー（P-13-02・03）を定義する
            path: bps-deprecation-storage.md
            rulebook: specdojo:bps-rulebook
            done_criteria: *bps-done-criteria
      - name: オーケストレーター（P-14）
        deliverables:
          - local_id: bps-routine-register-schedule-cycle
            name: 業務プロセス仕様（定期起点のPDCA運転）
            kind: work
            depends_on: [bes-index, bes-routine-due]
            overview: 定期起点の運転要求確定・競合判定・PDCA要求発行・実行状態追跡のフロー（P-14-01〜04）を定義する
            path: bps-routine-register-schedule-cycle.md
            rulebook: specdojo:bps-rulebook
            done_criteria: *bps-done-criteria
