id: prj-0001:dct-migration-planning
type: project
status: draft
title: 成果物カタログ（移行計画）
rulebook: specdojo:dct-rulebook
project_id: prj-0001
domain: migration-planning
base_path: /docs/ja/projects/prj-0001/060-migration-planning

# 移行対象は「じぶんごとプラネットのような、ソーシャルハックデー中心の反復開発（Slack上の
# 議論・ワークショップ記録・個人noteなど非構造の記録）で進むシビックテックプロジェクト」から
# 「SpecDojoベースのプロジェクト運営（成果物カタログ・Schedule・登録簿による構造化管理）」への
# 移行と位置づける。imp-business/imp-data（dct-impact-analysis.yaml）を根拠とする。
# mip-index/dmd-index/mtp-index/cop-index/otp-indexは5種類固定構成
# （dct-migration-planning-template.yaml、いずれも-index単一ハブ）のため、
# SpecDojo固有の分割判断は不要。

groups:
  - name: 移行計画
    deliverables:
      - local_id: mip-index
        name: 移行計画
        kind: work
        depends_on:
          - imp-business
        overview: ソーシャルハックデー中心の反復開発からSpecDojoベースの運営への移行方針・全体計画・切替リスクを定義する
        path: mip-index.md
        rulebook: specdojo:mip-index-rulebook
        recipe: undecided
        sample: specdojo:mip-index-sample
        template: undecided
        note: 移行元はcdfd-jibungoto-planetが示す進め方（企画・リサーチ・要件検討・軌道修正・検証・公開）を代表例とする
        done_criteria:
          - text: 移行範囲・移行方式・スケジュール・リスクが業務観点で確認できること
            roles: [BA]
            viewpoint: vp-ba-business-value
          - text: 移行計画全体を承認できること
            roles: [PO]
            viewpoint: vp-po-decision-readiness
          - text: 技術的移行方式・リスク対策が識別できること
            roles: [ARC]
            viewpoint: vp-arc-technical-constraints
          - text: 移行テスト・受入条件が確認できること
            roles: [QE]
            viewpoint: vp-qe-verifiability
          - text: 移行スケジュールと体制が計画可能な粒度で記述されていること
            roles: [PM]
            viewpoint: vp-pm-plan-feasibility
          - text: 運用切替・ハイパーケア体制が確認できること
            roles: [OPS]
            viewpoint: vp-ops-operability

      - local_id: dmd-index
        name: データ移行設計
        kind: work
        depends_on:
          - mip-index
          - imp-data
        overview: Slack上の議論・ワークショップ記録・個人noteなど非構造の記録を、成果物カタログ・登録簿・Schedule等の構造化データへ変換する設計を定義する
        path: dmd-index.md
        rulebook: specdojo:dmd-index-rulebook
        recipe: undecided
        sample: specdojo:dmd-index-sample
        template: undecided
        note: &kata-only-migration-note じぶんごとプラネットの移行は仮想シナリオであり、実データ移行・本番切替は発生しない。PJR-1F46のとおりKata（dmd-index-rulebook）の整備・検証を目的として意図的に維持する
        done_criteria:
          - text: 移行対象データ・変換方針・マッピングが業務観点で確認できること
            roles: [BA]
            viewpoint: vp-ba-requirements-completeness
          - text: データ移行設計を承認できること
            roles: [PO]
            viewpoint: vp-po-decision-readiness
          - text: データ変換・整合性検証の技術方式が識別できること
            roles: [ARC]
            viewpoint: vp-arc-technical-constraints
          - text: データ検証・ロールバック方針が確認できること
            roles: [QE]
            viewpoint: vp-qe-verifiability
          - text: データ移行実装の技術要件が確認できること
            roles: [DEV]
            viewpoint: vp-dev-implementation-readiness

      - local_id: mtp-index
        name: 移行テスト計画（リハーサル計画）
        kind: work
        depends_on:
          - mip-index
        overview: SpecDojoベース運営への切替前に、成果物カタログ・Schedule・登録簿が実運用に耐えるかを検証するリハーサル計画を定義する
        path: mtp-index.md
        rulebook: specdojo:mtp-rulebook
        recipe: undecided
        sample: specdojo:mtp-sample
        template: undecided
        note: *kata-only-migration-note
        done_criteria:
          - text: テスト範囲・シナリオ・判定基準が業務観点で確認できること
            roles: [BA]
            viewpoint: vp-ba-business-value
          - text: 移行テスト計画を承認できること
            roles: [PO]
            viewpoint: vp-po-decision-readiness
          - text: テスト環境・技術的検証方式が識別できること
            roles: [ARC]
            viewpoint: vp-arc-technical-constraints
          - text: 是正計画を含む合格基準が確認できること
            roles: [QE]
            viewpoint: vp-qe-verifiability

      - local_id: cop-index
        name: カットオーバー計画（本番切替手順）
        kind: work
        depends_on:
          - mip-index
          - mtp-index
        overview: ソーシャルハックデー中心の運営からSpecDojoベース運営への切替手順を定義し、活動停止期間と混乱を最小化する
        path: cop-index.md
        rulebook: specdojo:cop-index-rulebook
        recipe: undecided
        sample: specdojo:cop-index-sample
        template: undecided
        note: *kata-only-migration-note
        done_criteria:
          - text: 切替手順・業務停止範囲・判定ポイントが業務観点で確認できること
            roles: [BA]
            viewpoint: vp-ba-business-value
          - text: カットオーバー計画を承認できること
            roles: [PO]
            viewpoint: vp-po-decision-readiness
          - text: 技術的切替手順・切戻し方式が識別できること
            roles: [ARC]
            viewpoint: vp-arc-technical-constraints
          - text: 判定ポイント・エスカレーション・切戻し手順が確認できること
            roles: [QE]
            viewpoint: vp-qe-verifiability
          - text: 運用体制・エスカレーション経路が確認できること
            roles: [OPS]
            viewpoint: vp-ops-operability

      - local_id: otp-index
        name: 運用切替計画（ハイパーケア含む）
        kind: work
        depends_on:
          - cop-index
        overview: 切替後、SpecDojoベース運営（Schedule・登録簿・routine）が安定稼働するまでの運用移管計画とハイパーケア体制を定義する
        path: otp-index.md
        rulebook: specdojo:otp-index-rulebook
        recipe: undecided
        sample: specdojo:otp-index-sample
        template: undecided
        note: *kata-only-migration-note
        done_criteria:
          - text: 運用引継ぎ・ハイパーケア体制が業務観点で確認できること
            roles: [BA]
            viewpoint: vp-ba-business-value
          - text: 運用移管計画を承認できること
            roles: [PO]
            viewpoint: vp-po-decision-readiness
          - text: 技術的監視強化・問い合わせ対応方針が識別できること
            roles: [ARC]
            viewpoint: vp-arc-technical-constraints
          - text: 安定化完了条件・受入判定が確認できること
            roles: [QE]
            viewpoint: vp-qe-verifiability
          - text: 運用体制・手順・ハイパーケア終了条件が確認できること
            roles: [OPS]
            viewpoint: vp-ops-operability
