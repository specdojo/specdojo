# yaml-language-server: $schema=../../../../specdojo/schemas/v1/sch-strategy.schema.yaml
kind: strategy
id: prj-0001:sch-strategy-kata-wave-6-project
type: project
status: draft
title: スケジュール戦略（型の整備 第 6 波：プロジェクトの型の残り）
rulebook: specdojo:sch-rulebook
track: kata-wave-6-project
# 成果物は kata ドメインの sample そのもの（PJR-6998）。sample を厚くする段は sample-maintenance とし、
# 手本を rulebook、対象を sample にする。型ごとの段の鎖が互いに待たずに並べて流れるよう、phase_gates を置かず、
# dct-kata.yaml の depends_on は sample が本文で参照する関係だけにする（PJR-BHFG）。型の grade は review の段の前に
# runner が rulebook と sample の組で流す。人の確定は track に入れず、横串の確認でまとめて行う。
# prj-charter は PJR-SV9G などで直し済み（rulebook 90・sample 96）のため track に入れない。recipe・template を持つ型には
# recipe（045）・template（060）の段を足す。
# pm-change-request-log・pm-issue-log・pm-risk-register の sample は PJR-X141 で非推奨にしたため、scope と段から外した。
scope:
  catalogs:
    - id: prj-0001:dct-kata
      path: /docs/ja/projects/prj-0001/010-deliverables-catalog/dct-kata.yaml
      local_ids:
        - prj-overview-sample
        - prj-scope-sample
        - prj-issues-and-approach-sample
        - prj-stakeholder-register-sample
        - prj-success-criteria-and-acceptance-criteria-sample
        - pm-communication-plan-sample
        - pm-members-sample
        - dct-sample
  include_kinds:
    - work
approach_rules:
  - local_ids:
      - prj-overview-sample
      - prj-scope-sample
      - prj-issues-and-approach-sample
      - prj-stakeholder-register-sample
      - prj-success-criteria-and-acceptance-criteria-sample
      - pm-communication-plan-sample
      - pm-members-sample
      - dct-sample
    intent: improve-kata
    kata_target: rulebook
phase_sets:
  rulebook-maintenance-pass:
    - id: rulebook-maintenance
      name: rulebook を簡潔にする
      execution: agent
      mode: edit
      approach: rulebook-maintenance
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: expert
          - stage_role: reporter
            proficiency: normal
      task_suffix: "040"
      duration_days: 0.5
      description:
        "対象の sample が従う rulebook を、grade のし直しの指摘（run id regrade-kata-2026-11-21 と、その後の最新の grade）と成果物の done_criteria に沿って簡潔に整える。rulebook に完成例の章を置かず、完成例は sample に任せる。見出しは H4 までにする。sample・recipe・template はこの段で変更しない。

        [[specdojo:rulebook-authoring-standard|Rulebook 記述標準]]（docs/ja/specdojo/standards/rulebook-authoring-standard.md）の章立てに合わせ、記述ガイドには章ごとの判断の基準と良い例・悪い例を書く。実装・schema・リファレンスと同じことを書かない方針（PJR-2GD6）を保ち、値・構文・構造の詳細は正本を参照する。rulebook が frontmatter の includes で記法の rulebook（`<name>-mermaid-rulebook` など）を取り込む場合は、記法の rulebook もこの段で簡潔にする。

        grade が pass の型は、grade の指摘、冗長な記述、ほかの型との重なりのように理由のある箇所だけを直し、理由のない書き換えはしない。直さなかった箇所と理由を result に書く。

        PJR-76N9 の決まりに従い、rulebook の「誰がどの利用場面で何を判断するか」は「どの利用場面で何を判断するための文書か」に直し、成果物の本文に文書の役割の割り当て（作る・確かめる・承認する役割）と承認の範囲・留保・差し戻しの進み具合を求めない。承認と留保は登録簿の個票で追う。RACI・体制など、文書の中身として役割を扱う型は対象外とする。

        "
  recipe-maintenance-pass:
    - id: recipe-maintenance
      name: recipe を rulebook に合わせる
      execution: agent
      mode: edit
      approach: recipe-maintenance
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: expert
          - stage_role: reporter
            proficiency: normal
      task_suffix: "045"
      duration_days: 0.25
      description:
        "直した rulebook に沿って recipe を同期する。問いと作成手順に責務を絞り、rulebook の規則を言い直さない。rulebook と sample はこの段で変更しない。recipe が not-needed・undecided なら変更せず、その旨を result に書いて完了する。

        PJR-76N9 の決まりに従い、文書の役割の割り当てと承認の進み具合を書かせる問いや手順を残さない。RACI・体制など、文書の中身として役割を扱う型は対象外とする。

        "
  sample-maintenance-pass:
    - id: sample-maintenance
      name: sample を厚くする
      execution: agent
      mode: edit
      approach: sample-maintenance
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: expert
          - stage_role: reporter
            proficiency: normal
      task_suffix: "050"
      duration_days: 0.5
      description:
        "直した rulebook に沿い、sample を共通サンプル文脈（駄菓子屋のプロジェクト）の完成例として厚くする。この sample が成果物そのものなので、成果物の done_criteria と sample の grade の指摘をこの段で満たす。何を書くかの説明ではなく、値で埋めた成果物の実例にする。rulebook はこの段で変更せず、合わせて直すべき点は変更案として result に書く。

        sample は [[specdojo:clis-sample|CLI仕様の完成例]]（docs/ja/specdojo/samples/clis-sample.md）程度の厚さにし、[[specdojo:sample-authoring-standard|Sample 記述標準]]（docs/ja/specdojo/standards/sample-authoring-standard.md）に従う。性能や可用性の目標、移行の対象、切替の日程など、利用者が決める値は推測で埋めず `_UNDECIDED_` で残し、決める必要のある値を result に書く。grade が pass の型は、理由のある箇所だけを直す。

        PJR-76N9 の決まりに従い、sample の本文に文書の役割の割り当て（作る・確かめる・承認する役割）と承認の範囲・留保・差し戻しの進み具合を書かない。grade の指摘や done_criteria がそれを求めても足さず、合わせて直すべき点として result に書く。RACI・体制など、文書の中身として役割を扱う型は対象外とする。

        "
  template-maintenance-pass:
    - id: template-maintenance
      name: template を rulebook に合わせる
      execution: agent
      mode: edit
      approach: template-maintenance
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: expert
          - stage_role: reporter
            proficiency: normal
      task_suffix: "060"
      duration_days: 0.25
      description:
        "直した rulebook と厚くした sample に沿って template を同期する。骨組みに責務を絞り、必須の章・項目・表の列名をそろえ、説明や完成例を写さない。rulebook と sample はこの段で変更しない。template が not-needed・undecided なら変更せず、その旨を result に書いて完了する。

        PJR-76N9 の決まりに従い、文書の役割の割り当てと承認の進み具合の記入欄を置かない。RACI・体制など、文書の中身として役割を扱う型は対象外とする。

        "
  condense-pass:
    - id: condense
      name: 冗長さの整理
      execution: agent
      mode: edit
      approach: condense
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: normal
          - stage_role: reporter
            proficiency: normal
      task_suffix: "080"
      duration_days: 0.25
      description:
        "1 文書の冗長さを削る・まとめる・参照に置き換える。判断に要る背景・制約・例外・完了条件と意味を保ち、新しい内容を足さず、修正・保持した箇所と原因を result に記録する。

        "
  review-pass:
    - id: review
      name: 型の grade とレビュー
      execution: agent
      mode: review
      approach: fully-guided
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: normal
          - stage_role: reporter
            proficiency: normal
      task_suffix: "090"
      duration_days: 0.25
      description:
        "review の前に、runner が rulebook と sample の組（rulebook が宣言する recipe・template を含む）を grade の --target kata で評価する。この評価結果と、対応する rulebook と sample を読み、章構成・判断基準・例の充実度・相互整合をレビューする。sample の done_criteria だけで完了としない。成果物・型は変更せず、指摘と根拠を review result に残す。

        人の確定はこの track に入れず、sample がひととおりそろった後の横串の確認でまとめて行う。確定の前に確かめるべき点は review result に書く。

        "
default_phase_sets:
  - phase_set: rulebook-maintenance-pass
  - phase_set: sample-maintenance-pass
  - phase_set: condense-pass
  - phase_set: review-pass
owner_rules:
  - local_ids:
      - prj-overview-sample
      - prj-scope-sample
      - prj-issues-and-approach-sample
      - prj-stakeholder-register-sample
      - prj-success-criteria-and-acceptance-criteria-sample
    owner: PO
    phase_sets:
      - phase_set: rulebook-maintenance-pass
      - phase_set: recipe-maintenance-pass
      - phase_set: sample-maintenance-pass
      - phase_set: template-maintenance-pass
      - phase_set: condense-pass
      - phase_set: review-pass
    phase_overrides:
      - phase: rulebook-maintenance
        agent:
          executor: opus-executor
          reporter: gemma26-reporter
      - phase: recipe-maintenance
        agent:
          executor: opus-executor
          reporter: gemma26-reporter
      - phase: sample-maintenance
        agent:
          executor: opus-executor
          reporter: gemma26-reporter
      - phase: template-maintenance
        agent:
          executor: opus-executor
          reporter: gemma26-reporter
      - phase: condense
        agent:
          executor: sonnet-executor
          reporter: gemma26-reporter
      - phase: review
        agent:
          executor: sonnet-review-executor
          reporter: gemma26-reporter
  - local_ids:
      - pm-communication-plan-sample
      - pm-members-sample
    owner: PM
    phase_sets:
      - phase_set: rulebook-maintenance-pass
      - phase_set: recipe-maintenance-pass
      - phase_set: sample-maintenance-pass
      - phase_set: template-maintenance-pass
      - phase_set: condense-pass
      - phase_set: review-pass
    phase_overrides:
      - phase: rulebook-maintenance
        agent:
          executor: opus-executor
          reporter: gemma26-reporter
      - phase: recipe-maintenance
        agent:
          executor: opus-executor
          reporter: gemma26-reporter
      - phase: sample-maintenance
        agent:
          executor: opus-executor
          reporter: gemma26-reporter
      - phase: template-maintenance
        agent:
          executor: opus-executor
          reporter: gemma26-reporter
      - phase: condense
        agent:
          executor: sonnet-executor
          reporter: gemma26-reporter
      - phase: review
        agent:
          executor: sonnet-review-executor
          reporter: gemma26-reporter
  - local_ids:
      - dct-sample
    owner: PM
    phase_overrides:
      - phase: rulebook-maintenance
        agent:
          executor: opus-executor
          reporter: gemma26-reporter
      - phase: sample-maintenance
        agent:
          executor: opus-executor
          reporter: gemma26-reporter
      - phase: condense
        agent:
          executor: sonnet-executor
          reporter: gemma26-reporter
      - phase: review
        agent:
          executor: sonnet-review-executor
