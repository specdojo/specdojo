# yaml-language-server: $schema=../../../../specdojo/schemas/v1/sch-track.schema.yaml
kind: track
id: prj-0001:sch-track-kata-wave-2
type: project
status: draft
title: スケジュールトラック（kata-wave-2）
rulebook: specdojo:sch-rulebook
version: 1
project_id: prj-0001
track: kata-wave-2
settings: {}
tasks:
  - local_id: bac-task-completion
    phase_suffix: "005"
    phase_set: bootstrap-pass
    phase_id: bootstrap
    name: 代表成果物・実践の型の初期整備
    duration_days: 0.5
    depends_on: []
    owner: BA
    description: >
      実践の型の作成条件から要否を判断し、代表成果物と必要な rulebook / recipe / sample / template を同じタスクで初期整備する。不要な3種は rulebook frontmatter へ
      not-needed と宣言し、必要な一式の構造・用語・粒度を整合させる。代表が既存なら型との整合に必要な範囲だけ直し、業務判断は確定しない。判断できない前提は推測せず result に残す。


      [[specdojo:rulebook-authoring-standard|Rulebook 記述標準]]の章立てに合わせ、rulebook に完成例の章を置かず sample へ外出しする。Markdown
      の第2〜第4階層の見出しに階層ごとの連番を付け、記述ガイドには章ごとの判断基準と良い例・悪い例を書く。sample は [[specdojo:clis-sample|CLI仕様の完成例]]程度の厚さとし、YAML
      は対象形式に合わせて内容を充実させる。recipe と template の要否を判断し、rulebook frontmatter に対応する ID または not-needed を宣言して理由を result
      に残す。実装・schema・リファレンスの値・構文・構造の詳細を再掲せず、正本を参照する。
  - local_id: bac-task-completion
    phase_suffix: "040"
    phase_set: rulebook-maintenance-pass
    phase_id: rulebook-maintenance
    name: rulebook の見直し
    duration_days: 0.5
    depends_on:
      - T-KATA-WAVE-2-bac-task-completion-005
    owner: BA
    description: >
      代表成果物の実績から rulebook の規則・判断基準を見直す。後続の段で recipe・sample・template を同期する。成果物本体はこの段で変更しない。実行時に対象が not-needed なら変更せず、その旨を
      result に記録して完了する。


      [[specdojo:rulebook-authoring-standard|Rulebook 記述標準]]の章立てに合わせ、rulebook に完成例の章を置かず sample へ外出しする。Markdown
      の第2〜第4階層の見出しに階層ごとの連番を付け、記述ガイドには章ごとの判断基準と良い例・悪い例を書く。sample は [[specdojo:clis-sample|CLI仕様の完成例]]程度の厚さとし、YAML
      は対象形式に合わせて内容を充実させる。recipe と template の要否を判断し、rulebook frontmatter に対応する ID または not-needed を宣言して理由を result
      に残す。実装・schema・リファレンスの値・構文・構造の詳細を再掲せず、正本を参照する。
  - local_id: bac-task-completion
    phase_suffix: "045"
    phase_set: recipe-maintenance-pass
    phase_id: recipe-maintenance
    name: recipe の見直し
    duration_days: 0.5
    depends_on:
      - T-KATA-WAVE-2-bac-task-completion-040
    owner: BA
    description: >
      改訂した rulebook に沿って recipe を同期する。問いと作成手順に責務を絞り、rulebook の規則を再定義しない。成果物本体はこの段で変更しない。実行時に対象が not-needed なら変更せず、その旨を
      result に記録して完了する。


      [[specdojo:rulebook-authoring-standard|Rulebook 記述標準]]の章立てに合わせ、rulebook に完成例の章を置かず sample へ外出しする。Markdown
      の第2〜第4階層の見出しに階層ごとの連番を付け、記述ガイドには章ごとの判断基準と良い例・悪い例を書く。sample は [[specdojo:clis-sample|CLI仕様の完成例]]程度の厚さとし、YAML
      は対象形式に合わせて内容を充実させる。recipe と template の要否を判断し、rulebook frontmatter に対応する ID または not-needed を宣言して理由を result
      に残す。実装・schema・リファレンスの値・構文・構造の詳細を再掲せず、正本を参照する。
  - local_id: bac-task-completion
    phase_suffix: "050"
    phase_set: sample-maintenance-pass
    phase_id: sample-maintenance
    name: sample の見直し
    duration_days: 0.5
    depends_on:
      - T-KATA-WAVE-2-bac-task-completion-045
    owner: BA
    description: >
      改訂した rulebook に沿って sample を完成例として手入れする。共通サンプル文脈を用い、代表成果物を単純に複写せず、判断に要る場面・例外を拾う。成果物本体はこの段で変更しない。実行時に対象が not-needed
      なら変更せず、その旨を result に記録して完了する。


      [[specdojo:rulebook-authoring-standard|Rulebook 記述標準]]の章立てに合わせ、rulebook に完成例の章を置かず sample へ外出しする。Markdown
