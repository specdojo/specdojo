      は対象形式に合わせて内容を充実させる。recipe と template の要否を判断し、rulebook frontmatter に対応する ID または not-needed を宣言して理由を result
      に残す。実装・schema・リファレンスの値・構文・構造の詳細を再掲せず、正本を参照する。
  - local_id: bac-task-completion
    phase_suffix: "060"
    phase_set: template-maintenance-pass
    phase_id: template-maintenance
    name: template の見直し
    duration_days: 0.5
    depends_on:
      - T-KATA-WAVE-2-bac-task-completion-050
    owner: BA
    description: >
      改訂した rulebook に沿って template を同期する。骨組みに責務を絞り、必須の章・項目・表の列名を整合させ、説明や完成例を転載しない。成果物本体はこの段で変更しない。実行時に対象が not-needed
      なら変更せず、その旨を result に記録して完了する。


      [[specdojo:rulebook-authoring-standard|Rulebook 記述標準]]の章立てに合わせ、rulebook に完成例の章を置かず sample へ外出しする。Markdown
      の第2〜第4階層の見出しに階層ごとの連番を付け、記述ガイドには章ごとの判断基準と良い例・悪い例を書く。sample は [[specdojo:clis-sample|CLI仕様の完成例]]程度の厚さとし、YAML
      は対象形式に合わせて内容を充実させる。recipe と template の要否を判断し、rulebook frontmatter に対応する ID または not-needed を宣言して理由を result
      に残す。実装・schema・リファレンスの値・構文・構造の詳細を再掲せず、正本を参照する。
  - local_id: bac-task-completion
    phase_suffix: "070"
    phase_set: refine-pass
    phase_id: refine
    name: 磨き込み・整合性確認
    duration_days: 0.25
    depends_on:
      - T-KATA-WAVE-2-bac-task-completion-060
      - G-KATA-WAVE-2-first-pass
    owner: BA
    description: |
      整備済みの実践の型と先行・隣接成果物を参照し、既存の草案を保守的に磨き込む。責務境界と depends_on に沿った情報の受け渡しを確認し、不足や不整合だけを最小限修正して done_criteria を満たす状態へ整える。
  - local_id: bac-task-completion
    phase_suffix: "080"
    phase_set: condense-pass
    phase_id: condense
    name: 冗長さの整理
    duration_days: 0.25
    depends_on:
      - T-KATA-WAVE-2-bac-task-completion-070
      - G-KATA-WAVE-2-refine-pass
    owner: BA
    description: |
      1 文書の冗長さを削る・まとめる・参照に置き換える。判断に要る背景・制約・例外・完了条件と意味を保ち、新しい内容を足さず、修正・保持した箇所と原因を result に記録する。
  - local_id: bac-task-completion
    phase_suffix: "090"
    phase_set: retrofit-review-pass
    phase_id: review
    name: 完成版レビュー（実装照合）
    duration_days: 0.25
    depends_on:
      - T-KATA-WAVE-2-bac-task-completion-080
    owner: BA
    description: |
      完成版を変更せず、evidence_refs が示す現在動作、意図された仕様、done_criteria を照合する。実装との一致・乖離・未確認範囲を判定し、根拠と修正対象候補を review result に記録する。
  - local_id: bac-task-completion
    phase_suffix: "140"
    phase_set: finalize-pass
    phase_id: finalize
    name: 完成版確定
    duration_days: 0.125
    depends_on:
      - T-KATA-WAVE-2-bac-task-completion-090
      - G-KATA-WAVE-2-review-pass
    owner: BA
    description: >
      担当ロールがレビュー結果と done_criteria を最終確認し、成果物を完成版として確定する。bootstrap 対象では、同じタスクで整備した rulebook / recipe / sample / template
      もあわせて確認する。
