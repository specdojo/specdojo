# yaml-language-server: $schema=../../../../specdojo/schemas/v1/sch-track.schema.yaml
kind: track
id: prj-0001:sch-track-project-kata
type: project
status: draft
title: スケジュールトラック（project-kata）
rulebook: specdojo:sch-rulebook
version: 1
project_id: prj-0001
track: project-kata
settings: {}
tasks:
  - local_id: pm-organization
    phase_suffix: "040"
    phase_set: rulebook-maintenance-pass
    phase_id: rulebook-maintenance
    name: rulebook の見直し
    duration_days: 0.5
    depends_on: []
    owner: PM
    description: >
      代表成果物の実績から
      pm-plan・pm-organization・pm-roles・pm-raci・pm-quality-management-plan・prj-assumptions-constraints-dependencies・prj-comparison-of-alternatives
      のうち対応する rulebook を手入れする。成果物本体は変更しない。sample の完成例は後続の sample-maintenance で整備する。必要と判断した recipe・template
      は対応結果に次の作業案を残す。

      [[specdojo:rulebook-authoring-standard|Rulebook
      記述標準]]（docs/ja/specdojo/standards/rulebook-authoring-standard.md）の章立てに合わせ、rulebook にサンプルの章を置かず完成例を sample
      に外出しする。Markdown の ##〜#### の見出しに階層ごとの連番を付ける。記述ガイドには章ごとの判断の基準と良い例・悪い例を書く。sample は
      [[specdojo:clis-sample|CLI仕様の完成例]]（docs/ja/specdojo/samples/clis-sample.md）程度の厚さの完成例にする（YAML の sample
      は対象形式に合わせて内容を充実させる）。recipe と template の要否を決め、rulebook frontmatter に対応する ID または not-needed を宣言し、判断理由を result
      に残す。実装・schema・リファレンスと同じことを書かない方針（PJR-2GD6）を保ち、値・構文・構造の詳細は正本を参照する。
  - local_id: pm-organization
    phase_suffix: "050"
    phase_set: sample-maintenance-pass
    phase_id: sample-maintenance
    name: sample の見直し
    duration_days: 0.5
    depends_on:
      - T-PROJECT-KATA-pm-organization-040
    owner: PM
    agent:
      executor: sol-executor
    description: >
      改訂した rulebook に沿い、対応する sample（pm-plan-sample など）を完成例として手入れする。sample は共通サンプル文脈（駄菓子屋のプロジェクト）に合わせ、代表成果物（SpecDojo の
      prj-0001）の内容を写さない。代表から判断に要る場面・例外を拾う。成果物本体は変更しない。

      [[specdojo:rulebook-authoring-standard|Rulebook
      記述標準]]（docs/ja/specdojo/standards/rulebook-authoring-standard.md）の章立てに合わせ、rulebook にサンプルの章を置かず完成例を sample
      に外出しする。Markdown の ##〜#### の見出しに階層ごとの連番を付ける。記述ガイドには章ごとの判断の基準と良い例・悪い例を書く。sample は
      [[specdojo:clis-sample|CLI仕様の完成例]]（docs/ja/specdojo/samples/clis-sample.md）程度の厚さの完成例にする（YAML の sample
      は対象形式に合わせて内容を充実させる）。recipe と template の要否を決め、rulebook frontmatter に対応する ID または not-needed を宣言し、判断理由を result
      に残す。実装・schema・リファレンスと同じことを書かない方針（PJR-2GD6）を保ち、値・構文・構造の詳細は正本を参照する。
  - local_id: pm-organization
    phase_suffix: "090"
    phase_set: review-pass
    phase_id: review
    name: 完成版レビュー
    duration_days: 0.25
    depends_on:
      - T-PROJECT-KATA-pm-organization-050
      - G-PROJECT-KATA-first-pass
    owner: PM
    description: >
      対応する rulebook・sample と代表成果物を読み、型一式の章構成・判断基準・例の充実度・相互整合をレビューする。代表成果物の `done_criteria` だけで完了としない。成果物・型は変更せず、指摘と根拠を
      review result に残す。

      [[specdojo:rulebook-authoring-standard|Rulebook
      記述標準]]（docs/ja/specdojo/standards/rulebook-authoring-standard.md）の章立てに合わせ、rulebook にサンプルの章を置かず完成例を sample
