# agent は owner_rules の phase_overrides で指名する。当初は kata-guide の「書き手と別のモデルの組み方」に従い、
# claude と flash（cdt・ifx-cmd）が書いた sample を sol-executor に任せていた。codex の利用枠で止まるため、
# 利用者の判断でこの全件レビューに限って決まりを外し、全段を opus-executor にした（2026-11-25）。
# 流す順の段の区切りの依存は付けない（利用者の判断、2026-11-24）。1 件止まっても後ろが止まらないよう、
# grade が pass でない sample はオーケストレーターが先に流し、残りは exec run --auto の選択に任せる。
