# PJR-0BGE の段取りとして PJR-G2XJ で組んだもの。PJR-F4TG で目合わせした 5 段のレビュー（R1〜R5）を、
# dct-kata の非推奨でない sample のうち目合わせの 3 件（prj-overview・opr・stsd）を除く 103 件に広げる。
