# yaml-language-server: $schema=../../../../specdojo/schemas/v1/sch-strategy.schema.yaml
kind: strategy
id: prj-0001:sch-strategy-kata-wave-2
type: project
status: draft
title: スケジュール戦略（型の整備 第 2 波）
rulebook: specdojo:sch-rulebook
track: kata-wave-2
scope:
  catalogs:
    - id: prj-0001:dct-business-acceptance-criteria
      path: /docs/ja/projects/prj-0001/010-deliverables-catalog/dct-business-acceptance-criteria.yaml
      local_ids:
        - bac-task-completion
    - id: prj-0001:dct-user-interface-model
      path: /docs/ja/projects/prj-0001/010-deliverables-catalog/dct-user-interface-model.yaml
      local_ids:
        - bds-progress-report
    - id: prj-0001:dct-data-model-cdsd
      path: /docs/ja/projects/prj-0001/010-deliverables-catalog/dct-data-model-cdsd.yaml
      local_ids:
        - sld-specdojo
    - id: prj-0001:dct-external-interface-specs
      path: /docs/ja/projects/prj-0001/010-deliverables-catalog/dct-external-interface-specs.yaml
      local_ids:
        - ifx-file-agent-evidence
  include_kinds:
    - work
approach_rules:
  - local_ids:
      - bac-task-completion
      - bds-progress-report
      - sld-specdojo
      - ifx-file-agent-evidence
    intent: bootstrap-kata-set
    bootstrap_scope:
      - rulebook
      - sample
phase_sets:
  bootstrap-pass:
    - id: bootstrap
      name: 代表成果物・実践の型の初期整備
      execution: agent
      mode: edit
      approach: bootstrap
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: expert
          - stage_role: reporter
            proficiency: normal
      task_suffix: "005"
      duration_days: 0.5
      description: >
        実践の型の作成条件から要否を判断し、代表成果物と必要な rulebook / recipe / sample / template を同じタスクで初期整備する。不要な3種は rulebook frontmatter へ
        not-needed と宣言し、必要な一式の構造・用語・粒度を整合させる。代表が既存なら型との整合に必要な範囲だけ直し、業務判断は確定しない。判断できない前提は推測せず result に残す。


        [[specdojo:rulebook-authoring-standard|Rulebook 記述標準]]の章立てに合わせ、rulebook に完成例の章を置かず sample へ外出しする。Markdown
        の第2〜第4階層の見出しに階層ごとの連番を付け、記述ガイドには章ごとの判断基準と良い例・悪い例を書く。sample は [[specdojo:clis-sample|CLI仕様の完成例]]程度の厚さとし、YAML
        は対象形式に合わせて内容を充実させる。recipe と template の要否を判断し、rulebook frontmatter に対応する ID または not-needed を宣言して理由を result
        に残す。実装・schema・リファレンスの値・構文・構造の詳細を再掲せず、正本を参照する。
  rulebook-maintenance-pass:
    - id: rulebook-maintenance
      name: rulebook の見直し
      execution: agent
      mode: edit
      approach: rulebook-maintenance
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: expert
          - stage_role: reporter
            proficiency: normal
      task_suffix: "040"
      duration_days: 0.5
      description: >
        代表成果物の実績から rulebook の規則・判断基準を見直す。後続の段で recipe・sample・template を同期する。成果物本体はこの段で変更しない。実行時に対象が not-needed
        なら変更せず、その旨を result に記録して完了する。


        [[specdojo:rulebook-authoring-standard|Rulebook 記述標準]]の章立てに合わせ、rulebook に完成例の章を置かず sample へ外出しする。Markdown
        の第2〜第4階層の見出しに階層ごとの連番を付け、記述ガイドには章ごとの判断基準と良い例・悪い例を書く。sample は [[specdojo:clis-sample|CLI仕様の完成例]]程度の厚さとし、YAML
        は対象形式に合わせて内容を充実させる。recipe と template の要否を判断し、rulebook frontmatter に対応する ID または not-needed を宣言して理由を result
        に残す。実装・schema・リファレンスの値・構文・構造の詳細を再掲せず、正本を参照する。
  recipe-maintenance-pass:
    - id: recipe-maintenance
      name: recipe の見直し
      execution: agent
      mode: edit
      approach: recipe-maintenance
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: expert
          - stage_role: reporter
            proficiency: normal
      task_suffix: "045"
      duration_days: 0.5
      description: >
        改訂した rulebook に沿って recipe を同期する。問いと作成手順に責務を絞り、rulebook の規則を再定義しない。成果物本体はこの段で変更しない。実行時に対象が not-needed なら変更せず、その旨を
        result に記録して完了する。


        [[specdojo:rulebook-authoring-standard|Rulebook 記述標準]]の章立てに合わせ、rulebook に完成例の章を置かず sample へ外出しする。Markdown
        の第2〜第4階層の見出しに階層ごとの連番を付け、記述ガイドには章ごとの判断基準と良い例・悪い例を書く。sample は [[specdojo:clis-sample|CLI仕様の完成例]]程度の厚さとし、YAML
        は対象形式に合わせて内容を充実させる。recipe と template の要否を判断し、rulebook frontmatter に対応する ID または not-needed を宣言して理由を result
        に残す。実装・schema・リファレンスの値・構文・構造の詳細を再掲せず、正本を参照する。
  sample-maintenance-pass:
    - id: sample-maintenance
      name: sample の見直し
      execution: agent
      mode: edit
      approach: sample-maintenance
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: expert
          - stage_role: reporter
            proficiency: normal
      task_suffix: "050"
      duration_days: 0.5
      description: >
        改訂した rulebook に沿って sample を完成例として手入れする。共通サンプル文脈を用い、代表成果物を単純に複写せず、判断に要る場面・例外を拾う。成果物本体はこの段で変更しない。実行時に対象が
        not-needed なら変更せず、その旨を result に記録して完了する。


        [[specdojo:rulebook-authoring-standard|Rulebook 記述標準]]の章立てに合わせ、rulebook に完成例の章を置かず sample へ外出しする。Markdown
        の第2〜第4階層の見出しに階層ごとの連番を付け、記述ガイドには章ごとの判断基準と良い例・悪い例を書く。sample は [[specdojo:clis-sample|CLI仕様の完成例]]程度の厚さとし、YAML
        は対象形式に合わせて内容を充実させる。recipe と template の要否を判断し、rulebook frontmatter に対応する ID または not-needed を宣言して理由を result
        に残す。実装・schema・リファレンスの値・構文・構造の詳細を再掲せず、正本を参照する。
  template-maintenance-pass:
    - id: template-maintenance
      name: template の見直し
      execution: agent
      mode: edit
      approach: template-maintenance
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: expert
          - stage_role: reporter
            proficiency: normal
      task_suffix: "060"
      duration_days: 0.5
      description: >
        改訂した rulebook に沿って template を同期する。骨組みに責務を絞り、必須の章・項目・表の列名を整合させ、説明や完成例を転載しない。成果物本体はこの段で変更しない。実行時に対象が not-needed
        なら変更せず、その旨を result に記録して完了する。


        [[specdojo:rulebook-authoring-standard|Rulebook 記述標準]]の章立てに合わせ、rulebook に完成例の章を置かず sample へ外出しする。Markdown
        の第2〜第4階層の見出しに階層ごとの連番を付け、記述ガイドには章ごとの判断基準と良い例・悪い例を書く。sample は [[specdojo:clis-sample|CLI仕様の完成例]]程度の厚さとし、YAML
        は対象形式に合わせて内容を充実させる。recipe と template の要否を判断し、rulebook frontmatter に対応する ID または not-needed を宣言して理由を result
        に残す。実装・schema・リファレンスの値・構文・構造の詳細を再掲せず、正本を参照する。
  refine-pass:
    - id: refine
      name: 磨き込み・整合性確認
      execution: agent
      mode: edit
      approach: fully-guided
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: normal
          - stage_role: reporter
            proficiency: normal
      task_suffix: "070"
      duration_days: 0.25
      description: >
        整備済みの実践の型と先行・隣接成果物を参照し、既存の草案を保守的に磨き込む。責務境界と depends_on に沿った情報の受け渡しを確認し、不足や不整合だけを最小限修正して done_criteria
        を満たす状態へ整える。
  condense-pass:
    - id: condense
      name: 冗長さの整理
      execution: agent
      mode: edit
      approach: condense
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: normal
          - stage_role: reporter
            proficiency: normal
      task_suffix: "080"
      duration_days: 0.25
      description: |
        1 文書の冗長さを削る・まとめる・参照に置き換える。判断に要る背景・制約・例外・完了条件と意味を保ち、新しい内容を足さず、修正・保持した箇所と原因を result に記録する。
  retrofit-review-pass:
    - id: review
      name: 完成版レビュー（実装照合）
      execution: agent
      mode: review
      approach: retrofit
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: normal
          - stage_role: reporter
            proficiency: normal
      task_suffix: "090"
      duration_days: 0.25
      description: |
        完成版を変更せず、evidence_refs が示す現在動作、意図された仕様、done_criteria を照合する。実装との一致・乖離・未確認範囲を判定し、根拠と修正対象候補を review result に記録する。
  finalize-pass:
    - id: finalize
      name: 完成版確定
      execution: human
      mode: edit
      approach: finalize
      task_suffix: "140"
      duration_days: 0.125
      description: >
        担当ロールがレビュー結果と done_criteria を最終確認し、成果物を完成版として確定する。bootstrap 対象では、同じタスクで整備した rulebook / recipe / sample /
        template もあわせて確認する。
default_phase_sets:
  - phase_set: bootstrap-pass
  - phase_set: rulebook-maintenance-pass
  - phase_set: sample-maintenance-pass
  - phase_set: refine-pass
  - phase_set: condense-pass
  - phase_set: retrofit-review-pass
  - phase_set: finalize-pass
owner_rules:
  - local_ids:
      - ifx-file-agent-evidence
      - sld-specdojo
    owner: ARC
    phase_overrides:
      - phase: finalize
        approach: bootstrap-finalize
  - local_ids:
      - bac-task-completion
    owner: BA
    phase_sets:
      - phase_set: bootstrap-pass
      - phase_set: rulebook-maintenance-pass
      - phase_set: recipe-maintenance-pass
      - phase_set: sample-maintenance-pass
      - phase_set: template-maintenance-pass
      - phase_set: refine-pass
      - phase_set: condense-pass
      - phase_set: retrofit-review-pass
      - phase_set: finalize-pass
    phase_overrides:
      - phase: finalize
        approach: bootstrap-finalize
  - local_ids:
      - bds-progress-report
    owner: UX
    phase_overrides:
      - phase: finalize
        approach: bootstrap-finalize
phase_gates:
  - id: G-KATA-WAVE-2-first-pass
    name: 初回パス完了
    after_phase_sets:
      - bootstrap-pass
      - rulebook-maintenance-pass
      - recipe-maintenance-pass
      - sample-maintenance-pass
      - template-maintenance-pass
    owner: PO
    scope:
      catalogs:
        - prj-0001:dct-business-acceptance-criteria
        - prj-0001:dct-user-interface-model
        - prj-0001:dct-data-model-cdsd
        - prj-0001:dct-external-interface-specs
  - id: G-KATA-WAVE-2-refine-pass
    name: 磨き込み完了
    after_phase_sets:
      - refine-pass
    owner: PO
    scope:
      catalogs:
        - prj-0001:dct-business-acceptance-criteria
        - prj-0001:dct-user-interface-model
        - prj-0001:dct-data-model-cdsd
        - prj-0001:dct-external-interface-specs
  - id: G-KATA-WAVE-2-review-pass
    name: レビュー完了
    after_phase_sets:
      - retrofit-review-pass
    owner: PO
    scope:
      catalogs:
        - prj-0001:dct-business-acceptance-criteria
        - prj-0001:dct-user-interface-model
        - prj-0001:dct-data-model-cdsd
        - prj-0001:dct-external-interface-specs
group_milestones:
  - catalog_id: prj-0001:dct-business-acceptance-criteria
    milestone:
      id: M-KATA-WAVE-2-business-acceptance-criteria
      name: ドメイン完了
      artifact_name: 業務受入条件
      owner: PO
  - catalog_id: prj-0001:dct-user-interface-model
    milestone:
      id: M-KATA-WAVE-2-user-interface-model
      name: ドメイン完了
      artifact_name: ユーザーインターフェースモデル
      owner: PO
  - catalog_id: prj-0001:dct-data-model-cdsd
    milestone:
      id: M-KATA-WAVE-2-data-model
      name: ドメイン完了
      artifact_name: データモデル／概念データストア定義
      owner: PO
  - catalog_id: prj-0001:dct-external-interface-specs
    milestone:
      id: M-KATA-WAVE-2-external-interface-specs
      name: ドメイン完了
      artifact_name: 外部I/F仕様
      owner: PO
