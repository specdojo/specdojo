# yaml-language-server: $schema=../../../../specdojo/schemas/v1/sch-track.schema.yaml
kind: track
id: prj-0001:sch-track-kata-review-calibration
type: project
status: draft
title: スケジュールトラック（kata-review-calibration）
rulebook: specdojo:sch-rulebook
version: 1
project_id: prj-0001
track: kata-review-calibration
settings: {}
tasks:
  - local_id: opr-sample
    phase_suffix: "110"
    phase_set: kata-agent-review-pass
    phase_id: kata-review-r1
    name: R1 目的の過不足
    duration_days: 0.25
    depends_on: []
    owner: OPS
    agent:
      executor: sol-executor
      reporter: sonnet-reporter
    description: >
      kata のレビューの段 R1（目的の過不足）を行う。段の内容・読む範囲・観点・報告の形は
      [[specdojo:kata-guide|実践の型活用ガイド]]（docs/ja/specdojo/guides/kata-guide.md）の「kata を agent でレビューする」に従う。plan に展開された
      grade の finding は、この段の観点に当たるものだけを扱い、ほかは扱う段に任せる。この段は sample を厚くする段ではなく、R1 の確かめに当たる箇所だけを直す。

      対象の sample が、種別の責務（Sample 記述標準）と rulebook の目的に対し、要る内容を欠いていないか、要らない内容を含んでいないかを確かめ、足す・削る差分を sample に入れる。rulebook など
      sample 以外は変更せず、直す案を result に書く。報告は同ガイドの「人への報告の形」の指摘の表で result の実施内容に書き、迷った指摘に「要判断」の印を付ける。
  - local_id: opr-sample
    phase_suffix: "120"
    phase_set: kata-agent-review-pass
    phase_id: kata-review-r2
    name: R2 構成
    duration_days: 0.25
    depends_on:
      - T-KATA-REVIEW-CALIBRATION-opr-sample-110
    owner: OPS
    agent:
      executor: sol-executor
      reporter: sonnet-reporter
    description: >
      kata のレビューの段 R2（構成）を行う。段の内容・読む範囲・観点・報告の形は
      [[specdojo:kata-guide|実践の型活用ガイド]]（docs/ja/specdojo/guides/kata-guide.md）の「kata を agent でレビューする」に従う。plan に展開された
      grade の finding は、この段の観点に当たるものだけを扱い、ほかは扱う段に任せる。R1 が直した版を読み、R1 の指摘を繰り返さない。

      章の順・粒度・表と本文の配置が rulebook の本文構成と template に沿い、前提から結論の順に読めるかを確かめ、章の移動・分割・統合の差分を sample に入れる。rulebook など sample
      以外は変更せず、直す案を result に書く。報告は同ガイドの「人への報告の形」の指摘の表で result の実施内容に書き、迷った指摘に「要判断」の印を付ける。
  - local_id: opr-sample
    phase_suffix: "130"
    phase_set: kata-agent-review-pass
    phase_id: kata-review-r3
    name: R3 読みやすさ
    duration_days: 0.25
    depends_on:
      - T-KATA-REVIEW-CALIBRATION-opr-sample-120
    owner: OPS
    agent:
      executor: sol-executor
      reporter: sonnet-reporter
    description: >
      kata のレビューの段 R3（読みやすさ）を行う。段の内容・読む範囲・観点・報告の形は
      [[specdojo:kata-guide|実践の型活用ガイド]]（docs/ja/specdojo/guides/kata-guide.md）の「kata を agent でレビューする」に従う。plan に展開された
      grade の finding は、この段の観点に当たるものだけを扱い、ほかは扱う段に任せる。前の段が直した版を読み、前の段の指摘を繰り返さない。

      同ガイドの「文章のチェック項目」（W1〜W10）と、その正本として挙げた規約を確かめ、文の直しの差分を sample に入れる。意味と判断に要る背景・例外・制約は変えない。指摘の根拠の列にはチェック項目の No か観点 ID
      を書く。報告は同ガイドの「人への報告の形」の指摘の表で result の実施内容に書き、迷った指摘に「要判断」の印を付ける。
  - local_id: opr-sample
    phase_suffix: "140"
    phase_set: kata-agent-review-pass
    phase_id: kata-review-r4
    name: R4 正しさ
    duration_days: 0.25
    depends_on:
      - T-KATA-REVIEW-CALIBRATION-opr-sample-130
    owner: OPS
    agent:
      executor: sol-executor
      reporter: sonnet-reporter
    description: >
      kata のレビューの段 R4（正しさ）を行う。段の内容・読む範囲・観点・報告の形は
      [[specdojo:kata-guide|実践の型活用ガイド]]（docs/ja/specdojo/guides/kata-guide.md）の「kata を agent でレビューする」に従う。plan に展開された
      grade の finding は、この段の観点に当たるものだけを扱い、ほかは扱う段に任せる。前の段が直した版を読み、前の段の指摘を繰り返さない。

      sample に書いてある事実（コマンド、オプション、キー、既定値、列挙値、パス、挙動）を、schema（docs/specdojo/schemas/v1/）、src/、コマンドリファレンス、必要なら --help
      や検証コマンドの実行と突き合わせる。主張ごとの確かめの表を result の実施内容に書き、誤りの直しの差分を sample
      に入れる。確かめられなかった主張も表に残す。駄菓子屋の業務の値のように正本のない仮定は、共通サンプル文脈と食い違わなければ確かめの対象にしない。
  - local_id: opr-sample
    phase_suffix: "150"
    phase_set: kata-agent-review-pass
    phase_id: kata-review-r5
    name: R5 整合
    duration_days: 0.25
    depends_on:
      - T-KATA-REVIEW-CALIBRATION-opr-sample-140
    owner: OPS
    agent:
      executor: sol-executor
      reporter: sonnet-reporter
    description: >
      kata のレビューの段 R5（整合）を行う。段の内容・読む範囲・観点・報告の形は
      [[specdojo:kata-guide|実践の型活用ガイド]]（docs/ja/specdojo/guides/kata-guide.md）の「kata を agent でレビューする」に従う。plan に展開された
      grade の finding は、この段の観点に当たるものだけを扱い、ほかは扱う段に任せる。前の段が直した版を読み、前の段の指摘を繰り返さない。

      同じ接頭辞の sample（index と個別）、wikilink と based_on の参照先、用語集（docs/ja/product/010-business-specs/060-glossary/）、Sample
      記述標準の共通サンプル文脈を読み、食い違いを確かめる。sample の側を直す差分を入れ、相手側を直すべき点は変更せずに直す案を result に書く。報告は同ガイドの「人への報告の形」の指摘の表で result
      の実施内容に書き、迷った指摘に「要判断」の印を付ける。
