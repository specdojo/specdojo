    phase_set: condense-pass
    phase_id: condense
    name: 冗長さの整理
    duration_days: 0.25
    depends_on:
      - T-KATA-WAVE-1-cxd-specdojo-070
      - G-KATA-WAVE-1-refine-pass
    owner: ARC
    description: |
      1 文書の冗長さを削る・まとめる・参照に置き換える。判断に要る背景・制約・例外・完了条件と意味を保ち、新しい内容を足さず、修正・保持した箇所と原因を result に記録する。
