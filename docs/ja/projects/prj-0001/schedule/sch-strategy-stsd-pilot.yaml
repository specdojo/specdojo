# yaml-language-server: $schema=../../../../specdojo/schemas/v1/sch-strategy.schema.yaml
# PJR-WSND: scope と intent を入力して schedule strategy generate で生成後、
# PJR-3APD の実施済み段を除外し、残りの段 9〜12 だけに調整した。
# scope は Timeline の data-model 全体へ広げず、試行対象の stsd 5 件に限定する。
# 主担当 BA は親 epic と段 2〜4・8 の個票を引き継ぐ（done_criteria.roles からは導出しない）。
kind: strategy
id: prj-0001:sch-strategy-stsd-pilot
type: project
status: draft
title: スケジュール戦略（stsd-pilot）
rulebook: specdojo:sch-rulebook
track: stsd-pilot
settings:
  # 後半の工程を計画するため、共通の古い開始日ではなく本個票の作業日を使う。
  start_date: "2026-11-05"
scope:
  catalogs:
    - id: prj-0001:dct-data-model-stsd
      path: /docs/ja/projects/prj-0001/010-deliverables-catalog/dct-data-model-stsd.yaml
      local_ids:
        - stsd-register-entry
        - stsd-task-execution
        - stsd-deliverable
        - stsd-routine-run
        - stsd-job-run
  include_kinds:
    - work
approach_rules:
  - local_ids:
      - stsd-register-entry
      - stsd-routine-run
      - stsd-deliverable
      - stsd-job-run
    intent: reflect-implementation
  - local_ids:
      - stsd-task-execution
    intent: confirm-deliverable
# 各 description に PJR-PT5N の確定内容と図の分割条件を補足し、後続 plan へ渡す。
phase_sets:
  refine-pass:
    - id: refine
      name: 磨き込み・整合性確認
      execution: agent
      mode: edit
      approach: fully-guided
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: normal
          - stage_role: reporter
            proficiency: normal
      task_suffix: "070"
      duration_days: 0.25
      description: |
        PJR-PT5N（[[prj-0001:pjr-pt5n-stsd-kata-confirm]]）で確定した stsd の Kata に従う。
        図は [[specdojo:stsd-mermaid-rulebook]] の閾値を超える場合だけ分け、小さな図は分けない。
        整備済みの実践の型と先行・隣接成果物を参照し、既存の草案を保守的に磨き込む。
        責務境界と `depends_on` に沿った情報の受け渡しを確認し、不足や不整合だけを最小限修正して
        `done_criteria` を満たす状態へ整える。
  condense-pass:
    - id: condense
      name: 冗長さの整理
      execution: agent
      mode: edit
      approach: condense
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: normal
          - stage_role: reporter
            proficiency: normal
      task_suffix: "080"
      duration_days: 0.25
      description: |
        PJR-PT5N（[[prj-0001:pjr-pt5n-stsd-kata-confirm]]）で確定した stsd の Kata に従う。
        図は [[specdojo:stsd-mermaid-rulebook]] の閾値を超える場合だけ分け、小さな図は分けない。
        1 文書の冗長さを削る・まとめる・参照に置き換える。判断に要る背景・制約・例外・完了条件と意味を保ち、新しい内容を足さず、修正・保持した箇所と原因を result に記録する。
  retrofit-review-pass:
    - id: review
      name: 完成版レビュー（実装照合）
      execution: agent
      mode: review
      approach: retrofit
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: normal
          - stage_role: reporter
            proficiency: normal
      task_suffix: "090"
      duration_days: 0.25
      description: |
        PJR-PT5N（[[prj-0001:pjr-pt5n-stsd-kata-confirm]]）で確定した stsd の Kata に従う。
        図は [[specdojo:stsd-mermaid-rulebook]] の閾値を超える場合だけ分け、小さな図は分けない。
        完成版を変更せず、`evidence_refs` が示す現在動作、意図された仕様、`done_criteria` を照合する。
        実装との一致・乖離・未確認範囲を判定し、根拠と修正対象候補を review result に記録する。
  finalize-pass:
    - id: finalize
      name: 完成版確定
      execution: human
      mode: edit
      approach: finalize
      task_suffix: "140"
      duration_days: 0.125
      description: |
        PJR-PT5N（[[prj-0001:pjr-pt5n-stsd-kata-confirm]]）で確定した stsd の Kata に従う。
        図は [[specdojo:stsd-mermaid-rulebook]] の閾値を超える場合だけ分け、小さな図は分けない。
        担当ロールがレビュー結果と `done_criteria` を最終確認し、成果物を完成版として確定する。
# 段 8 は PJR-41B4・PJR-YQF1・PJR-RAPC・PJR-PYCY で完了したため、
# 生成された retrofit-pass の定義と既定 sequence からその段を除いた。
default_phase_sets:
  - phase_set: refine-pass
  - phase_set: condense-pass
  - phase_set: retrofit-review-pass
  - phase_set: finalize-pass
owner_rules:
  # 代表の段 2〜4 は PJR-1799・PJR-Q9AW・PJR-MC63 で完了済み。
  # confirm-deliverable が生成する finalize だけの列に、段 11 の実装照合 review を追加する。
  - local_ids:
      - stsd-task-execution
    owner: BA
    phase_sets:
      - phase_set: retrofit-review-pass
      - phase_set: finalize-pass
  - local_ids:
      - stsd-deliverable
      - stsd-job-run
      - stsd-register-entry
      - stsd-routine-run
    owner: BA
# 生成された phase_gates と group_milestones は除外した。
# 各成果物の前段への依存で順序を保証し、全件の待ち合わせを増やさず、
# 既存 sch-milestones.yaml を変えずに対象の 18 タスクだけを追加する。
