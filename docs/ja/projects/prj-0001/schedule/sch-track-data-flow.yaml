# yaml-language-server: $schema=../../../../specdojo/schemas/v1/sch-track.schema.yaml
kind: track
id: prj-0001:sch-track-data-flow
type: project
status: ready
title: スケジュールトラック（data-flow）
rulebook: specdojo:sch-rulebook
version: 1
project_id: prj-0001
track: data-flow
settings:
  start_date: "2026-08-06"
tasks:
  - local_id: cdfd-overview
    phase_suffix: "005"
    phase_set: overview-bootstrap-pass
    phase_id: legacy-bootstrap
    name: 代表成果物・実践一式の初期整備
    duration_days: 0.5
    depends_on: []
    owner: BA
    description: |
      cdfd-overview と共通の rulebook / recipe / sample / template を同じタスクで初期整備し、
      構造・用語・粒度が互いに矛盾しない実践一式として揃える。成果物カタログの done_criteria と
      プロジェクト文脈を基準にし、実装エビデンスの詳細な反映は後続の retrofit-pass に委ねる。
  - local_id: cdfd-overview
    phase_suffix: "006"
    phase_set: overview-bootstrap-pass
    phase_id: overview-bootstrap
    name: cdfd-overview・overview Kataの初期整備
    duration_days: 0.5
    depends_on:
      - T-DATA-FLOW-cdfd-overview-005
    owner: BA
    description: |
      cdfd-overview と cdfd-overview-rulebook / recipe / sample / template を新設し、
      一ノードを一領域とする領域間フローと分割境界の再現可能な型を定義する。
      既存の cdfd-rulebook / recipe / sample / template はこのタスクで領域別専用へ変更しない。
      Mermaid の共通記法は cdfd-mermaid-rulebook を共有し、overview と領域別の粒度差を
      表現するために必要な共通規則だけを更新する。成果物カタログの done_criteria と
      プロジェクト文脈を基準にし、実装エビデンスの詳細な反映は後続の retrofit-pass に委ねる。
  - local_id: cdfd-overview
    phase_suffix: "010"
    phase_set: retrofit-pass
    phase_id: retrofit
    name: 実装調査・草案反映
    duration_days: 0.5
    depends_on:
      - T-DATA-FLOW-cdfd-overview-006
    owner: BA
    description: |
      DCT の evidence_refs から現在動作を調査し、既存成果物・決定記録・プロジェクト文脈が示す
      意図された仕様、および成果物カタログの done_criteria と照合する。一致する内容は成果物へ
      反映し、乖離は実装へ無条件に合わせず result に記録する。実装から確認できない業務判断や
      将来方針は推測せず、必要に応じて確認事項として残す。
      cdfd-overview はプロセス領域一覧と領域間フローで全体境界と詳細化先を示し、領域内の
      正常経路・例外経路を展開しない。領域別 cdfd-<area> は overview の境界を引き継ぎ、
      プロセス概要の表と業務フロー図で名称を揃え、起点イベント、担当、主要な入力・出力、
      データストア、正常経路と必要な例外経路を概念レベルで記述する。
  - local_id: cdfd-overview
    phase_suffix: "070"
    phase_set: refine-pass
    phase_id: refine
    name: 磨き込み・整合性確認
    duration_days: 0.25
    depends_on:
      - T-DATA-FLOW-cdfd-overview-010
      - G-DATA-FLOW-retrofit-pass
      - T-DATA-FLOW-data-flow-dedup-060
    owner: BA
    description: |
      成果物種別に対応する整備済み Kata と先行・隣接 CDFD を参照し、既存の草案を保守的に
      磨き込む。cdfd-overview は領域粒度と領域間の主要な受け渡しを維持し、領域別 CDFD は
      領域内プロセス粒度で表と図のプロセス名・イベント・入出力・データストアを一致させる。
      重複整理後の責務境界と depends_on に沿った情報の受け渡しを確認し、不足や不整合だけを
      最小限修正して、成果物カタログの done_criteria を満たす状態へ整える。
  - local_id: cdfd-overview
    phase_suffix: "075"
    phase_set: retrofit-pass-2
    phase_id: retrofit-2
    name: 実装調査・草案再作成（Kata反映）
    duration_days: 0.5
    depends_on:
      - T-DATA-FLOW-cdfd-overview-070
      - G-DATA-FLOW-refine-pass
    owner: BA
    description: |
      整備済みの cdfd-rulebook / recipe / sample / template（Kata）に基づき、成果物を
      再度 retrofit する。DCT の evidence_refs から現在動作を再調査し、既存成果物・
      決定記録・プロジェクト文脈が示す意図された仕様、および成果物カタログの
      done_criteria と、更新済み Kata の章構成・記述ガイドと照合する。1回目の
      retrofit-pass・refine-pass の結果を土台に、Kata の変更点（個別プロセス主要
      入出力の分離、必須・条件付きプロセスによる図分割など）を反映して成果物を
      作り直す。
  - local_id: cdfd-overview
    phase_suffix: "080"
    phase_set: refine-pass-2
    phase_id: refine-2
    name: 磨き込み・整合性確認（再実施）
    duration_days: 0.25
    depends_on:
      - T-DATA-FLOW-cdfd-overview-075
      - G-DATA-FLOW-retrofit-pass-2
    owner: BA
    description: |
      retrofit-pass-2 で再作成した草案を、整備済み Kata に沿って磨き込む。表と図の
      プロセス名・イベント・入出力・データストアを一致させ、責務境界と depends_on
      に沿った情報の受け渡しを確認し、不足や不整合だけを最小限修正して、成果物
      カタログの done_criteria を満たす状態へ整える。
  - local_id: cdfd-overview
    phase_suffix: "090"
    phase_set: review-pass
    phase_id: review
    name: 完成版レビュー
    duration_days: 0.25
    depends_on:
      - T-DATA-FLOW-cdfd-overview-080
      - G-DATA-FLOW-refine-pass-2
    owner: BA
    description: |
      完成版の CDFD を変更せず、DCT の evidence_refs が示す現在動作、既存成果物・決定記録・
      プロジェクト文脈が示す意図された仕様、および done_criteria を照合する。cdfd-overview は
      領域粒度、領域間フロー、領域別 CDFD への分割を確認し、領域別 cdfd-<area> はプロセス粒度、
      正常系・主要例外、担当と入出力の追跡性を確認する。実装との一致・乖離・未確認範囲を判定し、
      根拠と修正対象候補を review result に記録する。
  - local_id: cdfd-overview
    phase_suffix: "140"
    phase_set: finalize-pass
    phase_id: finalize
    name: 完成版確定
    duration_days: 0.125
    depends_on:
      - T-DATA-FLOW-cdfd-overview-090
      - G-DATA-FLOW-review-pass
    owner: BA
    description: |
      担当ロールがレビュー結果と done_criteria を最終確認し、成果物を完成版として確定する。
      bootstrap 対象の cdfd-overview と cdfd-init では bootstrap-finalize により、各タスクで
      整備した専用 rulebook / recipe / sample / template もあわせて確認し、確定対象を ready に更新する。
  - local_id: cdfd-init
    phase_suffix: "005"
    phase_set: area-bootstrap-pass
    phase_id: area-bootstrap
    name: cdfd-init・領域別CDFD Kataの初期整備
    duration_days: 0.5
    depends_on:
      - T-DATA-FLOW-cdfd-overview-010
    owner: BA
    description: |
      cdfd-init を代表成果物として、既存の cdfd-rulebook / recipe / sample / template を
      領域別 CDFD 専用へ再構成する。cdfd-area-* という別 ID は作らず、
      一ノードを一プロセスとする領域内フロー、主要例外、領域外への委譲を定義する。
      overview 専用の cdfd-overview-rulebook / recipe / sample / template はこのタスクで変更せず、
      Mermaid の共通記法は cdfd-mermaid-rulebook を参照する。成果物カタログの done_criteria と
      cdfd-overview が定義した領域境界を基準にし、実装エビデンスの詳細な反映は後続の
      retrofit-pass に委ねる。
