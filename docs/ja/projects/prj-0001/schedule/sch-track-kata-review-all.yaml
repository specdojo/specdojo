# yaml-language-server: $schema=../../../../specdojo/schemas/v1/sch-track.schema.yaml
kind: track
id: prj-0001:sch-track-kata-review-all
type: project
status: draft
title: スケジュールトラック（kata-review-all）
rulebook: specdojo:sch-rulebook
version: 1
project_id: prj-0001
track: kata-review-all
settings: {}
tasks:
  - local_id: tsp-index-sample
    phase_suffix: "110"
    phase_set: kata-agent-review-pass
    phase_id: kata-review-r1
    name: R1 目的の過不足
    duration_days: 0.25
    depends_on: []
    owner: QE
    agent:
      executor: sol-executor
      reporter: sonnet-reporter
    description: >
      kata のレビューの段 R1（目的の過不足）を行う。段の内容・読む範囲・観点・報告の形は
      [[specdojo:kata-guide|実践の型活用ガイド]]（docs/ja/specdojo/guides/kata-guide.md）の「kata を agent でレビューする」に従う。plan に展開された
      grade の finding は、この段の観点に当たるものだけを扱い、ほかは扱う段に任せる。この段は sample を厚くする段ではなく、R1 の確かめに当たる箇所だけを直す。

      対象の sample が、種別の責務（Sample 記述標準）と rulebook の目的に対し、要る内容を欠いていないか、要らない内容を含んでいないかを確かめ、足す・削る差分を sample に入れる。rulebook など
      sample 以外は変更せず、直す案を result に書く。報告は同ガイドの「人への報告の形」に従い、executor は報告の handoff に指摘を 1 件ずつ 1
      項目（No・段・箇所・指摘・直した案・根拠・印）で書き、表の文字列にまとめない。reporter は handoff の指摘を result の実施内容に Markdown の表として 1
      回だけ書き、申し送りには表を重ねない。迷った指摘に「要判断」の印を付ける。
  - local_id: tsp-index-sample
    phase_suffix: "120"
    phase_set: kata-agent-review-pass
    phase_id: kata-review-r2
    name: R2 構成
    duration_days: 0.25
    depends_on:
      - T-KATA-REVIEW-ALL-tsp-index-sample-110
    owner: QE
    agent:
      executor: sol-executor
      reporter: sonnet-reporter
    description: >
      kata のレビューの段 R2（構成）を行う。段の内容・読む範囲・観点・報告の形は
      [[specdojo:kata-guide|実践の型活用ガイド]]（docs/ja/specdojo/guides/kata-guide.md）の「kata を agent でレビューする」に従う。plan に展開された
      grade の finding は、この段の観点に当たるものだけを扱い、ほかは扱う段に任せる。R1 が直した版を読み、R1 の指摘を繰り返さない。

      章の順・粒度・表と本文の配置が rulebook の本文構成と template に沿い、前提から結論の順に読めるかを確かめ、章の移動・分割・統合の差分を sample に入れる。rulebook など sample
      以外は変更せず、直す案を result に書く。報告は同ガイドの「人への報告の形」に従い、executor は報告の handoff に指摘を 1 件ずつ 1
      項目（No・段・箇所・指摘・直した案・根拠・印）で書き、表の文字列にまとめない。reporter は handoff の指摘を result の実施内容に Markdown の表として 1
      回だけ書き、申し送りには表を重ねない。迷った指摘に「要判断」の印を付ける。
  - local_id: tsp-index-sample
    phase_suffix: "130"
    phase_set: kata-agent-review-pass
    phase_id: kata-review-r3
    name: R3 読みやすさ
    duration_days: 0.25
    depends_on:
      - T-KATA-REVIEW-ALL-tsp-index-sample-120
    owner: QE
    agent:
      executor: sol-executor
      reporter: sonnet-reporter
    description: >
      kata のレビューの段 R3（読みやすさ）を行う。段の内容・読む範囲・観点・報告の形は
      [[specdojo:kata-guide|実践の型活用ガイド]]（docs/ja/specdojo/guides/kata-guide.md）の「kata を agent でレビューする」に従う。plan に展開された
      grade の finding は、この段の観点に当たるものだけを扱い、ほかは扱う段に任せる。前の段が直した版を読み、前の段の指摘を繰り返さない。

      同ガイドの「文章のチェック項目」（W1〜W10）と、その正本として挙げた規約を確かめ、文の直しの差分を sample に入れる。意味と判断に要る背景・例外・制約は変えない。指摘の根拠の列にはチェック項目の No か観点 ID
      を書く。報告は同ガイドの「人への報告の形」に従い、executor は報告の handoff に指摘を 1 件ずつ 1 項目（No・段・箇所・指摘・直した案・根拠・印）で書き、表の文字列にまとめない。reporter は
      handoff の指摘を result の実施内容に Markdown の表として 1 回だけ書き、申し送りには表を重ねない。迷った指摘に「要判断」の印を付ける。
