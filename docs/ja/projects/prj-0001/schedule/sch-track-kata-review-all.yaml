    phase_suffix: "140"
    phase_set: kata-agent-review-pass
    phase_id: kata-review-r4
    name: R4 正しさ
    duration_days: 0.25
    depends_on:
      - T-KATA-REVIEW-ALL-tsp-index-sample-130
    owner: QE
    agent:
      executor: sol-executor
      reporter: sonnet-reporter
    description: >
      kata のレビューの段 R4（正しさ）を行う。段の内容・読む範囲・観点・報告の形は
      [[specdojo:kata-guide|実践の型活用ガイド]]（docs/ja/specdojo/guides/kata-guide.md）の「kata を agent でレビューする」に従う。plan に展開された
      grade の finding は、この段の観点に当たるものだけを扱い、ほかは扱う段に任せる。前の段が直した版を読み、前の段の指摘を繰り返さない。

      sample に書いてある事実（コマンド、オプション、キー、既定値、列挙値、パス、挙動）を、schema（docs/specdojo/schemas/v1/）、src/、コマンドリファレンス、必要なら --help
      や検証コマンドの実行と突き合わせる。主張ごとの確かめの表を result の実施内容に書き、誤りの直しの差分を sample に入れる。確かめられなかった主張も表に残す。指摘は同ガイドの「人への報告の形」に従い、executor
      は報告の handoff に 1 件ずつ 1 項目で書き、reporter は result の実施内容に Markdown の表として 1
      回だけ書く（申し送りに表を重ねない）。駄菓子屋の業務の値のように正本のない仮定は、共通サンプル文脈と食い違わなければ確かめの対象にしない。
