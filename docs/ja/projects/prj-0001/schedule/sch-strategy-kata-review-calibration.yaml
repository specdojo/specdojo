# yaml-language-server: $schema=../../../../specdojo/schemas/v1/sch-strategy.schema.yaml
kind: strategy
id: prj-0001:sch-strategy-kata-review-calibration
type: project
status: draft
title: スケジュール戦略（kata の agent のレビューの段の目合わせ）
rulebook: specdojo:sch-rulebook
track: kata-review-calibration
# PJR-TQZA の案 A を PJR-F4TG で組んだもの。kata の agent のレビューを R1 目的の過不足・R2 構成・R3 読みやすさ・
# R4 正しさ・R5 整合の 5 段とし、段の内容・チェック項目・観点の組・報告の形は kata-guide の
# 「kata を agent でレビューする」を正本にする。目合わせの型は prj-overview・opr・stsd の sample
# （利用者の決定、2026-11-24）。3 つとも claude（opus・sonnet）が書いたため、段は codex の sol に任せる。
# 各段は sample だけを直し、段ごとの commit を人が採るか戻すかを決める差分にする。rulebook など相手側の直しは
# 案として result に書く。人の確定と、利用者のレビューとの比べは track に入れず、PJR-F4TG の個票で行う。
scope:
  catalogs:
    - id: prj-0001:dct-kata
      path: /docs/ja/projects/prj-0001/010-deliverables-catalog/dct-kata.yaml
      local_ids:
        - prj-overview-sample
        - opr-sample
        - stsd-sample
  include_kinds:
    - work
approach_rules:
  - local_ids:
      - prj-overview-sample
      - opr-sample
      - stsd-sample
    intent: improve-kata
    kata_target: rulebook
phase_sets:
  kata-agent-review-pass:
    - id: kata-review-r1
      name: R1 目的の過不足
      execution: agent
      mode: edit
      approach: sample-maintenance
      agent:
        executor: sol-executor
        reporter: sonnet-reporter
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: expert
          - stage_role: reporter
            proficiency: normal
      task_suffix: "110"
      duration_days: 0.25
      description:
        "kata のレビューの段 R1（目的の過不足）を行う。段の内容・読む範囲・観点・報告の形は [[specdojo:kata-guide|実践の型活用ガイド]]（docs/ja/specdojo/guides/kata-guide.md）の「kata を agent でレビューする」に従う。plan に展開された grade の finding は、この段の観点に当たるものだけを扱い、ほかは扱う段に任せる。この段は sample を厚くする段ではなく、R1 の確かめに当たる箇所だけを直す。

        対象の sample が、種別の責務（Sample 記述標準）と rulebook の目的に対し、要る内容を欠いていないか、要らない内容を含んでいないかを確かめ、足す・削る差分を sample に入れる。rulebook など sample 以外は変更せず、直す案を result に書く。報告は同ガイドの「人への報告の形」の指摘の表で result の実施内容に書き、迷った指摘に「要判断」の印を付ける。

        "
    - id: kata-review-r2
      name: R2 構成
      execution: agent
      mode: edit
      approach: sample-maintenance
      agent:
        executor: sol-executor
        reporter: sonnet-reporter
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: expert
          - stage_role: reporter
            proficiency: normal
      task_suffix: "120"
      duration_days: 0.25
      description:
        "kata のレビューの段 R2（構成）を行う。段の内容・読む範囲・観点・報告の形は [[specdojo:kata-guide|実践の型活用ガイド]]（docs/ja/specdojo/guides/kata-guide.md）の「kata を agent でレビューする」に従う。plan に展開された grade の finding は、この段の観点に当たるものだけを扱い、ほかは扱う段に任せる。R1 が直した版を読み、R1 の指摘を繰り返さない。

        章の順・粒度・表と本文の配置が rulebook の本文構成と template に沿い、前提から結論の順に読めるかを確かめ、章の移動・分割・統合の差分を sample に入れる。rulebook など sample 以外は変更せず、直す案を result に書く。報告は同ガイドの「人への報告の形」の指摘の表で result の実施内容に書き、迷った指摘に「要判断」の印を付ける。

        "
    - id: kata-review-r3
      name: R3 読みやすさ
      execution: agent
      mode: edit
      approach: sample-maintenance
      agent:
        executor: sol-executor
        reporter: sonnet-reporter
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: expert
          - stage_role: reporter
            proficiency: normal
      task_suffix: "130"
      duration_days: 0.25
      description:
        "kata のレビューの段 R3（読みやすさ）を行う。段の内容・読む範囲・観点・報告の形は [[specdojo:kata-guide|実践の型活用ガイド]]（docs/ja/specdojo/guides/kata-guide.md）の「kata を agent でレビューする」に従う。plan に展開された grade の finding は、この段の観点に当たるものだけを扱い、ほかは扱う段に任せる。前の段が直した版を読み、前の段の指摘を繰り返さない。

        同ガイドの「文章のチェック項目」（W1〜W10）と、その正本として挙げた規約を確かめ、文の直しの差分を sample に入れる。意味と判断に要る背景・例外・制約は変えない。指摘の根拠の列にはチェック項目の No か観点 ID を書く。報告は同ガイドの「人への報告の形」の指摘の表で result の実施内容に書き、迷った指摘に「要判断」の印を付ける。

        "
    - id: kata-review-r4
      name: R4 正しさ
      execution: agent
      mode: edit
      approach: sample-maintenance
      agent:
        executor: sol-executor
        reporter: sonnet-reporter
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: expert
          - stage_role: reporter
            proficiency: normal
      task_suffix: "140"
      duration_days: 0.25
      description:
        "kata のレビューの段 R4（正しさ）を行う。段の内容・読む範囲・観点・報告の形は [[specdojo:kata-guide|実践の型活用ガイド]]（docs/ja/specdojo/guides/kata-guide.md）の「kata を agent でレビューする」に従う。plan に展開された grade の finding は、この段の観点に当たるものだけを扱い、ほかは扱う段に任せる。前の段が直した版を読み、前の段の指摘を繰り返さない。

        sample に書いてある事実（コマンド、オプション、キー、既定値、列挙値、パス、挙動）を、schema（docs/specdojo/schemas/v1/）、src/、コマンドリファレンス、必要なら --help や検証コマンドの実行と突き合わせる。主張ごとの確かめの表を result の実施内容に書き、誤りの直しの差分を sample に入れる。確かめられなかった主張も表に残す。駄菓子屋の業務の値のように正本のない仮定は、共通サンプル文脈と食い違わなければ確かめの対象にしない。

        "
    - id: kata-review-r5
      name: R5 整合
      execution: agent
      mode: edit
      approach: sample-maintenance
      agent:
        executor: sol-executor
        reporter: sonnet-reporter
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: expert
          - stage_role: reporter
            proficiency: normal
      task_suffix: "150"
      duration_days: 0.25
      description:
        "kata のレビューの段 R5（整合）を行う。段の内容・読む範囲・観点・報告の形は [[specdojo:kata-guide|実践の型活用ガイド]]（docs/ja/specdojo/guides/kata-guide.md）の「kata を agent でレビューする」に従う。plan に展開された grade の finding は、この段の観点に当たるものだけを扱い、ほかは扱う段に任せる。前の段が直した版を読み、前の段の指摘を繰り返さない。

        同じ接頭辞の sample（index と個別）、wikilink と based_on の参照先、用語集（docs/ja/product/010-business-specs/060-glossary/）、Sample 記述標準の共通サンプル文脈を読み、食い違いを確かめる。sample の側を直す差分を入れ、相手側を直すべき点は変更せずに直す案を result に書く。報告は同ガイドの「人への報告の形」の指摘の表で result の実施内容に書き、迷った指摘に「要判断」の印を付ける。

        "
default_phase_sets:
  - phase_set: kata-agent-review-pass
owner_rules:
  - local_ids:
      - prj-overview-sample
    owner: PO
  - local_ids:
      - opr-sample
    owner: OPS
  - local_ids:
      - stsd-sample
    owner: ARC
