      - rulebook-maintenance-pass
      - recipe-maintenance-pass
      - sample-maintenance-pass
      - template-maintenance-pass
    owner: PM
    scope:
      catalogs:
        - prj-0001:dct-data-model-bdd
        - prj-0001:dct-data-model-ccd
        - prj-0001:dct-data-model-cdt
        - prj-0001:dct-business-model-bes
        - prj-0001:dct-business-model-br
        - prj-0001:dct-system-functions
        - prj-0001:dct-external-interface-specs
  - id: G-BUSINESS-SPECS-KATA-refine-pass
    name: 磨き込み完了
    after_phase_sets:
      - refine-pass
    owner: PM
    scope:
      catalogs:
        - prj-0001:dct-data-model-bdd
        - prj-0001:dct-data-model-ccd
        - prj-0001:dct-data-model-cdt
        - prj-0001:dct-business-model-bes
        - prj-0001:dct-business-model-br
        - prj-0001:dct-system-functions
        - prj-0001:dct-external-interface-specs
  - id: G-BUSINESS-SPECS-KATA-review-pass
    name: レビュー完了
    after_phase_sets:
      - review-pass
    owner: PM
    scope:
      catalogs:
        - prj-0001:dct-data-model-bdd
        - prj-0001:dct-data-model-ccd
        - prj-0001:dct-data-model-cdt
        - prj-0001:dct-business-model-bes
        - prj-0001:dct-business-model-br
        - prj-0001:dct-system-functions
        - prj-0001:dct-external-interface-specs
