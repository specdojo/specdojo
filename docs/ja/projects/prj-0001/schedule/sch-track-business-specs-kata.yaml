track: business-specs-kata
settings: {}
tasks:
  - local_id: bdd-register-entry
    phase_suffix: "040"
    phase_set: rulebook-maintenance-pass
    phase_id: rulebook-maintenance
    name: rulebook の見直し
    duration_days: 0.5
    depends_on: []
    owner: ARC
    agent:
      executor: sol-executor
    description: >
      代表成果物の実績から sf-rulebook・cdt-rulebook・ccd-mermaid-rulebook・bdd-rulebook・ifx-cmd-rulebook のうち対応する rulebook
      を手入れする。成果物本体は変更しない。sample の完成例は後続の sample-maintenance で整備する。ifx-cmd の recipe・template は後続の専用段で同期する。他の系統で新たに必要と判断した
      recipe・template は対応結果に次の作業案を残す。

      [[specdojo:rulebook-authoring-standard|Rulebook
      記述標準]]（docs/ja/specdojo/standards/rulebook-authoring-standard.md）の章立てに合わせ、rulebook にサンプルの章を置かず完成例を sample
      に外出しする。Markdown の ##〜#### の見出しに階層ごとの連番を付ける。記述ガイドには章ごとの判断の基準と良い例・悪い例を書く。sample は
      [[specdojo:clis-sample|CLI仕様の完成例]]（docs/ja/specdojo/samples/clis-sample.md）程度の厚さの完成例にする（YAML の sample
      は対象形式に合わせて内容を充実させる）。recipe と template の要否を決め、rulebook frontmatter に対応する ID または not-needed を宣言し、判断理由を result
      に残す。実装・schema・リファレンスと同じことを書かない方針（PJR-2GD6）を保ち、値・構文・構造の詳細は正本を参照する。
  - local_id: bdd-register-entry
    phase_suffix: "050"
    phase_set: sample-maintenance-pass
    phase_id: sample-maintenance
    name: sample の見直し
    duration_days: 0.5
    depends_on:
      - T-BUSINESS-SPECS-KATA-bdd-register-entry-040
    owner: ARC
    agent:
      executor: sol-executor
    description: >
      改訂した rulebook（ifx-cmd では recipe も）に沿い、対応する sf-sample・cdt-sample・ccd-sample・bdd-sample・ifx-cmd-sample
      を完成例として手入れする。代表成果物から判断に要る場面・例外を拾い、例を単純に複写しない。成果物本体は変更しない。

