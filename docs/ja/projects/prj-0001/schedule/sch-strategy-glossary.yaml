# yaml-language-server: $schema=../../../../specdojo/schemas/v1/sch-strategy.schema.yaml
kind: strategy
id: prj-0001:sch-strategy-glossary
type: project
status: draft
title: スケジュール戦略（glossary）
rulebook: specdojo:sch-rulebook
track: glossary
scope:
  catalogs:
    - id: prj-0001:dct-glossary
      path: /docs/ja/projects/prj-0001/010-deliverables-catalog/dct-glossary.yaml
  include_kinds:
    - work
approach_rules:
  - local_ids:
      - gl-common
    intent: reflect-implementation
phase_sets:
  retrofit-pass:
    - id: retrofit
      name: 実装調査・草案反映
      execution: agent
      mode: edit
      approach: retrofit
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: expert
          - stage_role: reporter
            proficiency: normal
      task_suffix: "010"
      duration_days: 0.5
      description: >
        成果物カタログの evidence_refs から現在動作を調査し、既存成果物・決定記録・プロジェクト文脈が示す意図された仕様、および done_criteria
        と照合する。一致する内容は成果物へ反映し、乖離は実装へ無条件に合わせず result に記録する。
  refine-pass:
    - id: refine
      name: 磨き込み・整合性確認
      execution: agent
      mode: edit
      approach: fully-guided
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: normal
          - stage_role: reporter
            proficiency: normal
      task_suffix: "070"
      duration_days: 0.25
      description: >
        整備済みの実践の型と先行・隣接成果物を参照し、既存の草案を保守的に磨き込む。責務境界と depends_on に沿った情報の受け渡しを確認し、不足や不整合だけを最小限修正して done_criteria
        を満たす状態へ整える。
  condense-pass:
    - id: condense
      name: 冗長さの整理
      execution: agent
      mode: edit
      approach: condense
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: normal
          - stage_role: reporter
            proficiency: normal
      task_suffix: "080"
      duration_days: 0.25
      description: |
        1 文書の冗長さを削る・まとめる・参照に置き換える。判断に要る背景・制約・例外・完了条件と意味を保ち、新しい内容を足さず、修正・保持した箇所と原因を result に記録する。
  retrofit-review-pass:
    - id: review
      name: 完成版レビュー（実装照合）
      execution: agent
      mode: review
      approach: retrofit
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: normal
          - stage_role: reporter
            proficiency: normal
      task_suffix: "090"
      duration_days: 0.25
      description: |
        完成版を変更せず、evidence_refs が示す現在動作、意図された仕様、done_criteria を照合する。実装との一致・乖離・未確認範囲を判定し、根拠と修正対象候補を review result に記録する。
  finalize-pass:
    - id: finalize
      name: 完成版確定
      execution: human
      mode: edit
      approach: finalize
      task_suffix: "140"
      duration_days: 0.125
      description: >
        担当ロールがレビュー結果と done_criteria を最終確認し、成果物を完成版として確定する。bootstrap 対象では、同じタスクで整備した rulebook / recipe / sample /
        template もあわせて確認する。
default_phase_sets:
  - phase_set: retrofit-pass
  - phase_set: refine-pass
  - phase_set: condense-pass
  - phase_set: retrofit-review-pass
  - phase_set: finalize-pass
owner_rules:
  - local_ids:
      - gl-common
    owner: BA
group_milestones:
  - catalog_id: prj-0001:dct-glossary
    milestone:
      id: M-GLOSSARY-glossary
      name: ドメイン完了
      artifact_name: 用語集
      owner: PO
