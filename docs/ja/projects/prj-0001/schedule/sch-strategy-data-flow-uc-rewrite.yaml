# yaml-language-server: $schema=../../../../specdojo/schemas/v1/sch-strategy.schema.yaml
kind: strategy
id: prj-0001:sch-strategy-data-flow-uc-rewrite
type: project
status: draft
title: スケジュール戦略（data-flow-uc-rewrite）
rulebook: specdojo:sch-rulebook
track: data-flow-uc-rewrite

# sch-track-data-flow-uc-rewrite.yaml を生成するための戦略定義。
# 系統別の詳細 3 文書（cdfd-uc-register・cdfd-uc-schedule・cdfd-uc-routine）を、PJR-PRYZ で直した
# ユースケース別 CDFD の Kata に合わせて書き直す。3 文書は互いに依存せず、並べて進める。
# dct-data-flow.yaml のうち 3 件を local_ids で scope にする。
# owner はロールのみを持ち、実際の実行者は pm-members.yaml と実行要件から解決する。

settings:
  start_date: "2026-11-03"

scope:
  catalogs:
    - id: prj-0001:dct-data-flow
      path: /docs/ja/projects/prj-0001/010-deliverables-catalog/dct-data-flow.yaml
      local_ids:
        - cdfd-uc-register
        - cdfd-uc-schedule
        - cdfd-uc-routine
  include_kinds:
    - work

approach_rules:
  - local_ids:
      - cdfd-uc-register
      - cdfd-uc-schedule
      - cdfd-uc-routine
    intent: author-deliverable

phase_sets:
  uc-rewrite-pass:
    - id: rewrite
      name: 系統別の詳細 CDFD の書き直し
      execution: agent
      mode: edit
      approach: fully-guided
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: expert
          - stage_role: reporter
            proficiency: normal
      task_suffix: "010"
      duration_days: 0.5
      description: |
        PJR-PRYZ で直した Kata（cdfd-uc-rulebook / recipe / sample / template と cdfd-d2-rulebook）に
        従って、対象の系統別の詳細 CDFD を書き直す。既存の草案の業務の中身（プロセス領域、データストア、
        受け渡す情報）は、cdfd-overview と矛盾しない限り生かす。次の方針を守る。

        - 目的は、その系統が何のためにあるかを 1〜2 文で書き、承認者や読み手の役割（BA・QE など）を書かない。
        - 「引き渡し」と「例外時の戻り先」の章は設けない。渡す情報は図の線のラベルで表し、引き渡し条件の
          イベント（H-xx）を図に置かない。戻りの流れが業務として大事な場合だけ、Kata に従い
          「例外時の戻り」の図を足してよい。
        - 図に Orchestrator（P-14）を置かない。調整は cdfd-overview の「Orchestrator による PDCA の調整」の図に任せる。
        - イベントは 1 つのノードに 1 つの出来事とし、短い文にする。起点イベントの文言は cdfd-overview の
          「プロセス領域」の表と同じにする。
        - プロセス領域の区分・名称・領域 ID は cdfd-overview の 7 区分と同じにし、表の列は Kata に従う。
        - based_on は cdfd-overview などの有効な文書とし、status が deprecated の文書（cdfd-plan・cdfd-do・
          cdfd-check・cdfd-action・cdfd-orchestrator・cdfd-onboarding・cdfd-uc-deliverable）を based_on と
          本文で参照しない。supersedes はそのまま残してよい。
        - 図は D2 の direction: down とし、配色と凡例は cdfd-overview の凡例を参照して再掲しない。
          図の題は業務の言葉で付け、説明は図から読み取れることを 1 文で書く。本文は表を中心に端的に書く。
        - status は draft のまま変えない。対象以外の CDFD の文書と Kata は変えない。

  uc-refine-pass:
    - id: refine
      name: 系統別の詳細 CDFD の磨き込み
      execution: agent
      mode: edit
      approach: fully-guided
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: expert
          - stage_role: reporter
            proficiency: normal
      task_suffix: "020"
      duration_days: 0.5
      description: |
        PJR-87KE で足した Kata（cdfd-uc-rulebook / recipe / sample / template）の決まりに従って、
        1 回目の書き直し（uc-rewrite-pass）の結果を磨き込む。業務の中身は cdfd-overview と矛盾しない限り
        変えない。次の方針を守る。

        - 複数の系統が共通して通るプロセス領域（このプロダクトでは実行サイクル P-07・P-08・P-11）の内部は
          描き直さない。実行サイクルは 1 つのノードとして置き、受け渡しの線（実行要求と結果など）だけを描く。
        - 例外時の戻りは省略しない。1 つの図の線が多い場合は、Kata の目安に従って戻り先や段ごとに図を分ける。
        - 例外時の戻りの図に限らず、すべての図の受け渡しの線を数え、Kata の分割の目安（1 つの図の線が 15 本を超える、
          または 1 つのノードに線が 10 本以上集まる）を超える図は、業務の段や独立した流れごとに分ける。
          ラベルが重なって読めない図も、配置を直すか分ける。
        - ノードのラベルの絵文字は、cdfd-overview の凡例に合わせて、3 文書でそろえる。
        - 目的は、register 系の書き方（何を正本に残し、何を通して、何ができるようになるか）にそろえる。
          schedule 系の目的は次の文とする。「管理する成果物とその完了条件をカタログとスケジュールに定め、
          計画に沿ったタスクの実行から評価、完了記録までを進捗と対応付けることで、成果物の作成を計画どおりに
          進め、遅れや抜けを早く見つけられるようにする。」
          routine 系の目的は次の文とする。「定期的に確認・実行する事項を定期実行と Job の定義に残し、
          サイクルが来るたびに同じ手順で実行して結果を記録することで、特定の人の記憶や手作業に頼らずに
          反復作業を続け、前回の結果を次の判断に生かせるようにする。」
          register 系の目的は変えない。
        - 図ごとに、線とデータストアの数、画像の大きさを result に記録する。
        - status は draft のまま変えない。対象以外の CDFD の文書と Kata は変えない。

owner_rules:
  - local_ids:
      - cdfd-uc-register
      - cdfd-uc-schedule
      - cdfd-uc-routine
    owner: BA
    phase_sets:
      - phase_set: uc-rewrite-pass
      - phase_set: uc-refine-pass

phase_gates:
  - id: G-DATA-FLOW-UC-REWRITE-pass
    name: data-flow-uc-rewrite pass 完了
    artifact_name: データフロー（系統別の詳細）
    after_phase_sets: [uc-rewrite-pass, uc-refine-pass]
    owner: PM
    scope:
      catalogs:
        - prj-0001:dct-data-flow

group_milestones:
  - catalog_id: prj-0001:dct-data-flow
    milestone:
      id: M-DATA-FLOW-UC-REWRITE-data-flow
      name: 系統別の詳細 CDFD の書き直し完了
      artifact_name: データフロー（系統別の詳細）
      owner: PM
