# yaml-language-server: $schema=../../../../specdojo/schemas/v1/sch-strategy.schema.yaml
kind: strategy
id: prj-0001:sch-strategy-kata-wave-3
type: project
status: draft
title: スケジュール戦略（型の整備 第 3 波：試験の型）
rulebook: specdojo:sch-rulebook
track: kata-wave-3
# 成果物は kata ドメインの sample そのもの（PJR-6998）。sample を厚くする段は sample-maintenance
# とし、手本を rulebook、対象を sample にする（fully-guided だと対象の sample が手本を兼ねる）。
# 対象の 13 種類には recipe・template が無く、template は PJR-WYTX で扱うため、どちらの段も置かない。
scope:
  catalogs:
    - id: prj-0001:dct-kata
      path: /docs/ja/projects/prj-0001/010-deliverables-catalog/dct-kata.yaml
      local_ids:
        - tsp-index-sample
        - utc-index-sample
        - utc-sample
        - itc-index-sample
        - itc-sample
        - stc-index-sample
        - stc-sample
        - etc-index-sample
        - etc-sample
        - atc-index-sample
        - atc-sample
        - trc-requirements-to-tests-sample
        - imp-test-sample
  include_kinds:
    - work
approach_rules:
  - local_ids:
      - tsp-index-sample
      - utc-index-sample
      - utc-sample
      - itc-index-sample
      - itc-sample
      - stc-index-sample
      - stc-sample
      - etc-index-sample
      - etc-sample
      - atc-index-sample
      - atc-sample
      - trc-requirements-to-tests-sample
      - imp-test-sample
    intent: improve-kata
    kata_target: rulebook
phase_sets:
  rulebook-maintenance-pass:
    - id: rulebook-maintenance
      name: rulebook を簡潔にする
      execution: agent
      mode: edit
      approach: rulebook-maintenance
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: expert
          - stage_role: reporter
            proficiency: normal
      task_suffix: "040"
      duration_days: 0.5
      description:
        "対象の sample が従う rulebook を、grade のし直しの指摘（run id regrade-kata-2026-11-21）と成果物の done_criteria に沿って簡潔に整える。rulebook に完成例の章を置かず、完成例は sample に任せる。見出しは H4 までにする。sample はこの段で変更せず、後続の sample-maintenance で厚くする。recipe・template は作らず、frontmatter の宣言も変えない（template は PJR-WYTX で扱う）。

        [[specdojo:rulebook-authoring-standard|Rulebook 記述標準]]（docs/ja/specdojo/standards/rulebook-authoring-standard.md）の章立てに合わせ、記述ガイドには章ごとの判断の基準と良い例・悪い例を書く。実装・schema・リファレンスと同じことを書かない方針（PJR-2GD6）を保ち、値・構文・構造の詳細は正本を参照する。

        PJR-76N9 の決まりに従い、rulebook の「誰がどの利用場面で何を判断するか」は「どの利用場面で何を判断するための文書か」に直し、成果物の本文に文書の役割の割り当て（作る・確かめる・承認する役割）と承認の範囲・留保・差し戻しの進み具合を求めない。承認と留保は登録簿の個票で追う。RACI・体制など、文書の中身として役割を扱う型は対象外とする。

        "
  sample-maintenance-pass:
    - id: sample-maintenance
      name: sample を厚くする
      execution: agent
      mode: edit
      approach: sample-maintenance
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: expert
          - stage_role: reporter
            proficiency: normal
      task_suffix: "050"
      duration_days: 0.5
      description:
        "直した rulebook に沿い、sample を共通サンプル文脈（駄菓子屋のプロジェクト）の完成例として厚くする。この sample が成果物そのものなので、成果物の done_criteria と sample の grade の指摘をこの段で満たす。何を書くかの説明ではなく、値で埋めた成果物の実例にする。rulebook はこの段で変更せず、合わせて直すべき点は変更案として result に書く。

        sample は [[specdojo:clis-sample|CLI仕様の完成例]]（docs/ja/specdojo/samples/clis-sample.md）程度の厚さにし、[[specdojo:sample-authoring-standard|Sample 記述標準]]（docs/ja/specdojo/standards/sample-authoring-standard.md）に従う。

        PJR-76N9 の決まりに従い、sample の本文に文書の役割の割り当て（作る・確かめる・承認する役割）と承認の範囲・留保・差し戻しの進み具合を書かない。grade の指摘や done_criteria がそれを求めても足さず、合わせて直すべき点として result に書く。RACI・体制など、文書の中身として役割を扱う型は対象外とする。

        "
  condense-pass:
    - id: condense
      name: 冗長さの整理
      execution: agent
      mode: edit
      approach: condense
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: normal
          - stage_role: reporter
            proficiency: normal
      task_suffix: "080"
      duration_days: 0.25
      description:
        "1 文書の冗長さを削る・まとめる・参照に置き換える。判断に要る背景・制約・例外・完了条件と意味を保ち、新しい内容を足さず、修正・保持した箇所と原因を result に記録する。

        "
  review-pass:
    - id: review
      name: 完成版レビュー
      execution: agent
      mode: review
      approach: fully-guided
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: normal
          - stage_role: reporter
            proficiency: normal
      task_suffix: "090"
      duration_days: 0.25
      description:
        "対応する rulebook と sample を読み、章構成・判断基準・例の充実度・相互整合をレビューする。sample の done_criteria だけで完了としない。成果物・型は変更せず、指摘と根拠を review result に残す。

        "
  finalize-pass:
    - id: finalize
      name: 完成版確定
      execution: human
      mode: edit
      approach: finalize
      task_suffix: "140"
      duration_days: 0.125
      description:
        "利用者がレビュー結果と done_criteria を最終確認し、sample を完成版として確定する。同じ track で直した rulebook もあわせて確認する。

        "
default_phase_sets:
  - phase_set: rulebook-maintenance-pass
  - phase_set: sample-maintenance-pass
  - phase_set: condense-pass
  - phase_set: review-pass
  - phase_set: finalize-pass
owner_rules:
  - local_ids:
      - tsp-index-sample
      - utc-index-sample
      - utc-sample
      - itc-index-sample
      - itc-sample
      - stc-index-sample
      - stc-sample
      - etc-index-sample
      - etc-sample
      - atc-index-sample
      - atc-sample
      - trc-requirements-to-tests-sample
      - imp-test-sample
    owner: QE
    phase_overrides:
      - phase: rulebook-maintenance
        agent:
          executor: opus-executor
          reporter: gemma26-reporter
      - phase: sample-maintenance
        agent:
          executor: opus-executor
          reporter: gemma26-reporter
      - phase: condense
        agent:
          executor: opus-executor
          reporter: gemma26-reporter
      - phase: review
        agent:
          executor: opus-review-executor
          reporter: gemma26-reporter
phase_gates:
  - id: G-KATA-WAVE-3-first-pass
    name: 初回パス完了
    after_phase_sets:
      - rulebook-maintenance-pass
      - sample-maintenance-pass
      - condense-pass
    owner: PO
    scope:
      catalogs:
        - prj-0001:dct-kata
  - id: G-KATA-WAVE-3-review-pass
    name: レビュー完了
    after_phase_sets:
      - review-pass
    owner: PO
    scope:
      catalogs:
        - prj-0001:dct-kata
group_milestones:
  - catalog_id: prj-0001:dct-kata
    milestone:
      id: M-KATA-WAVE-3-kata
      name: ドメイン完了
      artifact_name: 実践の型（試験の型）
      owner: PO
