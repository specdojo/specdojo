kind: strategy
id: prj-0001:sch-strategy-data-flow
type: project
status: ready
title: スケジュール戦略（data-flow）
rulebook: specdojo:sch-rulebook
track: data-flow

# sch-track-data-flow.yaml を生成するための戦略定義。
# dct-data-flow.yaml の kind: work の成果物を対象とし、共通の CDFD 実践一式を
# cdfd-overview の bootstrap で一度だけ整備してから、実装エビデンスを各成果物へ反映する。
# owner はロールのみを持ち、実際の実行者は pm-members.yaml と実行要件から解決する。

settings:
  start_date: "2026-08-06"

scope:
  catalogs:
    - id: prj-0001:dct-data-flow
      path: /docs/ja/projects/prj-0001/010-deliverables-catalog/dct-data-flow.yaml
  include_kinds:
    - work

# cdfd-overview だけは bootstrap-pass から開始し、成果物と共通の
# rulebook / recipe / sample / template を一式整備する。全成果物は DCT の evidence_refs を
# retrofit-pass で調査・反映し、横断的な重複整理後に fully-guided で磨き込む。
phase_sets:
  bootstrap-pass:
    - id: bootstrap
      name: 代表成果物・実践一式の初期整備
      execution: agent
      mode: edit
      approach: bootstrap
      proficiency: expert
      task_suffix: "005"
      duration_days: 0.5
      description: |
        cdfd-overview と共通の rulebook / recipe / sample / template を同じタスクで初期整備し、
        構造・用語・粒度が互いに矛盾しない実践一式として揃える。成果物カタログの done_criteria と
        プロジェクト文脈を基準にし、実装エビデンスの詳細な反映は後続の retrofit-pass に委ねる。

  retrofit-pass:
    - id: retrofit
      name: 実装調査・草案反映
      execution: agent
      mode: edit
      approach: retrofit
      proficiency: expert
      task_suffix: "010"
      duration_days: 0.5
      description: |
        DCT の evidence_refs から現在動作を調査し、既存成果物・決定記録・プロジェクト文脈が示す
        意図された仕様、および成果物カタログの done_criteria と照合する。一致する内容は成果物へ
        反映し、乖離は実装へ無条件に合わせず result に記録する。実装から確認できない業務判断や
        将来方針は推測せず、必要に応じて確認事項として残す。
        プロセス概要の表と業務フロー図で名称を揃え、起点イベント、担当、主要な入力・出力、
        データストア、正常経路と必要な例外経路を概念レベルで記述する。

  refine-pass:
    - id: refine
      name: 磨き込み・整合性確認
      execution: agent
      mode: edit
      approach: fully-guided
      proficiency: normal
      task_suffix: "070"
      duration_days: 0.25
      description: |
        整備済みの実践一式と先行・隣接 CDFD を参照し、既存の草案を保守的に磨き込む。
        表と図のプロセス名・イベント・入出力・データストアを一致させ、重複整理後の責務境界と
        depends_on に沿った情報の受け渡しを確認する。不足や不整合だけを最小限修正し、
        成果物カタログの done_criteria を満たす状態へ整える。

  review-pass:
    - id: review
      name: 完成版レビュー
      execution: agent
      mode: review
      approach: retrofit
      proficiency: normal
      task_suffix: "090"
      duration_days: 0.25
      description: |
        完成版の CDFD を変更せず、DCT の evidence_refs が示す現在動作、既存成果物・決定記録・
        プロジェクト文脈が示す意図された仕様、および done_criteria を照合する。表と図の対応、
        領域間の重複・欠落、正常系・例外系、担当と入出力の追跡性に加え、実装との一致・乖離・
        未確認範囲を判定し、根拠と修正対象候補を review result に記録する。

  finalize-pass:
    - id: finalize
      name: 完成版確定
      execution: human
      mode: edit
      approach: finalize
      task_suffix: "140"
      duration_days: 0.125
      description: |
        担当ロールがレビュー結果と done_criteria を最終確認し、成果物を完成版として確定する。
        cdfd-overview では bootstrap-finalize により、bootstrap で整備した共通の
        rulebook / recipe / sample / template もあわせて確認し、確定対象を ready に更新する。

default_phase_sets:
  - phase_set: retrofit-pass
  - phase_set: refine-pass
  - phase_set: review-pass
  - phase_set: finalize-pass

# CDFD は業務のプロセス・情報・イベントの流れを定義するため、主たる実作業責任は BA とする。
# cdfd-overview のみ bootstrap-pass を先行させ、共通の実践一式も確定対象に含める。
owner_rules:
  - local_ids:
      - cdfd-overview
    owner: BA
    phase_sets:
      - phase_set: bootstrap-pass
      - phase_set: retrofit-pass
      - phase_set: refine-pass
      - phase_set: review-pass
      - phase_set: finalize-pass
    phase_overrides:
      - phase: finalize
        approach: bootstrap-finalize

  - local_ids:
      - cdfd-init
      - cdfd-register-operation
      - cdfd-catalog-planning
      - cdfd-task-execution
      - cdfd-routine
      - cdfd-multi-project
      - cdfd-agent-config-operation
      - cdfd-derived-content
      - cdfd-reporting
    owner: BA

# retrofit-pass 後に全 CDFD を一度だけ横断し、同じ操作・状態遷移・データストアの
# 重複記述を正本選択・要約・参照へ整理してから、成果物別の磨き込みへ進む。
cross_deliverable_passes:
  - id: data-flow-dedup
    name: CDFD間の正本選択・重複整理
    task_suffix: "060"
    duration_days: 0.5
    owner: ARC
    after_gate: G-DATA-FLOW-retrofit-pass
    before_phase_set: refine-pass
    execution: agent
    mode: edit
    approach: cross-deliverable-dedup
    proficiency: expert
    description: |
      全 CDFD を横断し、同じプロセス・状態遷移・入力・出力・データストアの説明が
      複数文書へ重複していないか確認する。各情報の正本を選び、他の文書は必要な要約と参照へ整理する。
      各 CDFD の固有責務と done_criteria は維持し、領域間の受け渡しと用語を統一する。
    scope:
      catalogs:
        - prj-0001:dct-data-flow

phase_gates:
  - id: G-DATA-FLOW-retrofit-pass
    name: retrofit-pass 完了
    artifact_name: データフロー
    after_phase_sets: [retrofit-pass]
    owner: PM
    scope:
      catalogs:
        - prj-0001:dct-data-flow

  - id: G-DATA-FLOW-refine-pass
    name: refine-pass 完了
    artifact_name: データフロー
    after_phase_sets: [refine-pass]
    owner: PM
    scope:
      catalogs:
        - prj-0001:dct-data-flow

  - id: G-DATA-FLOW-review-pass
    name: review-pass 完了
    artifact_name: データフロー
    after_phase_sets: [review-pass]
    owner: PM
    scope:
      catalogs:
        - prj-0001:dct-data-flow

group_milestones:
  - catalog_id: prj-0001:dct-data-flow
    milestone:
      id: M-DATA-FLOW-data-flow
      name: ドメイン完了
      artifact_name: データフロー
      owner: PM
