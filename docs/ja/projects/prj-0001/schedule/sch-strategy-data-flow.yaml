kind: strategy
id: prj-0001:sch-strategy-data-flow
type: project
status: ready
title: スケジュール戦略（data-flow）
rulebook: specdojo:sch-rulebook
track: data-flow

# sch-track-data-flow.yaml を生成するための戦略定義。
# dct-data-flow.yaml の kind: work の成果物を対象とし、cdfd-overview 専用の実践一式と
# 領域別 cdfd-<area> 用の実践一式を別々の bootstrap タスクで整備してから、
# 実装エビデンスを各成果物へ反映する。
# owner はロールのみを持ち、実際の実行者は pm-members.yaml と実行要件から解決する。

settings:
  start_date: "2026-08-06"

scope:
  catalogs:
    - id: prj-0001:dct-data-flow
      path: /docs/ja/projects/prj-0001/010-deliverables-catalog/dct-data-flow.yaml
  include_kinds:
    - work

# cdfd-register-operation を cdfd-register-lifecycle へ改称した（id-and-file-naming-standard.md
# 9.2 経路B）。旧 local_id の完了実績（010〜140）を新 local_id へ引き継ぎ、フルフェーズの
# タスクチェーンを再生成しないようにするための登録。
initial_state:
  completed_deliverables:
    - local_id: cdfd-register-lifecycle
      completed_on: "2026-08-13"
      by: indie
      note: cdfd-register-operation（旧 local_id）の完了実績を引き継ぐ改称。内容は移行済み

# cdfd-overview は overview-bootstrap-pass、領域別の代表成果物 cdfd-init は
# area-bootstrap-pass から開始する。前者は overview 専用 Kata を新設し、後者は既存の
# cdfd Kata を領域別専用へ再構成する。全成果物は DCT の evidence_refs を retrofit-pass で
# 調査・反映し、横断的な重複整理後に fully-guided で磨き込む。
phase_sets:
  overview-bootstrap-pass:
    - id: legacy-bootstrap
      name: 代表成果物・実践一式の初期整備
      execution: agent
      mode: edit
      approach: bootstrap
      proficiency: expert
      task_suffix: "005"
      duration_days: 0.5
      description: |
        cdfd-overview と共通の rulebook / recipe / sample / template を同じタスクで初期整備し、
        構造・用語・粒度が互いに矛盾しない実践一式として揃える。成果物カタログの done_criteria と
        プロジェクト文脈を基準にし、実装エビデンスの詳細な反映は後続の retrofit-pass に委ねる。
    - id: overview-bootstrap
      name: cdfd-overview・overview Kataの初期整備
      execution: agent
      mode: edit
      approach: bootstrap
      proficiency: expert
      task_suffix: "006"
      duration_days: 0.5
      description: |
        cdfd-overview と cdfd-overview-rulebook / recipe / sample / template を新設し、
        一ノードを一領域とする領域間フローと分割境界の再現可能な型を定義する。
        既存の cdfd-rulebook / recipe / sample / template はこのタスクで領域別専用へ変更しない。
        Mermaid の共通記法は cdfd-mermaid-rulebook を共有し、overview と領域別の粒度差を
        表現するために必要な共通規則だけを更新する。成果物カタログの done_criteria と
        プロジェクト文脈を基準にし、実装エビデンスの詳細な反映は後続の retrofit-pass に委ねる。

  area-bootstrap-pass:
    - id: area-bootstrap
      name: cdfd-init・領域別CDFD Kataの初期整備
      execution: agent
      mode: edit
      approach: bootstrap
      proficiency: expert
      task_suffix: "005"
      duration_days: 0.5
      description: |
        cdfd-init を代表成果物として、既存の cdfd-rulebook / recipe / sample / template を
        領域別 CDFD 専用へ再構成する。cdfd-area-* という別 ID は作らず、
        一ノードを一プロセスとする領域内フロー、主要例外、領域外への委譲を定義する。
        overview 専用の cdfd-overview-rulebook / recipe / sample / template はこのタスクで変更せず、
        Mermaid の共通記法は cdfd-mermaid-rulebook を参照する。成果物カタログの done_criteria と
        cdfd-overview が定義した領域境界を基準にし、実装エビデンスの詳細な反映は後続の
        retrofit-pass に委ねる。

  retrofit-pass:
    - id: retrofit
      name: 実装調査・草案反映
      execution: agent
      mode: edit
      approach: retrofit
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: expert
          - stage_role: reporter
            proficiency: normal
      task_suffix: "010"
      duration_days: 0.5
      description: |
        DCT の evidence_refs から現在動作を調査し、既存成果物・決定記録・プロジェクト文脈が示す
        意図された仕様、および成果物カタログの done_criteria と照合する。一致する内容は成果物へ
        反映し、乖離は実装へ無条件に合わせず result に記録する。実装から確認できない業務判断や
        将来方針は推測せず、必要に応じて確認事項として残す。
        cdfd-overview はプロセス領域一覧と領域間フローで全体境界と詳細化先を示し、領域内の
        正常経路・例外経路を展開しない。領域別 cdfd-<area> は overview の境界を引き継ぎ、
        プロセス概要の表と業務フロー図で名称を揃え、起点イベント、担当、主要な入力・出力、
        データストア、正常経路と必要な例外経路を概念レベルで記述する。

  refine-pass:
    - id: refine
      name: 磨き込み・整合性確認
      execution: agent
      mode: edit
      approach: fully-guided
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: normal
          - stage_role: reporter
            proficiency: normal
      task_suffix: "070"
      duration_days: 0.25
      description: |
        成果物種別に対応する整備済み Kata と先行・隣接 CDFD を参照し、既存の草案を保守的に
        磨き込む。cdfd-overview は領域粒度と領域間の主要な受け渡しを維持し、領域別 CDFD は
        領域内プロセス粒度で表と図のプロセス名・イベント・入出力・データストアを一致させる。
        重複整理後の責務境界と depends_on に沿った情報の受け渡しを確認し、不足や不整合だけを
        最小限修正して、成果物カタログの done_criteria を満たす状態へ整える。

  retrofit-pass-2:
    - id: retrofit-2
      name: 実装調査・草案再作成（Kata反映）
      execution: agent
      mode: edit
      approach: retrofit
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: expert
          - stage_role: reporter
            proficiency: normal
      task_suffix: "075"
      duration_days: 0.5
      description: |
        整備済みの cdfd-rulebook / recipe / sample / template（Kata）に基づき、成果物を
        再度 retrofit する。DCT の evidence_refs から現在動作を再調査し、既存成果物・
        決定記録・プロジェクト文脈が示す意図された仕様、および成果物カタログの
        done_criteria と、更新済み Kata の章構成・記述ガイドと照合する。1回目の
        retrofit-pass・refine-pass の結果を土台に、Kata の変更点（個別プロセス主要
        入出力の分離、必須・条件付きプロセスによる図分割など）を反映して成果物を
        作り直す。

  refine-pass-2:
    - id: refine-2
      name: 磨き込み・整合性確認（再実施）
      execution: agent
      mode: edit
      approach: fully-guided
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: normal
          - stage_role: reporter
            proficiency: normal
      task_suffix: "080"
      duration_days: 0.25
      description: |
        retrofit-pass-2 で再作成した草案を、整備済み Kata に沿って磨き込む。表と図の
        プロセス名・イベント・入出力・データストアを一致させ、責務境界と depends_on
        に沿った情報の受け渡しを確認し、不足や不整合だけを最小限修正して、成果物
        カタログの done_criteria を満たす状態へ整える。

  review-pass:
    - id: review
      name: 完成版レビュー
      execution: agent
      mode: review
      approach: retrofit
      agent_pipeline:
        stages:
          - stage_role: executor
            proficiency: normal
          - stage_role: reporter
            proficiency: normal
      task_suffix: "090"
      duration_days: 0.25
      description: |
        完成版の CDFD を変更せず、DCT の evidence_refs が示す現在動作、既存成果物・決定記録・
        プロジェクト文脈が示す意図された仕様、および done_criteria を照合する。cdfd-overview は
        領域粒度、領域間フロー、領域別 CDFD への分割を確認し、領域別 cdfd-<area> はプロセス粒度、
        正常系・主要例外、担当と入出力の追跡性を確認する。実装との一致・乖離・未確認範囲を判定し、
        根拠と修正対象候補を review result に記録する。

  finalize-pass:
    - id: finalize
      name: 完成版確定
      execution: human
      mode: edit
      approach: finalize
      task_suffix: "140"
      duration_days: 0.125
      description: |
        担当ロールがレビュー結果と done_criteria を最終確認し、成果物を完成版として確定する。
        bootstrap 対象の cdfd-overview と cdfd-init では bootstrap-finalize により、各タスクで
        整備した専用 rulebook / recipe / sample / template もあわせて確認し、確定対象を ready に更新する。

default_phase_sets:
  - phase_set: retrofit-pass
  - phase_set: refine-pass
  - phase_set: review-pass
  - phase_set: finalize-pass

# CDFD は業務のプロセス・情報・イベントの流れを定義するため、主たる実作業責任は BA とする。
# cdfd-overview は overview-bootstrap-pass、領域別の代表成果物 cdfd-init は
# area-bootstrap-pass を先行させ、それぞれの専用 Kata も確定対象に含める。
# 全 10 成果物が retrofit-pass-2・refine-pass-2 を経て review-pass へ進むため、
# review-pass（090）は G-DATA-FLOW-refine-pass-2 で足並みをそろえてから開始する。
owner_rules:
  - local_ids:
      - cdfd-overview
    owner: BA
    phase_sets:
      - phase_set: overview-bootstrap-pass
      - phase_set: retrofit-pass
      - phase_set: refine-pass
      - phase_set: retrofit-pass-2
      - phase_set: refine-pass-2
      - phase_set: review-pass
      - phase_set: finalize-pass
    phase_overrides:
      - phase: finalize
        approach: bootstrap-finalize

  - local_ids:
      - cdfd-init
    owner: BA
    phase_sets:
      - phase_set: area-bootstrap-pass
      - phase_set: retrofit-pass
      - phase_set: refine-pass
      - phase_set: retrofit-pass-2
      - phase_set: refine-pass-2
      - phase_set: review-pass
      - phase_set: finalize-pass
    phase_overrides:
      - phase: finalize
        approach: bootstrap-finalize

  # 領域別 CDFD（bootstrap 対象の cdfd-overview・cdfd-init 以外）は、1 回目の
  # retrofit-pass・refine-pass の後、review-pass の前にもう一度 retrofit-pass・
  # refine-pass を挟み、今回整備した Kata（rulebook / recipe / sample /
  # template）に基づいて成果物を作り直してから磨き込む。1 回目の retrofit-pass・
  # refine-pass は Kata 整備前に完了しており、いずれも review-pass にはまだ
  # 進んでいない。
  - local_ids:
      - cdfd-register-operation
      - cdfd-register-lifecycle
      - cdfd-catalog-planning
      - cdfd-task-execution
      - cdfd-routine
      - cdfd-multi-project
      - cdfd-agent-config-operation
      - cdfd-derived-content
      - cdfd-reporting
    owner: BA
    phase_sets:
      - phase_set: retrofit-pass
      - phase_set: refine-pass
      - phase_set: retrofit-pass-2
      - phase_set: refine-pass-2
      - phase_set: review-pass
      - phase_set: finalize-pass

  # cdfd-deprecation は既存の Kata（rulebook / recipe / sample / template）に
  # 対して初めて書き起こす新規成果物のため、上記グループの二重 retrofit・refine
  # は不要。default_phase_sets（retrofit-pass → refine-pass → review-pass →
  # finalize-pass）を1回通す。
  - local_ids:
      - cdfd-deprecation
    owner: BA

# retrofit-pass 後に全 CDFD を一度だけ横断し、同じ操作・状態遷移・データストアの
# 重複記述を正本選択・要約・参照へ整理してから、成果物別の磨き込みへ進む。
cross_deliverable_passes:
  - id: data-flow-dedup
    name: CDFD間の正本選択・重複整理
    artifact_name: データフロー
    task_suffix: "060"
    duration_days: 0.5
    owner: ARC
    after_gate: G-DATA-FLOW-retrofit-pass
    before_phase_set: refine-pass
    execution: agent
    mode: edit
    approach: cross-deliverable-dedup
    proficiency: expert
    description: |
      全 CDFD を横断し、同じプロセス・状態遷移・入力・出力・データストアの説明が
      複数文書へ重複していないか確認する。各情報の正本を選び、他の文書は必要な要約と参照へ整理する。
      各 CDFD の固有責務と done_criteria は維持し、領域間の受け渡しと用語を統一する。
    scope:
      catalogs:
        - prj-0001:dct-data-flow

phase_gates:
  - id: G-DATA-FLOW-retrofit-pass
    name: retrofit-pass 完了
    artifact_name: データフロー
    after_phase_sets: [retrofit-pass]
    owner: PM
    scope:
      catalogs:
        - prj-0001:dct-data-flow

  - id: G-DATA-FLOW-refine-pass
    name: refine-pass 完了
    artifact_name: データフロー
    after_phase_sets: [refine-pass]
    owner: PM
    scope:
      catalogs:
        - prj-0001:dct-data-flow

  # retrofit-pass-2・refine-pass-2 は cdfd-overview・cdfd-init を除く領域別
  # CDFD だけが持つ phase_set のため、scope を横断してもこの2件には依存が
  # 付かない（該当 phase_set を持つ成果物だけが対象になる）。
  - id: G-DATA-FLOW-retrofit-pass-2
    name: retrofit-pass-2 完了
    artifact_name: データフロー
    after_phase_sets: [retrofit-pass-2]
    owner: PM
    scope:
      catalogs:
        - prj-0001:dct-data-flow

  - id: G-DATA-FLOW-refine-pass-2
    name: refine-pass-2 完了
    artifact_name: データフロー
    after_phase_sets: [refine-pass-2]
    owner: PM
    scope:
      catalogs:
        - prj-0001:dct-data-flow

  - id: G-DATA-FLOW-review-pass
    name: review-pass 完了
    artifact_name: データフロー
    after_phase_sets: [review-pass]
    owner: PM
    scope:
      catalogs:
        - prj-0001:dct-data-flow

group_milestones:
  - catalog_id: prj-0001:dct-data-flow
    milestone:
      id: M-DATA-FLOW-data-flow
      name: ドメイン完了
      artifact_name: データフロー
      owner: PM
