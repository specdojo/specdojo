# yaml-language-server: $schema=../../../../specdojo/schemas/v1/sch-track.schema.yaml
kind: track
id: prj-0001:sch-track-business-specs-kata-2
type: project
status: draft
title: スケジュールトラック（business-specs-kata-2）
rulebook: specdojo:sch-rulebook
version: 1
project_id: prj-0001
track: business-specs-kata-2
settings: {}
tasks:
  - local_id: stsd-task-execution
    phase_suffix: "040"
    phase_set: rulebook-maintenance-pass
    phase_id: rulebook-maintenance
    name: rulebook の見直し
    duration_days: 0.5
    depends_on: []
    owner: BA
    description: >
      代表成果物の実績から stsd-rulebook・cdsd-rulebook・cdfd-uc-rulebook・clis-rulebook・ifx-cmd-rulebook のうち対応する rulebook
      を手入れする。成果物本体は変更しない。sample の完成例は後続の sample-maintenance で整備する。ifx-cmd の recipe・template は、rulebook
      の改訂に合わせて同じ段で同期する。他に必要と判断した recipe・template は対応結果に次の作業案を残す。

      [[specdojo:rulebook-authoring-standard|Rulebook
      記述標準]]（docs/ja/specdojo/standards/rulebook-authoring-standard.md）の章立てに合わせ、rulebook にサンプルの章を置かず完成例を sample
      に外出しする。Markdown の ##〜#### の見出しに階層ごとの連番を付ける。記述ガイドには章ごとの判断の基準と良い例・悪い例を書く。sample は
      [[specdojo:clis-sample|CLI仕様の完成例]]（docs/ja/specdojo/samples/clis-sample.md）程度の厚さの完成例にする（YAML の sample
      は対象形式に合わせて内容を充実させる）。recipe と template の要否を決め、rulebook frontmatter に対応する ID または not-needed を宣言し、判断理由を result
      に残す。実装・schema・リファレンスと同じことを書かない方針（PJR-2GD6）を保ち、値・構文・構造の詳細は正本を参照する。
  - local_id: stsd-task-execution
    phase_suffix: "050"
    phase_set: sample-maintenance-pass
    phase_id: sample-maintenance
    name: sample の見直し
    duration_days: 0.5
    depends_on:
      - T-BUSINESS-SPECS-KATA-2-stsd-task-execution-040
    owner: BA
    agent:
      executor: sol-executor
    description: >
      改訂した rulebook に沿い、対応する stsd-sample・cdsd-sample・cdfd-uc-sample・clis-sample・ifx-cmd-sample
      を完成例として手入れする。代表成果物から判断に要る場面・例外を拾い、例を単純に複写しない。成果物本体は変更しない。clis-sample は他の型の厚さの基準でもあるため、薄くしない。

      [[specdojo:rulebook-authoring-standard|Rulebook
      記述標準]]（docs/ja/specdojo/standards/rulebook-authoring-standard.md）の章立てに合わせ、rulebook にサンプルの章を置かず完成例を sample
      に外出しする。Markdown の ##〜#### の見出しに階層ごとの連番を付ける。記述ガイドには章ごとの判断の基準と良い例・悪い例を書く。sample は
      [[specdojo:clis-sample|CLI仕様の完成例]]（docs/ja/specdojo/samples/clis-sample.md）程度の厚さの完成例にする（YAML の sample
      は対象形式に合わせて内容を充実させる）。recipe と template の要否を決め、rulebook frontmatter に対応する ID または not-needed を宣言し、判断理由を result
      に残す。実装・schema・リファレンスと同じことを書かない方針（PJR-2GD6）を保ち、値・構文・構造の詳細は正本を参照する。
  - local_id: stsd-task-execution
    phase_suffix: "090"
    phase_set: review-pass
    phase_id: review
    name: 完成版レビュー
    duration_days: 0.25
    depends_on:
      - T-BUSINESS-SPECS-KATA-2-stsd-task-execution-050
      - G-BUSINESS-SPECS-KATA-2-first-pass
    owner: BA
    description: >
      対応する rulebook・sample（ifx-cmd は recipe・template も）と代表成果物を読み、型一式の章構成・判断基準・例の充実度・相互整合をレビューする。代表成果物の `done_criteria`
      だけで完了としない。template は frontmatter の ID から明示的に開く。成果物・型は変更せず、指摘と根拠を review result に残す。

      [[specdojo:rulebook-authoring-standard|Rulebook
      記述標準]]（docs/ja/specdojo/standards/rulebook-authoring-standard.md）の章立てに合わせ、rulebook にサンプルの章を置かず完成例を sample
      に外出しする。Markdown の ##〜#### の見出しに階層ごとの連番を付ける。記述ガイドには章ごとの判断の基準と良い例・悪い例を書く。sample は
      [[specdojo:clis-sample|CLI仕様の完成例]]（docs/ja/specdojo/samples/clis-sample.md）程度の厚さの完成例にする（YAML の sample
      は対象形式に合わせて内容を充実させる）。recipe と template の要否を決め、rulebook frontmatter に対応する ID または not-needed を宣言し、判断理由を result
      に残す。実装・schema・リファレンスと同じことを書かない方針（PJR-2GD6）を保ち、値・構文・構造の詳細は正本を参照する。
  - local_id: stsd-task-execution
    phase_suffix: "140"
    phase_set: finalize-pass
    phase_id: finalize
    name: 完成版確定
    duration_days: 0.125
    depends_on:
      - T-BUSINESS-SPECS-KATA-2-stsd-task-execution-090
      - G-BUSINESS-SPECS-KATA-2-review-pass
    owner: BA
    description: >
      担当ロールがレビュー結果と done_criteria を最終確認し、成果物を完成版として確定する。bootstrap 対象では、同じタスクで整備した rulebook / recipe / sample / template
      もあわせて確認する。
