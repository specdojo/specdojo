# yaml-language-server: $schema=../../../../specdojo/schemas/v1/sch-track.schema.yaml
kind: track
id: prj-0001:sch-track-data-flow-pdca
type: project
status: ready
title: スケジュールトラック（data-flow-pdca）
rulebook: specdojo:sch-rulebook
version: 1
project_id: prj-0001
track: data-flow-pdca
settings:
  start_date: "2026-09-16"
tasks:
  - local_id: cdfd-onboarding
    phase_suffix: "010"
    phase_set: author-pass
    phase_id: author
    name: cdfd-overview と Kata に基づく新規作成
    duration_days: 0.5
    depends_on: []
    owner: BA
    description: |
      cdfd-overview の該当プロセスグループ（またはユースケース）の定義と、成果物カタログの
      done_criteria・evidence_refs の現行実装を根拠に、rulebook / recipe / sample / template に
      従って新規に作成する。trash へ退避した旧領域別 CDFD は参照しない。データストア名は
      cdfd-overview の「データストア」と一致させ、凡例は「凡例（本プロダクト共通）」を参照する。
      状態の定義と遷移は STSD / CSTD を正本として参照に留める。
  - local_id: cdfd-onboarding
    phase_suffix: "070"
    phase_set: refine-pass
    phase_id: refine
    name: 磨き込み・整合性確認
    duration_days: 0.25
    depends_on:
      - T-DATA-FLOW-PDCA-cdfd-onboarding-010
      - G-DATA-FLOW-PDCA-author-pass
    owner: BA
    description: |
      整備済みの Kata と cdfd-overview、先行して作成した他のプロセスグループ別 CDFD を参照し、
      草案を保守的に磨き込む。プロセス領域章の領域単位の入出力が cdfd-overview のグループ単位の
      箇条書きと矛盾しないこと、表と図のプロセス ID・名称・データストアが一致すること、
      グループ外委譲の参照先が実在することを確認し、不足や不整合だけを最小限修正して、
      成果物カタログの done_criteria を満たす状態へ整える。
  - local_id: cdfd-onboarding
    phase_suffix: "075"
    phase_set: refine-2-pass
    phase_id: refine-2
    name: grade の指摘を解消する磨き込み
    duration_days: 0.5
    depends_on:
      - T-DATA-FLOW-PDCA-cdfd-onboarding-070
    owner: BA
    description: |
      1 回目の磨き込みは normal 帯の agent が担い、rulebook・done_criteria との照合で不足を検出
      できず成果物をほぼ変更しなかった。本パスは expert 帯の agent が、成果物評価（grade）が本文へ
      残した `specdojo:finding` コメントの指摘を一つずつ確認し、妥当な指摘は本文を修正して解消し、
      妥当でない指摘はその理由を result に記録する。あわせて rulebook の完成判定と cdfd-overview の
      プロセス領域・データストアとの対応を照合し、不足だけを最小限修正する。finding コメント自体は
      削除せず残す（次回の grade が解消を判定する）。trash へ退避した旧領域別 CDFD は参照しない。
  - local_id: cdfd-onboarding
    phase_suffix: "090"
    phase_set: review-pass
    phase_id: review
    name: 完成版レビュー
    duration_days: 0.25
    depends_on:
      - T-DATA-FLOW-PDCA-cdfd-onboarding-075
    owner: BA
    description: |
      完成版の CDFD を変更せず、rulebook の完成判定、cdfd-overview との対応、DCT の
      evidence_refs が示す現在動作、および done_criteria を照合する。プロセスグループ別 CDFD は
      領域ごとのプロセス粒度、正常系・主要例外、グループ外委譲の追跡性を、ユースケース別 CDFD は
      グループ間の順序と引き渡し条件だけを扱っていることを確認し、判定と修正対象候補を
      review result に記録する。
  - local_id: cdfd-onboarding
    phase_suffix: "140"
    phase_set: finalize-pass
    phase_id: finalize
    name: 完成版確定
    duration_days: 0.125
    depends_on:
      - T-DATA-FLOW-PDCA-cdfd-onboarding-090
      - G-DATA-FLOW-PDCA-review-pass
    owner: BA
    description: |
      担当ロールがレビュー結果と done_criteria を最終確認し、成果物を完成版として確定して
      status を ready に更新する。
