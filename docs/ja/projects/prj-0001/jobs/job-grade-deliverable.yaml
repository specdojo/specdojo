# yaml-language-server: $schema=../../../../specdojo/schemas/v1/job.schema.yaml
id: job-grade-deliverable
name: 成果物の継続品質評価
description: 成果物を文書単位の codex 単段評価へ流し、最新の品質と done_criteria 充足状況を更新する。
inputs:
  period:
    type: string
    required: true
  limit:
    type: integer
    default: 0
    minimum: 0
  dependency_changed:
    type: boolean
    default: false
  rulebook_changed:
    type: boolean
    default: false
  unreviewed:
    type: boolean
    default: false
task:
  mode: command
  owner: ARC
  precondition:
    command: |
      selection=$(
        if [ "{{inputs.dependency_changed}}" = "false" ] && [ "{{inputs.rulebook_changed}}" = "false" ] && [ "{{inputs.unreviewed}}" = "false" ]; then
          {{specdojo}} grade list --target deliverable --project {{project_id}}
        else
          if [ "{{inputs.dependency_changed}}" = "true" ]; then
            {{specdojo}} grade list --target deliverable --project {{project_id}} --dependency-changed || exit $?
          fi
          if [ "{{inputs.rulebook_changed}}" = "true" ]; then
            {{specdojo}} grade list --target deliverable --project {{project_id}} --rulebook-changed || exit $?
          fi
          if [ "{{inputs.unreviewed}}" = "true" ]; then
            {{specdojo}} grade list --target deliverable --project {{project_id}} --unreviewed || exit $?
          fi
        fi
      )
      printf '%s\n' "$selection" | LC_ALL=C sort -u | awk -v limit="{{inputs.limit}}" '
        NF && (limit == 0 || selected < limit) {
          print
          selected++
        }
      '
    skip_when: empty-output
  command: |
    npm run build
    if tools/grade/run-per-document.sh --run-id {{job_run_id}} --stages 1 --target deliverable --limit {{inputs.limit}} --dependency-changed={{inputs.dependency_changed}} --rulebook-changed={{inputs.rulebook_changed}} --unreviewed={{inputs.unreviewed}}; then
      cat logs/grade/runs/per-document/{{job_run_id}}/results.tsv
    else
      grade_status=$?
      printf 'grade pipeline failed: run_id=%s exit_code=%s\n' '{{job_run_id}}' "$grade_status" >&2
      exit "$grade_status"
    fi
  analysis:
    agent: gemma-reporter
    description: |
      runner が記録した command evidence の終了コードと、stdout に出力された
      `results.tsv` から次を判断して報告する。

      - 終了コード75（rate limit）または中断で未完了の段が残っているか。残る場合は同じ
        `--run-id` で再開できる状態かを確認する。
      - `failed` の段があるか。ある場合は agent 側の失敗、`grade apply` の忠実性検証、
        done_criteria の過不足のいずれかへ切り分ける。
      - `retry_exhausted` の成果物があるか。ある場合は失敗段と連続失敗回数を示し、人手での
        原因解消または state の再開判断を促す。
      - codex 単段の verdict と score に、評価設定の見直しを要する偏りがあるか。
      - 未充足の done_criteria がある成果物と、その確認担当ロールを特定する。

      選択された成果物が0件の場合は no-op と判断する。判断できない事象は推測で埋めず、
      観測した事実と未確認の範囲を分けて報告する。
  paths:
    - docs/ja/projects/prj-0001
run:
  idempotency_key: "{{job_id}}:command-v5:{{scheduled_at}}:{{inputs.limit}}:{{inputs.dependency_changed}}:{{inputs.rulebook_changed}}:{{inputs.unreviewed}}"
