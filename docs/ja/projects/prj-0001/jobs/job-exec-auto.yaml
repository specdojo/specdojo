# yaml-language-server: $schema=../../../../specdojo/schemas/v1/job.schema.yaml
id: job-exec-auto
name: Ready task の自動実行
description: Schedule の Ready task を指定した戦略と並列数で自動実行する。
inputs:
  strategy:
    type: string
    default: critical-first
    enum: [critical-first, fifo]
  parallel:
    type: integer
    default: 1
    minimum: 1
  loop:
    type: boolean
    default: false
  max_rounds:
    type: integer
    minimum: 1
task:
  mode: command
  owner: ARC
  command: |
    set -- exec run --auto --project "{{project_id}}" --strategy "{{inputs.strategy}}" --parallel "{{inputs.parallel}}" --if-busy skip
    if [ "{{inputs.loop}}" = "true" ]; then
      set -- "$@" --loop
      if [ -n "{{inputs.max_rounds}}" ]; then
        set -- "$@" --max-rounds "{{inputs.max_rounds}}"
      fi
    fi
    {{specdojo}} "$@"
run:
  idempotency_key: "{{job_id}}:{{scheduled_at}}:{{inputs.strategy}}:{{inputs.parallel}}:{{inputs.loop}}:{{inputs.max_rounds}}"
