# yaml-language-server: $schema=../../../../specdojo/schemas/v1/routine.schema.yaml
# 2026-11-11: 子の run の統合テストに環境が漏れて落ちる（PJR-RX14）ため、直るまで止める。
# 有効化は保護設定を扱える人が、時刻・上限・fallback agent を確認した後に行う。
id: rtn-night-approved-register
name: 承認済み登録項目の夜間実行
description: 毎晩 0 時に、人が autopilot を承認した open todo・issue を実行して朝報告を作る。
enabled: false
trigger:
  cron: "0 0 * * *"
  timezone: Asia/Tokyo
action:
  kind: job
  job: job-night-approved-register
  inputs:
    max_items: "10"
    parallel: "2"
    max_consecutive_failures: "2"
    on_rate_limit: fallback
    fallback_executor: argon-executor
policy:
  missed_run: skip
  overlap: skip
