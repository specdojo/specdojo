# yaml-language-server: $schema=../../../../specdojo/schemas/v1/routine.schema.yaml
id: rtn-grade-deliverable-recheck
name: 依存先変更・kata更新・未レビューの成果物の定期評価
description: 毎日1時（Asia/Tokyo）に、依存先が変更された、kataが更新された、またはscheduleタスクを持たない成果物を最大10件評価する。
enabled: true
trigger:
  cron: "0 1 * * *"
  timezone: Asia/Tokyo
action:
  kind: job
  job: job-grade-deliverable
  inputs:
    period: "{{scheduled_at | iso_week}}"
    limit: "10"
    dependency_changed: "true"
    rulebook_changed: "true"
    # --unreviewed は内容の変化を見ずに schedule タスクのない文書を毎回すべて選ぶため、
    # 内容ハッシュで絞る修正（PJR-2F3Y）が入るまで無効にする。
    unreviewed: "false"
    changed_only: "true"
    ungraded: "true"
    incomplete: "true"
policy:
  missed_run: skip
  overlap: skip
