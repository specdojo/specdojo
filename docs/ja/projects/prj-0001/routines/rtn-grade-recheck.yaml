# yaml-language-server: $schema=../../../../specdojo/schemas/v1/routine.schema.yaml
id: rtn-grade-recheck
name: 依存先変更・kata更新・未レビューの実践の型の定期評価
description: 毎日6時（Asia/Tokyo）に、依存先が変更された、kataが更新された、またはscheduleタスクを持たない実践の型を最大15件評価する。
enabled: true
trigger:
  cron: "0 6 * * *"
  timezone: Asia/Tokyo
action:
  kind: job
  job: job-grade-kata
  inputs:
    # period は対象期間の表示用であり、Job Run や script の再開キーには使わない。
    period: "{{scheduled_at | iso_week}}"
    kind: all
    limit: "15"
    dependency_changed: "true"
    rulebook_changed: "true"
    # --unreviewed は内容の変化を見ずに schedule タスクのない文書を毎回すべて選ぶため、
    # 内容ハッシュで絞る修正（PJR-2F3Y）が入るまで無効にする。
    unreviewed: "false"
    changed_only: "true"
    ungraded: "true"
    incomplete: "true"
policy:
  missed_run: skip
  overlap: skip
