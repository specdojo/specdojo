# yaml-language-server: $schema=../../../../specdojo/schemas/v1/routine.schema.yaml
id: rtn-grade-recheck
name: 依存先変更・kata更新・未レビューの実践の型の定期評価
description: 毎日6時（Asia/Tokyo）に、依存先が変更された、kataが更新された、scheduleタスクを持たない、または旧rubricで評価された実践の型を最大15件評価する。
enabled: true
trigger:
  cron: "0 6 * * *"
  timezone: Asia/Tokyo
action:
  kind: job
  job: job-grade-kata
  inputs:
    # period は対象期間の表示用であり、Job Run や script の再開キーには使わない。
    period: "{{scheduled_at | iso_week}}"
    kind: all
    limit: "15"
    dependency_changed: "true"
    rulebook_changed: "true"
    unreviewed: "true"
    # PJR-Z47X 以降、changed_only は観点の comparison_sources で宣言した突き合わせ先の変更も検出する。
    # 現在の宣言では kata に適用される観点は突き合わせ先を持たないため、kata の選択は変わらない。
    changed_only: "true"
    ungraded: "true"
    incomplete: "true"
    # PJR-BVPS: 旧 rubric（grade-rubric-v1 など）の結果を、limit の範囲で夜間に少しずつ評価し直す。
    # 評価者は Job 定義で指定した agy-expert-executor とする（2026-09-30 に codex から変更）。
    rubric_outdated: "true"
policy:
  missed_run: skip
  overlap: skip
