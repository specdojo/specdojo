# yaml-language-server: $schema=../../../../specdojo/schemas/v1/routine.schema.yaml
# 利用制限で延期された task の再開・状態再計算・Ready task の auto loop を
# 1 つの定時実行単位として順次処理する routine のサンプル。
# 実行順は resume(due) → validate/refresh → run --auto --loop で固定され、
# routine ファイルの列挙順や複数 routine の cron 時刻差に依存しない。
# 一連の処理は単一の project 実行ロック内で保持されるため、step 間に手動実行・
# 別 routine・CI の exec run / exec resume が割り込まない。
# 2026-11-10: 業務仕様の代表の review を夜間に流すため有効にした（indie が決定）。0:00 の
# rtn-night-approved-register の後に動くよう 5 時 30 分だけにし（5 時の rtn-grade-recheck の後に動かすため）、編集は sol-executor、review は
# sol-review-executor を指定する。並べる review が grade の共有ファイルを取り合う（PJR-Z4H8）ため parallel は 1。
# 毎日1時と6時（Asia/Tokyo）に起動し、取りこぼした実行枠が複数ある場合は
# 最新の1回だけを実行する。実行中の重複起動は skip する。
id: rtn-exec-cycle
name: 延期 task 再開と Ready task 自動実行の順次処理
description: 毎日1時と6時（Asia/Tokyo）に、due な利用制限 task の再開、Schedule 状態の再計算、Ready task の auto loop を単一ロック内で順次実行する。
enabled: true
trigger:
  cron: "30 5 * * *"
  timezone: Asia/Tokyo
action:
  kind: job
  job: job-exec-cycle
  inputs:
    strategy: critical-first
    parallel: "1"
    loop: "true"
    max_rounds: "100"
    edit_by: sol-executor
    review_by: sol-review-executor
policy:
  missed_run: skip
  overlap: skip
