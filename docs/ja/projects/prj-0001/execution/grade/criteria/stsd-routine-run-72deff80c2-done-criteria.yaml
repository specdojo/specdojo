  - id: DC-002
    text: 状態遷移の業務的妥当性を承認できること
    roles:
      - PO
    viewpoint: vp-po-purpose-alignment
    status: unsatisfied
    reason: 試行中の復旧、overlap 方針、仮置き状態値が未決であり、状態遷移全体の業務的妥当性を承認できない。
  - id: DC-003
    text: 状態遷移実装の基礎として参照できること
    roles:
      - ARC
    viewpoint: vp-arc-technical-constraints
    status: unsatisfied
