criteria:
  - id: DC-001
    text: ステータス名・意味・成立条件と、遷移・イベント・条件が業務観点で正確に定義されていること
    roles:
      - BA
    viewpoint: vp-ba-requirements-completeness
    status: unsatisfied
    reason: >-
      The transition conditions and status criteria for 'running' lack identifiers to distinguish from prior completed
      runs, and the 'missed_run: skip' path is omitted.
  - id: DC-002
    text: 状態遷移の業務的妥当性を承認できること
    roles:
      - PO
    viewpoint: vp-po-purpose-alignment
    status: unsatisfied
    reason: >-
      Recovery policy for in-progress states and overlap handling lack decision options and business impacts required
      for PO approval.
  - id: DC-003
    text: 状態遷移実装の基礎として参照できること
    roles:
      - ARC
    viewpoint: vp-arc-technical-constraints
    status: unsatisfied
    reason: >-
      Lacks a mechanism or correlation rule between last_run and last_result, preventing its use as an architectural
      foundation for implementation.
  - id: DC-004
    text: 状態ベースのテスト設計に活用できること
    roles:
      - QE
    viewpoint: vp-qe-verifiability
    status: unsatisfied
    reason: >-
      Inability to deterministically identify the current state prevents state-based test design and expected state
      verification.
  - id: DC-005
    text: 状態管理実装の参照として使えること
    roles:
      - DEV
    viewpoint: vp-dev-implementation-readiness
    status: unsatisfied
    reason: >-
      Missing correlation keys or result update rules for new execution attempts, making it insufficient as an
      implementation reference.
