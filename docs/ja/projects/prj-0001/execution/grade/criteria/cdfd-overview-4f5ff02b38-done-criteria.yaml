criteria:
  - id: DC-001
    text: 初期セットアップ・登録簿ライフサイクル・計画展開・タスク実行・定期処理・並行処理・構成変更・派生生成・報告の各プロセス領域と相互の情報の流れが表と図で確認できること
    roles:
      - BA
    viewpoint: vp-ba-business-value
    status: unsatisfied
    reason: 登録簿ライフサイクルと定期処理は定義領域へ変更され、並行処理は独立領域ではなく実行形態に統合されているため、条件が列挙する各領域を表と図で確認できない。
  - id: DC-002
    text: 対象とするプロセス領域、および独立した業務フローに含めない補助操作の境界を承認できること
    roles:
      - PO
    viewpoint: vp-po-purpose-alignment
    status: satisfied
  - id: DC-003
    text: 各領域の起点イベント・主要入力・主要出力・データストアが識別でき、領域別CDFDの構成方針として参照できること
    roles:
      - ARC
    viewpoint: vp-arc-technical-constraints
    status: unsatisfied
    reason: 起点イベントは領域単位で確認できるが、主要入力・主要出力・データストアはプロセスグループ単位でしか記載されていない。
  - id: DC-004
    text: 領域別CDFDへの分割に重複または欠落がないことを、全体図との対応で確認できること
    roles:
      - QE
    viewpoint: vp-qe-omissions-consistency
    status: satisfied
