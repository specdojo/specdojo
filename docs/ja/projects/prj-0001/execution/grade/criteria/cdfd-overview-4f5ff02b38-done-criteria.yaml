  - id: DC-001
    text: Onboarding・Plan・Do・Check・Action・Orchestrator の六つのプロセスグループに属する 14 のプロセス領域と、グループとデータストアの間の情報・実行要求の流れが表と図で確認できること
    roles:
      - BA
    viewpoint: vp-ba-business-value
    status: satisfied
  - id: DC-002
    text: 対象とするプロセス領域、および独立した業務フローに含めない補助操作の境界を承認できること
    roles:
      - PO
    viewpoint: vp-po-purpose-alignment
    status: unsatisfied
    reason: PO による対象範囲と領域分割の承認記録が特定できない。
  - id: DC-003
    text: 各領域の起点イベントと、プロセスグループ単位の主要入力・主要出力・データストアが識別でき、概念データフローのエッジと相互に対応し、プロセスグループ別 CDFD の構成方針として参照できること
    roles:
      - ARC
    viewpoint: vp-arc-technical-constraints
    status: satisfied
  - id: DC-004
    text: プロセスグループ別 CDFD とユースケース別 CDFD への分割に重複または欠落がないことを、詳細 CDFD 一覧と各領域の対応で確認できること
    roles:
      - QE
    viewpoint: vp-qe-omissions-consistency
    status: satisfied
