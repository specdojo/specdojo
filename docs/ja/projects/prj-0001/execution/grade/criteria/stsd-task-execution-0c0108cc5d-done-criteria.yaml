criteria:
  - id: DC-001
    text: ステータス名・意味・成立条件と、遷移・イベント・条件が業務観点で正確に定義されていること
    roles:
      - BA
    viewpoint: vp-ba-requirements-completeness
    status: unsatisfied
    reason: >-
      The assigned actor and authority changes across supplemental events and actor handover are not defined precisely
      enough to establish the business conditions of all transitions.
  - id: DC-002
    text: 状態遷移の業務的妥当性を承認できること
    roles:
      - PO
    viewpoint: vp-po-purpose-alignment
    status: unsatisfied
    reason: >-
      The business validity of completion, blocking, and release cannot be approved unambiguously while claimant-based
      and latest-event-author authority remain unreconciled.
  - id: DC-003
    text: 状態遷移実装の基礎として参照できること
    roles:
      - ARC
    viewpoint: vp-arc-technical-constraints
    status: unsatisfied
    reason: >-
      The actor-authority contract and deterministic same-timestamp replay-order contract are incomplete as foundations
      for transition implementation.
  - id: DC-004
    text: 状態ベースのテスト設計に活用できること
    roles:
      - QE
    viewpoint: vp-qe-verifiability
    status: unsatisfied
    reason: >-
      Permission-dependent transition tests lack a document-defined expected result for A claiming a task followed by B
      recording supplemental information or resuming work.
  - id: DC-005
    text: 状態管理実装の参照として使えること
    roles:
      - DEV
    viewpoint: vp-dev-implementation-readiness
    status: unsatisfied
    reason: >-
      State-management implementation lacks the rules for establishing, retaining, and transferring the actor identity
      used by permission guards.
