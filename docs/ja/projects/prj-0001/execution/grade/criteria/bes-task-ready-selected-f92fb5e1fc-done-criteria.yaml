criteria:
  - id: DC-001
    text: イベント内容・発生条件・タイミングが業務観点で正確に記述されていること
    roles:
      - BA
    viewpoint: vp-ba-requirements-completeness
    status: satisfied
  - id: DC-002
    text: イベント仕様の業務的妥当性を承認できること
    roles:
      - PO
    viewpoint: vp-po-purpose-alignment
    status: unsatisfied
    reason: 適用範囲（schedule 系に限る前提）と、選択と claim の境界が未承認・未確定で、承認する人間の PO も特定されていないため、業務的な妥当性を承認できる状態になっていない。
  - id: DC-003
    text: イベント処理実装・メッセージ設計の基礎として参照できること
    roles:
      - ARC
    viewpoint: vp-arc-technical-constraints
    status: unsatisfied
    reason: 並列選択要求識別子が実行記録モデル（bdd-exec-event）と照合されておらず、メッセージ設計の基礎として確定していない。
  - id: DC-004
    text: イベントテスト設計への活用が確認できること
    roles:
      - QE
    viewpoint: vp-qe-verifiability
    status: unsatisfied
    reason: 確認例はあるが、相関項目と正本の対応が確定するまでテスト設計へ引き継げないと本書自身が記している。
  - id: DC-005
    text: イベントハンドラ・パブリッシャー実装の参照として使えること
    roles:
      - DEV
