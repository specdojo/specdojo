    line: 34
    anchor: >-
      agent が親 runner・Git hook・CI・agent 指示の内容を変更できないよう、`package.json`、lefthook 設定、`.specdojo/**`、commitlint 設定、CI
      設定、agent 指示ディレクトリ、root の指示ファイルは provider 共通の固定保護パスとする。runner は agent 終了直後かつ親検証前に起動前との差分を検査し、worktree の commit 前には未
      commit 差分と branch 上の commit 済み差分を再検査する。違反時は対象パスを標準エラーへ出力して block し、branch / worktree を保持する。provider 固有の permission
      / sandbox は第一層として維持するが、この判定の入力には使わない。
    message: >-
      固定保護パスに agent 指示ディレクトリと root 指示ファイルを含めているが、正本 `sysd-cross-cutting-policy` の `scp-SEC-002`
      にはこれらがなく保護範囲が一致しないため、正本側へ統合して本書は Rule ID 参照にしてください。
