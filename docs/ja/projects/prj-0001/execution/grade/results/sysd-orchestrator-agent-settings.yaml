  - id: F002
    severity: major
    rule: vp-arc-cross-document-consistency
    line: 75
    anchor: >-
      - **OpenCode**: `permission.bash` を許可リスト方式とし、読み取り系 `specdojo`（`--help` / `project list` / `exec status` / `exec
      where` / `exec validate` / `* --help` / `* --dry-run`）は `allow`、その他の `specdojo *` は `ask` とする。`.env` / `secrets/`
      の読み取りは `deny` する。
    message: >-
      同期対象の SSOT は提示コマンドを `npx specdojo` に統一している一方、OpenCode の `permission.bash` は裸の `specdojo` だけを allow/ask
      対象としており、設計どおりのコマンドが権限規則に一致しない。
