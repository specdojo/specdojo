    rule: vp-arc-conciseness
    line: 153
    anchor: >-
      現在の例外はなし。基準版・例外の記録先は利用先のプロジェクト登録簿（[[specdojo:pjr-rulebook|プロジェクト登録簿作成ルール]]）の decision（個票）とする。PM は規則 ID
      から判断記録（個票）と元の登録項目へ相互参照を置き、承認・却下・失効の状態を追跡する。却下された案は適用せず、期限切れの例外は元の規則へ戻すか、期限前に再検証して PO の再判断を受ける。
    message: >-
      「基準版・例外の記録先は利用先のプロジェクト登録簿の
      decision（個票）とする」は、「検証の節目と基準版の採用」の実装への採用の行と、例外判断の行の再掲になっています。この段落は相互参照と失効時の扱いだけに絞ると、判断情報を失わずに短くできます。
