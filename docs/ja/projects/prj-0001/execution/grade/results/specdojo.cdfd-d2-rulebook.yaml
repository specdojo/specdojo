    message_ja: 6.1 冒頭の「プロセスは角丸四角形、外部主体は四角形、イベントは六角形、データストアは円柱」は全体方針の対応表の再掲であり、物理保管を代替に使わないという固有の規定だけを残して表への参照に置き換えられる。
