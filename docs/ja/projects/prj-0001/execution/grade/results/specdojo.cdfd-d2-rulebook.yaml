  - id: F001
    severity: minor
    rule: vp-po-purpose-alignment
    line: 116
    anchor: >-
      - プロセスは上から Orchestrator・Plan・Do・Check・Action の順（Onboarding がある図では Onboarding を Orchestrator
      の上）に並べます。並び順に逆らう戻りの矢印（Orchestrator への応答、Action から Plan への再計画要求、上流のデータストアへの更新など）は `b -> a` ではなく `a <- b` と書き、ELK
      に並びを決めさせないようにします（矢印の向きは `b` から `a` のまま、配置上で `a` を上に保ちます）。
    message: プロセスの並び順を「Orchestrator・Plan・Do・Check・Action」に固定する規定は特定プロダクトの工程構成を前提としており、プロダクト非依存の記法部品という本書の目的（固有の割り当ては共通凡例へ委ねる）と整合しないため、並び順は包含元または共通凡例が定める場合に従う条件付きの規定へ改める。
    message_ja: プロセスの並び順を「Orchestrator・Plan・Do・Check・Action」に固定する規定は特定プロダクトの工程構成を前提としており、プロダクト非依存の記法部品という本書の目的（固有の割り当ては共通凡例へ委ねる）と整合しないため、並び順は包含元または共通凡例が定める場合に従う条件付きの規定へ改める。
