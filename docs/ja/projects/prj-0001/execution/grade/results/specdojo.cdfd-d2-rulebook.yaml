  - id: F003
    severity: minor
    rule: vp-arc-technical-constraints
    line: 9
    anchor: >-
      - 方向は `direction: down`、配置エンジンは文書サイトと同じ ELK を基本とし、横長に適する場合は `direction: right`
      を選べます。矢印は情報・物・実行要求の受け渡しを示し、包含元が明示した場合だけ業務順序も示します。プロセスの並び順と戻りの矢印は「エッジ」に従います。以下、プロセスグループ別とユースケース別を「詳細 CDFD」と呼びます。
    message: >-
      配置エンジンを「文書サイトと同じ ELK を基本」とするが、D2 コード内で `vars.d2-config.layout-engine`
      等を指定するのか文書サイトのビルド設定に委ねるのかが書かれておらず、作図者が設定要否を判断できないため、指定方法または委譲先を明記する。
    message_ja: >-
      配置エンジンを「文書サイトと同じ ELK を基本」とするが、D2 コード内で `vars.d2-config.layout-engine`
      等を指定するのか文書サイトのビルド設定に委ねるのかが書かれておらず、作図者が設定要否を判断できないため、指定方法または委譲先を明記する。
