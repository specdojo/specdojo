  - id: F001
    severity: minor
    rule: vp-po-purpose-alignment
    line: 3
    anchor: >-
      MacBook Pro を自宅用の常時起動開発サーバとして利用し、Mac 上の devcontainer を主作業環境にして、ローカル LLM、SSH、VS Code Remote SSH、SpecDojo agent
      実行の接続先にするための構成を定義する。本構成は個人または小規模開発用途を対象とし、インターネットへ SSH や LLM API を直接公開しない。
    message: 自宅開発サーバの安定稼働という固有目的を、上位文書の低コストな実現・継続可能性・OSS公開という目的へ対応付ける必要がある。
