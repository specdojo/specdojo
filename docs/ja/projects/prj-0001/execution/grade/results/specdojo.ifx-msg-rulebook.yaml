    line: 76
    anchor: >-
      - AsyncAPI 2.6.0 の `subscribe` は「アプリケーションが発行し、利用者が購読できる」、`publish` は「利用者が送り、アプリケーションが受け取る」を表す。向きの誤読を防ぐため、チャネルの
      `description` に発行者と購読者を名前で書く。
