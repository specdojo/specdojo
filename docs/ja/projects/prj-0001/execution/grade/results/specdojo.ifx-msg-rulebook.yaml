    message: rulebookは`info.description`に対応する`ifx-index`の連携名と未決事項を書くと定めているが、sampleの`info.description`にはいずれもなく、コメントで「ifx-index-sampleには未掲載の連携」としたまま`based_on`で同一覧を参照しているため、sampleに連携名（または未掲載である旨と未決事項）を`info.description`へ書くか、学習用の例外をrulebookに明記する必要がある。
