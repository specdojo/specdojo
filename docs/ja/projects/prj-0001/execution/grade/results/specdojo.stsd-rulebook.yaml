findings:
  - id: F001
    severity: minor
    rule: vp-arc-conciseness
    line: 110
    anchor: "- `値` は文書内で重複させず、外部参照から対応する状態を一意に特定できるようにします。`-` はコードを持たないことを表し、複数行で使用できます。"
    message: >-
      Section 6.4 repeats the state-value uniqueness requirement and the `-` exception already defined in Section 3.
      Replace this repeated normative statement with a reference to the naming and ID rules, retaining the column
      definition's explanation of code-less states, so future changes have one authoritative rule to update.
    message_ja: >-
      Section 6.4 repeats the state-value uniqueness requirement and the `-` exception already defined in Section 3.
      Replace this repeated normative statement with a reference to the naming and ID rules, retaining the column
      definition's explanation of code-less states, so future changes have one authoritative rule to update.
  - id: F002
    severity: minor
    rule: vp-qe-kata-conformance
    line: 137
    anchor: "- 分岐は同じ遷移元から出る複数の遷移として表し、各矢印へ同じイベントと相互排他的な条件を記載します。`<<choice>>` など、状態一覧にない疑似状態は使用しません。"
    message: >-
      Section 6.5.1 requires the same event and mutually exclusive conditions on all branches from a state, whereas
      Section 6.5.2 and the included Mermaid rulebook apply that requirement to branches triggered by the same event.
      Add the same-event qualifier here so authors can represent different outgoing business events without treating
      them as a violation.
