    message: >-
      This document prohibits agent termination and requires human review after every successful execution, whereas
      docs/ja/specdojo/guides/register-operation-guide.md §3.2 requires automatic close after post-review for
      human-preapproved todo and issue items; distinguish the ordinary execution path from this authorized overnight
      path and define their respective approval conditions.
    message_ja: >-
      このドキュメントはエージェントの終了を禁止し、実行成功ごとに人間によるレビューを求めていますが、docs/ja/specdojo/guides/register-operation-guide.md §3.2
      では、人間が事前承認した todo および issue アイテムについてポストレビュー後の自動クローズを求めています。通常の実行パスと、この許可された夜間パスを区別し、それぞれの承認条件を定義してください。
    cause:
      type: document
