    rule: vp-pm-control-reporting
    line: 62
    anchor: "- 根拠、影響先、課題から起票したリスク・変更要求を文書 ID で示す。なければ `（本書のみ）` と書く。"
    message: 課題対応で生じた決定事項を決定記録（decision）へ転記する基準・参照方法がなく、課題ログ内に判断が埋もれるおそれがあるため、決定記録への転記条件を追記する。
    message_ja: 課題対応で生じた決定事項を決定記録（decision）へ転記する基準・参照方法がなく、課題ログ内に判断が埋もれるおそれがあるため、決定記録への転記条件を追記する。
