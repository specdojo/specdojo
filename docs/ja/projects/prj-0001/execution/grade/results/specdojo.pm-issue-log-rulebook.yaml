    anchor: "- 課題 ID、発生日、内容、優先度、対応策、担当、期限、ステータスを一覧にする。"
    message: 課題ログ一覧の「担当」を Role code（適用先のメンバー定義の role）で書くことが規定されておらず、個人名の混入や表記ゆれを防げないため、担当欄の記述形式を明記する。
    message_ja: 課題ログ一覧の「担当」を Role code（適用先のメンバー定義の role）で書くことが規定されておらず、個人名の混入や表記ゆれを防げないため、担当欄の記述形式を明記する。
  - id: F002
