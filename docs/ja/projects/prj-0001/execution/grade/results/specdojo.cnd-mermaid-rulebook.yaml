findings:
  - id: F001
    severity: minor
    rule: vp-po-decision-readiness
    line: 1
    anchor: "# Mermaid を用いたC4コンテナ図 作成ルール"
    message: "`recipe: undecided` と `template: undecided` を解消する判断者、判断基準、影響、次アクションがなく、PO が ready 化の条件を確認できないため明示する必要がある。"
  - id: F002
    severity: minor
    rule: vp-pm-plan-feasibility
    line: 24
    anchor: >-
      | C4要素                                   | 意味                               | Mermaid
      での表現例                                                   |
    message: ノード、境界、関係、スタイルを作成する順序と全規則の適用を確認する完了チェックがなく、作業の進捗と完了を一貫して判断できないため簡潔な作成手順を追加する必要がある。
  - id: F003
    severity: minor
    rule: vp-pm-dependency-risk
    line: 48
    anchor: ※ 既存の C4 コンテキスト図（CXD）と同じ色指定を利用します。
    message: 「既存の C4 コンテキスト図（CXD）と同じ色指定」の参照先 ID または正本が示されておらず、色定義変更時の同期対象を特定できないため依存先を明示する必要がある。
  - id: F004
    severity: major
    rule: vp-ba-requirements-completeness
    line: 179
    anchor: "## 5. 命名・表記ルール"
    message: >-
      「命名・表記ルール」はノード ID と表示ラベルだけを扱い、Rulebook 記述標準で必須の成果物ファイル名・ID規則、Frontmatter、本文要件の必須／任意を定義していないため,
      利用者が完成文書の要件を判定できる構成へ補完する必要がある。
  - id: F005
    severity: minor
    rule: vp-ba-stakeholder-clarity
    line: 7
    anchor: C4 コンテナ図は「対象システム」を、**実行/配備単位（コンテナ）** に分割して俯瞰し、利用者（人）・外部システム・データストアとの関係（やり取り）を、概念レベルで合意するために用います。
    message: C4 コンテナ図で「合意する」対象は示されている一方、作成者、技術確認者、合意責任者の役割がなく、誰が図を確認するか判断できないため Role code または役割名を明示する必要がある。
  - id: F006
    severity: minor
    rule: vp-arc-technical-constraints
    line: 5
    anchor: 本ドキュメントは、アーキテクチャ設計のために、**Mermaid の `flowchart` 構文を使って C4 コンテナ図を描く際の標準ルール**です。
    message: Mermaid の対応バージョンまたは基準とする描画環境が示されておらず、＜br＞、日本語 ID、subgraph への style の互換性を一定条件で確認できないため実行環境の前提を明示する必要がある。
  - id: F007
    severity: minor
    rule: vp-dev-implementation-readiness
    line: 139
    anchor: "- 対象システムは **サブグラフ `subgraph ... end`** で囲う。"
    message: System Boundary の例が一貫して汎用ラベルの「対象システム」を使用し、成果物では具体的なシステム名を表示するという要件がないため、実装時に境界の識別情報が欠落しないよう規則を追加する必要がある。
  - id: F008
    severity: major
    rule: vp-dev-testability
    line: 200
    anchor: "## 7. サンプル（最小）"
    message: 完成例を提示している一方、Mermaid の構文解析または描画コマンド、期待結果、エラー時の確認箇所がなく、コード例と成果物を再現可能な方法で検証できないため検証手順を追加する必要がある。
  - id: F009
    severity: minor
    rule: vp-qe-verifiability
    line: 140
    anchor: "- 境界内には、対象システムの **主要コンテナ**（2〜7個程度を目安）と、必要なら主要DBを置く。"
    message: 境界内の「主要コンテナ」「必要なら主要DB」「増やしすぎない」の選定条件が定義されておらず、2〜7個という目安だけでは要素の過不足を一意に判定できないため包含・除外基準を明示する必要がある。
  - id: F010
    severity: major
    rule: vp-qe-omissions-consistency
    line: 1
    anchor: "# Mermaid を用いたC4コンテナ図 作成ルール"
    message: Rulebook 記述標準で必須の「ファイル命名・ID規則」「本文要件」「記述ガイド」に相当する章がなく、成果物ファイルの識別規則、必須構成、必須／任意、完了条件を判断できないため標準章構成に沿って再編する必要がある。
  - id: F011
    severity: minor
    rule: vp-qe-omissions-consistency
    line: 35
    anchor: "## 2.1 標準の色分け（推奨）"
    message: >-
      `## 2.1 標準の色分け（推奨）` は H2 の章として非整数番号になっているため、Rulebook 記述標準の連番規則に合わせて H3 の `### 2.1. 標準の色分け（推奨）` とし、配下の 2.1.1、2.1.2
      も階層と番号末尾を整合させる必要がある。
  - id: F012
