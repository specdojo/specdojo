  - id: F017
    severity: minor
    rule: vp-ops-operability
    line: 200
    anchor: "## 7. サンプル（最小）"
    message: Mermaid コードや標準スタイルを変更した際の再描画手順、対応 sample の同期確認、描画失敗時の問い合わせ先または切り分け方法がなく、継続保守の手順を判断できないため運用方法を追記する必要がある。
