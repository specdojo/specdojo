    rule: vp-qe-kata-conformance
    line: 48
    anchor: "| 関連導線           | ○    | 設計、非機能、運用、テスト、判断記録への入口。Rule 変更から schema・生成物・互換性・移行・回帰対象への影響と担当                |"
    message: >-
      The previous sample structure/type conflict is resolved; the remaining minor gap is that the rulebook does not
      define the family-specific revision, replacement, and retirement responsibilities required by Rulebook Authoring
      Standard. Add requirements identifying who updates the system-design index, affected policy references,
      implementation, tests, and operational documents when a policy or Rule ID is replaced or retired, referring to
      Document Metadata Standard for shared lifecycle mechanics.
