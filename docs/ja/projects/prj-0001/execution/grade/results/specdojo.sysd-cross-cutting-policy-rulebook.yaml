  - id: F002
    severity: minor
    rule: vp-ops-operability
    line: 28
    anchor: "- ルール ID は `scp-<カテゴリ>-<連番>` とし、同じ適用範囲内で一意かつ改訂後も追跡可能にする。"
    message: >-
      Traceability after revision is required, but no maintenance requirement explains how a replaced or retired Rule ID
      points to its successor or how obsolete references are cleared. Require an accountable maintenance owner, an
      explicit successor or retirement rationale, and confirmation that affected references and verification mappings
      have been updated.
