    line: 5
    anchor: >-
      店主代表と家族利用者代表が現金販売を記録し、会計と印字の結果を次の店番へ引き継ぐための販売管理 CLI
      を対象とする。店頭での操作、商品・売上の外部管理、レシート印刷の責任分界を定義し、通信や印字の失敗を会計のやり直しと混同しないようにする。本図は [[specdojo:clis-sample|販売管理 CLI 仕様]]
      と同じ学習用の構成を扱い、通常利用のタブレット画面、在庫調整、つけ管理、仕入れ、キャッシュレス決済は対象外とする。
    message: >-
      概要が `clis-sample` だけを参照し、プロジェクト目的の正本 `specdojo:prj-overview-sample` への参照がないため、タブレット前提・本格会計連携対象外との関係（学習用 CLI
      と本部基盤を置く理由）を上位目的から辿れない。概要に `prj-overview` への wikilink と位置づけを追記すべきである。
