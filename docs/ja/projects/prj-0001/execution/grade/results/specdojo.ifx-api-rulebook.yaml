    message: >-
      OpenAPI 3.0.3/3.1で必須の `info.version` と各Operationの `responses`
      が必須構造・記載方針に含まれず、このrulebookの条件をすべて満たしても無効なOpenAPI文書が成立するため、両項目の必須条件と検証方法を追加する必要がある。
    anchor: ""
