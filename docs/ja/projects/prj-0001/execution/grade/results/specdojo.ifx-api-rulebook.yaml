  - id: F003
    severity: minor
    rule: vp-qe-omissions-consistency
    line: 11
    anchor: >-
      - **対象外**: 非同期のメッセージ連携は `ifx-msg`（[[specdojo:ifx-msg-rulebook|外部メッセージ仕様 作成ルール]]）、ファイル連携は `ifx-file`、外部 CLI の起動は
      `ifx-cmd`（[[specdojo:ifx-cmd-rulebook|外部コマンド連携仕様作成ルール]]）で定める。
    message: >-
      対象外の列挙で ifx-msg・ifx-cmd には rulebook への wikilink を付ける一方、実在する ifx-file だけ
      `[[specdojo:ifx-file-rulebook|外部ファイル連携仕様作成ルール]]` の参照がなく参照の扱いが不揃いなため、ifx-file にも同じ形式で参照を付ける必要がある。
    message_ja: >-
      対象外の列挙で ifx-msg・ifx-cmd には rulebook への wikilink を付ける一方、実在する ifx-file だけ
