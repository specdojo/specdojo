findings:
  - id: F001
    severity: minor
    rule: vp-dev-testability
    line: 95
    anchor: >-
      - 本ファイルは `validate:schema` で構造を検証しない。作成・改訂のたびに、OpenAPI の版に対応した検証器（例: Redocly
      CLI、Spectral）で構造を確かめ、使った検証器と結果を実行記録に残す。
    message: >-
      OpenAPI 検証器を例示するだけで実行コマンドと期待結果（エラー0件など）がなく、x-spec-meta の照合（lint:fm・validate:schema:yaml）や yaml-pages
      再生成など作成・改訂後に流す検証の組み合わせが特定できないため、確認するコマンドと合格条件を明記する必要がある。
    message_ja: >-
      OpenAPI 検証器を例示するだけで実行コマンドと期待結果（エラー0件など）がなく、x-spec-meta の照合（lint:fm・validate:schema:yaml）や yaml-pages
