  - id: F004
    severity: minor
    rule: vp-qe-verifiability
    line: 1
    message: 見出しはエラー定義を「推奨」とする一方、本文は列挙した応答を「少なくとも定義します」と必須表現にしておりpass/failを一意に判定できないため、必須・条件付き必須・推奨のいずれかへ統一する必要がある。
    anchor: ""
