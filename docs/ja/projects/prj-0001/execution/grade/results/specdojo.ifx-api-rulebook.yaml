  - id: F002
    severity: minor
    rule: vp-qe-verifiability
    line: 58
    anchor: >-
      エラーの応答は、共通の形式（例: `components/schemas/ErrorResponse`）を各操作から参照する。次のコードは、操作に該当しない場合を除き必須とし、省略する場合は省略の理由を
      `info.description` に書く。
    message: >-
      エラーコードを「操作に該当しない場合を除き必須」とするが、該当しないと判断する条件（認証なしなら 401・403 不要、登録系でなければ 409 不要など）が示されず省略の可否を pass/fail
      で判定できないため、コードごとの省略可能条件を明記する必要がある。
    message_ja: >-
      エラーコードを「操作に該当しない場合を除き必須」とするが、該当しないと判断する条件（認証なしなら 401・403 不要、登録系でなければ 409 不要など）が示されず省略の可否を pass/fail
