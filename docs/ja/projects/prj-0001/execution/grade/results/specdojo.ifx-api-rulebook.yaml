    line: 1
    message: 必須構造から `info.version` およびOperationごとの `responses` が漏れており、宣言したOpenAPIバージョンの必須事項とrulebookの受入条件が整合しないため追加する必要がある。
    anchor: ""
  - id: F007
    severity: major
    rule: vp-qe-kata-conformance
    line: 1
    message: >-
      `target_format: yaml` の必須キー定義から `info.version` とOperationの `responses` が欠落し、参照 sample も `info.version`
      を持たない無効なOpenAPI完成例になっているため、rulebookを正として必須条件を追加しsampleも同時に整合させる必要がある。
