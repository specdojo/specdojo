findings:
  - id: F001
    severity: major
    rule: vp-arc-cross-document-consistency
    line: 3
    anchor: >-
      Claude Code、Codex、OpenCode、GitHub Copilot CLIをdevcontainer内で更新し、バージョンと永続化範囲を検証する手順である。`opr-index`
      の個別手順として、更新作業と証跡を具体化する。
    message: >-
      `opr-index` の個別手順と宣言する一方、カタログの `depends_on` にある `opr-index` を
      `based_on`・関連文書導線に記載せず正本文書も存在しないため、依存関係を解消して共通規約へ到達できる導線を示す必要がある。
  - id: F002
    severity: major
    rule: vp-arc-cross-document-consistency
    line: 66
    anchor: CodexとOpenCodeは`.devcontainer/post-create.sh`のnpm global installに合わせてnpmで更新する。この更新は実行中コンテナだけに反映される。
    message: >-
      現在の `.devcontainer/post-create.sh` は Codex を公式インストーラーで導入し npm は失敗時のfallbackに限るため、npm global
      installに合わせるという説明と更新方法を現行構成へ整合させる必要がある。
  - id: F003
    severity: major
    rule: vp-qe-done-criteria
    line: 49
    anchor: 2. 対象CLIだけを更新する。
    message: 公式インストーラー由来のCodexが `~/.local/bin` で優先される現行構成では npm global installが実行中の `codex` を更新しないため、DC-002を満たす更新手順になっていない。
  - id: F004
    severity: major
    rule: vp-qe-done-criteria
    line: 57
    anchor: 3. 同じdevcontainer内でバージョンを確認する。
    message: 更新前version、期待version、4 CLIすべての起動成功、再作成後の一致条件が定義されておらず、DC-003が要求する完了条件を判定できない。
  - id: F005
    severity: major
    rule: vp-qe-done-criteria
    line: 105
    anchor: "| 証跡     | 保存先                         | 最低限残す内容                      |"
    message: 証跡の具体的なURL・チケットID・保存期間・参照権限・コマンド出力の保存方法がなく, DC-003が要求する追跡可能な証跡要件を確認できない。
  - id: F006
    severity: major
    rule: vp-qe-verifiability
    line: 57
    anchor: 3. 同じdevcontainer内でバージョンを確認する。
    message: 更新後versionを表示するだけで更新前値・期待値・全CLIの起動確認・再作成前後の比較条件がないため、更新成功と永続化をpass/fail判定できない。
  - id: F007
    severity: minor
    rule: vp-qe-verifiability
    line: 105
    anchor: "| 証跡     | 保存先                         | 最低限残す内容                      |"
