  - id: F008
    severity: major
    rule: vp-qe-omissions-consistency
    line: 15
    anchor: "| 必要権限 | devcontainer内の`sudo`、永続更新時はHost Mac上のdevcontainer操作権限 |"
    message: 実施可能時間帯、実施者、使用手段、連絡先がなく、誰がいつ更新を開始できるかを判断できない。
  - id: F009
    severity: major
    rule: vp-qe-omissions-consistency
    line: 25
    anchor: >-
      更新後に起動できない場合は、新規agent実行を停止し、更新方法と導入元を確認する。一時更新ではコンテナ再作成、永続更新ではlockfile差分の取り消しまたは既知バージョンへの固定を復旧候補とし、実行中の会話やtaskを更新途中から再開しない。
    message: 更新失敗時の優先度、エスカレーション先、ロールバック開始条件、判断者が定義されておらず、障害対応と復旧判断を再現できない。
  - id: F010
    severity: major
    rule: vp-qe-omissions-consistency
    line: 33
    anchor: 認証、設定、会話履歴はnamed volumeに保持する。更新前にvolumeを削除しないことを確認し、復旧時もvolumeの削除を通常手段にしない。
    message: named volumeを削除しないという注意だけで、更新前の確認方法、リストア手順、演習条件、完了条件、証跡が定義されていない。
