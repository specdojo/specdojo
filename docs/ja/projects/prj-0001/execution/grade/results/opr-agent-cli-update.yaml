    message: >-
      切り分け先を「provider別システム設計の公式仕様参照」とだけ記し、関連文書も `sysd-claude-agent-settings`
      等という省略表記であるため、各CLIの具体的な参照先へ直接到達できるリンクを示す必要がある。
