    line: 111
    anchor: "- 一図で順序を追えない場合は連続する引き渡し単位で分割し、前図の終了側と後図の開始側へ同じ引き渡し ID を記載します。"
    message: >-
      `specdojo:cdfd-mermaid-rulebook` は図を分割するノード数の目安を包含元 rulebook
      が定めるとしているが、本書は「一図で順序を追えない場合」という主観的条件しか示していないため、ノード数の目安または第三者が同じ判断を再現できる分割条件を定義してください。
  - id: F002
    severity: minor
    rule: vp-qe-verifiability
    line: 54
    anchor: "- 作成途中の `status` は `draft` とし、完成判定と所定の承認を満たした後の昇格は定められた承認者が行います。"
    message: "`ready` 昇格条件が「所定の承認」「定められた承認者」に留まり、承認者の参照元と承認証跡を確認する場所が定義されていないため, 責任分担文書の参照方法と登録簿・レビュー結果などの確認可能な証跡を指定してください。"
  - id: F003
    severity: major
    rule: vp-qe-omissions-consistency
    line: 10
    anchor: "- 「プロセス領域」を順序とグループ別責務の正本、「データストア」を引き渡しで使う上位一覧の部分集合、「引き渡し」を情報・条件・戻す条件の正本、図を開始から終了までの横断順序の正本として併用します。"
    message: 「プロセス領域」と図の双方を横断順序の正本としており、不一致時にどちらを修正すべきか決定できないため、正本を一方に限定し、他方を正本に一致させる対応表現として定義してください。
  - id: F004
    severity: minor
