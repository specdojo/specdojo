    anchor: SpecDojo CLI と Antigravity CLI（`agy`）を組み合わせ、executor / reporter pipeline を非対話実行するための provider 固有設定を定義する。
    message: Antigravity を第3の frontier 経路として採用する業務課題・期待効果と、その根拠である PJR-2T2S への参照がないため, provider 固有設計の必要性を追跡できない。
  - id: F002
    severity: major
    rule: vp-po-decision-readiness
    line: 9
