    rule: vp-po-publication-accountability
    line: 106
    anchor: "- 担当、責務、連絡経路、エスカレーション先を明記する。"
    message: 担当・連絡先とユーザ向け周知を同じ成果物に収める一方、内部限定情報と公開可能な通知内容の分離、個人情報の扱い、公開承認者を定義しておらず、公開時に機微情報を混在させるおそれがある。
  - id: F002
    severity: minor
    rule: vp-pm-dependency-risk
    line: 21
    anchor: "`cop-index` と他ドキュメントの関係を示す。"
