  - id: F003
    severity: minor
    rule: vp-qe-omissions-consistency
    line: 55
    anchor: >-
      [[specdojo:itc-index-sample|内部結合テストカタログ: 概要]] の観点の型のうち、「結合 I/F
      の契約」は各観点の応答（確定結果・エラー種別）の期待値で担保し、独立した観点にしない。「状態遷移の整合性」は未確定から確定への遷移を、「未確定の購入の保留」の観点で扱う。「依存障害時の挙動」は DB
      の更新拒否を「確定できない会計のロールバック」で扱い、DB 停止・接続断は採用しない（理由: 検証用コンテナ DB の停止は CI の他ケースを巻き込み再現性を保てない、代替: ST
      の障害・回復）。「セキュリティ境界」は該当なし（単一店舗・端末1台）。
    message: 「状態遷移の整合性」を「未確定から確定への遷移」として「未確定の購入の保留」で扱うとしているが、同観点のケースは保留の維持だけで、補完後に確定へ進む遷移を検証するケースがない。遷移のケースを追加するか、扱う範囲を「保留の維持」に改める必要がある。
    message_ja: 「状態遷移の整合性」を「未確定から確定への遷移」として「未確定の購入の保留」で扱うとしているが、同観点のケースは保留の維持だけで、補完後に確定へ進む遷移を検証するケースがない。遷移のケースを追加するか、扱う範囲を「保留の維持」に改める必要がある。
