    anchor: >-
      [[specdojo:itc-index-sample|内部結合テストカタログ: 概要]] の観点の型のうち、「結合 I/F
      の契約」は各観点の応答（確定結果・エラー種別）の期待値で担保し、独立した観点にしない。「状態遷移の整合性」は未確定のまま確定へ進まない保留の維持だけを「未確定の購入の保留」の観点で扱い、補完後の確定への遷移は扱わない。「依存障害時の挙動」は
      DB の更新拒否を「確定できない会計のロールバック」で扱い、未保存を成功と応答しないことを `it-sales-checkout-transaction-boundary-020` で確かめる。DB
      停止・接続断は採用しない（理由: 検証用コンテナ DB の停止は CI の他ケースを巻き込み再現性を保てない、代替: ST の障害・回復）。「セキュリティ境界」は該当なし（単一店舗・端末1台）。
    message: >-
      itc-index-sample は「状態遷移の整合性」を `itc-sales-checkout`
      で「未確定から確定への遷移」と割り当て、該当しない型には理由を1行残すよう求めているが、本書は「補完後の確定への遷移は扱わない」とするだけで理由も代わりに担うケースもない。補完後の確定は通常の会計確定と同じため
      `it-sales-checkout-persistence-integrity-010` で担う、などの理由と代わりのケースを書き添える必要がある。
