  - id: F005
    severity: minor
    rule: vp-ux-language-consistency
    line: 34
    anchor: "- 対象範囲、省略範囲と理由、採用 Role の参照、兼務・Agent 支援の扱いを必須とし、責任の確認範囲を判断できるようにします。記号の説明は上位標準への参照とプロジェクト固有の補足で足ります。"
    message: >-
      The rulebook mixes "Agent"/"agent" and "Member"/"member" for the same concepts and uses the abbreviation "PJR"
      (line 73) without expansion or reference; unify the casing per the upper standard and expand or link PJR.
