  - id: F003
    severity: major
    rule: vp-qe-kata-conformance
    line: 64
    anchor: >-
      - Schedule の `owner` の優先順と例外は、[[specdojo:people-and-organization-definition-standard|人と組織の定義標準]] の「Schedule
      への担当展開」に従います。照合時は WBS の明示 `owner` を先に確認し、作成作業の主担当と、承認・レビュー・外部待ちの別 Task / Milestone を区別します。後者では対象に応じた `A` / `C`
      を許容し、全タスクを `R` へ一律に合わせません。
    message: >-
      The rulebook now defers Schedule owner precedence to the upper standard and allows `A`/`C` owners for approval,
      review and wait tasks, but the recipe (steps, §4.4, good-example table) and the template TODO still instruct
      aligning every Schedule owner with the primary `R`; align the recipe and template with the rulebook, or state in
      the rulebook that it overrides them.
    message_ja: >-
      The rulebook now defers Schedule owner precedence to the upper standard and allows `A`/`C` owners for approval,
      review and wait tasks, but the recipe (steps, §4.4, good-example table) and the template TODO still instruct
      aligning every Schedule owner with the primary `R`; align the recipe and template with the rulebook, or state in
      the rulebook that it overrides them.
  - id: F004
    severity: minor
    rule: vp-ux-readability
    line: 63
    anchor: >-
      - 判断基準: `R` が一つならその Role を主担当とします。複数なら、行に付随する注記で対象作業ごとに一つの主担当 Role code と担当範囲を明記します。タスクの action に最も近い `R`
      を選び、一意に決められない作業は責任境界を確認してタスクを分割します。`A/R` も `R` として扱います。
    message: >-
      The criterion bullet combines five separate rules (single R, multi-R annotation, closest-to-action selection, task
      split, A/R treatment) and uses the undefined term "action"; split it into separate items and identify "action" as
      the Schedule task field.
    message_ja: >-
      The criterion bullet combines five separate rules (single R, multi-R annotation, closest-to-action selection, task
