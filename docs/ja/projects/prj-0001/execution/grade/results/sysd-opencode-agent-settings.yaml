findings:
  - id: F001
    severity: major
    rule: vp-arc-cross-document-consistency
    line: 21
    anchor: "- **limit 情報は provider 非依存に共通化しない**: OpenCode 自身の session limit を前提にせず、失敗要因は Ollama のロード待ち、メモリ不足、接続タイムアウトを主として扱う。"
    message: >-
      `ollama-local` だけに限定すると宣言しているが、実際の `opencode.json` には `enabled_providers` がなく、`based_on` の `tsd-ollama-opencode`
      も既存 provider との併存を定義しているため、採用方針と実設定を一致させる必要がある。
  - id: F002
    severity: major
    rule: vp-arc-cross-document-consistency
    line: 31
    anchor: → providers.opencode の command template から解決した opencode run --agent <name> を起動
    message: review agent が result 以外を編集禁止との記述は、実際の review agent 定義および本書7.3節の「成果物・resultとも編集禁止」と矛盾するため、権限境界を統一する必要がある。
  - id: F003
    severity: major
    rule: vp-arc-cross-document-consistency
    line: 197
    anchor: "provider: opencode"
    message: >-
      例示された `opencode-executor` 等の nickname に対応する agent ファイルが存在せず、実際の `pm-members.yaml` は `qwen-*`・`gemma-*`
      を使用しているため、この設定では記載された command template による起動が成立しない。
  - id: F004
    severity: major
    rule: vp-arc-cross-document-consistency
    line: 227
    anchor: "opencode:"
    message: >-
      全memberの優先度・capability・既定モデルに関する説明が実際の `pm-members.yaml` と各agent定義に一致せず、Qwen/Gemmaの選択結果を誤認させるため,
      実設定に合わせて書き直す必要がある。
  - id: F005
    severity: major
    rule: vp-arc-cross-document-consistency
    line: 323
    anchor: ""
    message: >-
      現状欄のmember名が実在しない `opencode-*-agent` となり、`exec-defaults.yaml` も既にcommand
      templateとOllama固有エラーを定義済みであるため、現状差分表を現在の生成物に同期する必要がある。
  - id: F006
    severity: minor
    rule: vp-arc-conciseness
    line: 235
    anchor: "rate_limit_policy:"
    message: 8.3節は正本の設定ブロックを再掲した後、ローカル資源・limit・wait/retryに関する1章の方針を複数段落で繰り返しているため、設定値は正本参照へ寄せ、固有の判断理由と例外だけに集約すると必要十分になる。
  - id: F007
    severity: major
    rule: vp-qe-done-criteria
    line: 17
    anchor: >-
      - **agent 定義は `.opencode/agents/*.md`**: モデル、primary / subagent、permission、最小限の実行契約を定義する。タスク固有の指示は edit / review
      plan を正本とする。
    message: 設計方針に対応する業務要件または上位要求への参照と承認条件がないため、DC-001の整合性およびDC-002の承認可否を確認できない。
  - id: F008
    severity: major
    rule: vp-qe-done-criteria
    line: 318
    anchor: "- [OpenCode Config](https://opencode.ai/docs/config/)"
    message: 導入状況が実設定と食い違い、確認手順にも期待結果・合否条件・テスト設計参照がないため、DC-004の検証用途およびDC-005の実装基礎として利用できない。
  - id: F009
    severity: major
    rule: vp-qe-verifiability
    line: 326
    anchor: ""
    message: >-
      agent認識・単一タスク・並列実行を列挙するだけで、実行コマンド、期待される出力や状態、失敗条件、64kコンテキスト・同時実行上限・permissionを確認する方法が定義されていないため、受入判定可能な検証項目を追加する必要がある。
  - id: F010
    severity: major
