    line: 15
    anchor: "- **非対話実行は `opencode run`**: TUI を起動せず、SpecDojo が生成した plan を標準入力で渡す。"
    message: 文書の対象技術は示されているが、実装・検証・運用判断に利用する読者、対象外、運用文書へ委譲する範囲が明示されておらず、rulebookの目的・適用範囲要件を満たしていない。
  - id: F011
