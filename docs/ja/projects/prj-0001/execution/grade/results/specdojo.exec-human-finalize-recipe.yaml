    message: "`judgement: 承認` と `judgement: 差し戻し` の双方が同じ complete 操作へ到達して判定結果とタスク状態が対応しないため、各判定に対応する状態イベントと確認可能な終端状態を定義する必要がある。"
  - id: F002
    severity: major
    rule: vp-qe-omissions-consistency
    line: 34
    anchor: >-
      8. `specdojo exec complete --project <project-id> --task <task-id> --by <actor> --msg "<message>"` で完了を記録し、再度
      build して次の Ready を更新します。
    message: 差し戻し時に complete せずタスクを停止し、修正対象を再対応へ戻した後に再確認する手順がないため、未充足のまま後続タスクを Ready にしない状態遷移を追記する必要がある。
  - id: F003
    severity: major
    rule: vp-qe-omissions-consistency
    line: 34
    anchor: >-
      8. `specdojo exec complete --project <project-id> --task <task-id> --by <actor> --msg "<message>"` で完了を記録し、再度
      build して次の Ready を更新します。
    message: >-
      完了 event 後に必要な `specdojo exec refresh —project ＜project-id＞` が手順から欠落し「再度 build」とだけ記載されているため、Ready
      更新の必須操作を完全なコマンドで明記する必要がある。
