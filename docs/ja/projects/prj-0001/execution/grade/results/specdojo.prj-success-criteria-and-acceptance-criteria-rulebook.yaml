  - id: F001
    severity: minor
    rule: vp-po-publication-accountability
    line: 49
    anchor: "- **判定手順と証跡（必須）**: 条件ごとの確認順・判定時期・証跡の保存先・確認者・承認者を示し、合格基準との照合から受入可否の判断まで辿れること。否決時は是正内容、再確認する条件 ID、再判定時期を定めます。"
    message: 「判定手順と証跡」は証跡の保存先を求めていますが、つけ残高画面のような顧客情報を含む証跡や確認者の個人名を公開文書・公開リポジトリに残さない扱い（役割名での記載、非公開保存先への参照など）が定められていないため、証跡の公開範囲と禁止事項を追記してください。
    message_ja: 「判定手順と証跡」は証跡の保存先を求めていますが、つけ残高画面のような顧客情報を含む証跡や確認者の個人名を公開文書・公開リポジトリに残さない扱い（役割名での記載、非公開保存先への参照など）が定められていないため、証跡の公開範囲と禁止事項を追記してください。
