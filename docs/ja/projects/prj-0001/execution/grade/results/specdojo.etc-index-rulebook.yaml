  - id: F004
    severity: minor
    rule: vp-qe-omissions-consistency
    line: 49
    anchor: "- 本ルールの対象ドキュメントの `id` は `etc-index` 固定。対象別は `etc-<term>` とします。"
    message: >-
      `id` を `etc-index` 固定としているが、生成後の文書 id はプロジェクト修飾付き（`＜project-id＞:etc-index`）で、dct では `etc-index` が `local_id`
      に当たるため、id と local_id のどちらかを区別して書くべきである（4.1節の `id: etc-index` も同様）。
