  - id: F001
    severity: minor
    rule: vp-po-purpose-alignment
    line: 5
    anchor: 本書は、使いやすさと誤操作防止を定義するための最小サンプルである。
    message: >-
      The document states it is for a candy store sales management system, but fails to clarify the project purpose,
      expected outcomes, or why specific usability targets are needed in alignment with higher-level goals.
    message_ja: ドキュメントには菓子店の販売管理システム用であると記載されていますが、プロジェクトの目的、期待される成果、または上位目標に沿って特定のユーザビリティ目標が必要である理由が明確にされていません。
  - id: F002
