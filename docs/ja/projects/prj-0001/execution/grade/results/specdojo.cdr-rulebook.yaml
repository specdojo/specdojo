    anchor: >-
      `.github/` は文書サイトと `lint:fm` の対象外のため、Frontmatter の検査は成果物カタログの登録と grade で行う。`status` を `ready`
      にするのは、テストと検証の章のコマンドが実行でき、使う環境のラッパーで正本の読み込みを確かめた後とする。
    message: status の値は定義されていますが、規約を ready にする際に確認する条件がありません。上位設計・設定との一致、検証コマンドの実行可能性、ラッパーの追従、未決事項の処置を承認前の確認条件として定めてください。
    message_ja: status の値は定義されていますが、規約を ready にする際に確認する条件がありません。上位設計・設定との一致、検証コマンドの実行可能性、ラッパーの追従、未決事項の処置を承認前の確認条件として定めてください。
