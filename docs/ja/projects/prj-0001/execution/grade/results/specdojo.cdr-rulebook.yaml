    message: >-
      `.github/instructions/` は `lint:fm`（`docs/**` 限定）の対象外のため、「整形・lint はリポジトリの検証で扱う」だけでは規約ファイルの
      Frontmatter（`applyTo`・`specdojo.id`・`specdojo.rulebook`）の不備を検出する手段が分かりません。成果物カタログの検証（`validate:catalog` など）や grade
      など、Frontmatter を確かめる検証とその期待結果を明記してください。
