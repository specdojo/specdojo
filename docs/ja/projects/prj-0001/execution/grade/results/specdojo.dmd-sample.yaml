    line: 5
    anchor: 本書は受注データの対象別移行設計（`dmd-<term>`）として、抽出・変換・投入・検証方法を定義する最小サンプルである。
    message: >-
      移行対象が数百万件規模の受注データと S3 で、共通サンプル文脈「駄菓子屋きぬや
      販売管理システム構築」（ノートと記憶による運用からの記録化、単一店舗）と結び付いていない。きぬやの既存記録（販売ノート、つけ帳、在庫メモなど）を移す題材に置き換え、プロジェクト目的との対応を概要に示す必要がある。
