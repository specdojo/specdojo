  - id: F005
    severity: minor
    rule: vp-ux-language-consistency
    line: 43
    anchor: 矢印は主たる利用・依頼・参照の向きで、返される結果も同じ関係に含む。来店客への商品の引き渡しと現金授受は店番担当が行い、来店客は画面を直接操作しないため Person に含めない。
    message: >-
