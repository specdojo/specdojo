      | 販売画面（タブレットのブラウザ） | 明細・預かり金の入力を受け、会計と印字の結果を表示する |
      ブラウザアプリ。表示中の明細だけを販売成立の根拠にしない。構築した画面資材をタブレットから利用する                         |
    message: >-
      販売画面の「構築した画面資材をタブレットから利用する」は配置の前提なのに `_ASSUMPTION_` が付いておらず、資材の配信元と、その経路を図・関係表に描かない理由もないため、配置の仮定として明示し、未確定なら「メモ /
      将来課題」の配備の論点へ含めるべきである。
