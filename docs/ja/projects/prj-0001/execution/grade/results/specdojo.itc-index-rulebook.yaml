  - id: F002
    severity: minor
    rule: vp-qe-verifiability
    line: 222
    anchor: "`itc-<term>` のケース表は、次の共通カラム順とする。「推奨（運用必須）」の列も運用時には揃える。"
    message: >-
      共通カラムの区分「推奨（運用必須）」は、省略可否がいつの時点（ドラフト作成時か、ready
      化時か、運用開始時か）で必須に切り替わるのかが定義されていないため、どの段階で列の欠落を不合格とするかが判定できない。区分の切り替え条件を明記すべきである。
