    anchor: "- 検討候補は fixture生成・匿名化・seed戦略、環境起動時間短縮（コンテナ最適化・キャッシュ）、flaky対策（リトライ方針・タイムアウト基準）、証跡リンク形式、ケースID重複・必須列の検査などとする。"
    message: ケースIDの重複や必須列の欠落の検査は将来課題として挙げられているだけで、当面の確認手段（レビュー時のチェック項目や検証コマンド）が示されておらず、作成後に何で合否を確認するかが読み取れないため、当面の扱いを明記すべきである。
