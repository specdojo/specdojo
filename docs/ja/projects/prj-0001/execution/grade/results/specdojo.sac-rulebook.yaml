    anchor: SAC は非機能要件（NFR）や業務受入条件（BAC）を根拠に、システム全体の合格基準を定めます。下位のテスト設計（テスト条件一覧、システムテスト仕様など）は SAC の受入条件を分解して参照するため、ID は安定させます。
    message: 位置づけの章で、下位のテスト設計が参照すること以外に、SAC を作成・確認・受入判定する関係者（Role code）と利用場面が示されていないため、想定する読み手と合意相手を明記すべきである。
