findings:
  - id: F001
    severity: major
    rule: vp-pm-plan-feasibility
    line: 75
    anchor: >-
      SC-04 の比較期間を失わないよう、`PM` は `kinuya-schedule` に「人間の `PO` による対象商品・除外条件の確定 → `BA` による運用開始前1か月の日次欠品記録の採取 → `QE`
      による対象・期間・欠測の照合 → 店頭試用開始」の依存を置く。採取結果は `kinuya-trial-log` の SC-04・対象商品・営業日で識別する。`BA` が採取を担う参加者と期間を準備着手時に確保し、`PM`
      は比較期間の欠落リスクと軽減策をリスク登録簿へ記録する。記録をそろえられない場合は課題化し、人間の `PO`
      が試用開始の延期または測定条件の変更要求を判断する。試用終了時には採取済みの基準値と運用後の観測・比較だけを後続へ渡す。
    message: >-
      The preparation chain schedules only the SC-04 baseline, while SC-05 also requires a pre-operation inventory-waste
      baseline. Add work to collect or validate the preceding month's waste quantities and amounts and their annualized
      baseline, with a responsible Role, effort estimate, completion evidence, and a dependency before operation starts;
      otherwise the later SC-05 comparison may become impossible.
    message_ja: >-
      The preparation chain schedules only the SC-04 baseline, while SC-05 also requires a pre-operation inventory-waste
      baseline. Add work to collect or validate the preceding month's waste quantities and amounts and their annualized
      baseline, with a responsible Role, effort estimate, completion evidence, and a dependency before operation starts;
      otherwise the later SC-05 comparison may become impossible.
