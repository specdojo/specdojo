    message: >-
      The trial-start gate checks SC-04 baseline availability but does not require the pre-operation baseline needed by
      SC-05. Identify SC-05 baseline availability as a preparation dependency and register the risk of losing its
      comparison period, with an assigned Role and mitigation before trial starts; defer only the subsequent observation
      and comparison.
