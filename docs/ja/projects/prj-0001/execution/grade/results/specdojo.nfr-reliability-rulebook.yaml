  - id: F001
    severity: minor
    rule: vp-po-purpose-alignment
    line: 5
    anchor: 本ドキュメントは、非機能要件のうち信頼性（障害抑止・誤動作防止・継続稼働）を定義する `nfr-reliability` の作成ルールを定義する。
    message: >-
      冒頭の「継続稼働」とサンプルの「復旧性」が
      `nfr-availability`（停止許容・RTO/RPO）と重なるため、「位置づけ」に可用性との責務の境界（信頼性は障害の発生抑止・誤動作防止・自動回復、停止許容・復旧目標は可用性）を明記すること。
    message_ja: >-
      冒頭の「継続稼働」とサンプルの「復旧性」が
