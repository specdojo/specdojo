findings:
  - id: F001
    severity: minor
    rule: vp-ba-requirements-completeness
    line: 64
    anchor: 並び順は販売数の多い順とし、同数の場合は商品名の五十音順とする。
    message: 販売数が「不明」の商品を、数値の販売数を持つ商品の前後どちらに並べるかを定義してください。「不完全」を付けた数値の扱いも明示すると、例外時を含めて利用者が同じ順序で明細を確認できます。
    message_ja: 販売数が「不明」の商品を、数値の販売数を持つ商品の前後どちらに並べるかを定義してください。「不完全」を付けた数値の扱いも明示すると、例外時を含めて利用者が同じ順序で明細を確認できます。
  - id: F002
    severity: major
    rule: vp-dev-implementation-readiness
    line: 70
    anchor: >-
      - 締めの版: 各日について、出力時点で PO
      が確定した最新の確認版を使う。販売件数の照合は、その版が参照する日次販売集計の販売件数と行う。日ごとに使った版を「参照した締めの版」に載せ、同じ版から再出力すれば同じ値になるようにする。
    message: 締めの確認版を固定して再現する際、商品別数量をどの基準時点・訂正状態の販売明細から集計するかを定義してください。現状は販売件数だけを固定した日次販売集計と照合し、数量は販売記録から合計するため、件数を変えない数量訂正があると同じ確認版でも販売数が変わり、「同じ版から再出力すれば同じ値になる」という条件を満たせません。
    message_ja: 締めの確認版を固定して再現する際、商品別数量をどの基準時点・訂正状態の販売明細から集計するかを定義してください。現状は販売件数だけを固定した日次販売集計と照合し、数量は販売記録から合計するため、件数を変えない数量訂正があると同じ確認版でも販売数が変わり、「同じ版から再出力すれば同じ値になる」という条件を満たせません。
  - id: F003
    severity: minor
    rule: vp-qe-verifiability
    line: 64
    anchor: 並び順は販売数の多い順とし、同数の場合は商品名の五十音順とする。
    message: 数値の販売数、「不完全」を付けた販売数、「不明」が混在する明細について、期待する並び順を判定できる条件を追加してください。現在の「販売数の多い順」だけでは「不明」の位置が決まらず、実装ごとに異なる順序でも合否を判定できません。
    message_ja: 数値の販売数、「不完全」を付けた販売数、「不明」が混在する明細について、期待する並び順を判定できる条件を追加してください。現在の「販売数の多い順」だけでは「不明」の位置が決まらず、実装ごとに異なる順序でも合否を判定できません。
  - id: F004
    severity: major
    rule: vp-qe-omissions-consistency
    line: 73
    anchor: "- 前週比: 前週の報告に載っていない商品は前週の販売数を 0 として計算する。初回は「前週なし」とする。前週の報告がない・読めない場合と、今週か前週の販売数が「不完全」「不明」の場合は「比較不可」とし、差を出さない。"
    message: 前週に販売件数の不一致がある場合は、前週の明細にない商品を販売数0とみなさず、「比較不可」とする条件を定義してください。例えば前週の商品Bの販売記録が丸ごと欠落し、欠品記録もなければBの明細は作られず、「不完全」「不明」の印も付きません。その翌週にBが売れると、現行規則では欠落した前週販売を0として増減を表示してしまいます。
    message_ja: 前週に販売件数の不一致がある場合は、前週の明細にない商品を販売数0とみなさず、「比較不可」とする条件を定義してください。例えば前週の商品Bの販売記録が丸ごと欠落し、欠品記録もなければBの明細は作られず、「不完全」「不明」の印も付きません。その翌週にBが売れると、現行規則では欠落した前週販売を0として増減を表示してしまいます。
