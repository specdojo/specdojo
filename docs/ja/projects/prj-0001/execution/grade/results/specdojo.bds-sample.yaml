    anchor: >-
      | 本書の変更（変更要求）         |
      表示項目・算出ルール・契機を変えると、定期処理、過去の週の再出力、再出力した週の翌週の前週比、仕入れノートに綴じた報告との比較に影響する                                                                         
      | BA が差分を整理し、DEV が定期処理と再出力する週の範囲を、QE が再検証の範囲を示す。PO
      が承認してから定期処理へ反映し、反映後に直近の週を再出力する。過去の週を再出力するときは「出力の時期と契機」に従い翌週の報告も再出力し、QE
      が翌週の前週比が再出力した週の販売数と一致することを確かめる                                                                                                
      | 変更ごとに登録する               |
    message: 変更影響と再検証の範囲に、連動再出力した翌週の販売数が変わった場合の2週先以降の前週比を含めてください。本文70行に従って翌週の最新の確認版を使うと翌週の販売数も変わり得るため、翌週までの追従作業だけでは、その販売数を参照する作成済み報告に古い前週比が残ります。
    message_ja: 変更影響と再検証の範囲に、連動再出力した翌週の販売数が変わった場合の2週先以降の前週比を含めてください。本文70行に従って翌週の最新の確認版を使うと翌週の販売数も変わり得るため、翌週までの追従作業だけでは、その販売数を参照する作成済み報告に古い前週比が残ります。
