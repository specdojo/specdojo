      - 再出力:
      同じ週を再出力した場合は、その週の報告を作り直し、別の報告を増やさない。作り直す前の報告は残さない。翌週の報告が作成済みなら、その前週比の基準が変わるため、翌週の報告も続けて再出力する。翌週の販売数は変わらないため、2
      週先からは作り直さない。
    message: 「翌週の販売数は変わらないため、2週先からは作り直さない」という条件を本文70行と整合させてください。例えば翌週の販売数が新しい確認版で10から12に変わり、2週先の販売数が20なら、2週先の前週比は+10から+8へ更新が必要です。翌週の集計入力を保持するか、販売数の変更が後続報告へ影響する間は再出力を続ける規則が必要です。
