findings:
  - id: F001
    severity: major
    rule: vp-dev-implementation-readiness
    line: 70
    anchor: >-
      - 締めの版: 各日について、出力時点で PO が確定した最新の確認版を使う。その日の販売数は、その版が参照する日次販売集計の販売集合（含めた売上 ID
      の集合）の明細を、集計の基準時点の状態で合計する。基準時点の後に承認した訂正と、販売集合にない販売記録は、PO
      が新しい確認版を確定するまで販売数に含めない。日ごとに使った版を「参照した締めの版」に載せ、同じ版から再出力すれば同じ値になるようにする。確定した版がない日は出力時点の販売記録で数えるため、再出力で値が変わりうる。
    message: 翌週を連動再出力するとき、前回使用した締め版と販売数を保持して前週比だけを更新するのか、出力時点の最新の確認版で販売数も再集計するのかを明示してください。本文26行は翌週の販売数が変わらないことを前提にしていますが、本行の最新の確認版を使う規則では新しい確認版や締め未確定日の記録によって販売数が変わるため、実装する入力選択と更新範囲が一意に定まりません。
    message_ja: 翌週を連動再出力するとき、前回使用した締め版と販売数を保持して前週比だけを更新するのか、出力時点の最新の確認版で販売数も再集計するのかを明示してください。本文26行は翌週の販売数が変わらないことを前提にしていますが、本行の最新の確認版を使う規則では新しい確認版や締め未確定日の記録によって販売数が変わるため、実装する入力選択と更新範囲が一意に定まりません。
