    rule: vp-dev-testability
    line: 143
    anchor: "- 作成先リポジトリに設定された Markdown・Frontmatter・Mermaid の静的検査を実施します。構文検査の合格だけで、キーや多重度の業務上の妥当性を確認済みとしません。"
    message: >-
      The required Markdown, Frontmatter, and Mermaid checks have no executable commands or linked execution procedure;
      provide a validation reference or illustrative commands such as npm run lint:md, npm run lint:fm, and npm run
      lint:mermaid, while allowing destination repositories to define their equivalents.
