  - id: F002
    severity: minor
    rule: vp-qe-kata-conformance
    line: 46
    anchor: >-
      - `based_on` には、実際に読み直接の根拠とした作成済み辞書を記録します。カタログがある場合は `depends_on`
      の推移閉包内に限定し、未作成辞書や単なる参照候補を追加しません。直接の根拠がなければ省略できます。
    message: >-
      This rule requires existing dictionaries used as direct evidence to be recorded in based_on, but the declared
      ccd-sample explicitly reports checking specdojo:bdd-sample and omits based_on; align the rule and its declared
      example so authors can distinguish evidence metadata from body references consistently.
