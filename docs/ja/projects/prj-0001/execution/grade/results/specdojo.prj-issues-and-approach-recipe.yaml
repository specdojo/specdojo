findings:
  - id: F001
    severity: minor
    rule: vp-po-decision-readiness
    line: 134
    anchor: "- 「ToDo」「目的」「責任ロール」の表にする。"
    message: 「次の検討事項」の表が ToDo・目的・責任ロールだけで判断時期と未解消時の影響を記録できないため、PO が承認・保留・差し戻しを判断できるよう「判断時期」と「影響」の項目を追加する。
  - id: F002
    severity: minor
    rule: vp-po-publication-accountability
    line: 196
    anchor: "- 曖昧表現や設計詳細を書きすぎていない。"
    message: 仕上げチェックに公開対象、個人情報・非公開情報の有無、人間の PO による公開可否判断の確認がないため、公開適性と説明責任を確認する項目を追加する。
  - id: F003
    severity: minor
    rule: vp-pm-plan-feasibility
    line: 134
    anchor: "- 「ToDo」「目的」「責任ロール」の表にする。"
    message: ToDo 表に完了条件または判断タイミングがなく、作業の順序付け・進捗確認に使う終点を判定できないため、「完了条件」と「判断時期」を記録できるようにする。
  - id: F004
    severity: minor
    rule: vp-pm-control-reporting
    line: 122
    anchor: "- 区分（`トレードオフ` / `リスク`）で揃え、課題ログやリスク登録簿へ転記しやすい粒度にする。区切りの `/` の前後にはスペースを置かない。"
    message: トレードオフとリスクを「課題ログやリスク登録簿」へ転記するとだけ記載しており、課題・リスク・変更要求・決定のどれとして記録するか判定できないため、事象区分ごとの記録先を示す。
  - id: F005
    severity: minor
    rule: vp-qe-verifiability
    line: 191
    anchor: "- 「全体の作成手順」で示した章立てと必須表がそろっている。"
    message: 「必須表」が本文中で定義されておらず, 対応 rulebook の表も推奨扱いであるため, 仕上げ時にどの表の有無を pass / fail 判定するのか列挙するか, 「必須章・必須項目」に改める。
  - id: F006
    severity: minor
    rule: vp-qe-omissions-consistency
    line: 196
    anchor: "- 曖昧表現や設計詳細を書きすぎていない。"
    message: 「仕上げチェック」に Recipe 記述標準が求める公開適性の最終確認がなく, 業務課題・リスク・根拠に非公開情報を含めてよいか判定できないため, 機密情報や公開可否を確認する項目を追加する。
  - id: F007
    severity: minor
    rule: vp-qe-kata-conformance
    line: 94
    anchor: "- 同じ判断を置き換える案の詳細比較は代替案比較へ委譲し、本書では比較が必要な論点を示す。"
    message: 存在する関連成果物「代替案比較」をリンクまたは仮置き識別子で示しておらず Recipe 記述標準のリンク規約を満たさないため, 参照先リンクまたは `prj-comparison-of-alternatives` を明示する。
  - id: F008
    severity: minor
    rule: vp-qe-kata-conformance
    line: 135
    anchor: "- ToDo の項目は、未確定事項を示す場合は _TODO_: または _UNDECIDED_ ラベルを先頭に付け、後続で検索・フィルタできるようにする（例: _TODO_: 公開先にGitHub を採用するか決定する）。"
    message: >-
      _TODO_ と _UNDECIDED_ を同列の選択肢にし, 意思決定未了の「GitHub を採用するか決定する」を _TODO_ の例にしているため, 「要確認・追記は _TODO_, 意思決定未了は
      _UNDECIDED_」という共通定義に合わせて用途と例を分ける。
  - id: F009
    severity: minor
    rule: vp-qe-kata-conformance
    line: 191
    anchor: "- 「全体の作成手順」で示した章立てと必須表がそろっている。"
    message: 仕上げチェックは「必須表」が揃うことを要求しているが, rulebook の各表は推奨扱いで recipe 内にも必須表の定義がないため, 表の必須性を rulebook と統一する。
  - id: F010
    severity: minor
    rule: vp-qe-kata-conformance
    line: 12
    anchor: "- 最後に、トレードオフ/リスクと次の検討事項を置き、未確定のまま判断を進めないようにする。"
    message: rulebook では「トレードオフ/リスク」「次の検討事項」「見直しと変更管理」が任意章だが、recipe は常に配置する手順としているため、必要な場合だけ作成し不要なら省略できることを明示する。
  - id: F011
    severity: minor
    rule: vp-qe-kata-conformance
    line: 196
    anchor: "- 曖昧表現や設計詳細を書きすぎていない。"
    message: Recipe 記述標準が「仕上げチェック」に求める公開適性の最終確認がないため, 対象成果物に機密情報・個人情報など公開不適切な内容が含まれないことを確認する項目を追加する。
  - id: F012
    severity: minor
    rule: vp-ux-language-consistency
    line: 135
    anchor: "- ToDo の項目は、未確定事項を示す場合は _TODO_: または _UNDECIDED_ ラベルを先頭に付け、後続で検索・フィルタできるようにする（例: _TODO_: 公開先にGitHub を採用するか決定する）。"
    message: 意思決定待ちにも _TODO_ を使用できる説明は _UNDECIDED_ との意味境界を曖昧にするため, 要確認・追記と意思決定未了を区別し, それぞれ対応するラベルを一意に示す。
  - id: F013
    severity: minor
    rule: vp-ops-release-readiness
    line: 196
    anchor: "- 曖昧表現や設計詳細を書きすぎていない。"
    message: 仕上げチェックに公開適性と人間の PO による最終承認の確認がなく、ready 化・公開判断の完了条件を判定できないため、公開前確認項目として明示する。
