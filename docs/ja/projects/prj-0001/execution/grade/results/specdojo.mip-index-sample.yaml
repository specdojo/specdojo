    anchor: "| 体制     | 開発担当が閉店後の日次締めに立ち会い、店舗運営アドバイザーが店番の引継ぎで困った点を聞き取る          |"
    message: ハイパーケアの体制に挙げた「店舗運営アドバイザー」が「体制・役割（GO判断含む）」の表に載っておらず、移行後支援での責務と連絡先が分からないため、体制表へ行を加えて責務と連絡/判断を定義する。
    message_ja: ハイパーケアの体制に挙げた「店舗運営アドバイザー」が「体制・役割（GO判断含む）」の表に載っておらず、移行後支援での責務と連絡先が分からないため、体制表へ行を加えて責務と連絡/判断を定義する。
