    message_ja: 業務停止時間の基準「0 時間」に対し、証跡が移行作業の開始・終了時刻になっていて停止の有無を測れないため、証跡を「通常の開店時刻どおりに販売を受け付けたかの記録」などに改める。
  - id: F004
    severity: major
    rule: vp-qe-omissions-consistency
    line: 12
    anchor: "- _ASSUMPTION_: 平日の午前は来店が少ないため、切替当日は午前に取り込みと動作確認を行い、下校時間に来店が増える午後から本番で利用する。閉店時間は変えない。"
    message: >-
      「平日の午前は来店が少ない」で午前の営業を前提にしながら、「切替日の午前は販売しない」（line 71）や「午後の開店前」（line 52）とも書いており、成功条件の「業務停止時間 0 時間」（line
      44）と矛盾するため、切替日の午前を休業扱いにして停止許容時間を明記するか、午前の営業を続ける前提に揃える。
    message_ja: >-
      「平日の午前は来店が少ない」で午前の営業を前提にしながら、「切替日の午前は販売しない」（line 71）や「午後の開店前」（line 52）とも書いており、成功条件の「業務停止時間 0 時間」（line
      44）と矛盾するため、切替日の午前を休業扱いにして停止許容時間を明記するか、午前の営業を続ける前提に揃える。
