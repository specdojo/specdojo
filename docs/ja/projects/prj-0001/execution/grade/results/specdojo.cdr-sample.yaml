    message: 単体テスト失敗時に期待値の変更を一律に禁じているため、承認済みの仕様変更で期待結果が変わる場合にも旧仕様へ実装を戻す指示になる。実装不具合と仕様変更に伴う期待値更新を区別し、後者は変更根拠を確認して更新する条件を示す。
    message_ja: 単体テスト失敗時に期待値の変更を一律に禁じているため、承認済みの仕様変更で期待結果が変わる場合にも旧仕様へ実装を戻す指示になる。実装不具合と仕様変更に伴う期待値更新を区別し、後者は変更根拠を確認して更新する条件を示す。
