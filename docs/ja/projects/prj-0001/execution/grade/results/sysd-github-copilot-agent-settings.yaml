      executor/reporter の違いを一意に理解できない。
    anchor: >-
      exec の無人実行の command template は `--agent` を指定しない（`起動コマンドの設計` を参照）。本節の custom agent は Copilot Chat / cloud agent
      で明示的に選択する用途であり、`specdojo exec run` の worker 選択には関与しない。
