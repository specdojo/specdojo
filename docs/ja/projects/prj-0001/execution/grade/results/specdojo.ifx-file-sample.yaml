findings:
  - id: F001
    severity: major
    rule: vp-ba-requirements-completeness
    line: 331
    anchor: '"type": "object",'
    message: >-
      The sales-record schema contains only transaction identifiers, aggregate amounts, and statuses, and
      additionalProperties: false rejects line_items. Because current-tx.json is deleted after settlement, the contract
      leaves no retained itemized sales record despite promising sales details at lines 199–201. Define the retained
      product, quantity, and price details, or reference another durable itemized record and its retention contract.
    message_ja: >-
      The sales-record schema contains only transaction identifiers, aggregate amounts, and statuses, and
      additionalProperties: false rejects line_items. Because current-tx.json is deleted after settlement, the contract
      leaves no retained itemized sales record despite promising sales details at lines 199–201. Define the retained
      product, quantity, and price details, or reference another durable itemized record and its retention contract.
  - id: F002
    severity: major
    rule: vp-arc-technical-constraints
    line: 231
    anchor: "atomic_write: 同一ディレクトリ内の一時ファイル（.tmp）へ書き込み・フラッシュ後に renameSync でアトミック置換を実施"
    message: >-
      Per-file atomic replacement does not define a crash-safe update sequence across current-tx.json, the sales record,
      and the headquarters request. The state table describes payment_requested after sending, leaving a possible
      interruption with an open session and an unresolved request. Specify which session and pending-evidence writes
      must be durable before transmission, and how readers handle every intermediate file combination.
    message_ja: >-
      Per-file atomic replacement does not define a crash-safe update sequence across current-tx.json, the sales record,
      and the headquarters request. The state table describes payment_requested after sending, leaving a possible
      interruption with an open session and an unresolved request. Specify which session and pending-evidence writes
      must be durable before transmission, and how readers handle every intermediate file combination.
  - id: F003
    severity: major
    rule: vp-dev-implementation-readiness
    line: 331
    anchor: '"type": "object",'
    message: >-
      Implementing the sales-record schema as written prevents writers from persisting line_items and prevents readers
      from accepting them. After session deletion, the promised itemized evidence is unavailable. Extend the canonical
      illustrative schema with retained sales details, or define an explicit durable reference that compatible writers
      and readers can implement.
    message_ja: >-
      Implementing the sales-record schema as written prevents writers from persisting line_items and prevents readers
      from accepting them. After session deletion, the promised itemized evidence is unavailable. Extend the canonical
      illustrative schema with retained sales details, or define an explicit durable reference that compatible writers
      and readers can implement.
  - id: F004
    severity: major
    rule: vp-dev-implementation-readiness
    line: 367
    anchor: >-
      | `status`          | `payment_requested`         | 会計要求を本部へ送った後で、控えの `api_sync_status` が `accepted`
      になるまで保持する。取消は不可 |
    message: >-
      payment_requested is described as a state after headquarters transmission, while open permits additions and
      cancellation. Define a durable pre-transmission transition and the required pending-record write order so an
      interruption cannot expose a potentially submitted transaction as editable or cancellable. Specify the restart
      behavior for failures between these writes and the external request.
    message_ja: >-
      payment_requested is described as a state after headquarters transmission, while open permits additions and
      cancellation. Define a durable pre-transmission transition and the required pending-record write order so an
      interruption cannot expose a potentially submitted transaction as editable or cancellable. Specify the restart
      behavior for failures between these writes and the external request.
  - id: F005
    severity: major
    rule: vp-qe-omissions-consistency
    line: 200
    anchor: 会計確定要求時の販売実績明細、預かり金・釣銭、本部売上登録 API の受付結果、
    message: >-
      The sales-evidence description promises 販売実績明細, but its schema omits item details and explicitly rejects
      additional properties. Session deletion then removes the only defined itemized source. Align the description,
      schema, and deletion condition so the promised evidence can actually survive settlement.
    message_ja: >-
      The sales-evidence description promises 販売実績明細, but its schema omits item details and explicitly rejects
      additional properties. Session deletion then removes the only defined itemized source. Align the description,
      schema, and deletion condition so the promised evidence can actually survive settlement.
  - id: F006
    severity: major
    rule: vp-qe-kata-conformance
    line: 231
    anchor: "atomic_write: 同一ディレクトリ内の一時ファイル（.tmp）へ書き込み・フラッシュ後に renameSync でアトミック置換を実施"
    message: >-
      Rulebook section 6.3 requires safe reruns without duplicate processing or lost work, but the multi-file completion
      example specifies atomic replacement only for individual files. Add the ordered publication and recovery rules for
      session state, pending sales evidence, headquarters submission, and session deletion so the example demonstrates
      that requirement across interrupted stages.
    message_ja: >-
      Rulebook section 6.3 requires safe reruns without duplicate processing or lost work, but the multi-file completion
      example specifies atomic replacement only for individual files. Add the ordered publication and recovery rules for
      session state, pending sales evidence, headquarters submission, and session deletion so the example demonstrates
      that requirement across interrupted stages.
  - id: F007
    severity: major
    rule: vp-ops-operability
    line: 148
    anchor: 5 分間隔で最大 3 回再試行し、22:00 までに完了しない場合は自動再送を止めて店主代表へ電話発注を促す。
    message: >-
      A transfer timeout can occur after the remote final CSV has already been published, so stopping local retries and
      moving the local file to phoned/ does not prevent the supplier from processing both the CSV and a telephone order.
      Distinguish confirmed non-delivery from an unknown delivery outcome, and require PO to reconcile supplier receipt
      or cancellation before placing the replacement telephone order.
    message_ja: >-
      A transfer timeout can occur after the remote final CSV has already been published, so stopping local retries and
      moving the local file to phoned/ does not prevent the supplier from processing both the CSV and a telephone order.
      Distinguish confirmed non-delivery from an unknown delivery outcome, and require PO to reconcile supplier receipt
      or cancellation before placing the replacement telephone order.
