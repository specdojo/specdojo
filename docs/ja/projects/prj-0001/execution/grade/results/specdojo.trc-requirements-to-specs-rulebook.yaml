  - id: F003
    severity: minor
    rule: vp-qe-omissions-consistency
    line: 60
    anchor: "| `一部充足` | 対応仕様はあるが、参照先が未作成・`draft` であるか、ギャップが残る |"
    message: >-
      `一部充足` の条件「参照先が未作成」は、仕様側の `relations.satisfies` を正本とする生成方式では未作成の仕様が対応仕様として現れないため `未着手`
      の条件と重なっており、何が未作成の場合を指すか（要求側から参照される仕様 ID など）を明確にする必要がある。
    message_ja: >-
