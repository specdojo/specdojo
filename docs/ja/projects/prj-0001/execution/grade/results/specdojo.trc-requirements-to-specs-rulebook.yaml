      'describe', causing a contradiction in responsibilities between automatic generation and manual editing.
    message_ja: セクション1では手動編集を禁止していますが、セクション6では「指定する」や「記述する」といったフレーズを使用して手動での記述を前提としており、自動生成と手動編集の間の責任において矛盾が生じています。
