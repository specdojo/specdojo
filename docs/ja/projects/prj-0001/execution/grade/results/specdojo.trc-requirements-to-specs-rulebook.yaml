  - id: F004
    severity: major
    rule: vp-qe-kata-conformance
    line: 17
    anchor: >-
      本ビューは、要求（業務の受入基準 `bac-*` など）と、それを充足する仕様（システム化機能 `sf-*`、業務仕様 `bes-*`
      など）の作成後に生成し、仕様のレビュー時と要求・仕様の変更時に再生成します。要求→テストの対応は
      [[specdojo:trc-requirements-to-tests-rulebook|トレーサビリティ（要求→テスト）作成ルール]] が扱います。
    message: >-
      宣言 sample が rulebook と矛盾している（`bac-*` を仕様参照元として扱う、前提に生成手段・生成日がない、対応仕様があるのに `未着手`
      とする、ギャップ表に担当・期限列がある、備考へ手で追記させる、`based_on` がマトリクスの生成元と一致しない）ため、sample を rulebook に合わせて改訂するか rulebook
      側の規定を見直して整合させる必要がある。
