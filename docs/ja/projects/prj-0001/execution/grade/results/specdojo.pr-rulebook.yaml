findings:
  - id: F001
    severity: minor
    rule: vp-po-purpose-alignment
    line: 7
    anchor: "## 1. 全体方針"
    message: >-
      It is recommended to specify the target scope of the progress report (e.g., which project phases or teams are
      covered) in addition to the purpose of standardizing the format.
    message_ja: フォーマットを標準化する目的だけでなく、進捗報告の対象範囲（例：どのプロジェクトフェーズやチームを対象とするか）を明記することを推奨します。
  - id: F002
    severity: minor
    rule: vp-po-decision-readiness
    line: 13
    anchor: "## 2. 位置づけと用語定義（必要に応じて）"
    message: >-
      It is recommended to clarify who (e.g., PO or manager) is supposed to make what decisions or approvals (e.g.,
      approval of next plans, agreement on risk responses) during the review.
    message_ja: レビュー中に誰が（例：POやマネージャー）、どのような意思決定や承認（例：次期計画の承認、リスク対応への合意）を行うべきかを明確にすることを推奨します。
  - id: F003
    severity: minor
    rule: vp-po-publication-accountability
    line: 7
    anchor: "## 1. 全体方針"
    message: >-
      It is recommended to provide guidelines on the publication scope of the report content (e.g., internal-only, for
      customers) and how to handle confidential information.
    message_ja: 報告内容の公開範囲（例：社内限定、顧客向け）と、機密情報の取り扱いに関するガイドラインを提供することを推奨します。
  - id: F004
    severity: minor
    rule: vp-ba-requirements-completeness
    line: 7
    anchor: "## 1. 全体方針"
    message: >-
      It is recommended to specify the granularity of items to be included in the progress report and the criteria for
      out-of-scope items (e.g., minor daily updates) that do not need to be reported.
    message_ja: 進捗報告に含まれる項目の粒度と、報告の必要がない対象外の項目（例：軽微な日次アップデート）の基準を明記することを推奨します。
  - id: F005
    severity: minor
    rule: vp-ba-stakeholder-clarity
    line: 13
    anchor: "## 2. 位置づけと用語定義（必要に応じて）"
    message: >-
      It is recommended to explicitly state the stakeholders for the progress report, such as the intended readers and
      the roles responsible for reviewing and reaching an agreement.
    message_ja: 想定される読者や、レビューおよび合意形成の責任を負うロールなど、進捗報告のステークホルダーを明示することを推奨します。
