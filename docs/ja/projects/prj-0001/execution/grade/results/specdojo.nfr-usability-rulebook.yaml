findings:
  - id: F001
    severity: minor
    rule: vp-qe-verifiability
    line: 60
    anchor: "- **判断基準**: 1 行 1 指標とし、指標・基準値・`備考` の対象から合否を出せること。指標は完了率・完了時間・誤操作率・習熟時間・エラーメッセージの対処方法含有率・破壊的操作の確認網羅率などから選ぶ。"
    message: >-
      For rate metrics such as `誤操作率` or `タスク完了率`, the good example and the guidance do not say what the rate is
      measured against (per operation, per task or per user), so measured values may not be comparable; add a rule that
      the denominator and how to count it must be stated in `指標` or `備考`.
    message_ja: >-
