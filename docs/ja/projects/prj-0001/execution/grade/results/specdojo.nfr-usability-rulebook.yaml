      the denominator and how to count it must be stated in `指標` or `備考`.
  - id: F002
    severity: minor
    rule: vp-qe-omissions-consistency
    line: 61
    anchor: "- **良い例**: 「`nfr-usb-002` ／ 誤操作を基準以下に抑える ／ 誤操作率 ／ 2% 以下 ／ 取消導線を提供」"
    message: >-
      In the good example of the requirements list, `備考` is "取消導線を提供", which describes how the goal is met and
      contradicts the body line 42 rule that `備考` narrows the target users and operations; change the example `備考` to
      name the target users or operations.
