    line: 120
    anchor: >-
      - **良い例**: 「`docs/**/generated/` および `.specdojo/doc-index.json` ／ 派生 Markdown ビューと文書索引 ／ `specdojo build`、`index
      build` ／ 共有なし（`.gitignore` で除外し各環境で生成） ／ ビルド時に再生成 ／ `削除可`。`specdojo build` で再生成できる」
    message: >-
      「良い例」が `docs/**/generated/` 全体を `削除可` かつ `specdojo build` で再生成可能としているが、実装の `src/grade/run.ts`
      はこの配下に実行ロックと再開用状態を保存し、`src/routine/storage.ts` は旧 `routines/generated/`
      の状態・履歴を移行元として扱う。これらの削除は排他の破綻や再開情報・未移行履歴の消失につながるため、例の対象を再生成可能な派生物へ限定し、実行状態と未移行データの除外条件を明記する。
