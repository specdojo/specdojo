    rule: vp-ux-language-consistency
    line: 108
    anchor: >-
      - 人が雛形に文脈を記入してから下書きする場合は `draft-with-context` を宣言する。必要な Kata がすべて利用可能な場合だけ `draft` profile
      を生成し、雛形作成・文脈記入（human）、下書き（`draft`）、磨き込み（`fully-guided`）、review、finalize（human）の順とする。human の着手と完了は claim / complete
      で記録する。
    message: >-
      `draft` を profile 名、phase、approach の三つの意味で区別なく使っているため、各出現に「`draft` profile」「`approach:
      draft`」のように種別を付けて書き分ける必要がある。
