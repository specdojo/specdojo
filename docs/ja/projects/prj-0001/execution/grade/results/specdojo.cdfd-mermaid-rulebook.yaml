  - id: F004
    severity: minor
    rule: vp-arc-technical-constraints
    line: 9
    anchor: >-
      - Mermaid の `flowchart` を使用し、方向は全体概要・プロセスグループ別・ユースケース別 CDFD を問わず `LR` を基本とします。CDFD
      の矢印は情報・物・実行要求の受け渡しを表し、ユースケース別など包含元が明示した場合だけ業務上の順序も表します。`TB`
      は、対象が階層構造（組織・分類など）を表す場合にだけ使用します。以下では、プロセスグループ別とユースケース別を合わせて「詳細 CDFD」と呼びます。
    message: Mermaid の対応バージョンまたはプロジェクト標準レンダラーを明示し、絵文字、日本語ノード ID、各形状構文をどの環境で保証するか固定する必要がある。
    message_ja: Mermaid の対応バージョンまたはプロジェクト標準レンダラーを明示し、絵文字、日本語ノード ID、各形状構文をどの環境で保証するか固定する必要がある。
