  - id: F002
    severity: minor
    rule: vp-po-publication-accountability
    line: 5
    anchor: >-
      Mermaid の `flowchart` 構文で CDFD
      のプロセス、イベント、データストア、外部主体、情報・物の流れを一貫して表すための記法ルールです。`specdojo:cdfd-overview-rulebook`、`specdojo:cdfd-rulebook`、`specdojo:cdfd-uc-rulebook`
      の `includes` から適用される共通部品です。対象プロダクトの `cdfd-overview` に「凡例（本プロダクト共通）」がある場合はその割り当てを正本とし、共通凡例がない場合は本 rulebook
      の形状・線種と既定の色・絵文字方針に従います。
    message: 共通記法の内容に非公開情報は見当たらないが、`draft` から公開可能な状態へ移す人間の承認責任と承認記録の所在を明示する必要がある。
