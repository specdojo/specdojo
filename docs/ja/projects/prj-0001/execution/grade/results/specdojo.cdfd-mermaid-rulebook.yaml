findings:
  - id: F001
    severity: minor
    rule: vp-po-decision-readiness
    line: 5
    anchor: >-
      Mermaid の `flowchart` で CDFD のプロセス・イベント・データストア・外部主体・受け渡しを表す記法ルールです。全体概要・プロセスグループ別・ユースケース別 CDFD の主 rulebook の
      `includes` から適用します。プロダクト固有の割り当ては全体概要の「凡例（本プロダクト共通）」、共通凡例がなければ本書の既定凡例を使います。
    message: >-
      Approval and status now come from the metadata standard, so this drops from the previous major. The rulebook still
      does not say why it stays `draft` or what is still open, so the PO cannot decide what must be fixed before
      promotion to `ready`.
    message_ja: >-
      Approval and status now come from the metadata standard, so this drops from the previous major. The rulebook still
      does not say why it stays `draft` or what is still open, so the PO cannot decide what must be fixed before
      promotion to `ready`.
