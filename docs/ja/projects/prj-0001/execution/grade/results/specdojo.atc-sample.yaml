    line: 5
    anchor: >-
      店主不在の店番で、家族利用者代表が商品Aを登録して会計を確定し、レシートと販売一覧・在庫一覧で結果を確かめるまでを受け入れるかの判断に使う。確定前の取消と確定後の取引の照合もこのカタログ（`atc-cash-sale`）で扱う。店番の交代は
      `atc-sale-hold` の引継ぎ経路だけで確かめる。ローカル ID は `atc-cash-sale` とし、粒度は [[specdojo:atc-index-sample|受入テストカタログ 概要]]
      の分割基準（商品の登録→会計確定→レシートの受け渡し）に従う。
    message: >-
      概要で引用する atc-index の分割基準が「商品の登録→会計確定→レシートの受け渡し」となっており、atc-index
      の「商品の登録→金額の提示→会計確定→レシートの受け渡し」から「金額の提示」が抜けているため、正本どおりに揃えるか参照だけにする必要がある。
