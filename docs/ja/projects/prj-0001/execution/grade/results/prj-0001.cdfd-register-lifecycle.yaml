      の境界を引き継ぎ、立ち上げ時の未整理事項と運用中の計画外事項を、個票の起票から対応、審査、終了、再開、派生生成、履歴確認、例外復旧まで継続管理する概念仕様である。BA が登録簿と Schedule
      の境界を整理し、PO、ARC、QE が人間の判断責任、正本、状態遷移、主要例外を同じ表と図から確認するために使用する。
  - id: F001
    severity: major
    rule: vp-arc-cross-document-consistency
    line: 58
    message: >-
      `note` を項目 owner の確認後に `done` とする定義は、正本の登録簿運用ガイドおよび pjr-rulebook が定める「`note` は `open`
      のまま終端させない」という規則と矛盾するため、承認者・遷移・後続行動を非終端運用へ修正する必要がある。
    anchor: "| `note`           | 項目 owner                 | 記録充足後に `done`                        | 個票と commit    |"
  - id: F003
    severity: major
    rule: vp-qe-done-criteria
    line: 58
    message: >-
      DC-004 が要求する type 別の承認・遷移境界について、非終端である `note` に審査者と `done` 遷移を定義しているため、`note` は承認・終了対象外で `open`
      のまま更新することを明示しなければ完了条件を満たさない。
    anchor: "| `note`           | 項目 owner                 | 記録充足後に `done`                        | 個票と commit    |"
  - id: F004
    severity: major
    rule: vp-qe-omissions-consistency
    line: 58
    message: >-
