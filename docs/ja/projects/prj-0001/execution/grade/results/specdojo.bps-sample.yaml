    line: 51
    anchor: "| 補充不要記録 | 店主代表     | 対象商品、理由、確認時刻があり、依頼がない | 在庫記録 | 次回の販売・入荷後に再判定         |"
    message: >-
      補充不要記録の確定条件を「依頼がない」としているが、S-01・S-02
      の補充不要分岐は既存依頼がある商品も除外しておらず、その依頼を取り消す処置もないため、「新規依頼を作らない」という条件に限定するか、既存依頼がある場合の処置と分岐優先関係を明示する必要がある。
