    severity: major
    rule: vp-qe-verifiability
    line: 1
    message: >-
      ルートキーだけでなく、`command`、`arguments`、`streams`、`authentication`、`execution`、`error_handling`
      の各入れ子キーについて必須・任意と条件付き必須を明記し、仕様だけで pass / fail を判定できるようにしてください。
    anchor: "# 外部コマンド連携仕様作成ルール"
