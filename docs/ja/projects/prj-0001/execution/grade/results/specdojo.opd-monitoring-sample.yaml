    line: 58
    anchor: >-
      - 死活の誤検知が月 3 件以上ある場合、`OPS` は閾値の変更案（例: 5 分を 10 分に延ばす）を作る。閾値は `opd-index` の統制のため、`opd-index` の変更管理に従い `PO` の承認を得て
      `opd-index` 側を改訂してから適用する。
    message: 閾値の見直し例の「5 分を 10 分に延ばす」は、対象の閾値の定義が本書になく `opd-index` のどの値かも示されていないので、対象の閾値を参照付きで明記して判定できるようにすべきである。
