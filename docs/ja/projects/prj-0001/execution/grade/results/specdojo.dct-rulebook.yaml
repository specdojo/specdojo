    rule: vp-arc-conciseness
    line: 89
    anchor: "| `title`    | ○    | ドキュメント名              |"
    message: 「4. 推奨メタ項目」と「5.1. ルート構造」でトップレベルキーの定義が重複しており, 冗長であるため。
  - id: F002
    severity: major
    rule: vp-qe-omissions-consistency
    line: 110
    anchor: ""
    message: >-
      `groups` と `deliverables` はどちらか一方だけを持つと規定しているが、`dct.schema.yaml` は `anyOf` のため両方を持つ構造も検証に合格し, rulebook
      上の親・葉グループ境界を機械検証できないため。
  - id: F003
    severity: minor
    rule: vp-qe-omissions-consistency
    line: 207
    anchor: ""
    message: ドメインの `base_path` について、スキーマ（`^/[^\s]+$`）および4章の表では絶対パスを必須としているが、6.6節では「絶対パスで記載することを推奨する」と任意に読める表現になっており矛盾しているため。
  - id: F004
    severity: minor
    rule: vp-qe-omissions-consistency
    line: 225
    anchor: "- どちらのパターンでも `groups[]` と `deliverables[]` の項目数に上限はない。テンプレートの1件は書式サンプルであり、実際に必要な数だけ記載する。"
    message: >-
      `min_size` は `type: template` でのみ使用可能と規定しているが、`dct.schema.yaml` は project の group と deliverable でも受理するため、禁止事項と
      schema 検証結果が一致しないため。
  - id: F005
    severity: major
    rule: vp-qe-kata-conformance
    line: 172
    anchor: "- 参照先は同一カタログまたは他ドメインカタログに存在する `local_id` とし、ファイルパスや URL を混在させない。"
    message: >-
      `sch-track-＜track＞` は対応する `sch-strategy-＜track＞` を `depends_on` に宣言すると規定しているが、`dct-project-management-template` の
      `sch-track-launch` は `depends_on: []` であり、生成元 `sch-strategy-launch` へのトレーサビリティが欠落しているため。
  - id: F006
    severity: major
    rule: vp-qe-kata-conformance
    line: 186
    anchor: "- `evidence_refs` は成果物ごとの安定した調査入力であり、`approach: retrofit` の edit / review plan に「実装エビデンス」として展開される。"
    message: >-
      recipe・sample・template の要否と所在は rulebook Frontmatter を正本とすると定義している一方、既存の DCT template 群が本 rulebook を参照しているのに
      `template` 宣言がなく、fully-guided の参照ハブから適用テンプレートを解決できないため。
  - id: F007
    severity: minor
    rule: vp-ux-readability
    line: 89
    anchor: "| `title`    | ○    | ドキュメント名              |"
    message: 「推奨メタ項目」と「ルート構造」が同じトップレベルキーを連続して再掲し、両節の役割差を読み分けにくいため。
  - id: F008
    severity: minor
