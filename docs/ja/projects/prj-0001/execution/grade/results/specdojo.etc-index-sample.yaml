    anchor: >-
      「外部」は、開発担当が運用しない製品・サービスとの境界とする。[[specdojo:ifd-sample|インフラ構成図]] の経路のうち、店舗プリンタを動かす `receipt-print`
      コマンドと、提供事業者が運用する復元用保管サービス（`PATH-05`・`PATH-06`）が該当する。業務記録
      DB（`PATH-03`・`PATH-04`・`PATH-07`）は開発担当が同じ環境で運用するため内部結合テストに置く。
    message: >-
      `PATH-04`（保全の取得）と `PATH-07`（復元の回復）を内部結合テストに置いていますが、based_on の tsp-index-sample と itc-index-sample は
      `PATH-04`〜`PATH-07` を外部結合テストの範囲と定めており、このままではどのテストもこの2経路を扱いません。外部の範囲と `backup-storage` の経路を `PATH-04`〜`PATH-07`
      にそろえ、復元の回復に対応する観点を加えてください。
