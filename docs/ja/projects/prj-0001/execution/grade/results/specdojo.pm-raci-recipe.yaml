    line: 30
    anchor: 5. Schedule ownerと主たる`R`を一致させます。
    message: Schedule ownerを主たる`R`へ一律に合わせる方針では、WBS ownerを優先する場合や承認・レビューTaskを`A`または`C`が担当する場合に誤った責任割当となるため、上位標準の優先順と例外を反映してください。
  - id: F002
    severity: major
    rule: vp-po-decision-readiness
    line: 57
    anchor: "- 不一致時の更新先を決めます。"
    message: 「不一致時の更新先を決めます」だけでは、WBS・RACI・Scheduleのどれを正として採用または差し戻すかの条件と影響が分からないため、正本の優先順、例外、判断記録先を明記してください。
  - id: F003
