      入荷受入、入荷検品                       | 店舗内共有                                           | 入荷当日の配置完了まで               |
      `条件付き処分可`。検品結果を仕入ノートへ記録し、商品を売場棚か返品保管箱へ移してから外箱を処分する。伝票は店頭台帳保管棚へ移す |
    message: 前回の集計元とメンバー割り当ての重大な不整合、および現金と仮メモの混在は解消していますが、検品場所には破棄しない商品、保管棚へ移す納品伝票、解体処分する外箱が同じ管理行に残っています。ルールブックが求める共有範囲・寿命・削除可否の判断単位に従い、同じ検品場所内でも商品・伝票・外箱の管理区分を分けてください。個別の扱い自体は記載されているため、残る問題は区分の軽微な不整合です。
