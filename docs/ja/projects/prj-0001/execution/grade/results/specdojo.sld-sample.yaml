    message_ja: >-
      日次サマリーの回収を clis-sample の現金のみのスコープと一致させてください：data/sales/ はその CLI
      によって生成されるもので、紙に記録された掛売り販売のソースを確立するものではありませんが、89行目では現金と掛売り販売の両方を想定しています。完全なソースマッピングを定義するか、サマリーのスコープを明示的に制限して引き渡してください。
  - id: F005
    severity: major
    rule: vp-qe-kata-conformance
    line: 7
    anchor: >-
      BA（同行レビュー担当）と OPS（家族利用者代表・店舗運営アドバイザー）が日常の保管・清掃・処分の境界を整理し、ARC（技術メンター）・DEV（開発担当）が概念データストアおよび CLI
      の保存パスと整合させる。QE（同行レビュー担当）が検証手順と受入条件を確認し、PM が未決事項を管理台帳へつなぎ、店主代表が PO として保管方針と公開可否を最終判断する。
    message: >-
      Align the member-to-role assignments with pm-members-sample and pm-organization-sample: BA belongs to the
      development representative, the peer reviewer holds QE, and the family representative holds UX rather than OPS;
      correct the repeated recovery assignments or record an explicit organization change before relying on them.
    message_ja: >-
      メンバーからロールへの割り当てを pm-members-sample および pm-organization-sample と一致させてください：BA は開発代表者に属し、ピアレビュワーは QE を、ファミリー代表は OPS
      ではなく UX を担当しています。繰り返される回収の割り当てを修正するか、それらに頼る前に明示的な組織変更を記録してください。
  - id: F006
