    message: >-
      Include paper-recorded credit sales in the interim manual daily tally and distinguish their confirmation evidence
      from headquarters acceptance; using only accepted data/sales/ transactions can understate the day's sales and
      cannot reproduce the cash-plus-credit closing example in line 89.
    message_ja: >-
