    message: >-
      合格条件では店番担当が破損時に新規会計を止めて DEV へ連絡すると答えますが、53行目の担当欄では同じ対処を OPS（51行目で店主代表と定義）が行うと書いており、担当の表記が店番担当と Role code
      の間で揺れて同一場面の行為者が一致しません。店番担当を業務上の担当名として使うなら Role code との関係を明示するか、場面別の表と確認手順で同じ担当表記に揃えてください。
