      `処分不可`。日次締めで店主代表が現金実査と販売額の一致を確認した後、売上金を母屋金庫へ移す。破棄できるのは締めに転記済みの仮メモだけ                       |
    message: >-
      The electronic storage rows are now separated, but this row still combines non-disposable cash with disposable
      temporary memos; separate their storage-control classes so each row has a uniform lifetime and disposal decision
      as required by the rulebook.
    message_ja: 電子保存の行は分離されましたが、この行には依然として、廃棄不可能な現金と廃棄可能な一時的なメモが組み合わされています。ルールブックの要求に従い、各行の有効期間と廃棄の決定が統一されるよう、それぞれの保存管理クラスを分離してください。
