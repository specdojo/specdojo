    rule: vp-arc-cross-document-consistency
    line: 59
    anchor: >-
      - `P-06` はジョブ定義を作る領域で、定義の検証・表示は `SF-ROUT-03`（`job`）が担う。ジョブの実行は `exec run --job` を入口とし、`SF-ROUT-02`
      が担う。`SF-ROUT-02` の意味を変えないため、定義の機能は新しい ID で採番した。_ASSUMPTION_: ジョブの実行だけを扱う業務プロセス領域はないため、起動元の `P-05` へ対応付ける。BPS の作成時に
      `Q-01` で照合する。
    message: >-
      Reconcile the P-05 assignment with `prj-0001:dct-business-model-bps`, which defines P-05 as producing a
      periodic-execution definition, and `docs/ja/product/010-business-specs/010-data-flow/cdfd-uc-routine.md` sections
      3.1–3.2, which place definition in P-05 and Job Run materialization and execution in the shared execution cycle;
      SF-ROUT-01 describes dispatch instead of definition handling, while SF-ROUT-02 assigns execution to P-05 on the
      assumption that no execution area exists.
    message_ja: P-05の割り当てを、P-05を定期実行の定義を生成するものと定義している`prj-0001:dct-business-model-bps`、および、定義をP-05に、ジョブ実行の具体化と実行を共有実行サイクルに置いている`docs/ja/product/010-business-specs/010-data-flow/cdfd-uc-routine.md`のセクション3.1–3.2と整合させてください。SF-ROUT-01は、定義の処理ではなくディスパッチを説明しており、一方でSF-ROUT-02は、実行領域が存在しないという仮定に基づいて、実行をP-05に割り当てています。
    cause:
      type: document
