    rule: vp-po-publication-accountability
    line: 16
    anchor: "- 公開範囲: 本文は機能名、コマンド名、文書 ID だけで構成し、個人情報、認証情報、非公開の接続先を含めない。SpecDojo の製品文書として文書サイトで公開する文書として扱い、公開する相手と範囲は確定前に確認する。"
    message: 公開する相手と範囲を確定前に確認するとしているが未決事項・追跡先に載っていないため、公開範囲の確認を未決事項へ追加し、判断時点と追跡先を明記してください。
    message_ja: 公開する相手と範囲を確定前に確認するとしているが未決事項・追跡先に載っていないため、公開範囲の確認を未決事項へ追加し、判断時点と追跡先を明記してください。
    cause:
      type: document
  - id: F002
    severity: major
    rule: vp-pm-plan-feasibility
    line: 99
    anchor: >-
      | `Q-01` | 留保とする。業務プロセス仕様列の BPS と CLI 仕様 `clis-index` の多くが未作成のため、対応は成果物カタログの定義に基づく暫定とする。BPS
      が作成された時点で、各行の概要と処理ステップの対応を照合する                                                                                                                                                                                                       
      | 全機能       | 各 BPS・`clis-index` の作成時                  | 照合表の行ごとに、その行の BPS
      の作成時に照合し、差異があれば本書を更新する。行ごとの照合作業の順序・期限は追跡先の PJR と Schedule で管理する。照合表の「BPS
      本文との照合」が全行で一致または改訂済みになれば完了とする。留保の間、照合は確定の範囲から切り出して扱う |
      [[prj-0001:pjr-ak5v-bps-mapping-check-after-bps\|PJR-AK5V]]                                |
    message: BPSとCLIのマッピングレビューを、PMがスケジュールを組み、監視できるように、担当者、完了条件、および決定のタイミングを含む追跡可能な作業に分割してください。
    message_ja: BPSとCLIのマッピングレビューを、PMがスケジュールを組み、監視できるように、担当者、完了条件、および決定のタイミングを含む追跡可能な作業に分割してください。
    cause:
