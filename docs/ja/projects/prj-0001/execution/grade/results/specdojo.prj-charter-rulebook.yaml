    message: 本行では条件付きで本格実行や公開まで認可できる一方、「共通」では冒頭文に本格実行開始・外部公開を承認しない旨を必ず書くよう要求しています。例外を認める場合は冒頭文と禁止事項の適用条件をそろえ、同じ憲章で認可と非認可を併記させない規則にしてください。
