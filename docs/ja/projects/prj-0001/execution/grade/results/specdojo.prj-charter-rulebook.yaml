    line: 129
    anchor: "- 観点ごとに確認内容、合格条件、判断結果の記録先を示す。目的整合は概要、体制は組織定義、品質は品質管理計画と照合し、予算枠と公開範囲の条件も確認する。未達条件が残れば開始判断を保留する。"
    message: >-
      観点ごとの合格条件を必須としていますが、対応 template の GO / Not GO 表は「判断観点・確認内容・記録先」のみで、合格条件の記入欄や記入指示がありません。template
