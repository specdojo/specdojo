  - id: F001
    severity: major
    rule: vp-po-publication-accountability
    line: 46
    anchor: "- リスクID、内容、発生確率、影響度、優先度、対応策、担当、ステータスを一覧にする。"
    message: >-
      承認責任はドキュメントメタ情報標準に任せることで解消したが、担当列を必須にしながら個人名・連絡先・非公開のリスク内容（要員や取引先に関する情報など）を書かない制限も、担当を Role code
      で書く指定もないため、公開リポジトリに不適切な情報が載るおそれがある。禁止事項か記述ガイドに公開してよい情報の範囲を加える必要がある。
    message_ja: >-
      承認責任はドキュメントメタ情報標準に任せることで解消したが、担当列を必須にしながら個人名・連絡先・非公開のリスク内容（要員や取引先に関する情報など）を書かない制限も、担当を Role code
