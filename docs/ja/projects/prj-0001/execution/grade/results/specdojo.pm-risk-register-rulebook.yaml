    message_ja: >-
      The risk table requires priority and response data but omits the decision owner, decision state, decision
      deadline, and residual-risk acceptance criteria needed for PO approval, hold, or rejection decisions.
  - id: F002
    severity: major
    rule: vp-po-publication-accountability
    line: 24
    anchor: "## 4. 推奨 Frontmatter 項目"
    message: >-
      The metadata rules define publication-like statuses but provide no restrictions for personal or confidential
      information and no human PO approval responsibility for making a register ready or public.
    message_ja: メタデータルールは公開に近いステータスを定義していますが、個人情報や機密情報に対する制限がなく、レジスターを準備または公開するための人間のPOによる承認責任も規定されていません。
  - id: F003
    severity: major
    rule: vp-pm-plan-feasibility
    line: 66
    anchor: "- 回避、低減、受容、移転の方針と具体対応を記載する。"
    message: >-
      The response-plan rules do not require a work unit, dependency, due date, completion criterion, or accountable
      Role code, even though the sample relies on deadlines and completion conditions to make responses actionable.
    message_ja: >-
      response-plan のルールには、work unit、dependency、due date、completion criterion、または accountable Role code
      は必要ありません。ただし、サンプルでは、レスポンスを実行可能なものにするために、期限や完了条件に依存しています。
  - id: F004
    severity: major
    rule: vp-pm-dependency-risk
    line: 74
    anchor: "- `pm-issue-log`、`pm-change-request-log` への導線を記載する。"
    message: >-
      The related-document guidance omits affected deliverables, dependencies, schedule impact, and PJR linkage, so
      downstream planning consequences of a risk cannot be traced.
    message_ja: 関連ドキュメントのガイダンスには、影響を受ける成果物、依存関係、スケジュールの影響、およびPJRとの関連性が記載されていないため、リスクによる下流の計画への影響を追跡することができません。
  - id: F005
    severity: major
    rule: vp-pm-control-reporting
    line: 74
    anchor: "- `pm-issue-log`、`pm-change-request-log` への導線を記載する。"
    message: >-
      The rules name the issue and change-request logs but do not define transfer criteria, reporting destinations, or
      ownership for separating risks from realized issues, change requests, and decisions.
    message_ja: ルールには、問題および変更要求のログが記載されていますが、リスクを顕在化した問題、変更要求、および意思決定から分離するための移管基準、報告先、または所有権が定義されていません。
  - id: F006
    severity: minor
    rule: vp-ba-business-value
    line: 5
    anchor: 本ドキュメントは、`リスク登録簿` を一貫した粒度で作成するためのルールを定義する。
    message: >-
      The purpose states the management activity but does not identify its beneficiary or the business consequence
      avoided through risk control, leaving business-value alignment implicit.
    message_ja: 目的では管理活動について述べていますが、その受益者やリスク管理を通じて回避されるビジネス上の結果を特定していないため、ビジネス価値との整合性が暗黙的なままになっています。
  - id: F007
    severity: minor
    rule: vp-ba-requirements-completeness
    line: 53
    anchor: "- リスクID、内容、発生確率、影響度、優先度、対応策、担当、ステータスを一覧化する。"
    message: >-
      The required risk table includes a status column but defines neither allowed values nor transition criteria,
      leaving the usage requirements incomplete.
    message_ja: 必要なリスクテーブルにはステータス列が含まれていますが、許可される値も遷移基準も定義されておらず、使用要件が不完全なままになっています。
  - id: F008
    severity: major
    rule: vp-ba-stakeholder-clarity
    line: 49
    anchor: "- 管理対象、見直し頻度、責任者を 1〜3 行で示す。"
    message: >-
      The rules require a responsible person but do not distinguish the maintainer, reviewer, approver, consulted
      stakeholders, or the decisions on which their agreement is required.
    message_ja: ルールでは責任者を求めていますが、メンテナー、レビュアー、承認者、相談先のステークホルダー、または彼らの合意が必要となる意思決定を区別していません。
  - id: F009
    severity: minor
    rule: vp-dev-change-impact
    line: 32
    anchor: "| supersedes | 置換関係ID（配列）               | 任意 |"
    message: >-
      The metadata includes supersedes but gives no procedure for migrating existing registers or assessing impacts on
      templates, generated views, and consumers when this rulebook changes.
    message_ja: メタデータには supersedes が含まれていますが、このルールブックが変更された際の、既存のレジスタの移行や、テンプレート、生成されたビュー、およびコンシューマーへの影響を評価するための手順は示されていません。
  - id: F010
