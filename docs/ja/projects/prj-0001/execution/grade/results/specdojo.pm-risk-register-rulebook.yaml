    anchor: "- 受容する場合は、受容を判断した者と、許容する残存影響を書く。"
    message: 受容の判断を決定記録へ転記するかと、課題・変更要求へ移したあとの元のリスクの扱い（ステータスをクローズにするか継続監視するか）が定義されておらず、リスクと決定・課題の記録が重複したり宙に浮いたりするおそれがある。
