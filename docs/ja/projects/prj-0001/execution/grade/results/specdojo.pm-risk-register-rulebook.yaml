  - id: F002
    severity: minor
    rule: vp-pm-dependency-risk
    line: 51
    anchor: "- 発生確率と影響度の段階ごとの判定条件と、その組み合わせから優先度を決める対応表を書く。"
    message: 導入文で抑えるべき影響に納期を挙げているが、影響度の判定条件にスケジュールや後続成果物への影響を観点として含める指定がなく、リスクのスケジュールへの影響を一貫して識別できない。判定観点の例として明記する必要がある。
    message_ja: 導入文で抑えるべき影響に納期を挙げているが、影響度の判定条件にスケジュールや後続成果物への影響を観点として含める指定がなく、リスクのスケジュールへの影響を一貫して識別できない。判定観点の例として明記する必要がある。
