    anchor: "- **良い例**: 「`_UNDECIDED_`: ピーク時の同時会計数。決まるまで総合テストの性能条件は日次売上1,000取引で仮置きする（入口／出口条件に影響）。」"
    message: >-
      記述ガイド「メモ / 将来課題」の良い例は、ピーク時の「同時会計数」を論点に「日次売上1,000取引」で仮置きしている。共通サンプル文脈の sample
      は単一店舗・タブレット1台の前提で「放課後ピーク1時間60取引、会計確定の応答 95% が2秒以内」を仮置き基準にしており、規模も指標も合わない。良い例を sample の仮置き基準に合わせて書き換える。
