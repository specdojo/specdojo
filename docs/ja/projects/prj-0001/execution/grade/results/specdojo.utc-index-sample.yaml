    anchor: ready にする前に解消する論点は、通信不能時の販売継続と AC-02 のつけ残高確認への接続とする。CI ジョブ `kinuya-ci-unit` の整備は ready 後も継続でき、整備前は暫定の `証跡` で運用する。
