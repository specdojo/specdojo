    message: >-
      `P-02-05` の起動条件は「検品で数量違いまたは品質不良が判明した」だけですが、図では仕入記録確定後に起動し、`E-02-02`
      も記録一致まで返品を停止するため、仕入記録確定を起動条件へ追加して開始時点を統一してください。
  - id: F004
    severity: minor
    rule: vp-qe-verifiability
    line: 170
    anchor: >-
      凡例の形状・色・絵文字は全体概要の「凡例（本プロダクト共通）」を参照する。`-->` は情報、`==>`
      は商品の流れを表す。仕入記録は仕入計画の図と同じデータストアである。在庫グループは検品済み入荷数量を受けて在庫記録を更新する本グループ外の委譲先で、内部プロセスと在庫記録ノードを省略している。返品対象がなければ
      `P-02-05` は起動せず、受入品がなければ `P-02-04` は起動しない。仕入記録の確定後、返品引渡しまたは在庫グループの入荷反映と売場補充を終えることでグループが正常完了する。
    message: >-
      受入品と返品対象が混在する場合は `P-02-04` と `P-02-05`
      の双方が必要ですが、「返品引渡しまたは在庫グループの入荷反映と売場補充を終える」で一方の完了だけでも正常完了と読めるため、該当する全条件付きプロセスの完了を正常完了条件として明記してください。
