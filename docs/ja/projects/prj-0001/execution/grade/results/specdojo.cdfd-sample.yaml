    message_ja: 目的とスコープを、目的を1〜2文、含まれるスコープと除外されるスコープをそれぞれ1文とする現在のルールブックの要件に合わせて再構成してください。既存のコンテンツを整理し、必要な外部参照を保持してください。
  - id: F005
    severity: minor
    rule: vp-qe-kata-conformance
    line: 25
    anchor: 在庫グループが発注単位に合わせて確定した補充依頼に商品台帳の仕入先を割り当て、店主代表が承認した発注内容を仕入先と後続の入荷検品へ引き渡す。
    message: >-
      The previous conflict with cdfd-uc-sample is resolved, but cdfd-overview-sample still assigns adjustment of
      replenishment quantities to ordering units to purchasing area P-01, while this sample assigns it to inventory;
      reconcile the claimed responsibility with the authoritative overview so the detailed sample does not silently move
      an area responsibility.
    message_ja: cdfd-uc-sampleとの以前の競合は解決されましたが、cdfd-overview-sampleでは補充量の調整をオーダーユニットから購買エリアP-01に割り当てているのに対し、このサンプルではそれをinventoryに割り当てています。詳細なサンプルがエリアの責任を密かに移動させないよう、主張されている責任権限を権威ある概要と一致させてください。
  - id: F006
    severity: minor
    rule: vp-qe-kata-conformance
    line: 290
    anchor: >-
      | `cdfd-sales`            | 売場棚の商品を用いた店頭販売                         | 売場商品                               |
      販売後の在庫が補充基準を下回り、在庫グループが補充を依頼した |
    message: >-
      The sales delegation passes only physical shelf goods, whereas cdfd-uc-sample requires purchasing to hand sales
      the confirmed receipt quantities and acceptance results for reconciliation; identify the producing process and
      represent this information handoff in the diagram, process outputs, and delegation row without expanding sales
      internals.
    message_ja: 販売の委譲は物理的な棚の物品のみを渡していますが、cdfd-uc-sampleでは、照合のために確定済みの受領量と受諾結果を購買から販売へ渡すことが求められています。生成プロセスを特定し、販売内部の情報を拡大することなく、この情報の受け渡しを図、プロセス出力、および委譲の行に表現してください。
