    message_ja: 27–29行目と40–42行目にあるエリアレベルの入力、出力、およびdatastoreのリストを削除してください。図とセクション4および6にはすでにこれらの事実が保持されているため、リストは決定事項や制約を追加することなく、重複するメンテナンスポイントを追加してしまいます。
  - id: F002
    severity: minor
    rule: vp-arc-conciseness
    line: 241
    anchor: >-
      凡例は全体概要の「凡例（本プロダクト共通）」を参照する。`->`（戻りは `<-`）の通常線は情報、`material_flow` class
      の太線は商品の流れを表す。仕入記録は仕入計画の図と同じデータストアである。仕入グループは仕入記録の確定と同じプロセスで受入品の入荷数量を在庫記録へ直接反映する。返品対象がなければ `P-02-05` は起動せず、受入品がなければ
      `P-02-04` は起動しない。仕入記録の確定後、受入品があれば売場補充、返品対象があれば返品引渡しを行い、該当する条件付き経路をすべて完了することでグループが正常完了する。
    message: >-
      Shorten the diagram note by removing the repeated inventory-update description and conditional-process
      non-execution rules already stated in the process table and diagram; retain the legend reference, shared-store
      explanation, and the distinct requirement to complete every applicable conditional branch.
    message_ja: プロセス表と図ですでに述べられている、繰り返しのinventory-updateの説明およびconditional-processの非実行ルールを削除して、図の注釈を短縮してください。凡例の参照、shared-storeの説明、および適用可能なすべての条件分岐を完了させるという明確な要件は保持してください。
