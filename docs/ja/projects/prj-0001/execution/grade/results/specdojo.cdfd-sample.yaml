    anchor: "- 対象組織は店主代表と家族利用者代表、外部主体は仕入先である。システム境界は商品台帳の参照と仕入記録の更新までとし、在庫記録の更新、画面操作、物理項目、保存方式は対象外とする。"
    message: >-
      上位の `cdfd-overview-sample` と横断の `cdfd-uc-sample` は仕入グループから在庫記録への更新を定義している一方、本書は在庫記録の更新を対象外として `cdfd-inventory`
      へ委譲しているため、更新責務と入荷反映後のグループ順序を三文書で一意に統一してください。
  - id: F002
