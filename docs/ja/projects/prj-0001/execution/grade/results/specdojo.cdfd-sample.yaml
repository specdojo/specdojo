    message_ja: セクション3.1と3.2には説明パラグラフと入力/出力/datastoreのリストが残っていますが、cdfd-rulebookのセクション5、6.2、および7では、各エリアのサブセクションにはプロセス表のみを含める必要があります。リファレンスレシピやテンプレートに残っている古い構成に関わらず、現在のルールブックを示すように、この完成済みサンプルを更新してください。
  - id: F004
    severity: minor
    rule: vp-qe-kata-conformance
    line: 7
    anchor: "- 店主代表は、仕入計画と入荷検品の責任境界、必須・条件付きプロセスの起動条件、発注・受入に関する主要例外を承認する。"
    message: >-
