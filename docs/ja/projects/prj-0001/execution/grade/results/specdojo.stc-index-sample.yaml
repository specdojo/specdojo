    message: >-
      `stc-record-recovery` を分ける理由に「実施者が店主代表」とありますが、92行目の責任欄は「実施と証跡の照合は QE」としており矛盾します。記録の復元の操作者が店主代表で、照合と判定が QE
      であるなら、分割理由と責任欄の役割分担をその内容に揃える必要があります。
