  - id: F004
    severity: minor
    rule: vp-qe-verifiability
    line: 53
    anchor: "- 高: データ欠損・不整合、許容時間を超える停止、復旧不能な移行、代替不能な業務停止のいずれかがある。"
    message: 「高」の条件「データ欠損・不整合」と「中」の条件「補正・移行手順が必要」が重なり、補正で解消できる軽微な不整合を高と中のどちらにするか作成者によって分かれるため、「補正しても解消できない、または業務判断に誤りを生む不整合」など高の不整合の範囲を限定する必要がある。
    message_ja: 「高」の条件「データ欠損・不整合」と「中」の条件「補正・移行手順が必要」が重なり、補正で解消できる軽微な不整合を高と中のどちらにするか作成者によって分かれるため、「補正しても解消できない、または業務判断に誤りを生む不整合」など高の不整合の範囲を限定する必要がある。
  - id: F005
    severity: minor
    rule: vp-qe-omissions-consistency
    line: 24
    anchor: >-
      共通項目・必須性・型制約は [[specdojo:document-metadata-standard|ドキュメントメタ情報標準]] に従う。`type` は `project`、`rulebook` は
      `specdojo:imp-data-rulebook` とする。`based_on` には直接の根拠とした作成済みの `<project-id>:imp-business` を必須とし、追加の根拠もカタログの
      `depends_on` の推移閉包内に限る。
    message: >-
      `based_on` の追加根拠をカタログの depends_on
      の推移閉包内に限っているため、目的と適用範囲で識別子を求める変更要求そのものを直接の根拠として記録できず、メタデータ上の参照方法も定めていないので、変更要求の参照先（`based_on` の例外または `relations`
      等）を明記する必要がある。
    message_ja: >-
      `based_on` の追加根拠をカタログの depends_on
      の推移閉包内に限っているため、目的と適用範囲で識別子を求める変更要求そのものを直接の根拠として記録できず、メタデータ上の参照方法も定めていないので、変更要求の参照先（`based_on` の例外または `relations`
      等）を明記する必要がある。
