    line: 5
    anchor: 本ドキュメントは、業務分析・要求定義のために **帳票仕様を統一形式で記述する標準ルール**です。
    message: 上位文書（成果物リファレンス等）への参照と、schema 上 `ui`（画面・帳票仕様）とされる UIS との分担が書かれていないため、BDS を独立した成果物とする必要性を上位の根拠から説明できない。
