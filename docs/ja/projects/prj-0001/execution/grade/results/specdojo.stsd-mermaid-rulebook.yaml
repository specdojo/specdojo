  - id: F002
    severity: minor
    rule: vp-ba-business-value
    line: 5
    anchor: >-
      STSD の「状態遷移」章の図を Mermaid の `stateDiagram-v2` で一貫して記述するための記法ルールです。状態の意味と成立条件は同じ STSD
      の「状態一覧」、各遷移の詳細は「状態遷移」の遷移表を正本とします。
    message: 導入文と全体方針が記法を一貫させる手段だけを述べている。図を読む人（STSD の作成者・レビュー担当など）が状態遷移の全体像や分岐の漏れをどう確認しやすくなるか、という期待価値を一文で添えるべきである。
    message_ja: 導入文と全体方針が記法を一貫させる手段だけを述べている。図を読む人（STSD の作成者・レビュー担当など）が状態遷移の全体像や分岐の漏れをどう確認しやすくなるか、という期待価値を一文で添えるべきである。
