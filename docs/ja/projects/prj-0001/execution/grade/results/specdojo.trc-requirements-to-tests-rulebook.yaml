    message: 充足状況とギャップを生成元成果物または検証結果へ記録するとしているが、使用する成果物種別、フィールド、優先順位、競合時の扱いがなく派生不能なため、各出力カラムの生成元と変換規則を定義してください。
  - id: F009
    severity: major
