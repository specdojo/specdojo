  - id: F014
    severity: major
    rule: vp-ux-language-consistency
    line: 1
    message: >-
      `充足状況` を「テスト整備の達成状態」とだけ定義しているため、テストIDが存在する `未着手` や一部のテストだけが
      ready・成功した場合の意味を一意に解釈できず、対応関係・作成状態・実行結果を区別した用語と状態定義へ改めてください。
    anchor: "# トレーサビリティ（要求→テスト）作成ルール"
  - id: F001
    severity: major
    rule: vp-arc-cross-document-consistency
    line: 1
    message: >-
      参考 sample の `based_on` は `utc-index` と `itc-index` のみで、本文が参照元とする `req-2026-r1` と `atc-*` を含まず、「生成元となる要求・テスト仕様の ID
      配列」という本定義と整合しないため、全直接生成元を列挙する規則と sample を一致させてください。
    anchor: "# トレーサビリティ（要求→テスト）作成ルール"
