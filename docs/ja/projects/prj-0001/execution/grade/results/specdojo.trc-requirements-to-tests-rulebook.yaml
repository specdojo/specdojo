    line: 105
    anchor: "- 要求IDまたは対応テストIDが空の行を作成しない。"
    message: >-
      非手編集の派生ビューであるにもかかわらず、入力解決、状態・ギャップの導出、再生成の実行方法が rulebook・recipe・template のいずれにも定義されず、参考 sample
      も完成した適用例になっていないため、rulebook 内に適用契約を定義するか対応 recipe/template を宣言してください。
  - id: F012
    severity: major
    rule: vp-ux-readability
    line: 107
    anchor: "- ギャップを「なし」としながら対応テストIDが未記載の状態を許容しない。"
    message: 読者には充足状況・ギャップ・対応方針を記載するよう求めながら直接入力を禁止しており、どの元成果物をどの順序で更新してビューを再生成するか分からないため、入力成果物からレビューまでの手順と編集境界を明記してください。
  - id: F013
    severity: major
    rule: vp-ux-language-consistency
    line: 31
    anchor: "- 追加分割が必要な場合は `trc-requirements-to-tests-<term>` 形式を用いる。"
    message: >-
      `充足状況` を「テスト整備の達成状態」とだけ定義しているため、テストIDが存在する `未着手` や一部のテストだけが
      ready・成功した場合の意味を一意に解釈できず、対応関係・作成状態・実行結果を区別した用語と状態定義へ改めてください。
