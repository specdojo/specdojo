    anchor: "| 2   | トレース対象の前提   | ○    | 対象要求群・対象テスト群・除外範囲を明確化する |"
    message: 要求漏れを検出するための要求母集団とテスト関係を機械的に特定する必要があるのに、生成元を表す `based_on` が任意で代替の探索規則もないため、必須化するか成果物カタログ等からの決定的な入力解決規則を定義してください。
  - id: F006
    severity: major
    rule: vp-qe-omissions-consistency
    line: 52
    anchor: "| 2   | トレース対象の前提   | ○    | 対象要求群・対象テスト群・除外範囲を明確化する |"
    message: >-
      参考 sample の `based_on` は `utc-index` と `itc-index` のみで、本文が参照元とする `req-2026-r1` と `atc-*` を含まず、「生成元となる要求・テスト仕様の ID
      配列」という本定義と整合しないため、全直接生成元を列挙する規則と sample を一致させてください。
  - id: F007
    severity: major
    rule: vp-qe-omissions-consistency
    line: 87
    anchor: "- 充足状況は件数で集計し、未着手と一部充足を優先管理対象として明示する。"
    message: 「1行は1つの要求IDと対応テストIDの関係」とする line 11 に対して対応テストIDを複数可としており、行の粒度が矛盾するため、1関係1行または1要求1行のどちらかに統一してください。
  - id: F008
    severity: major
    rule: vp-qe-omissions-consistency
