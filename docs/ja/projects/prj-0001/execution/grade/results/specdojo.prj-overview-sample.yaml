    anchor: >-
      3. **Small Start, Improve Later（小さく始めて改善する）**:
      初期公開（店頭で使い始める最初の版の提供）では単一店舗の店頭運用に絞り、記録が安定してから仕入れ支援や分析を拡張する。拡張の要否は短期指標の結果を見て決める。
    message: 「初期公開」は店頭で使い始める最初の版の提供と定義されているが、指標の起点には「運用開始」が使われ、両者が同じ時点か別の時点か明示されていない。初期公開の定義に「初期公開の日を運用開始日とする」などの一文を加え、判定期間の起点を一つに揃える。
