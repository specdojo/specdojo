findings:
  - id: F001
    severity: minor
    rule: vp-po-decision-readiness
    line: 20
    anchor: とりわけ繁忙期は来店と取引が集中し、欠品・在庫・つけの確認負荷が一気に高まる。記憶と紙の運用のままでは繁忙期の負荷に対応しきれず、損失と属人化のリスクが顕在化するため、負荷が高まる前のこの時期に着手する必要がある。
    message: >-
      The busy season and "this period" are not given as a concrete time (for example, a month or a school-holiday
      period), so the deadline behind "why now" is unclear. State when the busy season falls and what point the work
      must be done by.
    message_ja: >-
      The busy season and "this period" are not given as a concrete time (for example, a month or a school-holiday
      period), so the deadline behind "why now" is unclear. State when the busy season falls and what point the work
      must be done by.
  - id: F002
    severity: minor
    rule: vp-pm-dependency-risk
    line: 41
    anchor: 下記の目標値は初期仮説であり、実測値に基づき継続的に見直す。欠品回数と在庫の無駄は、運用開始前1か月の実績をベースラインとする。季節、仕入れ条件、来店数などの影響も記録し、改善を本システムだけの成果とは断定せず寄与として評価する。
    message: >-
      The text says the targets are initial hypotheses but not which document confirms them. Name
      `prj-success-criteria-and-acceptance-criteria` as the hand-off target, as rulebook Section 6.7 requires.
    message_ja: >-
