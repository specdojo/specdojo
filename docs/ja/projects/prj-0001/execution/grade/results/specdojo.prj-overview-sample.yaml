    line: 106
    anchor: "- オフライン時の運用方針は _UNDECIDED_: 初期公開の計画で決定する。"
    message: >-
      未決事項（初期公開の日付、オフライン時の運用方針）の決定先が「初期公開の計画」とだけ書かれており、どの文書（wikilink）で、いつまでに決めるかが分からない。初期公開の日付は繁忙期の前に終える期限とベースライン測定の開始に関わるため、決定先の文書と決定期限（例:
      繁忙期開始の2か月前まで）を添える。
