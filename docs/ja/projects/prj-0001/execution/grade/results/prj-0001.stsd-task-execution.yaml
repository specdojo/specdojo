    severity: minor
    rule: vp-arc-technical-constraints
    line: 12
    anchor: "- 対象タスクのイベントログ（追記型イベント列）を再生して得る基本状態を正とする。イベントがないタスクの基本状態は `todo` とし、同時刻のイベントは状態遷移として成立する順に並べて再生する。"
    message: >-
      Identify the canonical same-timestamp replay-order contract or link to readAllEventFiles and
