  - id: F002
    severity: major
    rule: vp-arc-cross-document-consistency
    line: 75
    anchor: 着手解放の「操作権限」は、担当アクターからの要求、または強制操作を明示した人間からの要求を指す。完了報告にも同じ操作権限を要する。「差し戻し条件」は、人間からの要求であり、直接・間接の後続タスクに実行中・中断中・完了が一つもないことを指す。
    message: >-
      T-03 says the specified actor acquires work authority, and this paragraph grants subsequent operations to the
      assigned actor, but src/exec/events.ts foldEventsToState overwrites last_by for every event, including
      note/link/estimate, and canCompleteTask, canBlockTask, and canReleaseTask authorize against last_by. Consequently,
      A claiming a task followed by B adding a note gives B those permissions; reconcile this behavior with the
      documented actor contract.
    message_ja: >-
      T-03 says the specified actor acquires work authority, and this paragraph grants subsequent operations to the
      assigned actor, but src/exec/events.ts foldEventsToState overwrites last_by for every event, including
      note/link/estimate, and canCompleteTask, canBlockTask, and canReleaseTask authorize against last_by. Consequently,
      A claiming a task followed by B adding a note gives B those permissions; reconcile this behavior with the
      documented actor contract.
    cause:
      type: document
