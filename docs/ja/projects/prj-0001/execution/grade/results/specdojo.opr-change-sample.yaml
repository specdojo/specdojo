findings:
  - id: F001
    severity: minor
    rule: vp-dev-change-impact
    line: 87
    anchor: >-
      ロールバック条件に当たったら、`DEV`
      は原因を調べる前に直前の版や変更前の価格へ戻す。戻した後に適用の確認と同じ操作をして、変更前と同じく記録できれば戻しの完了とし、戻した理由を変更記録に書く。データの形が変わる版で戻せない場合は、適用前の手動バックアップから復元する。
    message: 手動バックアップから復元する手順の参照先（`opr-index` のバックアップ・リストア手順または `opr-backup-restore`）を明記し、導線表にも追加すると、変更が復元手順へ与える影響を追えるようになる。
    message_ja: 手動バックアップから復元する手順の参照先（`opr-index` のバックアップ・リストア手順または `opr-backup-restore`）を明記し、導線表にも追加すると、変更が復元手順へ与える影響を追えるようになる。
