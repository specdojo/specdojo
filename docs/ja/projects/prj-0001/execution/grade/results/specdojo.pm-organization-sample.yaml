    line: 10
    message: >-
      「計画・調整」の最終判断を PM に一括しているが、`pm-raci-sample.md` では費用・参加時間上限の A は PO、作業順序・課題・リスク管理の A は PM
      であるため、判断項目を分割して最終判断者を一致させてください。
    anchor: "| 計画・調整 | 作業順序、課題、費用・時間上限を管理する | PM       | PM             |"
