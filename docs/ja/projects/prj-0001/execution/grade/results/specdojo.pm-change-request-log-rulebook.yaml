  - id: F001
    severity: minor
    rule: vp-po-decision-readiness
    line: 57
    anchor: "- 審査結果は「承認・条件付き承認・却下・保留」のいずれかとし、決定者・決定日・実施条件と、`pm-plan` のスコープ・優先順位との対応を書く。"
    message: 審査結果「保留」を選んだ場合に、再審査の期限または条件と、追加で必要な判断材料を記録する基準がなく、保留が未決事項として追跡されないおそれがある。
    message_ja: 審査結果「保留」を選んだ場合に、再審査の期限または条件と、追加で必要な判断材料を記録する基準がなく、保留が未決事項として追跡されないおそれがある。
