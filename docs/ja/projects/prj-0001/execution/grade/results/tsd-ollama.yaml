    message: Ollama・モデル・mise・uvのライセンス、対応macOSとハードウェア、必要メモリ・ディスク容量、固定または更新するバージョン方針を明記する必要がある。
  - id: F012
    severity: minor
    rule: vp-arc-conciseness
    line: 80
    anchor: 複数Agentを使う場合、重いモデルを常時複数ロードしない方が安定するため、環境変数を設定して Ollama を起動する運用を採用する。
    message: macOSアプリには引き継がれない `export` 設定を削除するかCLI起動時専用として分離し、次章の `launchctl` 設定へ統合できる。
  - id: F013
    severity: minor
    rule: vp-dev-implementation-readiness
    line: 117
    anchor: >-
      内容は `ops/local/launchd/org.specdojo.ollama-env.plist` を参照。ログイン時に `launchctl setenv` で環境変数を設定し、Ollama.app
      を再起動する。app のログイン項目より先に起動しても、この再起動で環境変数が確実に反映される。
    message: >-
      `ops/local/launchd/org.specdojo.ollama-env.plist` を `~/Library/LaunchAgents/`
      へコピーする具体的コマンドと、既存ファイルを上書きする場合の扱いを追記する必要がある。
