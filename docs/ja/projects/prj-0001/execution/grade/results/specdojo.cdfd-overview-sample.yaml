findings:
  - id: F001
    severity: minor
    rule: vp-ba-stakeholder-clarity
    line: 21
    anchor: "## 3. プロセス領域"
    message: 共通 sample 文脈と参照先のプロジェクト概要では家族の店番利用者を「家族利用者代表」としているが、本書は未定義の「店番担当」を使用しているため、正式な役割名へ統一するか両者の対応を明記する必要がある。
  - id: F002
    severity: major
    rule: vp-dev-implementation-readiness
    line: 64
    anchor: "| `P-05` | 在庫確認 | 販売と入荷を在庫記録へ反映し、現在庫を確認できる状態に保つ。 | 店番担当（管理責任: 店主代表） | 販売または入荷が記録された |"
    message: 仕入側の `P-02` が在庫記録へ入荷数量を直接反映する一方、`P-05` も販売と入荷を同じ在庫記録へ反映するとされ、実装担当が入荷更新の単一責務・呼出順・重複更新防止条件を確定できない。
  - id: F003
    severity: major
    rule: vp-qe-verifiability
    line: 69
    anchor: 常連客を顧客台帳へ登録してつけ上限を定め、つけ台帳の残高を精算する。
    message: 仕入の `P-02` と在庫の `P-05` がともに入荷数量を在庫記録へ反映すると定義されているため、入荷時の更新責務を一方へ定め、他方を受け渡しまたは参照として表現しなければ更新の成否を一意に判定できない。
  - id: F004
    severity: minor
    rule: vp-qe-verifiability
    line: 50
    anchor: "| `P-03` | 店頭販売 | 現金販売を記録し、商品を顧客へ渡す。 | 店番担当（管理責任: 店主代表） | 顧客が商品を購入した |"
    message: "`P-03` の起点イベントを「顧客が商品を購入した」と完了後の表現にしているため、主要入力の「購入依頼と支払」のどの時点で店頭販売が開始したかを判定できるイベントへ修正する必要がある。"
  - id: F005
    severity: major
    rule: vp-qe-omissions-consistency
    line: 163
    anchor: つけ台帳 -->|"つけ残高"| 販売
    message: 主要入力の「仕入からの入荷数量」に対応する図のエッジが在庫グループへ到達せず `仕入 → 在庫記録` となり、さらに在庫グループも同じ在庫記録を更新しているため、単一の更新責務とそれに対応する受け渡し経路へ修正する必要がある。
  - id: F006
    severity: minor
