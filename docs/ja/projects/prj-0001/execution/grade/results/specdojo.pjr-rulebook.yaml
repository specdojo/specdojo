  - id: F001
    severity: minor
    rule: vp-qe-verifiability
    line: 199
    anchor: "### 5.4. 個票 status の遷移基準"
    message: >-
      個票 status の遷移基準の表は `register close` 時に必須節を満たす場合と `register reject` だけを定め、`_TODO_` が残ったまま close
      した場合（運用ガイドは「昇格せず警告して据え置く」とする）や `register defer`・`register reopen` 後の `status` を定めていないため、各遷移で `status`
      を維持・変更する条件を表に追加して pass / fail を判定できるようにする必要がある。
    message_ja: >-
      個票 status の遷移基準の表は `register close` 時に必須節を満たす場合と `register reject` だけを定め、`_TODO_` が残ったまま close
