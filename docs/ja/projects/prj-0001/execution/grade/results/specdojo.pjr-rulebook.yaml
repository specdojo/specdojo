findings:
  - id: F001
    severity: major
    rule: vp-qe-verifiability
    line: 91
    anchor: "- type 固有の構成は `todo` の概要・完了条件・作業内容・対応結果など、各 type 用テンプレートに従う。"
    message: >-
      `ready` 昇格と終端可否は「type 固有の必須節」を満たすことに依存する一方、各 `item_type` の必須節・必須記入欄を本文で列挙せず参照 ID のない「各 type 用テンプレート」に委ねているため、必須条件の
      pass / fail を決定できる定義または解決可能な参照を追加する必要がある。
  - id: F002
    severity: major
    rule: vp-qe-omissions-consistency
    line: 1
    anchor: "# プロジェクト登録簿 作成ルール"
    message: >-
      本文と schema は未定の owner / due を省略し、`deferred` では `completed_at` を持たない規則だが、`register-operation-guide.md` は
      Frontmatter に `_TODO_` を残し、`defer` 時にも完了日時を記録すると説明しているため、関連ガイドを正本と同じ保存規則へ修正しないと schema 違反または誤った履歴を生成する。
  - id: F003
    severity: minor
    rule: vp-qe-omissions-consistency
    line: 68
    anchor: "- 起票と終端は瞬間として記録し、`registered_at` / `completed_at` に UTC の RFC 3339・秒精度（`YYYY-MM-DDTHH:MM:SSZ`）で保存する。"
    message: >-
      「起票と終端」を `registered_at` / `completed_at` に保存するとする記述は、`deferred` は終端だが `completed_at`
      を持たないとする後段の例外規則と整合しないため、`completed_at` の対象を完了・決定・却下に限定して記述する必要がある。
  - id: F004
    severity: major
    rule: vp-qe-kata-conformance
    line: 16
    anchor: "- type 別テンプレートの選択と初期生成は `register add` が担うため、本 rulebook は単一の template を参照しない。"
    message: >-
      Frontmatter の `template: not-needed` は template が不要であることを表す一方、本文は `register add` が type 別 template を選択すると定め、実在する
      `pjr-*-template` 群もこの rulebook を参照しているため, 複数 template を表せるメタデータまたは解決可能なディスパッチ定義で対応関係を宣言する必要がある。
  - id: F005
    severity: minor
    rule: vp-ux-readability
    line: 1
    anchor: "# プロジェクト登録簿 作成ルール"
    message: >-
      `register-item-frontmatter.schema.yaml` と `register-events.schema.yaml` がファイル名だけで参照先パスまたはリンクを持たず、コマンドの選択基準を扱う
      register operation guide への案内もないため, 初見の読者が次に確認すべき正本へ直接移動できる導線を追加する必要がある。
  - id: F006
    severity: minor
    rule: vp-ux-language-consistency
    line: 193
    anchor: "- `type` / `item_status` / `priority` に schema 未定義の値を使用しない。"
    message: >-
      `type` は文書種別 `project`、`item_type` は登録項目分類として区別しているのに、禁止事項を含む複数箇所で登録項目分類を裸の「type」と表記しており両者を混同し得るため、`item_type`
      または「CLI の type は `item_type` を指す」という定義へ統一する必要がある。
