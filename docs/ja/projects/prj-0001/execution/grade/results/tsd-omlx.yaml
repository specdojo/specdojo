findings:
  - id: F001
    severity: minor
    rule: vp-po-purpose-alignment
    line: 3
    anchor: >-
      SpecDojo では、ローカル LLM の実行基盤として、Ollama（[[tsd-ollama]]）に加えて oMLX を技術スタックの一部として定義する。oMLX は Apple Silicon 向けの MLX
      推論サーバで、1 つのモデルを continuous batching で複数のリクエストに共有させられる。devcontainer 内の複数の opencode agent から同じモデルを並列に使う用途に向く。なお、oMLX
      の使用は必須ではない。
    message: oMLX の並列実行がプロジェクトの費用、情報管理、処理時間などのどの目的に寄与するかを、上位文書への参照とともに明記する必要がある。
