    line: 40
    anchor: "- `based_on` には移行判断に直接利用した上位成果物を列挙する。"
    message: "`based_on` に挙げる「上位成果物」が抽象的です。移行計画が前提にする上位成果物の種類（例: スコープ・要件・アーキテクチャ・運用設計など）を例示し、上流の依存と変更があったときの影響を特定できるようにしてください。"
    message_ja: "`based_on` に挙げる「上位成果物」が抽象的です。移行計画が前提にする上位成果物の種類（例: スコープ・要件・アーキテクチャ・運用設計など）を例示し、上流の依存と変更があったときの影響を特定できるようにしてください。"
  - id: F002
    severity: minor
    rule: vp-dev-change-impact
    line: 12
    anchor: >-
      - **共通の運用**: 役割の割り当ては適用先のメンバー定義に、`status`・承認・改訂と廃止・未決事項の引き継ぎは [[specdojo:document-metadata-standard|ドキュメントメタ情報標準]]
      に従う。文書の整形・lint はリポジトリの検証で扱い、移行の業務の検証に含めない。
    message: >-
      改訂と廃止を標準に委譲するだけで、自系統の追従対象と役割分担を定めていません。成功条件・判定点・スコープなどを変えたときに追従して見直す下流成果物（`dmd-*`/`mtp-*`/`cop-*`/`otp-*`）と担当 Role
      code を明記してください。
    message_ja: >-
      改訂と廃止を標準に委譲するだけで、自系統の追従対象と役割分担を定めていません。成功条件・判定点・スコープなどを変えたときに追従して見直す下流成果物（`dmd-*`/`mtp-*`/`cop-*`/`otp-*`）と担当 Role
