    anchor: >-
      PM は「配置の照合 → 契約整備 → 結合検証 →
      店舗試行・公開判断」の順で作業を割り当て、関係数と回復条件の未確定範囲から見積もる。日付は未設定であり、各判断時点を満たせない場合は後続開始を延期し、上表の担当・解消条件を進捗確認に使う。構成の採否、販売・保留・回復の条件、公開範囲の判断結果は
      `kinuya:pjr-a005-sales-approval` に残す想定とする。
    message: >-
      Consolidate the two trailing paragraphs (lines 148 and 150) into the §5 table rows to remove the duplicated
      PM/PJR/publication description.
    message_ja: >-
      Consolidate the two trailing paragraphs (lines 148 and 150) into the §5 table rows to remove the duplicated
      PM/PJR/publication description.
  - id: F005
    severity: minor
    rule: vp-arc-conciseness
    line: 137
    anchor: >-
      PO の合意依頼には ARC の境界・契約の照合、DEV の実装対応、QE の文書検査・描画確認と結合観測点、BA の両利用者による正常・保留時の確認、OPS の運用・公開前確認をそろえる。OPS
      は個人情報、認証情報、実店舗の内部接続先を公開候補から除外し、確認範囲と残る懸念を合意記録へ渡す。本例は架空の役割名・構成と仮参照名だけを扱う。PO が承認・保留・差し戻しと公開先・可否を記録し、人間が `ready`
      への昇格を判断する。境界・責務・受け渡し・成功基準に影響する上表の残件がある現状は `draft` を維持する。
    message: PO の最終合意・公開判断と OPS の公開前確認が11・126・133・137・139行で重複しているため、11行目の役割割当てと5章の表へ集約し、137行目と139行目末尾は参照に置き換えるべきである。
    message_ja: PO の最終合意・公開判断と OPS の公開前確認が11・126・133・137・139行で重複しているため、11行目の役割割当てと5章の表へ集約し、137行目と139行目末尾は参照に置き換えるべきである。
