  - id: F001
    severity: minor
    rule: vp-ba-business-value
    line: 7
    anchor: >-
      業務目的と成功基準は [[specdojo:prj-overview-sample|プロジェクト概要]]
      の「基本的な考え方」「期待効果」を根拠とする。本分割は、販売記録の完遂と両利用者の確認結果の一致を支える。正常販売では同じ明細・請求額・販売結果を確認でき、保存失敗・未印字・結果不明では未完了の取引を店主代表へ引き継げることを確認対象とする。在庫・つけを含むプロジェクト全体の成功は、本図だけでは判定しない。
    message: >-
      Explicitly state the problem's impact-if-unaddressed (業務への影響) in the body so the business-value chain is complete,
      not only referenced upward.
    message_ja: >-
      Explicitly state the problem's impact-if-unaddressed (業務への影響) in the body so the business-value chain is complete,
      not only referenced upward.
