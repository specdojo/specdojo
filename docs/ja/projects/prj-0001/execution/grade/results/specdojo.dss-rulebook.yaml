  - id: F004
    severity: minor
    rule: vp-qe-kata-conformance
    line: 139
    anchor: "- 推奨列: 対象の規則・正本キー / 対応する要求 / 確認方法 / 合格条件 / 担当。トークンの静的確認・部品表示・試作操作・利用者評価を使い分け、規則への適合と操作性目標の達成を別に確かめます。"
    message: >-
      検証の推奨列に合格条件を挙げているが、sample の検証の表に合格条件の列がなく型と完成例が対応していないため、合格条件を規則の表の確認条件で代替してよいかを rulebook に明記するか、sample
      の検証の表に合格条件を加えて整合させる。
