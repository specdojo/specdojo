  - id: F005
    severity: minor
    rule: vp-ux-language-consistency
    line: 73
    anchor: "### 6.2. 観点: 未確定停止"
    message: >-
      観点名「未確定停止」に対して意図は「会計確定後に印刷だけが失敗しても会計を取り消さず」であり、確定済みの会計を「未確定」と呼ぶ名称が内容と逆になって読み手を混乱させるため、`print-failure` に即した観点名（例:
      印刷失敗時の会計維持）にするか、stc-index の分配表と併せて名称を見直す必要がある。
