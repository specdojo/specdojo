    rule: vp-po-purpose-alignment
    line: 9
    anchor: >-
      - CPD は、上位図と上位の要求から分割の理由（Why）を引き継ぎ、コンポーネントの責務と境界で受け渡す情報（What）を定め、依存方向と失敗時の観測点（How）を示す。これらをコンポーネント名と関係 ID
      でたどれるようにする（Trace）。
    message: 上位の業務目的・成功基準を recipe がどこへ遡り、rulebook の上位文書群（メタ情報標準・命名標準・構成ガイド）とどう関係するかの参照先を一行で補うべきである。
