  - id: F001
    severity: minor
    rule: vp-pm-control-reporting
    line: 86
    anchor: "- 重大な不適合は課題または変更要求として登録し、是正完了または承認済み基準が認める期限付き例外の判断まで該当ゲートを通過させません。例外には理由、期限、人間の承認者、再判定条件を記録します。"
    message: >-
      The rulebook routes serious nonconformances to issues or change requests but never mentions risks, and names no
      Role code for reporting and registering; it should require anticipated quality risks to go to the risk register
      and name the Role code that reports and registers serious nonconformances (e.g. report to `PM`, who registers
      them), as the sample does.
