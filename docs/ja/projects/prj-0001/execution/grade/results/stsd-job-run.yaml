    message: >-
      The meanings and entry criteria for success, partial success, failure, and noop depend on receiving identically
      named result notifications, while their business selection and acceptance rules remain unconfirmed; define or
      reference the observable business facts that distinguish these outcomes before treating T-02 through T-05 as
      complete business requirements.
    message_ja: 成功、部分的な成功、失敗、およびnoopの意味とエントリ基準は、同一の名称を持つ結果通知を受け取ることに依存していますが、それらのビジネス上の選択および受け入れルールは未確認のままです。T-02からT-05を完全なビジネス要件として扱う前に、これらの結果を区別する観測可能なビジネス事実を定義または参照してください。
