findings:
  - id: F001
    severity: minor
    rule: vp-arc-cross-document-consistency
    line: 74
    anchor: Job Definitionはプロジェクトの`jobs_path`配下へ`job-<slug>.yaml`として配置し、ファイル名と`id`を一致させる案を基本とする。
    message: ファイル名とJob IDの一致は`job-definition-standard`で必須の判定基準だが、「案を基本とする」と任意に読めるため、必須規則として表現を統一する必要がある。
  - id: F002
    severity: major
    rule: vp-arc-cross-document-consistency
    line: 237
    anchor: "owner: TR"
    message: "`owner: TR` は `pm-roles.yaml` に存在しないため、Schedule taskと共通のRole codeを使うという方針に従い、登録済みRole codeへ置換する必要がある。"
  - id: F003
    severity: minor
    rule: vp-arc-conciseness
    line: 289
    anchor: >-
      - `task.mode:
      command`はrunnerがin-placeで直接実行する。`task.analysis`を持つ場合だけ成功後にreporterを起動し、redact・上限付きstdout/stderrを含むevidence本体を渡す。commandまたはanalysisの失敗はRun全体をfailedにする。
    message: command実行・analysis起動・失敗判定の説明が第3節と第4節を反復しているため、この節では現在未対応の差分と実装上の制約だけを残して前節を参照する形へ整理する必要がある。
  - id: F004
    severity: major
    rule: vp-qe-done-criteria
    line: 294
    anchor: ""
    message: 設計制約ごとの検査方法、対象テスト、期待結果, またはテスト設計への参照がないため、DC-004「テスト設計・検証観点の参照として使えること」を確認できない。
  - id: F005
    severity: major
    rule: vp-qe-verifiability
    line: 294
    anchor: ""
    message: Job生成、重複排除、precondition、retry、checkpoint、権限・秘密情報の各制約について検証手段と期待結果を対応付けた検証観点を追加する必要がある。
  - id: F006
    severity: major
    rule: vp-qe-omissions-consistency
    line: 294
    anchor: ""
    message: "`sysd-rulebook`で必須の検証観点・関連文書がなく、`sysd-index`、横断ルール、テスト設計、運用ガイド、`job-definition-standard`への解決可能な導線を追加する必要がある。"
  - id: F007
    severity: minor
    rule: vp-ux-readability
    line: 124
    anchor: >-
      決定論的な処理は`task.mode:
      command`とし、入力を展開する`task.command`を必須にする。対象選択を伴う処理では任意の`task.precondition`をRun保存前に実行し、空出力または指定終了コードならJob
      Runと付随成果物を作らずskipする。runnerはmaterialize済みコマンドをPOSIX環境では`/bin/sh
      -eu`で直接実行し、コマンド、終了コード、標準出力、標準エラーをevidenceへ記録する。stdout / stderr
      はredact・上限付きログへの参照と、その参照先と同じbounded内容をevidence本体へ保持する。終了コードが0以外なら、その値からRunを直接`failed`と判定しagentは起動しない。結果の解釈が必要な場合だけ`task.analysis.agent`と`task.analysis.description`を指定し、成功時のcommand
      evidence本体をreporterへ渡す。これによりreporterは作業ツリーや参照先ログを追加で読むことなく出力を解釈できる。analysisを省略した場合はrunnerがresultを確定する。同じprojectの`specdojo
      exec`を子プロセスで呼ぶcommandでは、親runnerのproject実行lock tokenとowner tokenの一致を検証してlockを継承し、自己デッドロックを避けながら排他範囲を維持する。
    message: precondition、shell実行、evidence、失敗判定、analysis、lock継承という複数論点が一段落に集中しているため、小見出しまたは表へ分割して条件と結果を対応付ける必要がある。
  - id: F008
    severity: major
    rule: vp-ux-user-flow
    line: 31
    anchor: ""
    message: "`job-definition-standard`をSSOTとして示しているがリンクがなく、関連文書一覧も存在しないため、実装者・検証者・運用者が必要な正本へ到達できるリンク付き導線を追加する必要がある。"
  - id: F009
    severity: minor
    rule: vp-ux-language-consistency
    line: 74
    anchor: Job Definitionはプロジェクトの`jobs_path`配下へ`job-<slug>.yaml`として配置し、ファイル名と`id`を一致させる案を基本とする。
    message: 冒頭では実装済みと宣言している一方で「案を基本とする」「追加し」「既定案」と未確定に見える表現が残るため、現行仕様と将来案を明示的に区別する必要がある。
  - id: F010
    severity: major
    rule: vp-ux-language-consistency
    line: 237
    anchor: "owner: TR"
    message: 翻訳Job例の`TR`はプロジェクトで定義されたRole codeではなく、ownerの語彙を混乱させるため登録済みRole codeへ統一する必要がある。
