    anchor: "- 対象: 店舗が仕入先へ発注し、納品を受けた商品"
    message: 対象「納品を受けた商品」の単位（納品ロット単位か個品単位か）が定義されておらず、受入・返品は数量付きの納品単位、販売は顧客への引渡し単位で判定しているため、一部だけ販売・一部だけ不合格のときに現在状態を一意に決められない。対象の単位と、分割時の扱いを「適用範囲」または「状態の判定」に明記する。
