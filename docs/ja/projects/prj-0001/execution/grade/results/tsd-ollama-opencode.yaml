  - id: F001
    severity: major
    rule: vp-po-decision-readiness
    line: 7
    anchor: >-
      本構成は、Host Mac 上で動く Ollama を devcontainer 内の opencode から利用するための接続定義である。Ollama は OpenAI互換の `/v1/*` API
      を提供しており、SpecDojo の opencode 連携では `opencode.json` の custom provider 方式に合わせて OpenAI互換 API を標準とする。
    message: custom provider 方式を標準とする判断について、代替方式との比較、影響範囲、承認者、未決事項、承認後の次アクションが記載されていない。
