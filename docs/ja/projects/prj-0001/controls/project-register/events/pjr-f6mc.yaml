    - field: input
      from: ""
      to: "[\"発端は利用者のプロジェクト coderdojo-lessons-specdojo（SpecDojo 0.9.2、2026-11-21）。\",\"本家へ起票するため .specdojo/specdojo.local.config.json に `external_projects` だけを書いたところ、register add が「unknown key `\\\"external_projects\\\"` (allowed: version, projects)」「version must be 1」で止まった。\",\"specdojo-config-reference の `external_projects` の節は、ローカル設定で書けないことに触れていない。利用者のプロジェクトでは、共有の specdojo.config.json に `external_projects`（path: ../specdojo）を置いて回避した。\"]"
