    - field: title
      from: ""
      to: オーケストレーターが自分で、または subagent で項目を実装する手順を skill にする
    - field: description
      from: ""
      to: オーケストレーターが自分で実装する手順が playbook と判断に頼り、回ごとにぶれる。worktree と feature ブランチを作り、自分か subagent で実装し、検査・保護された設定の確認・commit・承認後の merge・片付けまでを skill に固定する。
    - field: input
      from: ""
      to: '["skill の正本は .agents/skills/`<skill-name>`/SKILL.md に置く。Codex はリポジトリの .agents/skills を標準で読む（https://developers.openai.com/codex/skills）。",".claude/skills/`<skill-name>`/SKILL.md は、frontmatter と正本を最初に読んで従う指示だけの薄いラッパーにする。シンボリックリンクは Windows と npm の配布で動きが怪しいため使わない（indie の決定、2026-11-22）。読み落としが起きたら、本文を写して lefthook で一致を保つ方式へ移す。","subagent での実装は Claude Code の skill の context: fork と agent で指定できる（https://code.claude.com/docs/en/skills）。skill 全体は fork させず、実装の段だけを subagent に渡し、検査と確認はオーケストレーターが行う。","作業は worktree を作り feature/`<project-id>`/`<topic>` で行う。いまの作業ツリー（develop）は runner の統合と記帳に使うため切り替えない（indie の決定、2026-11-22）。","SpecDojo のコマンドには、register の項目を worktree で準備・commit・統合する段のコマンドがない（exec worktree prepare/commit/merge は --task のみ）。段のコマンドは DEF1 の続きとして別に扱う。","実装者は specdojo-orchestrator（indie の指定、2026-11-22）。.agents/skills と .claude は executor が書けない保護された場所のため、この項目を skill の最初の利用例にする。"]'
