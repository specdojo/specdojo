  reason: section "背景" updated
  changes:
    - field: section
      from: ""
      to: 背景
    - field: description
      from: SpecDojo を OSS として広め、kata で仕様と要件を復元し、確認状態と人の確定と記録で理解の負債を解消することを中核の位置づけにする。最初の実証の場は OpenFisca-Japan
      to: SpecDojo は OSS として広め、シビックテックを持続可能にすることを目指す（[[prj-0001:prj-overview\|プロジェクト概要]] の CH-01・BV-03）。2026-11-23 の位置づけの見直し（PJR-36QG の `3.16.`）では、価値の中心を「kata による成果物の標準化」と「プロダクトから分けた環境での記録と継続」に寄せた。BMAD・Spec Kit・Kiro などの競合は主に「AI で速く作る」を解いており、シビックテックで先に詰まる「作った後に理解が失われ、引き継げなくなる」問題（理解の負債）を正面から扱うものは少ない。AI がコードを速く書くほど、この負債は速くたまる。
  previous_event_id: reg_1354525c979746f8975670de34dfae57
