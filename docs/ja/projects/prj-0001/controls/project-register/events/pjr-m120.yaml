      to: 登録簿の専用ブランチへの push を受け持つ register branch-push を足す
    - field: description
      from: ""
      to: 登録簿の同期（`register_sync`）では、`register ... --commit` と `exec run` が専用ブランチへ自動で push する。一方、初回の専用ブランチの作成と push、同期に失敗したときの復旧は、ガイドで素の `git branch`・`git pull --rebase`・`git push` を手で打つ手順になっている。素の `git push` はどのブランチへも push できるため、オーケストレーターには許していない。push を、設定の remote と branch だけに絞った専用のコマンドで受け持ち、オーケストレーターが素の `git push` を打たずに同期を始め・直せるようにする。
