      to: '["利用者の要望（2026-11-25）: 起票を専用ブランチへ push する運用を、prj-0001 と prj-0002 の間で始めたい","利用者の提案と判断（2026-11-25）: register の git の push は specdojo の専用コマンドを作った方がよい。コマンドを作ってから同期を始める（案 B）。全件レビュー（PJR-0BGE）は止めずに並行して進める","同期の設定（2 つの project の specdojo.config.json・CLAUDE.md・オーケストレーターの本文・check-register-push.yml・lefthook.yml）の差分は、オーケストレーターが ../worktrees/feature-prj-0001-register-sync と ../worktrees/feature-prj-0002-register-sync に用意してある（未 commit）。この項目では変えない","担当と期限は利用者の確認待ち"]'
