    - field: input
      from: ""
      to: '["sch-rulebook は strategy と成果物カタログを SSOT とし、生成後の `sch-track-<track>.yaml` を直接編集しないと定め、禁止事項にも挙げている。schedule-design-guide は agent を --executor-by、strategy の phase の agent（`owner_rules[].phase_overrides[].agent` で成果物ごとに上書き）、自動選択の順で解決すると書く。","2026-11-18 にオーケストレーターが sch-track-kata-slim-2.yaml の agent.executor を直接編集した（commit b210e5b5a）が、エラーにも警告にもならず、runner は strategy の段の指定で claim した。track の鮮度は strategy とのファイル更新時刻だけで判定している（src/exec/run/schedule-mode.ts の findStaleGeneratedTracks）。","src/exec/schedule/schedule.ts の ready を作る処理は resolveAgentAssignment（strategy 由来）で task.agent を無条件に上書きする。src/exec/task-view.ts と src/exec/run/schedule-mode.ts は track の task.agent を先に使い、未指定のときだけ strategy から解決する。","schedule-design-guide の「トラックへ展開する情報」の表に agent がないが、src/schedule/build.ts は phase の agent と `phase_overrides` の agent を track へ展開している。","PJR-X21W は track の指定を優先させる方向で起票したが、strategy を正本とする規則に照らして reject し、本項目へ引き継いだ。"]'
