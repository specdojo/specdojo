      to: '["ホストの script は小さくし、本体は SpecDojo の npm で配る script で動かしたい（利用者の要望、2026-10-31）","本体は bash の script とし、TypeScript にはしない。ホストで node を要らなくするため（2026-10-31 の対話で推奨の B を採用）","本体の置き場所は CLI のコマンドで workspace の .specdojo/host/ へ書き出す方式とする。`node_modules` を直接呼ぶ方式は PJR-TATP の named volume 化と両立しないため採らない","止まっているコンテナは docker start で起こし、devcontainer up はコンテナが無いときだけ利用者のログインシェル経由で動かす。`SPECDOJO_NODE_BIN` で上書きできるようにする","コンテナ内の作業ディレクトリは docker inspect のマウント情報から、実行ユーザーは devcontainer.json の remoteUser から求める","対応 OS は mac・Linux・Windows の WSL2 とする。ネイティブの Windows（PowerShell・Git Bash）は対象外とし、要望が出てから検討する","書き出すコマンドの名前（仮: specdojo devcontainer host-script）と書き出し先のファイル名は executor が決め、理由を個票の対応結果に記録してよい"]'
