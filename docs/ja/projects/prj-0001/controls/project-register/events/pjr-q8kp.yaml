      to: ホストから tmux へ入る script の本体を SpecDojo から配る
    - field: description
      from: ""
      to: ホストの ~/bin/specdojo-tmux は node の PATH 設定などを含み分かりにくい。本体を SpecDojo が配る bash の script とし、workspace の .specdojo/host/ へ書き出す。ホスト側は workspace のパスを渡して本体を呼ぶ数行に縮める。通常の接続では node を要らなくし、対応 OS は mac・Linux・Windows の WSL2 とする
    - field: input
