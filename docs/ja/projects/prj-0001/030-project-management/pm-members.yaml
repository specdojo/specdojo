# yaml-language-server: $schema=../../../../specdojo/schemas/v1/pm-members.schema.yaml
id: prj-0001:pm-members
type: project
status: ready
title: メンバー名簿
rulebook: specdojo:pm-members-rulebook
based_on:
  - specdojo:people-and-organization-definition-standard
  - prj-0001:pm-organization
  - prj-0001:pm-roles
version: 1
project_id: prj-0001

# Member は、実際に作業する人間または agent を表す。
# roles には対応する Role code のリストを指定する。兼務の場合は複数記載する。
# タスク側の owner には pm-roles.yaml に存在する Role code を使う。
#
# type: agent のメンバーは、全員 stage_role（executor / reporter）を持つ pipeline
# メンバーとする。単体で edit/review を完結する legacy 構成（stage_role なし）は
# 廃止した。sch-strategy-<track>.yaml の phase は agent_pipeline（executor + reporter
# の2段構成）を必須とする。
#
# stage_role: executor は成果物の編集・検証を担当し、result は更新しない。
#   mode: edit    はさらに成果物への書き込みを許可する。
#   mode: review  は成果物への書き込みを禁止する（読み取り専用で調査し、evidence だけを残す）。
# stage_role: reporter は、executor の evidence から構造化 result を作るだけで、
#   ファイルへは一切書き込まない（result への書き込みは runner が行う）。reporter の
#   振る舞いは edit/review で変わらないため、選択条件としての mode（taskMode との
#   一致判定）は課さない。provider の command_template が {mode} を使う場合（claude 等）
#   は、reporter 専用の permission profile を選ぶために mode: report を使用する。
#
# provider は agent を実行する CLI 種別を表す（opencode / claude / codex / copilot / custom）。
# capabilities はツールアクセス（web_search 等）のみを表す。
#
# 起動コマンドは .specdojo/exec-defaults.yaml の providers.<provider>.command_template
# を member 属性（nickname / mode / proficiency）で展開して解決するため、member には
# 書かない。command はテンプレートを持たない構成（provider: custom 等）専用の上書き。
# priority は、stage_role・proficiency・必須 capabilities が一致した候補間で昇順に評価する。
#   normal                  : Qwen -> Gemma -> Codex -> Claude
#   expert                  : Qwen -> Gemma -> Codex -> Claude
#
# disabled: true を指定した agent は exec run --auto の候補選択（rate limit 時の
# フォールバックを含む）から一時的に除外される。member 定義を削除せずに特定 provider
# だけを残してテストしたい場合（例: codex の rate limit 動作確認時に他 agent を止める）
# に使う。省略時または false は通常どおり選択対象になる。

