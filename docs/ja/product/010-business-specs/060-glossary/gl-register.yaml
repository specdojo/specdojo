# yaml-language-server: $schema=../../../../specdojo/schemas/v1/gl.schema.yaml
id: gl-register
type: glossary
rulebook: specdojo:gl-rulebook
title: 用語集（登録簿）
locale: ja
status: ready
terms:
  - id: tm-register-entry
    term: 登録項目
    englishName: register item
    aliases: [登録簿項目]
    definition: 登録簿で作業・課題・懸念・問い・判断・記録を個別に追跡する管理単位。
    notes: 登録簿・起票・記帳の基本定義は [[gl-common|用語集（共通）]] を正本とする。Schedule の計画済みタスクを重複登録しない。
    relatedTerms: [tm-register-ticket, tm-register-item-type, tm-register-item-status]
    source: "[[prj-0001:bdd-register-entry|業務データ辞書（登録項目個票）]]"
  - id: tm-register-ticket
    term: 登録項目個票
    englishName: register ticket
    aliases: [個票]
    definition: 一つの登録項目の現在値、入力、対応結果、判断の証跡を保持する正本の文書。
    notes: 構造化した現在値は Frontmatter の `specdojo` 配下、タイトル・概要・入力・完了条件・対応結果は本文に置く。一覧は派生ビュー、変更履歴は別のイベント記録とする。所属登録簿は `part_of` で示す。
    category: tm-register-entry
    relatedTerms: [tm-register-item-id, tm-register-event]
    source: "[[specdojo:pjr-rulebook|プロジェクト登録簿 作成ルール]]、`src/register/item.ts`"
  - id: tm-register-item-id
    term: 登録項目表示 ID
    englishName: register item ID
    aliases: [PJR-ID]
    definition: 同一プロジェクト内の登録項目を識別し、CLI 操作や項目間参照に使う短い識別子。
    notes: "`PJR-XXXX` 形式で `--id` に指定する。別プロジェクトの派生元・先行項目は `<project-id>:PJR-XXXX` で参照する。個票の文書 ID（`id`）はプロジェクトと主題を含み、表示 ID と区別する。形式の正本は schema とする。"
    category: tm-register-entry
    relatedTerms: [tm-register-derived-from, tm-register-dependency]
    source: "`docs/specdojo/schemas/v1/register-item-frontmatter.schema.yaml` の `id`・`LocalRegisterItemRef`・`QualifiedRegisterItemRef`、`src/register/item.ts`"
  - id: tm-register-item-type
    term: 登録項目の分類
    englishName: item type
    aliases: [登録項目の種別]
    definition: 何を追跡し、どの結果をもって通常の追跡を終えるかを分ける登録項目の区分。
    notes: "`item_type` に保持し、CLI では `--type` で指定する。分類ごとの使い分けは分類一覧、終了判断は状態定義を参照する。許容値の正本は schema の `ItemType` とする。"
    category: tm-register-entry
    source: "[[prj-0001:cdt-register-type|分類一覧（登録項目の種別）]]、`docs/specdojo/schemas/v1/register-item-frontmatter.schema.yaml#/$defs/ItemType`"
  - id: tm-register-todo
    term: todo
    englishName: todo
    aliases: [作業]
    definition: 実施することが決まっている具体的な作業を追跡する登録項目の分類。
    notes: やるかどうか自体が未定なら問いまたは判断を使う。
    category: tm-register-item-type
    relatedTerms: [tm-register-question, tm-register-decision, tm-register-done]
  - id: tm-register-epic
    term: epic
    englishName: epic
    aliases: [エピック]
    definition: 一つのトラック全体の計画と、着手・完了の判断を担う登録項目の分類。
    notes: "必ず 1 つの track（[[gl-planning|用語集（計画）]]）と結び付け、対象の領域と着手予定日も epic だけが持つ。具体的な作業は子の項目で行い、epic 自身は実行の対象にしない。完了は、子の項目と Schedule を見て人が判断する。"
    category: tm-register-item-type
    relatedTerms: [tm-register-todo, tm-register-derived-from, tm-register-done]
    source: "[[prj-0001:pjr-njj7-register-epic-track-governance|エピックによるトラック管理の決定]]、`docs/specdojo/schemas/v1/register-item-frontmatter.schema.yaml`、`src/register/epic.ts`"
  - id: tm-register-question
    term: question
    englishName: question
    aliases: [問い, 質問]
    definition: 回答や確認が必要な事項を追跡する登録項目の分類。
    notes: 回答が確定したら決定済みとする。回答から方針選択や作業が生じたら、判断または作業を別に起票する。
    category: tm-register-item-type
    relatedTerms: [tm-register-decision, tm-register-decided]
  - id: tm-register-risk
    term: risk
    englishName: risk
    aliases: [リスク]
    definition: まだ顕在化していない懸念を追跡する登録項目の分類。
    notes: 顕在化したら課題として起票する。対応完了または受容の判断で追跡を終える。
    category: tm-register-item-type
    relatedTerms: [tm-register-issue, tm-register-done]
  - id: tm-register-issue
    term: issue
    englishName: issue
    aliases: [課題]
    definition: すでに発生している問題を追跡する登録項目の分類。
    category: tm-register-item-type
    relatedTerms: [tm-register-risk, tm-register-done]
  - id: tm-register-change-request
    term: change-request
    englishName: change-request
    aliases: [変更要求]
    definition: 承認済みの成果物・仕様・計画を変える要望を追跡する登録項目の分類。
    notes: 選択肢の比較を伴っても既存合意の変更を求める場合に使う。採択した変更の反映と必要な確認を終えて完了とする。
    category: tm-register-item-type
    relatedTerms: [tm-register-decision, tm-register-done]
  - id: tm-register-decision
    term: decision
    englishName: decision
    aliases: [判断, 決定事項]
    definition: 既存合意の変更要求を除き、当該領域の意思決定者が選択肢から方針を決める事項を追跡する登録項目の分類。
    notes: 決定内容と理由・承認の証跡を残して決定済みとする。決定後の作業は別に起票する。分類の `decision` と処理状態の `decided` を区別する。
    category: tm-register-item-type
    relatedTerms: [tm-register-change-request, tm-register-decided, tm-register-conclusion]
  - id: tm-register-note
    term: note
    englishName: note
    aliases: [記録, 共有記録, 備忘]
    definition: 共有・備忘のために、起票済みのまま内容を継続更新する登録項目の分類。
    notes: 審査・終了承認の対象とせず、対応・回答・判断が必要なら目的に合う別項目を起票する。
    category: tm-register-item-type
    relatedTerms: [tm-register-open, tm-register-update]
    source: "[[prj-0001:pjr-s5ya-register-item-type-lifecycle|分類別ライフサイクルの決定]]、`src/register/update.ts`"
  - id: tm-register-item-status
    term: 登録項目の処理状態
    englishName: item status
    definition: 登録項目の対応・判断の現在位置と、追跡を続ける必要性を表す区分。
    notes: "活動中は起票済み・対応中・待機中・審査待ち、終端は完了・決定済み・却下・延期。個票の文書成熟度やタスク実行状態とは別に管理する。終了と再開は人が判断する。"
    category: tm-register-entry
    relatedTerms: [tm-register-operation]
    source: "[[stsd-register-entry|ステータス定義（登録項目個票）]]、`docs/specdojo/schemas/v1/register-item-frontmatter.schema.yaml#/$defs/ItemStatus`"
  - id: tm-register-open
    term: 起票済み
    englishName: open
    aliases: [未着手]
    definition: 起票または再開され、対応に着手していない登録項目の処理状態。
    notes: 記録の分類では、継続して更新する生きている記録を表し、対応漏れを意味しない。
    category: tm-register-item-status
    relatedTerms: [tm-register-note, tm-register-operation]
  - id: tm-register-in-progress
    term: 対応中
    englishName: in-progress
    definition: 担当者または AI Agent が対応・調査している登録項目の処理状態。
    category: tm-register-item-status
    relatedTerms: [tm-register-operation, tm-register-wait]
  - id: tm-register-waiting
    term: 待機中
    englishName: waiting
    aliases: [保留]
    definition: 外部回答、前提解消、失敗復旧、審査材料の補完を待つ登録項目の処理状態。
    notes: 活動中の状態であり、追跡を停止する延期とは区別する。
    category: tm-register-item-status
    relatedTerms: [tm-register-block-reason, tm-register-deferred]
  - id: tm-register-review-status
    term: 審査待ち
    englishName: in review
    definition: 対応結果について人間の審査・承認を待つ登録項目の処理状態。
    notes: "状態の値は `review`。タスク実行の成功だけでは終了を意味しない。完了可否レビューの定義は [[gl-quality|用語集（評価とレビュー）]] を参照する。"
    category: tm-register-item-status
    relatedTerms: [tm-register-submit-review, tm-register-close]
  - id: tm-register-done
    term: 完了
    englishName: done
    definition: 対応と必要な確認を終え、追跡を終了した登録項目の処理状態。
    notes: 作業・エピック・リスク・課題・変更要求の通常の終了先とする。
    category: tm-register-item-status
    relatedTerms: [tm-register-operation, tm-register-completed-at]
  - id: tm-register-decided
    term: 決定済み
    englishName: decided
    definition: 判断または問いの決定・回答が確定し、追跡を終了した登録項目の処理状態。
    category: tm-register-item-status
    relatedTerms: [tm-register-decision, tm-register-question, tm-register-operation]
  - id: tm-register-rejected
    term: 却下
    englishName: rejected
    definition: 実施・回答・判断の対象外または不採択と判断して、追跡を終了した登録項目の処理状態。
    category: tm-register-item-status
    relatedTerms: [tm-register-operation, tm-register-completed-at]
  - id: tm-register-deferred
    term: 延期
    englishName: deferred
    definition: 再開条件または再評価時期を定め、現時点での追跡を停止した登録項目の処理状態。
    notes: 遷移上は終端だが、完了日時を新たに付与しない。完了・決定済み・却下とは区別する。
    category: tm-register-item-status
    relatedTerms: [tm-register-operation]
  - id: tm-register-operation
    term: 登録簿の操作
    englishName: register operation
    definition: 登録項目の処理状態や内容を変更し、対応の開始・待機・審査・終了・再開と記録の更新を行う操作の総称。
    notes: "状態を変える操作（start・wait・review・close・reject・defer・reopen）と、状態を変えずに内容を変える update がある。CLI が受け付けただけで、人が承認したとは扱わない。"
    category: tm-register-entry
    relatedTerms:
      [tm-register-item-status, tm-register-conclusion, tm-register-wait, tm-register-update]
    source: "[[specdojo:register-operation-guide|登録簿運用ガイド]]、[[stsd-register-entry|ステータス定義（登録項目個票）]]、`docs/specdojo/schemas/v1/register-item-frontmatter.schema.yaml`、`src/register/transition-commands.ts`、`src/register/create-commands.ts`、`src/register/update.ts`"
  - id: tm-register-start
    term: register start
    englishName: register start
    aliases: [登録項目の着手]
    definition: 活動中の登録項目を対応中へ移す操作。
    notes: "`register start --id` に対応する。待機中からの対応の再開にも使う。終端の項目は先に `register reopen` で戻す。"
    category: tm-register-operation
    relatedTerms: [tm-register-in-progress, tm-register-reopen]
    source: "`src/register/transition-commands.ts`、[[stsd-register-entry|ステータス定義（登録項目個票）]]"
  - id: tm-register-submit-review
    term: register review
    englishName: register review
    aliases: [登録項目の審査提出]
    definition: 活動中の登録項目を、人の審査を待つ審査待ちへ移す操作。
    notes: "`register review --id` に対応する。対応結果・検証結果・承認の対象・証跡を確かめられることを前提とする。"
    category: tm-register-operation
    relatedTerms: [tm-register-review-status, tm-register-close]
    source: "`src/register/transition-commands.ts`、[[stsd-register-entry|ステータス定義（登録項目個票）]]"
  - id: tm-register-close
    term: register close
    englishName: register close
    aliases: [登録項目の終了]
    definition: 対応結果・決定・回答を確かめ、登録項目を完了または決定済みへ移す操作。
    notes: "`register close --id` に対応する。既定の終了先は decision と question が `decided`、ほかが `done`。note は終了させない。結論・完了日時と人の承認の証跡を残す。"
    category: tm-register-operation
    relatedTerms: [tm-register-done, tm-register-decided, tm-register-conclusion]
    source: "`src/register/transition-commands.ts`、[[stsd-register-entry|ステータス定義（登録項目個票）]]"
  - id: tm-register-reject
    term: register reject
    englishName: register reject
    aliases: [登録項目の却下]
    definition: 不採択などの判断により、活動中の登録項目を却下へ移す操作。
    notes: "`register reject --id` に対応する。note には使わない。判断の理由と完了日時を残す。"
    category: tm-register-operation
    relatedTerms: [tm-register-rejected, tm-register-conclusion]
    source: "`src/register/transition-commands.ts`、[[stsd-register-entry|ステータス定義（登録項目個票）]]"
  - id: tm-register-defer
    term: register defer
    englishName: register defer
    aliases: [登録項目の延期]
    definition: 再開の条件や見直しの時期を定め、活動中の登録項目を延期へ移す操作。
    notes: "`register defer --id` に対応する。note には使わない。延期の理由を結論に、見直しの条件を本文に残す。完了日時は付けない。"
    category: tm-register-operation
    relatedTerms: [tm-register-deferred, tm-register-reopen]
    source: "`src/register/transition-commands.ts`、[[stsd-register-entry|ステータス定義（登録項目個票）]]"
  - id: tm-register-reopen
    term: register reopen
    englishName: register reopen
    aliases: [登録項目の再開]
    definition: 終端の登録項目を活動中へ戻す操作。
    notes: "`register reopen --id` に対応する。既定の戻り先は `open` で、`--status` で活動中の状態を選べる。完了日時を消し、前の結論は残す。待機中からの再開（`register start`）とは区別する。"
    category: tm-register-operation
    relatedTerms: [tm-register-start, tm-register-close]
    source: "`src/register/transition-commands.ts`、[[stsd-register-entry|ステータス定義（登録項目個票）]]"
  - id: tm-register-wait
    term: register wait
    englishName: register wait
    aliases: [登録項目の待機]
    definition: 活動中の登録項目を、外部回答や復旧などを待つ待機中へ移す操作。
    notes: "`register wait --id --reason` に対応する。再開条件は本文へ記録する。"
    category: tm-register-operation
    relatedTerms: [tm-register-waiting, tm-register-block-reason]
    source: "`src/register/transition-commands.ts`、[[stsd-register-entry|ステータス定義（登録項目個票）]]"
  - id: tm-register-update
    term: register update
    englishName: register update
    aliases: [登録項目の更新]
    definition: 登録項目の処理状態と分類を維持したまま、題名・担当・優先度・期限・結論・入力・依存などの内容を変更する操作。
    notes: "`register update --id` に対応し、終端の項目も更新できる。分類（`item_type`）は変えられない。処理状態を変える場合は専用の遷移操作を使う。"
    category: tm-register-operation
    relatedTerms: [tm-register-ticket, tm-register-event]
    source: "`src/register/create-commands.ts`、`src/register/update.ts`"
  - id: tm-register-event
    term: 登録項目イベント
    englishName: register event
    definition: 登録項目に加えた操作・変更内容を、実行者・理由・日時とともに追記する監査履歴。
    notes: "個票とは別のファイルに、操作ごとに追記する。操作の種類、前後の処理状態、変えた項目を残す。状態が変わらない更新も含む。今の状態の正本は個票で、記録した実行者が承認者とは限らない。"
    category: tm-register-entry
    relatedTerms: [tm-register-ticket, tm-register-item-status, tm-register-update]
    source: "`docs/specdojo/schemas/v1/register-events.schema.yaml`、`src/register/events.ts`"
  - id: tm-register-priority
    term: 対応優先度
    englishName: priority
    definition: 他の作業や判断への影響と期限を踏まえ、登録項目の対応順を判断する目安。
    notes: "`priority` に保持し、`--priority` で `high`・`medium`・`low` を指定する。作業難易度とは区別する。"
    category: tm-register-entry
    relatedTerms: [tm-register-difficulty]
    source: "[[prj-0001:bdd-register-entry|業務データ辞書（登録項目個票）]]、`docs/specdojo/schemas/v1/register-item-frontmatter.schema.yaml#/$defs/Priority`"
  - id: tm-register-difficulty
    term: 作業難易度
    englishName: difficulty
    definition: 登録項目の作業の難しさを示し、実行を担う agent の経路選択に用いる区分。
    notes: "`difficulty` に保持し、`--difficulty` で `hard`・`medium`・`easy` を指定する。省略時は優先度による既存の自動選択を使う。"
    category: tm-register-entry
    relatedTerms: [tm-register-priority]
    source: "`docs/specdojo/schemas/v1/register-item-frontmatter.schema.yaml#/$defs/Difficulty`、`src/register/item.ts`"
  - id: tm-register-conclusion
    term: 登録項目の結論
    englishName: conclusion
    definition: 登録項目の対応結果・決定・却下、または延期理由を一文で要約する記録。
    notes: "`conclusion` に保持し、`--conclusion` で指定する。詳細は個票本文に置き、未確定ならキーを省略する。待機・実行失敗の理由によって結論を上書きしない。"
    category: tm-register-entry
    relatedTerms: [tm-register-block-reason, tm-register-operation]
    source: "`docs/specdojo/schemas/v1/register-item-frontmatter.schema.yaml` の `conclusion`、[[stsd-register-entry|ステータス定義（登録項目個票）]]"
  - id: tm-register-block-reason
    term: 待機理由
    englishName: block reason
    definition: 登録項目が待機中である理由を、結論と分けて示す運用記録。
    notes: "`block_reason` に保持する。`register wait --reason` または待機中の `register update --block-reason` で設定し、待機を離れると削除する。過去の理由はイベントに残す。"
    category: tm-register-entry
    relatedTerms: [tm-register-waiting, tm-register-conclusion, tm-register-event]
    source: "`docs/specdojo/schemas/v1/register-item-frontmatter.schema.yaml` の `block_reason`、`src/register/update.ts`、`src/register/create-commands.ts`"
  - id: tm-register-registered-at
    term: 登録日時
    englishName: registered at
    definition: 登録項目を起票した瞬間を示す日時。
    notes: "`registered_at` に UTC・秒精度で保持し、`--registered` に対応する。登録日はプロジェクトのタイムゾーンへ変換した表示値。新規起票では日時を記録し、時刻が不明な旧項目では省略する。"
    category: tm-register-entry
    relatedTerms: [tm-register-completed-at, tm-register-due-on]
