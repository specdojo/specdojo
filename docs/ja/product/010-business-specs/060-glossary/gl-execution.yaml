  - id: tm-routine-action
    term: 定期実行アクション
    englishName: routine action
    definition: 定期実行の機会に、Job への委譲または読み取り・派生生成用コマンドの直接起動を指定する実行単位。
    notes: "`action.kind: job` は Job と入力を参照する。`kind: specdojo` は agent を呼ばず exec と競合しないサブコマンドを `args` で直接起動する。単一または配列で定義し、種類ごとの項目は schema を正本とする。統合前レビューは「Job の統合前 review」を参照し、routine の `commit` は互換用途に限る。"
    category: tm-execution
    relatedTerms: [tm-routine-trigger, tm-job-run, tm-job-review]
