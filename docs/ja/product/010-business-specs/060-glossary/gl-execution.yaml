  - id: tm-job-checkpoint
    term: checkpoint
    englishName: checkpoint
    aliases: [ジョブ継続位置, チェックポイント]
    definition: 次回のジョブ入力へ引き継ぐために、許可された結果の実行から保存する処理済みの位置や値。
    notes: ジョブ定義の `checkpoint` に保存値を定め、`advance_on` で継続位置を進める結果を指定する。成功・処理不要が対象となり、部分成功を成功に読み替えない。更新条件は schema と Job の状態定義を正本とする。
