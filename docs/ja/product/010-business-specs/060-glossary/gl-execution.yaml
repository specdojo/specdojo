  - id: tm-routine-policy
    term: routine の実行方針
    englishName: routine policy
    aliases: [定期実行の機会処理方針]
    definition: 定期実行で取りこぼした予定と重複起動の扱いを宣言する方針。
    notes: "`policy.missed_run` と `policy.overlap` に対応する。宣言可能な値は schema を正本とする。`overlap: skip` の宣言と routine 全体の lock 取得失敗時の停止には既存の未決事項があり、スキップ結果が必ず記録されるとは扱わない。"
