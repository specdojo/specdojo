  - id: tm-routine-trigger
    term: 定期実行の起動条件
    englishName: routine trigger
    definition: 定期実行定義について、経過時間または暦上の予定により実行機会を選ぶための条件。
    notes: 定期実行定義自体は [[gl-common|用語集（共通）]] の `tm-routine` を参照する。周期の `interval` と、`cron`・`timezone` を持つ `trigger` は選択肢として使い分ける。指定の組み合わせは schema、due 判定の詳細は状態定義を正本とする。
