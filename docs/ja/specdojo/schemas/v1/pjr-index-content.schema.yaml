# pjr-index-content.schema.yaml
# pjr-index.md の本文構造（セクション・テーブル）を検証するカスタムスキーマ。
# validate-md-content.ts / remark-md-content によって読み込まれ、remark AST を使って検証する。
# 日本語版の登録簿を対象とする言語別 schema。列名・見出しは日本語で直接記述する。
id: pjr-index-content
title: "PJR Index Content Schema"
description: "pjr-index.md の本文構造を検証するスキーマ"

sections:
  - heading: 登録項目一覧
    level: 2
    number: 1
    required: true
    table:
      required_columns:
        - ID
        - ステータス
        - タイトル
        - 分類
        - 優先度
      optional_columns:
        - 説明
        - 担当
        - 期限
        - 完了日
        - 結論
        - 個票
      # 各行は 説明 または 個票 のいずれかに値を持つ必要がある。
      at_least_one_of:
        - [説明, 個票]
      # ID 列は登録簿全体で一意でなければならない。並行起票や rebase / cherry-pick で
      # 同一 PJR-ID が別行に混入した場合を検証で必ず落とす。
      unique_columns:
        - ID
      # 表の PJR-ID と個票セルのファイル名 `pjr-XXXX-<topic>.md` の対応を検証する。
      ticket_filename_check:
        id_column: ID
        ticket_column: 個票
      column_rules:
        ID:
          pattern: "^PJR-\\d{4}$"
        ステータス:
          enum:
            - open
            - in-progress
            - waiting
            - review
            - decided
            - done
            - deferred
            - rejected
        分類:
          enum:
            - todo
            - question
            - risk
            - issue
            - change-request
            - decision
            - dependency
            - note
        優先度:
          enum:
            - high
            - medium
            - low
        完了日:
          # date (YYYY-MM-DD) or "-" (not yet done)
          pattern: "^(\\d{4}-\\d{2}-\\d{2}|-)$"
        期限:
          # date (YYYY-MM-DD), "-", or "_TODO_" (undecided)
          pattern: "^(\\d{4}-\\d{2}-\\d{2}|-|_TODO_)$"
