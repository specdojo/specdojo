# yaml-language-server: $schema=../../../specdojo/schemas/v1/pm-review-viewpoints.schema.yaml
# SpecDojo 共通レビュー観点の正本。プロジェクトは extends と差分だけを宣言する。
id: specdojo:pm-review-viewpoints
type: standard
status: draft
title: 共通レビュー観点一覧
rulebook: none

# レビュー観点一覧。
# Role code の語彙は pm-roles.yaml を参照する。
# レビュー運用方針は review-guide.md を参照する。
# 成果物ごとの完了条件は成果物カタログの done_criteria を正とする。

categories:
  - id: purpose
    name: 目的・判断
  - id: planning
    name: 計画・管理
  - id: business
    name: 業務・利用者価値
  - id: architecture
    name: 構造・技術整合
  - id: implementation
    name: 実装・設定可能性
  - id: quality
    name: 品質・検証可能性
  - id: usability
    name: 読みやすさ・利用体験
  - id: operations
    name: 公開・運用
  - id: consistency
    name: 成果物間整合

coverage_types:
  - id: stakeholder
    name: ステークホルダー
    description: 利用者、意思決定者、確認者、運用者、影響を受ける関係者が識別されているか。
    applies_to:
      - requirements
      - specification
      - design
      - operations
  - id: business_goal
    name: 業務目的・価値
    description: 業務目的、課題、期待効果、成功条件との対応が説明できるか。
    applies_to:
      - requirements
      - specification
  - id: scope_boundary
    name: 対象範囲・対象外
    description: 対象範囲、対象外、前提、制約、依存関係が判断できるか。
    applies_to:
      - requirements
      - specification
      - design
  - id: use_case
    name: 利用シーン
    description: 主要な利用シーン、利用者行動、期待結果が具体化されているか。
    applies_to:
      - requirements
      - specification
  - id: business_event
    name: 業務イベント
    description: 業務上の開始条件、完了条件、発生イベント、トリガーが識別されているか。
    applies_to:
      - requirements
      - specification
  - id: exception_case
    name: 例外・異常系
    description: 例外ケース、異常系、境界条件、失敗時の扱いが確認できるか。
    applies_to:
      - requirements
      - specification
      - design
      - testing
  - id: permission
    name: 権限・責務
    description: 実行者、承認者、責任分界、権限チェック、agent と人間の境界が明確か。
    applies_to:
      - requirements
      - specification
      - design
      - operations
  - id: state_transition
    name: 状態遷移
    description: 状態、遷移条件、禁止遷移、終了状態が矛盾なく定義されているか。
    applies_to:
      - specification
      - design
      - testing
  - id: data
    name: 入出力・データ
    description: 入力、出力、データ項目、保持、更新、削除、整合性の扱いが確認できるか。
    applies_to:
      - requirements
      - specification
      - design
      - operations
  - id: integration
    name: 外部連携
    description: 外部システム、API、ファイル、通知、手動連携などの依存が識別されているか。
    applies_to:
      - requirements
      - specification
      - design
      - operations
  - id: non_functional
    name: 非機能要求
    description: 性能、可用性、セキュリティ、保守性、拡張性、互換性などの品質要求が確認できるか。
    applies_to:
      - requirements
      - specification
      - design
      - operations
  - id: operations
    name: 運用・保守
    description: 継続運用、変更管理、問い合わせ、障害時対応、再生成、公開後の保守が考慮されているか。
    applies_to:
      - requirements
      - specification
      - operations
  - id: auditability
    name: 監査・証跡
    description: 判断、承認、変更、実行結果を追跡できる証跡が残るか。
    applies_to:
      - requirements
      - specification
      - design
      - operations
  - id: acceptance
    name: 受入条件・検証可能性
    description: pass / fail を判断できる受入条件、完了条件、検証手順があるか。
    applies_to:
      - requirements
      - specification
      - testing
  - id: traceability
    name: トレーサビリティ
    description: 上位目的から要求、要件、仕様、設計、テスト、運用までの対応を追跡できるか。
    applies_to:
      - requirements
      - specification
      - design
      - testing
      - operations

severity_levels:
  - id: blocker
    description: 完了判断、公開判断、後続作業を止める不備。
  - id: major
    description: done_criteria 未充足、文書間矛盾、責任分担の不整合など重要な不備。
  - id: minor
    description: 意味や判断を大きく変えない補足不足、表記ゆれ、軽微な修正。
  - id: note
    description: 改善提案、将来検討、補足コメント。

verdict_definitions:
  - id: pass
    description: 対象 Role code の観点では修正不要。次の Role code または PO 判断へ進める。
  - id: conditional_pass
    description: 軽微な修正または PO 判断待ちを条件に進めてよい。条件を明記し、必要に応じて minor 指摘を残す。
  - id: changes_requested
    description: 修正後の再レビューが必要。修正担当 Role code と再レビュー観点を明記する。
  - id: blocked
    description: 前提不足、依存成果物未整備、重大矛盾によりレビュー継続不可。PJR 登録または PO 判断を依頼する。

# grade と review が共有する離散ルーブリック。review の blocked は判定不能を表すため
# level へ写像せず、根拠が揃った判定だけを pass / conditional_pass / changes_requested へ対応させる。
# v2 で全観点を grade の対象にし、weights を 9 category へ広げた（PJR-K351）。
# v1 の score とは母集団の category が異なるため比較できない。id を改めて区別する。
# pass_score は level 3（軽微な課題・実務上そのまま利用できる）の score 75 に合わせる。
# major がない限り各観点の level は 3 以上であるため、75 は「全 category が level 3 以上」の
# 下限と一致し、category の数や重みを変えても意味が変わらない。v1 の 70 は category 数に
# 依存しない根拠を持たなかったため改める。
grade_rubric:
  id: grade-rubric-v2
  pass_score: 75
  levels:
    - level: 0
      name: 不成立
      description: blocker があり、その観点で文書が機能していない。
      review_verdict: changes_requested
    - level: 1
      name: 不十分
      description: major が複数、または観点の目的をほぼ果たしていない。
      review_verdict: changes_requested
    - level: 2
      name: 要改善
      description: major があり、誤用・誤読を招く箇所がある。
      review_verdict: changes_requested
    - level: 3
      name: 軽微な課題
      description: minor のみで、実務上はそのまま利用できる。
      review_verdict: conditional_pass
    - level: 4
      name: 良好
      description: 指摘なし、または note のみである。
      review_verdict: pass
  # 重みは合計 100。文書に適用される観点がない category は、その文書の加重平均から外す。
  # v1 の 4 category の相対比を保ったまま縮め、空いた分を新たに加わる 5 category へ配る。
  weights:
    # kata（rulebook / template など実践の型）は、成果物を作る土台としての構造・検証可能性・
    # 使いやすさが主である。v1 の 4 category を 70 に縮め、残り 30 を配る。型が何のために
    # あるか（purpose）と、型どおりに作れるか（implementation）を厚くし、運用上の責任分界
    # （operations）を続ける。計画（planning）と業務価値（business）は個別の成果物で
    # 問われるため最も薄くする。
    kata:
      quality: 25
      usability: 18
      architecture: 14
      consistency: 13
      purpose: 8
      implementation: 6
      operations: 6
      planning: 5
      business: 5
    # 成果物は、目的・業務価値・実装可能性がプロジェクト固有に問われる。v1 の 4 category を
    # 65 に縮め、kata より多い 35 を配る。目的（purpose）と業務価値（business）を最も厚く
    # し、実装可能性（implementation）、計画（planning）、公開・運用（operations）の順に置く。
    deliverable:
      quality: 20
      consistency: 16
      usability: 16
      architecture: 13
      purpose: 8
      business: 8
      implementation: 7
      planning: 6
      operations: 6

viewpoints:
  - id: vp-po-purpose-alignment
    role: PO
    category: purpose
    title: 目的・スコープとの整合
    check: 成果物の主要な定義・判断が、プロジェクト目的、スコープ、優先順位、公開方針と矛盾せず、成果物固有の目的または上位文書への参照から必要性を説明できるか。対応する目的・成果のない手段を目的として扱っていないか。
    evidence: プロジェクト概要の目的・必要性・期待効果、成果物固有の目的、対象範囲、対象外、主要な定義・判断と上位根拠との対応、判断理由、関連成果物への参照。
    # project-level Why との整合と、根拠のない主要判断・手段の検出を担う。
    # 対象者・業務課題・期待価値の内容は vp-ba-business-value、読み手への伝わり方は
    # vp-ux-readability の責務とし、同じ指摘を複数観点で重複させない。
    # 構造・設定中心の成果物は参照・命名・下流利用の整合で判定し、業務上の Why の詳細な再掲を要求しない。
    coverage_types:
      - business_goal
      - scope_boundary
      - traceability
    default_severity: major
    evaluation: referential
  - id: vp-po-decision-readiness
    role: PO
    category: purpose
    title: 承認判断に必要な情報
    check: PO が承認、保留、差し戻しを判断するための論点、未決事項、影響範囲が明示されているか。
    evidence: 判断対象、判断者、未決事項、前提、影響、次アクション。
    coverage_types:
      - stakeholder
      - permission
      - auditability
    default_severity: major
    evaluation: discretionary
  - id: vp-po-publication-accountability
    role: PO
    category: operations
    title: 公開可否と説明責任
    check: 公開してよい情報だけで構成され、最終判断と説明責任を人間の PO が担う前提になっているか。
    evidence: status、公開対象、個人情報・非公開情報の有無、承認責任の記述。
    coverage_types:
      - permission
      - operations
      - auditability
    default_severity: blocker
    evaluation: referential
  - id: vp-pm-plan-feasibility
    role: PM
    category: planning
    title: 計画化可能性
    check: 成果物の内容がタスク化、順序付け、所要時間見積もり、進捗確認に使える粒度になっているか。
    evidence: 依存関係、作業単位、完了条件、担当 Role code、期限または判断タイミング。
    default_severity: major
    evaluation: discretionary
  - id: vp-pm-dependency-risk
    role: PM
    category: planning
    title: 依存関係・リスク・課題化
    check: 後続成果物、Schedule、PJR に影響する依存、リスク、課題、変更要求が識別されているか。
    evidence: depends_on、関連文書、未決事項、PJR 登録候補、スケジュール影響。
    default_severity: major
    evaluation: referential
  - id: vp-pm-control-reporting
    role: PM
    category: planning
    title: 管理・報告への接続
    check: 進捗、課題、リスク、変更要求、決定記録へ転記すべき事項が分離されているか。
    evidence: PJR 転記候補、報告先、対応方針、担当 Role code。
    default_severity: minor
    evaluation: referential
  - id: vp-ba-business-value
    role: BA
    category: business
    title: 業務価値との対応
    check: 主要な定義・判断がどの対象者のどの業務課題・期待価値に応えるかを説明でき、主要な成果・方針がその目的に対応しているか。
    evidence: 対象者、業務課題、放置時の影響、期待価値・効果、成功基準、判断理由、主要な成果・方針との対応、上位文書への参照。
    # 業務上の Why の充足と主要な What / How との対応を確認し、対象者・課題・期待価値の不足、
    # 上位目的との矛盾、対応先のない成果・方針を finding として説明できる範囲に絞る。
    # 利用者像・利用シーン・業務イベントの列挙は、それぞれ vp-ba-stakeholder-clarity /
    # vp-ba-requirements-completeness の責務とし、概要・憲章などへの過剰な詳細流入を避ける。
    coverage_types:
      - business_goal
      - traceability
    default_severity: major
    evaluation: discretionary
    document_kinds:
      exclude:
        - specdojo:bdd-rulebook
        - specdojo:dct-index-rulebook
        - specdojo:dct-rulebook
        - specdojo:gl-rulebook
        - specdojo:ifx-api-rulebook
        - specdojo:ifx-cmd-rulebook
        - specdojo:ifx-index-rulebook
        - specdojo:ifx-msg-rulebook
        - specdojo:pm-members-rulebook
        - specdojo:pm-roles-rulebook
        - specdojo:sch-rulebook
        - specdojo:tml-rulebook
      unclassified: include
      # 既定（適用する）のままと判断した rulebook。判断漏れの検証（PJR-VJP8）用の記録で、
      # 適用判定には影響しない。rulebook を追加したら exclude かここのどちらかへ載せる。
      confirmed_default:
        - specdojo:atc-index-rulebook
        - specdojo:atc-rulebook
        - specdojo:bac-rulebook
        - specdojo:bds-rulebook
        - specdojo:bes-index-rulebook
