        - specdojo:cdfd-uc-rulebook
        - specdojo:cdsd-rulebook
        - specdojo:cld-rulebook
        - specdojo:cnd-mermaid-rulebook
        - specdojo:cnd-rulebook
        - specdojo:cop-index-rulebook
        - specdojo:cop-rulebook
        - specdojo:cpd-mermaid-rulebook
        - specdojo:cpd-rulebook
        - specdojo:cstd-rulebook
