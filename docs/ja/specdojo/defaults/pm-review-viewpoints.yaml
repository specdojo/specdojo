  - id: vp-dev-implementation-readiness
    role: DEV
    category: implementation
    title: 実装・設定作業への接続
    check: 実装、設定、変更作業に必要な入力、制約、完了条件が読み取れるか。
    evidence: 設定項目、schema、入力、出力、制約、作業対象ファイル。
    coverage_types:
      - data
      - integration
      - permission
      - acceptance
    default_severity: major
    evaluation: discretionary
  - id: vp-dev-change-impact
    role: DEV
    category: implementation
    title: 技術的変更影響
    check: 変更が既存成果物、schema、生成処理、コマンド、運用手順へ与える影響が識別されているか。
    evidence: 影響範囲、関連コード、schema、生成物、コマンド、互換性。
    coverage_types:
      - scope_boundary
      - data
      - integration
      - operations
      - traceability
    default_severity: major
    evaluation: referential
  - id: vp-dev-testability
    role: DEV
    category: quality
    title: 技術検証可能性
    check: 実装・設定変更後に確認すべき lint、schema、build、生成コマンドが分かるか。
    evidence: 検証コマンド、期待結果、対象ファイル、エラー時対応。
    default_severity: minor
    evaluation: referential
  - id: vp-qe-done-criteria
    role: QE
    category: quality
    title: done_criteria 充足
    check: 成果物カタログの done_criteria を満たしているか、未充足条件が明示されているか。
    evidence: done_criteria、レビュー結果、未解決指摘、判定根拠。
    coverage_types:
      - acceptance
      - traceability
    default_severity: major
    evaluation: referential
    grade_targets: [deliverable]
    comparison_sources:
      - catalog-entry
  - id: vp-qe-verifiability
    role: QE
    category: quality
    title: 検証可能性
    check: 成功基準、受入条件、品質基準、設定値が pass / fail を判定できる表現になっているか。
    evidence: 判定条件、数値、状態、必須項目、チェック手順。
    coverage_types:
      - exception_case
      - state_transition
      - non_functional
      - acceptance
    default_severity: major
    evaluation: referential
  - id: vp-qe-omissions-consistency
    role: QE
    category: consistency
    title: 抜け漏れ・矛盾
    check: 必須章、必須キー、参照、責務、禁止事項に抜け漏れや矛盾がないか。
    evidence: rulebook、schema、関連文書、禁止事項、レビュー履歴。
    # 構造・整合の抜け漏れを見る観点であり、特定の業務 coverage 次元の網羅は要求しない。
    # 必須要素の充足は check / evidence と各成果物の rulebook・schema で判定し、
    # 構造系成果物（pm-roles / pm-members / pm-raci など）への無関係な詳細流入を避ける。
    default_severity: major
    evaluation: referential
  - id: vp-qe-config-validity
    role: QE
    category: quality
    title: 設定値の妥当性
    check: 設定値・必須キー・参照が schema と整合し、妥当な値で過不足なく定義されているか。
    evidence: schema、必須キー、設定値、デフォルト値、validate 結果。
    # 設定 YAML（スケジュール定義・デフォルト等）向けの軽量観点。挙動仕様向けの
    # coverage（exception_case / state_transition / non_functional）を要求せず、
    # 設定値の妥当性と schema 整合に絞る。
    default_severity: major
    evaluation: deterministic
    grade_targets: [deliverable]
  - id: vp-qe-kata-conformance
    role: QE
    category: quality
    title: 実践の型としての適合性
    check: >-
      rulebook、recipe、sample、template が種別ごとの責務を守り、Kata 内部、Kata 相互、および参照する組織定義や生成物を含む適用先との関係が矛盾なく定義されているか。Kata に関するこれらの整合はこの観点で判定し、vp-arc-cross-document-consistency では扱わない。
    evidence: >-
      authoring standard、rulebook の型宣言、recipe の問い、sample の完成例、template の骨組み、相互参照、組織定義や生成物を含む適用先との対応。
    coverage_types:
      - acceptance
      - traceability
    default_severity: major
    evaluation: referential
    grade_targets: [kata]
  - id: vp-ux-readability
    role: UX
    category: usability
    title: 読みやすさ・理解しやすさ
    check: >-
      初見の読者が、成果物固有の目的または上位文書への参照、名称、メタデータから、なぜ扱うか、役割、利用先、対象、主要な判断、次に見る文書を理解できるか。主旨または主要な判断点を読み取れない箇所を特定できる場合は major とする。同一主張の反復や正本の過剰な再掲など冗長性の判定は vp-arc-conciseness で行い、この観点では扱わない。
    evidence: >-
      導入文、目的・理由、主要な成果・方針との対応、上位文書への参照、見出し、表、用語、関連ドキュメント、補足説明、段落・箇条書きの長さと論点数、保持すべき背景・判断理由・例外・制約・done_criteria。
    # Why の内容の妥当性は PO / BA に委ね、ここでは必要性と主要な判断の関係を読み手が
    # 識別できるか、および手段だけが目的に見える表現になっていないかを判定する。
    default_severity: minor
    evaluation: referential
    document_kinds:
      unclassified: include
  - id: vp-ux-user-flow
    role: UX
    category: usability
    title: 利用者導線
    check: >-
      利用者や将来貢献者が迷わず必要情報へ到達できる構成になっているか。目次から必要な章を見つけられるか、関連成果物への参照が適切な位置にあるか、前提から結論への説明順序が守られているかのいずれかの基準に照らして判定し、情報を見失う箇所を具体的に特定できる場合のみ不備とする。
    evidence: 目次、関連リンク、手順、参照先、サンプル、説明順序。
    default_severity: minor
    evaluation: referential
    grade_targets: [deliverable]
  - id: vp-ux-language-consistency
    role: UX
    category: usability
    title: 用語・表現の一貫性
    check: 用語、Role code、成果物名、状態、ラベルが読み手を混乱させない形で統一されているか。
    evidence: 用語定義、表記ゆれ、Role code、local_id、status、ラベル。
    default_severity: minor
    evaluation: referential
  - id: vp-ops-release-readiness
    role: OPS
    category: operations
    title: リリース・公開準備
    check: 公開、配布、ready 化、リリース判断に必要な前提や未解決事項が明示されているか。
    evidence: status、ready 条件、公開対象、未解決指摘、承認者、公開前確認。
    coverage_types:
      - permission
      - operations
      - auditability
      - acceptance
    default_severity: major
    evaluation: discretionary
  - id: vp-ops-operability
    role: OPS
    category: operations
    title: 運用しやすさ
    check: 継続更新、再生成、変更管理、問い合わせ対応、障害時対応に必要な情報が読み取れるか。
    evidence: 運用手順、再生成手順、変更管理、問い合わせ導線、担当 Role code。
    coverage_types:
      - operations
      - integration
      - auditability
      - non_functional
    default_severity: minor
    evaluation: discretionary
  - id: vp-ops-agent-boundary
    role: OPS
    category: operations
    title: agent 委任境界
    check: agent に最終承認、公開可否判断、説明責任を委ねる記述になっていないか。
    evidence: owner、reviewer、approver、agent_mode、manual gate、承認責任。
    coverage_types:
      - permission
      - auditability
    default_severity: blocker
    evaluation: referential

