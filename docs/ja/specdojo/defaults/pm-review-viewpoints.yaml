  - id: vp-ba-requirements-completeness
    role: BA
    category: business
    title: 要件・受入条件の充足
    check: 要件、受入条件、対象範囲、対象外が利用者視点で確認できる粒度になっているか。
    evidence: 要件、受入条件、対象範囲、除外範囲、用語定義。
    coverage_types:
      - stakeholder
      - scope_boundary
      - use_case
      - business_event
      - exception_case
      - non_functional
      - operations
      - acceptance
      - traceability
    default_severity: major
    evaluation: discretionary
  - id: vp-ba-stakeholder-clarity
    role: BA
    category: business
    title: 関係者・利用場面の明確性
    check: 関係者、利用場面、確認者、合意対象が読み取れるか。
    evidence: stakeholder、利用者、店番・運用者、確認者、合意事項。
    coverage_types:
      - stakeholder
      - use_case
      - permission
    default_severity: minor
    evaluation: discretionary
  - id: vp-arc-document-structure
    role: ARC
    category: architecture
    title: 文書構造・配置・命名
    check: frontmatter、ID、ファイル名、配置、見出し、リンクがプロジェクトの文書体系と整合しているか。
    evidence: id、path、rulebook、based_on、見出し、相対リンク、成果物カタログ。
    default_severity: major
    evaluation: deterministic
  - id: vp-arc-cross-document-consistency
    role: ARC
    category: consistency
    title: 成果物間整合
    check: >-
      成果物について、成果物カタログ、Schedule、RACI、組織定義、メンバー定義、生成物と矛盾していないか。不整合の finding は突き合わせ先の文書 ID またはパスと、双方の相反する記述を特定する。rulebook、recipe、sample、template の内部・相互・適用先との整合は vp-qe-kata-conformance で判定し、この観点では扱わない。
    evidence: >-
      local_id、depends_on、owner、roles、RACI、関連文書、生成元、finding ごとの突き合わせ先の文書 ID またはパスと双方の該当箇所。
    coverage_types:
      - permission
      - traceability
      - auditability
    default_severity: major
    evaluation: referential
    grade_targets: [deliverable]
    # 突き合わせ先の変更を grade list --changed-only の再評価契機にする（PJR-Z47X）。
    # 生成物は生成元（カタログ・メンバー定義など）の変更として検出する。
    comparison_sources:
      - catalog-entry
      - dependencies
      - schedule
      - members
      - roles
      - deliverable:pm-raci
      - deliverable:pm-organization
  - id: vp-arc-technical-constraints
    role: ARC
    category: architecture
    title: 技術前提・制約の明確性
    check: 技術的な前提、制約、外部依存、構成判断が必要な範囲で明示されているか。
    evidence: 技術制約、外部依存、schema、validate 手順、構成方針。
    coverage_types:
      - scope_boundary
      - data
      - integration
      - non_functional
    default_severity: major
    evaluation: discretionary
  - id: vp-arc-conciseness
    role: ARC
    category: usability
    title: 冗長性・簡潔性
    check: >-
      各節が固有の判断または手順に寄与し、同じ主張の反復、一般論、表と本文の内容重複、正本からの過剰な再掲がないか。判断に必要な背景、制約、例外、done_criteria が残されていれば下限を満たしているとする。長さだけでは fail にせず、削除または統合しても判断情報を失わない箇所を具体的に特定できる場合のみ minor とする。
    evidence: 反復する段落、表と本文の重複、正本への参照で置換できる再掲、削除または統合しても判断情報を失わない箇所。
    default_severity: minor
    evaluation: referential
  - id: vp-arc-single-responsibility
    role: ARC
    category: architecture
    title: 文書責務の単一性
    check: >-
      文書の中心主題と責務境界が一つに定まり、各章がその責務に直接寄与しているか。独立して参照・更新できる主題が複数あり、対象読者・利用時点が異なる、または別々の sample・recipe・template に対応する場合は分割を検討する。分量や対応する実践の型の数だけでは不備としない。同一主張の反復や正本の過剰な再掲は vp-arc-conciseness で判定し、この観点では扱わない。
    evidence: >-
      文書の目的、章ごとの主題と相互依存、章が参照・更新される単位、対象読者、利用時点、対応する sample・recipe・template、分割後も独立して成立する境界候補。分割が必要な finding には境界候補と参照・カタログへの影響を記録する。
    default_severity: major
    evaluation: referential
    document_kinds:
      exclude:
        - specdojo:atc-index-rulebook
        - specdojo:bes-index-rulebook
        - specdojo:cdfd-overview-rulebook
        - specdojo:cop-index-rulebook
