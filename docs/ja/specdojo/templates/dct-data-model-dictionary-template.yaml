# Template: data model deliverables catalog (business data dictionary)
# Placeholder _PROJECT_ID_ is not used for product-level templates.
# base_path is fixed to the product document directory.
#
# This file is one physical part of the data-model domain. It shares domain
# `data-model` with dct-data-model-conceptual-template.yaml; catalog build
# merges same-domain parts (in sorted file order) into one dct-data-model.md.
#
# local_id の _TERM_ 反復方針（複数業務領域への複製 / 単一領域を複数項目に分割）は
# dct-rulebook.md の「業務領域テンプレートの反復方針（_TERM_ の使い分け）」を正とする。
id: specdojo:dct-data-model-dictionary-template
type: template
status: draft
title: 成果物カタログ（データモデル／業務データ辞書）
rulebook: specdojo:dct-rulebook
domain: data-model
base_path: /docs/ja/product/010-business-specs/020-data-model

groups:
  # ── 業務データ辞書 ────────────────────────────────────────────────────────
  - name: 業務データ辞書
    deliverables:
      - local_id: bdd-_TERM_
        name: 業務データ辞書
        kind: work
        depends_on: []
        overview: 業務上の管理単位（エンティティ）とその属性の論理名・説明・制約を定義する
        path: bdd-_TERM_.yaml
        rulebook: specdojo:bdd-rulebook
        note: "_TERM_ は対象業務領域の略称（kebab-case）"
        done_criteria:
          - text: エンティティ・属性の業務的定義が正確に記述されていること
            roles: [BA]
            viewpoint: vp-ba-requirements-completeness
          - text: データスコープとエンティティ境界を承認できること
            roles: [PO]
            viewpoint: vp-po-purpose-alignment
          - text: DB設計・システム設計の入力として参照できること
            roles: [ARC]
            viewpoint: vp-arc-technical-constraints
          - text: データ検証ルール・制約が確認できること
            roles: [QE]
            viewpoint: vp-qe-verifiability
          - text: 実装（テーブル設計・モデル定義）の基礎として参照できること
            roles: [DEV]
            viewpoint: vp-dev-implementation-readiness

      - local_id: cdsd-_TERM_
        min_size: medium
        name: 概念データストア定義
        kind: work
        depends_on: []
        overview: 概念データストア（情報の保管場所）を一覧で定義する
        path: cdsd-_TERM_.md
        rulebook: specdojo:cdsd-rulebook
        note: "_TERM_ は対象業務領域の略称（kebab-case）"
        done_criteria:
          - text: データストアの業務的役割・内容・粒度が記述されていること
            roles: [BA]
            viewpoint: vp-ba-requirements-completeness
          - text: データストア構成を設計の基礎として参照できること
            roles: [ARC]
            viewpoint: vp-arc-technical-constraints
          - text: データ検証・整合性確認の対象が識別できること
            roles: [QE]
            viewpoint: vp-qe-verifiability

      - local_id: sld-_TERM_
        min_size: medium
        name: 保管場所定義
        kind: work
        depends_on: []
        overview: 業務対象となる物の物理的な保管場所を一覧で定義する
        path: sld-_TERM_.md
        rulebook: specdojo:sld-rulebook
        note: "_TERM_ は対象業務領域の略称（kebab-case）"
        done_criteria:
          - text: 保管場所・保管対象・管理頻度が業務観点で記述されていること
            roles: [BA]
            viewpoint: vp-ba-requirements-completeness
          - text: 保管場所の運用・管理方針が確認できること
            roles: [QE]
            viewpoint: vp-qe-verifiability

      - local_id: stsd-_TERM_
        name: ステータス定義
        kind: work
        depends_on: []
        overview: 業務上のエンティティが取り得る状態（ステータス）を一覧で定義する
        path: stsd-_TERM_.md
        rulebook: specdojo:stsd-rulebook
        note: "_TERM_ は対象エンティティ・ライフサイクルの略称（kebab-case）"
        done_criteria:
          - text: ステータス名・説明が業務観点で正確に定義されていること
            roles: [BA]
            viewpoint: vp-ba-requirements-completeness
          - text: 状態遷移実装の基礎として参照できること
            roles: [ARC]
            viewpoint: vp-arc-technical-constraints
          - text: 状態ベースのテスト設計に活用できること
            roles: [QE]
            viewpoint: vp-qe-verifiability
          - text: 状態管理実装の参照として使えること
            roles: [DEV]
            viewpoint: vp-dev-implementation-readiness

      - local_id: cld-_TERM_
        min_size: medium
        name: 分類定義
        kind: work
        depends_on: []
        overview: 業務上の分類（カテゴリ・種別・区分など）を一覧で定義する
        path: cld-_TERM_.md
        rulebook: specdojo:cld-rulebook
        note: "_TERM_ は対象分類体系の略称（kebab-case）"
        done_criteria:
          - text: 分類名・説明が業務観点で正確に定義されていること
            roles: [BA]
            viewpoint: vp-ba-requirements-completeness
          - text: 分類実装（マスタデータ・コード値）の基礎として参照できること
            roles: [DEV]
            viewpoint: vp-dev-implementation-readiness
