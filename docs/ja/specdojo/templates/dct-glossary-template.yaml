id: specdojo:dct-glossary-template
type: template
status: draft
title: 成果物カタログ（用語集）
rulebook: specdojo:dct-rulebook
domain: glossary
base_path: /docs/ja/product/010-business-specs/060-glossary

groups:
  - name: 用語集
    deliverables:
      - local_id: gl-_DOMAIN_
        name: 用語集
        kind: work
        depends_on: []
