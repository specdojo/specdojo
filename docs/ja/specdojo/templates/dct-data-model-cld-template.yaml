# Template: data model deliverables catalog (classification definition)
# Placeholder _PROJECT_ID_ is not used for product-level templates.
# base_path is fixed to the product document directory.
#
# This is the cld physical part of the data-model domain. Catalog build merges
# all dct-data-model-*-template parts by same-name group in sorted file order.
#
# local_id の _TERM_ 反復方針（複数業務領域への複製 / 単一領域を複数項目に分割）は
# dct-rulebook.md の「業務領域テンプレートの反復方針（_TERM_ の使い分け）」を正とする。
id: specdojo:dct-data-model-cld-template
type: template
status: draft
title: 成果物カタログ（データモデル／分類定義）
rulebook: specdojo:dct-rulebook
domain: data-model
base_path: /docs/ja/product/010-business-specs/020-data-model

groups:
  - name: 業務データ辞書
    deliverables:
      - local_id: cld-_TERM_
        min_size: medium
        name: 分類定義
        kind: work
        depends_on: []
        overview: 業務上の分類（カテゴリ・種別・区分など）を一覧で定義する
        path: cld-_TERM_.md
        rulebook: specdojo:cld-rulebook
        note: "_TERM_ は対象分類体系の略称（kebab-case）"
        done_criteria:
          - text: 分類名・説明が業務観点で正確に定義されていること
            roles: [BA]
            viewpoint: vp-ba-requirements-completeness
          - text: 分類実装（マスタデータ・コード値）の基礎として参照できること
            roles: [DEV]
            viewpoint: vp-dev-implementation-readiness
