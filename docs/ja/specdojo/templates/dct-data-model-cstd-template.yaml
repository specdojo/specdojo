# Template: data model deliverables catalog (conceptual state transition diagram)
# Placeholder _PROJECT_ID_ is not used for product-level templates.
# base_path is fixed to the product document directory.
#
# This is the cstd physical part of the data-model domain. Catalog build merges
# all dct-data-model-*-template parts by same-name group in sorted file order.
#
# local_id の _TERM_ 反復方針（複数業務領域への複製 / 単一領域を複数項目に分割）は
# dct-rulebook.md の「業務領域テンプレートの反復方針（_TERM_ の使い分け）」を正とする。
id: specdojo:dct-data-model-cstd-template
type: template
status: draft
title: 成果物カタログ（データモデル／概念状態遷移図）
rulebook: specdojo:dct-rulebook
domain: data-model
base_path: /docs/ja/product/010-business-specs/020-data-model

groups:
  - name: 概念モデル
    deliverables:
      - local_id: cstd-_TERM_
        min_size: medium
        name: 概念状態遷移図
        kind: work
        depends_on: []
        overview: 業務オブジェクトの状態変化・イベント・遷移条件を図で定義する
        path: cstd-_TERM_.md
        rulebook: specdojo:cstd-rulebook
        note: "_TERM_ は対象エンティティ・ライフサイクルの略称（kebab-case）"
        done_criteria:
          - text: 状態・遷移・イベント・条件が業務観点で正確に表現されていること
            roles: [BA]
            viewpoint: vp-ba-requirements-completeness
          - text: 状態遷移の業務的妥当性を承認できること
            roles: [PO]
            viewpoint: vp-po-purpose-alignment
          - text: 状態管理実装・イベント処理設計の入力として参照できること
            roles: [ARC]
            viewpoint: vp-arc-technical-constraints
          - text: 状態遷移ベースのテスト設計に活用できること
            roles: [QE]
            viewpoint: vp-qe-verifiability
          - text: 状態遷移ロジック実装の基礎として参照できること
            roles: [DEV]
            viewpoint: vp-dev-implementation-readiness
