# yaml-language-server: $schema=../../../specdojo/schemas/v1/dct.schema.yaml
# specdojo-schema: validate=false reason=template
# Template: migration planning deliverables catalog
# min_size: deliverable is included only when scaffold --size >= this value
# Placeholder _PROJECT_ID_ is replaced with the actual project_id on scaffold.
id: specdojo:dct-migration-planning-template
type: template
status: draft
title: 成果物カタログ（移行計画）
rulebook: specdojo:dct-rulebook
part_of:
  - _PROJECT_ID_:dct-index
domain: migration-planning
base_path: /docs/ja/projects/_PROJECT_ID_/060-migration-planning

groups:
  - name: 移行計画
    min_size: medium
    deliverables:
      - local_id: mip-index
        name: 移行計画
        kind: work
        depends_on:
          - imp-business
        overview: 移行方針と全体計画を定義し、切替リスクを管理
        path: mip-index.md
        rulebook: specdojo:mip-index-rulebook
        done_criteria:
          - text: 移行範囲・移行方式・スケジュール・リスクが業務観点で確認できること
            roles: [BA]
            viewpoint: vp-ba-business-value
          - text: 移行計画全体を承認できること
            roles: [PO]
            viewpoint: vp-po-decision-readiness
          - text: 技術的移行方式・リスク対策が識別できること
            roles: [ARC]
            viewpoint: vp-arc-technical-constraints
          - text: 移行テスト・受入条件が確認できること
            roles: [QE]
            viewpoint: vp-qe-verifiability
          - text: 移行スケジュールと体制が計画可能な粒度で記述されていること
            roles: [PM]
            viewpoint: vp-pm-plan-feasibility
          - text: 運用切替・ハイパーケア体制が確認できること
            roles: [OPS]
            viewpoint: vp-ops-operability

      - local_id: dmd-index
        min_size: large
        name: データ移行設計
        kind: work
        depends_on:
          - mip-index
          - imp-data
        overview: データ移行の設計内容を定義し、移行時の整合性を確保
        path: dmd-index.md
        rulebook: specdojo:dmd-index-rulebook
        done_criteria:
          - text: 移行対象データ・変換方針・マッピングが業務観点で確認できること
            roles: [BA]
            viewpoint: vp-ba-requirements-completeness
          - text: データ移行設計を承認できること
            roles: [PO]
            viewpoint: vp-po-decision-readiness
          - text: データ変換・整合性検証の技術方式が識別できること
            roles: [ARC]
            viewpoint: vp-arc-technical-constraints
          - text: データ検証・ロールバック方針が確認できること
            roles: [QE]
            viewpoint: vp-qe-verifiability
          - text: データ移行実装の技術要件が確認できること
            roles: [DEV]
            viewpoint: vp-dev-implementation-readiness

      - local_id: mtp-index
        min_size: large
        name: 移行テスト計画（リハーサル計画）
        kind: work
        depends_on:
          - mip-index
        overview: 移行リハーサルの実施計画を定義し、切替前に妥当性を検証
        path: mtp-index.md
        done_criteria:
          - text: テスト範囲・シナリオ・判定基準が業務観点で確認できること
            roles: [BA]
            viewpoint: vp-ba-business-value
          - text: 移行テスト計画を承認できること
            roles: [PO]
            viewpoint: vp-po-decision-readiness
          - text: テスト環境・技術的検証方式が識別できること
            roles: [ARC]
            viewpoint: vp-arc-technical-constraints
          - text: 是正計画を含む合格基準が確認できること
            roles: [QE]
            viewpoint: vp-qe-verifiability

      - local_id: cop-index
        min_size: large
        name: カットオーバー計画（本番切替手順）
        kind: work
        depends_on:
          - mip-index
          - mtp-index
        overview: 本番切替の手順を定義し、停止時間と障害リスクを最小化
        path: cop-index.md
        rulebook: specdojo:cop-index-rulebook
        done_criteria:
          - text: 切替手順・業務停止範囲・判定ポイントが業務観点で確認できること
            roles: [BA]
            viewpoint: vp-ba-business-value
          - text: カットオーバー計画を承認できること
            roles: [PO]
            viewpoint: vp-po-decision-readiness
          - text: 技術的切替手順・切戻し方式が識別できること
            roles: [ARC]
            viewpoint: vp-arc-technical-constraints
          - text: 判定ポイント・エスカレーション・切戻し手順が確認できること
            roles: [QE]
            viewpoint: vp-qe-verifiability
          - text: 運用体制・エスカレーション経路が確認できること
            roles: [OPS]
            viewpoint: vp-ops-operability

      - local_id: otp-index
        min_size: large
        name: 運用切替計画（ハイパーケア含む）
        kind: work
        depends_on:
          - cop-index
        overview: 切替後の運用移管計画を定義し、安定稼働へ移行
        path: otp-index.md
        rulebook: specdojo:otp-index-rulebook
        done_criteria:
          - text: 運用引継ぎ・ハイパーケア体制が業務観点で確認できること
            roles: [BA]
            viewpoint: vp-ba-business-value
          - text: 運用移管計画を承認できること
            roles: [PO]
            viewpoint: vp-po-decision-readiness
          - text: 技術的監視強化・問い合わせ対応方針が識別できること
            roles: [ARC]
            viewpoint: vp-arc-technical-constraints
          - text: 安定化完了条件・受入判定が確認できること
            roles: [QE]
            viewpoint: vp-qe-verifiability
          - text: 運用体制・手順・ハイパーケア終了条件が確認できること
            roles: [OPS]
            viewpoint: vp-ops-operability
