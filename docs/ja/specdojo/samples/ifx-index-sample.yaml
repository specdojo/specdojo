id: specdojo:ifx-index-sample
type: api
title: 駄菓子屋きぬや 販売管理CLIの外部システムI/F一覧
status: draft
rulebook: specdojo:ifx-index-rulebook
supersedes: []

# _ASSUMPTION_: 単一店舗・店舗端末1台の学習用 CLI について、現金販売の
# 商品照会・売上登録・レシート印字を整理する。店番担当は店主代表または家族利用者代表。
# 通常利用のタブレット画面とは別の操作例であり、実案件で採用済みの仕様を表さない。
# 仕入先システム連携、本格会計、EC、つけ販売、キャッシュレス決済、オフライン同期は対象外。
# CLI 内部の取引記録・設定ファイルは外部 I/F とせず、CLI 仕様の入出力へ委譲する。
# 本部 API を用いる仮定は [[specdojo:clis-sample|販売管理 CLI 仕様]] と共有する。
# 管理担当は ARC（技術メンター）。DEV（開発担当）が詳細設計を主導し、ARC が助言する。
# Role と兼務の正本: [[specdojo:pm-roles-sample|ロール定義]]、
# [[specdojo:pm-members-sample|メンバー定義]]。
# 人間の PO（店主代表）が一覧の承認・保留・差し戻しと ready への昇格を判断する。
# _UNDECIDED_: 公開対象は本一覧と対応する詳細仕様の学習用文書。社外公開可否と
# 実運用の採否は PO の判断待ち。本部の契約未整備・印字実機確認待ちを解消済みとして公開しない。
# 本部の二つの詳細仕様は未同梱。spec_ref は TBD とし、未作成の参照名をコメントで区別する。

interfaces:
  # 商品コードを渡し、商品名・販売単価・税区分を得る。商品マスタ自体は更新しない。
  # 売上登録と同じ本部が相手でも、成功後の状態と失敗の影響が異なるため分ける。
  - name: 本部商品マスタの照会
    source: 店舗端末の販売管理 CLI
    target: 本部の商品マスタ API
    direction: bidirectional
    kind: API
    format: JSON
    timing: 店番担当が購入明細へ商品を追加する時、明細を保存する前
    error_handling: >-
      商品未登録ならコードを訂正する。接続不能・時間切れ・認証拒否なら明細を追加せず停止する。
      店番担当が接続を、開発担当が認証・権限を確認し、復旧後に同じ取引へ追加する。
    spec_ref: TBD
    # _TODO_: 詳細契約は未着手。DEV が `ifx-api-kinuya-products.yaml` に
    # 接続・認証権限と応答の契約を定義し、ARC と契約レビューで照合する。
    # BA（開発担当）が店番担当と商品・単価の照合手順を確認し、
    # QE（同行レビュー担当）が商品未登録・通信失敗で明細が増えないことを確認する。
    # 商品照会の外部結合テスト着手前に契約と期待結果をそろえて実在する ID へ接続する。
    # そろうまでは商品追加経路の受入を保留し、PM への作業登録依頼は末尾にまとめる。

  # 同一取引の販売実績を渡し、受付結果を受け取る。商品照会の成功は会計成功を意味しない。
  - name: 本部への売上登録
    source: 店舗端末の販売管理 CLI
    target: 本部の売上登録 API
    direction: bidirectional
    kind: API
    format: JSON
    timing: 店番担当が購入明細と預かり金を確認し、会計確定を要求した時
    error_handling: >-
      接続不能・時間切れ・拒否時は送信内容と受付状態を保持し、結果不明を未登録と断定しない。
      店主代表と開発担当が本部受付とローカル記録を照合し、確認できなければ保留する。
      会計・取消を繰り返さず、回復条件は詳細契約で確認する。
    spec_ref: TBD
    # _UNDECIDED_: 受付照会・重複排除・保存失敗後の回復方式が未決。
    # DEV が ARC の助言を受けて本部側と方式を決め、`ifx-api-kinuya-sales.yaml` を作成する。
    # BA が PO と取引の保留・確定の運用を、ARC・DEV が受付と回復の契約を、
    # QE が受付済み・未受付・結果不明の期待結果を確認する。
    # 売上登録の外部結合テスト着手前に合意を記録して実在する ID へ接続するまで、
    # 当該経路の受入と実運用を保留する。PO には二重登録リスクと保留時の店頭対応を渡す。

  # 保存済みレシートを渡し、印字結果を受け取る。売上の再登録は委ねない。
  - name: 確定済みレシートの印字
    source: 店舗端末の販売管理 CLI
    target: receipt-print CLI と店舗プリンタ
    direction: bidirectional
    kind: コマンド
    # 入力テキストと結果 JSON・診断が混在する。形式・構造の詳細は印刷契約が正本。
    format: その他
    timing: 会計確定と控え保存の後、印刷を要求した時。再印刷は紙面確認後に手動で要求した時
    error_handling: >-
      印字失敗・結果不明なら会計を維持し、未印字の警告と控えを残す。
      自動再試行の可否は詳細仕様の送信前失敗の識別条件に従う。
      結果不明なら店番担当が紙面を確認し、必要時は保存済みレシートだけを再印刷する。
    spec_ref: specdojo:ifx-cmd-sample
    # 詳細契約: [[specdojo:ifx-cmd-sample|レシート印刷コマンド連携仕様]]。
    # USB 直結・認証不要の仮定、OS 権限、起動制約と失敗分類は同契約に委譲する。
    # _TODO_: 契約の完成例はあるが実機確認は未実施。DEV は ARC と起動・権限を照合し、
    # BA は店番担当と警告・控え保持・紙面確認後の再印刷を確認する。
    # QE が結果不明・二重印字と、会計・売上を再実行しないことを確認した記録を、
    # 店頭試用の開始判断前に PO へ渡す。それまで印字経路の実運用の採否は保留する。

# _TODO_: 本部商品照会・売上登録の外部側確認窓口は未特定。
# BA は本部 API の契約レビュー前に商品・売上の確認先と権限の管理主体を特定し、
# DEV が接続・認証権限と受付・回復方式の確認を依頼できる状態にする。
# _TODO_: 上記3連携の残作業は学習用 Schedule・PJR に未登録。
# PM（開発担当）へ、外部結合テスト計画の確定前に、本部2契約の作成・確認と
# 印字実機確認の作業を Schedule へ登録するよう依頼する。
# 同じ時点で、本部窓口・認証権限の確認待ちによる着手遅延と、売上の結果不明による
# 二重登録リスクを PJR に登録し、商品追加・会計確定の受入への影響を PO へ報告する。
# 印字実機確認は店頭試用の開始判断の前提作業として追跡する。
# 登録後は該当コメントを実在する作業・管理レコードの参照へ付け替え、
# 担当・期日・進捗は Schedule、採否・公開判断は決定記録で管理する。
# スコープ・方式の変更時は ARC が連携名と詳細契約の対応を整理し、DEV と QE へ
# 実装・結合テスト対象の変更を渡す。PM が計画・管理記録へ接続し、PO が業務上の採否を判断する。
