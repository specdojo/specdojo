# yaml-language-server: $schema=../../../specdojo/schemas/v1/bdd.schema.yaml
id: specdojo:bdd-sample
type: data
title: 業務データ辞書(main)
status: draft
rulebook: specdojo:bdd-rulebook
supersedes: []

entities:
  - logical_name: 商品
    physical_name: product
    description: 駄菓子屋で販売する個々の商品
    glossary_term_id: tm-product
    related_terms: [tm-price, tm-stock]
    key_fields: [product_code]
    fields:
      - logical_name: 商品コード
        physical_name: product_code
        glossary_term_id: tm-product-code
        type: string
        description: 各商品を一意に識別するコード
        constraints:
          required: true
          unique: true
        example: 45-14603-32581-2
      - logical_name: 商品名
        physical_name: product_name
        type: string
        glossary_term_id: tm-product-name
        description: おばあちゃんやお客さんが読める商品名
        constraints:
          required: true
        example: うまか棒 たこ焼き味
      - logical_name: 価格
        physical_name: price
        type: integer
        glossary_term_id: tm-price
        description: 商品の販売価格（税抜き）
        unit: 円
        constraints:
          required: true
        example: 100

  - logical_name: 取引
    physical_name: transaction
    description: 店頭での購買取引記録（TypeScript 型定義を参照する例）
    type_ref: src/types/transaction.ts#TransactionRecord
    key_fields: [transaction_id]
    fields:
      - logical_name: 取引ID
        physical_name: transaction_id
        description: 取引を一意に識別する業務ID
      - logical_name: 取引種別
        physical_name: transaction_type
        description: 店頭現金販売、掛売り、返品の業務区分

  - logical_name: 支払い
    physical_name: payment
    description: 顧客からの支払い情報（スキーマを参照する例）
    glossary_term_id: tm-payment
    schema_ref: schemas/payment.schema.yaml
    key_fields: [payment_id]
    fields:
      - logical_name: 支払ステータス
        physical_name: payment_status
        description: 支払い処理の現在状態。未処理・支払済・取消の3状態で遷移する
        allowed_values_detailed:
          - value: PENDING
            label: 未処理
          - value: PAID
            label: 支払済
          - value: CANCELED
            label: 取消
