# yaml-language-server: $schema=../../../../docs/specdojo/schemas/v1/tml-index.schema.yaml

id: specdojo:tml-sample
type: project
status: draft
title: トラック順序計画
rulebook: specdojo:tml-rulebook
version: 1
project_id: prj-0001

tracks:
  - track: launch
    domains: [project-definition, project-management]
    catalog_status: primary
    order: 1
    depends_on: []
    note: プロジェクト全体の前提を定義する起点トラック。

  - track: data-flow
    domains: [data-flow]
    catalog_status: primary
    order: 2
    parallel_group: business-specs
    depends_on: [launch]

  - track: data-model
    domains: [data-model]
    catalog_status: draft
    catalog_duration_estimate_days: 3
    order: 2
    parallel_group: business-specs
    depends_on: [launch]
    note: data-flow と同じ入力を使うため並行候補とする。

  - track: architecture
    domains: [architecture]
    catalog_status: not_started
    catalog_duration_estimate_days: 2
    order: 3
    depends_on: [data-flow, data-model]
