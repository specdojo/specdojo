# yaml-language-server: $schema=../../../specdojo/schemas/v1/pm-members.schema.yaml
id: specdojo:pm-members-sample
type: project
status: draft
title: "メンバー定義: 駄菓子屋きぬや 販売管理システム"
rulebook: specdojo:pm-members-rulebook
based_on:
  - specdojo:people-and-organization-definition-standard
  - specdojo:pm-organization-sample
  - specdojo:pm-roles-sample
version: 1
project_id: prj-0001

members:
  - nickname: shop-owner
    display_name: 店主代表
    email: null
    roles: [PO, OPS]
    type: human
    persona: final-decision-maker
    focus:
      - 範囲、費用・参加時間上限、受入、公開・継続の最終判断
      - 店頭運用と引き継ぎへの専門支援
    scheduler_strategy: critical-first
    note: 店舗の当事者として最終判断する。OPS の支援は PM が導入準備へ取り込み、初期は独立した owner にしない。判断の場は営業後の週1回で、急ぎの判断は店頭で受ける。
  - nickname: developer
    display_name: 開発担当
    email: null
    roles: [PM, BA, DEV]
    type: human
    persona: hands-on-builder
    focus:
      - 作業順序・参加負荷の調整と業務・利用者確認
      - 実装・データ設計と技術的な是正判断
    scheduler_strategy: dependency-first
    note: 管理・業務確認・開発を兼務する。利用者の確認と QE の照合を受け、作業記録と判断記録を分ける。作業は放課後と週末に限る。
  - nickname: peer-reviewer
    display_name: 同行レビュー担当
    email: null
    roles: [QE]
    type: human
    focus:
      - 受入条件 ID（AC・BAC）と対象版・検証結果の照合
      - 指摘の是正・再判定結果の確認
    note: 実装に加わらない第三者として開発担当の成果を確かめ、受入・公開の判断材料を PO へ渡す。確認は週末にまとめて行う。
  - nickname: technical-mentor
    display_name: 技術メンター
    email: null
    roles: [ARC]
    type: human
    note: DEV が主導する構成・設計に助言する。初期は独立した Schedule タスクの主責任を持たない。相談は月2回の定例に限り、間の質問は次の定例でまとめて答える。
  - nickname: family-user-representative
    display_name: 家族利用者代表
    email: null
    roles: [UX]
    type: human
    note: 家族の店番での操作・説明を確認し、BA へ専門支援として意見を渡す。内部 Role の承認責任は持たない。参加は週末の店番に入る日だけで、1回30分以内の操作確認とする。

rules:
  - 表示名は役割名だけとし、個人名・学校名・勤務先を書かない。
  - 未成年の member（開発担当・同行レビュー担当）は email を null のままとし、連絡は店主代表を通す。
  - 交代・離脱時は既存の member を消さずに残し、note に交代日と引き継ぎ先の nickname を書いて、後任は新しい nickname で追加する。
