# specdojo-schema: none reason=external-openapi
openapi: 3.0.3
info:
  title: 本部売上登録API
  version: 1.0.0
  description: >-
    駄菓子屋きぬやの店舗端末の販売管理 CLI が、会計確定した売上を本部へ登録する API。
    `specdojo:ifx-index-sample` の「本部への売上登録」の詳細仕様にあたる。

x-spec-meta:
  id: specdojo:ifx-api-sample
  type: api
  status: draft
  rulebook: specdojo:ifx-api-rulebook
  based_on: []

servers:
  - url: https://api.hq.kinuya.example.com
    description: 本部（本番）

paths:
  /v1/sales:
    post:
      operationId: createSale
      summary: 売上を登録する
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSaleRequest"
      responses:
        "201":
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSaleResponse"
        "400":
          description: 入力不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 認証エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 同じ取引IDの売上が登録済み
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 内部エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    CreateSaleRequest:
      type: object
      additionalProperties: false
      required: [transaction_id, sold_at, lines]
      properties:
        transaction_id:
          type: string
          description: 取引ID（店舗端末側の識別子。重複登録の判定に使う）
        sold_at:
          type: string
          format: date-time
          description: 会計確定時刻
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SaleLine"

    SaleLine:
      type: object
      additionalProperties: false
      required: [product_code, quantity, unit_price]
      properties:
        product_code:
          type: string
          description: 商品コード
        quantity:
          type: integer
          minimum: 1
        unit_price:
          type: integer
          minimum: 0
          description: 販売単価（円）

    CreateSaleResponse:
      type: object
      additionalProperties: false
      required: [sale_id, status]
      properties:
        sale_id:
          type: string
          description: 本部が採番した売上ID
        status:
          type: string
          enum: [ACCEPTED, REJECTED]

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          description: 任意の追加情報
