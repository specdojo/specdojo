$schema: "https://json-schema.org/draft/2020-12/schema"
title: Business Data Dictionary Schema
type: object
additionalProperties: false

required:
  - id
  - type
  - title
  - status
  - rulebook
  - entities

properties:
  id:
    type: string
    pattern: "^(?:[a-z][a-z0-9-]*:)?bdd-[a-z0-9\\-]+$"

  type:
    type: string
    const: "data"

  title:
    type: string

  status:
    type: string
    enum: ["draft", "ready", "deprecated"]

  rulebook:
    type: string
    pattern: "^((?:[a-z][a-z0-9-]*:)?[a-z0-9][a-z0-9-]*-rulebook|none)$"

  version:
    type: string

  owners:
    type: array
    items:
      type: string

  tags:
    type: array
    items:
      type: string

  supersedes:
    type: array
    items:
      type: string

  entities:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
        - logical_name
        - physical_name
        - key_fields

      properties:
        logical_name:
          type: string
          pattern: "^[\\p{L}\\p{N}\\p{Zs}]+$"

        physical_name:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"

        description:
          type: string

        schema_ref:
          type: string
          pattern: "^[^\\s]+$"
          description: "正本となるスキーマ（JSON Schema / YAML Schema 等）の参照パス"

        type_ref:
          type: string
          pattern: "^[^\\s]+$"
          description: "正本となる型定義（TypeScript 等）の参照パス（例: src/types/xxx.ts#Type）"

        glossary_term_id:
          type: string
          pattern: "^tm-[A-Za-z0-9\\-]+$"

        related_terms:
          type: array
          items:
            type: string
            pattern: "^tm-[A-Za-z0-9\\-]+$"

        key_fields:
          type: array
          minItems: 1
          items:
            type: string
            pattern: "^[a-z][a-z0-9_]*$"

        fields:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
              - logical_name
              - physical_name

            properties:
              logical_name:
                type: string
                pattern: "^[\\p{L}\\p{N}\\p{Zs}]+$"

              physical_name:
                type: string
                pattern: "^[a-z][a-z0-9_]*$"

              glossary_term_id:
                type: string
                pattern: "^tm-[A-Za-z0-9\\-]+$"

              type:
                type: string
                enum:
                  - integer
                  - string
                  - boolean
                  - date
                  - datetime
                  - enum
                  - money

              description:
                type: string

              unit:
                type: string

              example:
                anyOf:
                  - type: string
                  - type: number
                  - type: boolean

              constraints:
                type: object
                additionalProperties: false
                properties:
                  required:
                    type: boolean
                  unique:
                    type: boolean
                  min:
                    type: number
                  max:
                    type: number
                  pattern:
                    type: string

              allowed_values:
                type: array
                items:
                  type: string
                uniqueItems: true

              allowed_values_detailed:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - value
                    - label
                  properties:
                    value:
                      type: string
                    label:
                      type: string
                uniqueItems: true

      # schema_ref または type_ref がない（スタンドアロン定義）の場合は fields を必須とする
      if:
        not:
          anyOf:
            - required: ["schema_ref"]
            - required: ["type_ref"]
      then:
        required:
          - fields

      # schema_ref と type_ref は同時に指定できない
      not:
        allOf:
          - required: ["schema_ref"]
          - required: ["type_ref"]
