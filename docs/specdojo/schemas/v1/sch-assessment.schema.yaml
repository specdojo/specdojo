# sch-assessment.schema.yaml
$schema: "https://json-schema.org/draft/2020-12/schema"
title: "SpecDojo Schedule readiness assessment schema"
description: >
  Track-scoped assessment of deliverable and Kata (rulebook/recipe/sample/template) readiness.
  Written to sch-assessment-<track>.yaml under the schedule assessments directory and kept under
  version control so the recommended approach can be reviewed and regenerated.
  Responsibility split: `facts` is collected by code (file existence, declaration form, frontmatter
  status, reference resolution) and must never be authored or edited by an agent; `judgment` is the
  agent's semantic assessment (is the content usable as a basis for this deliverable) plus the task
  intent. `recommended_approach` is derived from intent and judgment by a deterministic rule and is
  stored here so a later generator can consume it without re-running the agent.
type: object
additionalProperties: false

required:
  - kind
  - id
  - type
  - status
  - title
  - rulebook
  - schema_version
  - project_id
  - track
  - strategy
  - include_kinds
  - deliverables
  - open_questions
  - confidence

properties:
  kind:
    const: "assessment"
    description: "File kind identifier. Must be 'assessment'."

  id:
    type: string
    minLength: 1
    description: "Deliverable ID (e.g., prj-0001:sch-assessment-launch)."

  type:
    const: "project"

  status:
    type: string
    enum: ["draft", "ready", "deprecated"]

  title:
    type: string
    minLength: 1
    description: "Document title used as the heading of the generated display page."

  rulebook:
    type: string
    pattern: "^((?:[a-z][a-z0-9-]*:)?[a-z0-9][a-z0-9-]*-rulebook|none)$"
    description: "Rulebook ID this document conforms to. Use none when no rulebook exists."

  schema_version:
    type: integer
    minimum: 1
    description: "Assessment schema version this file was written against."

  project_id:
    type: string
    minLength: 1

  track:
    $ref: "./sch-common.schema.yaml#/$defs/Track"

  strategy:
    type: object
    additionalProperties: false
    required:
      - id
      - path
    description: "Strategy file whose scope defined the assessed deliverable set."
    properties:
      id:
        type: string
        minLength: 1
      path:
        type: string
        minLength: 1
        description: "Repository-root-relative path (no leading slash)."

  include_kinds:
    type: array
    minItems: 1
    uniqueItems: true
    description: "Deliverable kinds assessed, copied from the strategy scope (typically [work])."
    items:
      type: string
      enum: ["work", "control", "generated"]

  deliverables:
    type: array
    description: "One entry per deliverable in the strategy scope, ordered by catalog and local_id."
    items:
      $ref: "#/$defs/AssessedDeliverable"

  open_questions:
    type: array
    description: >
      Unresolved points that block a deterministic recommendation. Every deliverable whose
      recommended_approach is 'undecided' must be covered by a blocking entry.
    items:
      $ref: "#/$defs/OpenQuestion"

  confidence:
    $ref: "#/$defs/Confidence"
    description: "Overall confidence in the assessment."

  notes:
    type: string
    description: "Free-form note, e.g. why an existing assessment was regenerated."

$defs:
  Confidence:
    type: string
    enum: ["high", "medium", "low"]

  KataKind:
    type: string
    enum: ["rulebook", "recipe", "sample", "template"]

  AssessedDeliverable:
    type: object
    additionalProperties: false
    required:
      - local_id
      - name
      - catalog_id
      - facts
    properties:
      local_id:
        type: string
        minLength: 1
      name:
        type: string
        minLength: 1
      catalog_id:
        type: string
        minLength: 1
      facts:
        $ref: "#/$defs/Facts"
      judgment:
        $ref: "#/$defs/Judgment"
        description: "Omitted while the entry is still a scaffold (not yet assessed by an agent)."

  Facts:
    type: object
    additionalProperties: false
    description: "Machine-collected facts. Regenerated by the CLI and compared on ingest."
    required:
      - deliverable
      - kata
      - evidence_refs
    properties:
      deliverable:
        type: object
        additionalProperties: false
        required:
          - exists
        properties:
          path:
            type: string
            minLength: 1
            description: "Repository-root-relative document path declared by the catalog."
          exists:
            type: boolean
          status:
            type: string
            description: "Frontmatter status of the existing document, when readable."
      kata:
        type: object
        additionalProperties: false
        required:
          - rulebook
          - recipe
          - sample
          - template
        properties:
          rulebook:
            $ref: "#/$defs/KataFact"
          recipe:
            $ref: "#/$defs/KataFact"
          sample:
            $ref: "#/$defs/KataFact"
          template:
            $ref: "#/$defs/KataFact"
      schema:
        type: object
        additionalProperties: false
        required:
          - path
          - exists
        description: "Validation schema resolved for yaml/json deliverables, when one applies."
        properties:
          path:
            type: string
            minLength: 1
          exists:
            type: boolean
      evidence_refs:
        type: array
        description: "Implementation evidence declared by the catalog, with resolved existence."
        items:
          type: object
          additionalProperties: false
          required:
            - path
            - exists
          properties:
            path:
              type: string
              minLength: 1
            purpose:
              type: string
            exists:
              type: boolean

  KataFact:
    type: object
    additionalProperties: false
    required:
      - declaration
      - exists
      - broken_reference
    properties:
      declaration:
        type: string
        enum: ["declared", "conventional", "none", "not-needed", "unresolved"]
        description: >
          How the reference was resolved. declared: an explicit id in the catalog (rulebook) or in
          the rulebook frontmatter (recipe/sample/template). conventional: no declaration, resolved
          by the conventional <prefix>-<kind> file that exists on disk. not-needed: the catalog
          records an intentional decision not to create this Kata. none: a legacy rulebook-frontmatter
          disablement. unresolved: no declaration and no conventional file.
      id:
        type: string
        minLength: 1
      path:
        type: string
        minLength: 1
        description: "Repository-root-relative path (no leading slash)."
      exists:
        type: boolean
      status:
        type: string
        description: "Frontmatter status of the file, when readable. draft does not imply unusable."
      broken_reference:
        type: boolean
        description: "True when an explicit declaration points at a file that does not exist."

  Judgment:
    type: object
    additionalProperties: false
    required:
      - intent
      - intent_rationale
      - kata
      - recommended_approach
      - rationale
      - evidence
      - confidence
    properties:
      intent:
        $ref: "#/$defs/TaskIntent"
      intent_rationale:
        type: string
        minLength: 1
        description: "Why this task purpose applies, beyond how many Kata files happen to exist."
      kata_target:
        $ref: "#/$defs/KataKind"
        description: "Kata improved by the task. Required for intent improve-kata."
      bootstrap_scope:
        type: array
        minItems: 1
        uniqueItems: true
        description: >
          Kata kinds established together with the deliverable. Required for intent
          bootstrap-kata-set and confirm-with-kata-set.
        items:
          $ref: "#/$defs/KataKind"
      kata:
        type: object
        additionalProperties: false
        description: "Usability judgment per Kata. Only kinds whose file exists are judged."
        properties:
          rulebook:
            $ref: "#/$defs/KataJudgment"
          recipe:
            $ref: "#/$defs/KataJudgment"
          sample:
            $ref: "#/$defs/KataJudgment"
          template:
            $ref: "#/$defs/KataJudgment"
      recommended_approach:
        type: string
        enum:
          [
            "fully-guided",
            "recipe-guided",
            "freeform",
            "bootstrap",
            "retrofit",
            "cross-deliverable-dedup",
            "rulebook-maintenance",
            "recipe-maintenance",
            "sample-maintenance",
            "template-maintenance",
            "finalize",
            "bootstrap-finalize",
            "undecided",
          ]
        description: >
          Approach derived from intent and the usability judgments by the documented rule.
          'undecided' stops generation until the blocking open question is answered.
      rationale:
        type: string
        minLength: 1
      evidence:
        type: array
        minItems: 1
        description: "Paths or ids the judgment is based on (files listed in facts)."
        items:
          type: string
          minLength: 1
      confidence:
        $ref: "#/$defs/Confidence"

  TaskIntent:
    type: string
    enum:
      [
        "author-deliverable",
        "bootstrap-kata-set",
        "reflect-implementation",
        "deduplicate-across-deliverables",
        "improve-kata",
        "confirm-deliverable",
        "confirm-with-kata-set",
      ]
    description: >
      Purpose of the next task for this deliverable. Only author-deliverable is decided by Kata
      readiness (fully-guided / recipe-guided / freeform). The others are purpose-specific phases:
      bootstrap-kata-set establishes the deliverable and a reusable Kata set together,
      reflect-implementation reads declared implementation evidence (retrofit),
      deduplicate-across-deliverables reorganizes an explicitly scoped deliverable group,
      improve-kata maintains one Kata from finished deliverables (*-maintenance), and
      confirm-deliverable / confirm-with-kata-set are human confirmation phases
      (finalize / bootstrap-finalize) that promote status to ready.

  KataJudgment:
    type: object
    additionalProperties: false
    required:
      - usability
      - checks
      - rationale
      - confidence
    properties:
      usability:
        type: string
        enum: ["usable", "unusable", "unknown"]
        description: >
          Derived from checks: usable when every check passes, unusable when any check fails,
          unknown while any check is unknown and none fails.
      checks:
        type: array
        minItems: 4
        maxItems: 4
        description: "All four viewpoints are mandatory; each needs a concrete note as evidence."
        items:
          type: object
          additionalProperties: false
          required:
            - check
            - result
            - note
          properties:
            check:
              type: string
              enum:
                ["target-fit", "substantive-content", "internal-consistency", "standard-alignment"]
              description: >
                target-fit: the content addresses this deliverable rather than a different one.
                substantive-content: the file is not empty or placeholder-dominated.
                internal-consistency: no fatal contradiction with the other Kata of the same set.
                standard-alignment: consistent with the current rulebook and schema.
            result:
              type: string
              enum: ["pass", "fail", "unknown"]
            note:
              type: string
              minLength: 1
              description: "Concrete grounds, e.g. the section or wording that led to the result."
      rationale:
        type: string
        minLength: 1
      confidence:
        $ref: "#/$defs/Confidence"

  OpenQuestion:
    type: object
    additionalProperties: false
    required:
      - topic
      - question
      - blocking
      - reason
    properties:
      topic:
        type: string
        minLength: 1
        description: "Deliverable local_id or a track-wide topic."
      question:
        type: string
        minLength: 1
      blocking:
        type: boolean
        description: "True when the recommendation cannot be finalized until this is answered."
      reason:
        type: string
        minLength: 1
      next_action:
        type: string
