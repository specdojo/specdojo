$schema: "https://json-schema.org/draft/2020-12/schema"
title: SpecDojo Routine Definition
type: object
additionalProperties: false
required: [id, action]
oneOf:
  - required: [interval]
    not:
      required: [trigger]
  - required: [trigger]
    not:
      required: [interval]
properties:
  id:
    type: string
    pattern: "^rtn-[a-z0-9][a-z0-9-]*$"
  name:
    type: string
  description:
    type: string
  enabled:
    type: boolean
  interval:
    type: string
    pattern: "^[1-9][0-9]*[mhdw]$"
  trigger:
    type: object
    additionalProperties: false
    required: [cron, timezone]
    properties:
      cron:
        type: string
        minLength: 1
      timezone:
        type: string
        minLength: 1
  policy:
    type: object
    additionalProperties: false
    properties:
      missed_run:
        enum: [skip, latest, all]
      overlap:
        const: skip
  action:
    oneOf:
      - $ref: "#/$defs/action"
      - type: array
        minItems: 1
        items:
          $ref: "#/$defs/action"
$defs:
  action:
    oneOf:
      - $ref: "#/$defs/jobAction"
      - $ref: "#/$defs/specdojoAction"
  jobAction:
    type: object
    additionalProperties: false
    required: [kind, job]
    properties:
      kind:
        const: job
      job:
        type: string
        pattern: "^job-[a-z0-9][a-z0-9-]*$"
      inputs:
        type: object
        additionalProperties:
          type: string
  specdojoAction:
    description: >
      Runs a specdojo subcommand directly with --project appended, without taking the exec run
      lock. Use only for read-and-generate commands (e.g. dashboard build) that call no agent
      and do not conflict with a running exec.
    type: object
    additionalProperties: false
    required: [kind, args]
    properties:
      kind:
        const: specdojo
      args:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
