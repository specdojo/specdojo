# dct-plan.schema.yaml
$schema: "https://json-schema.org/draft/2020-12/schema"
title: "SpecDojo DCT plan YAML schema"
description: >
  Schema for agent judgment plans (dct-plan-<domain>.yaml) that precede deliverables
  catalog generation. A plan records which deliverable instances a domain needs, which
  template placeholders resolve to which values, which candidates are excluded, and what
  remains undecided. The plan is the version-controlled agent output; the deterministic
  generator consumes it to produce dct-<domain>.yaml. Plans never contain catalog
  structure (groups, base_path, done_criteria); those stay in the DCT template.
type: object
additionalProperties: false

required:
  - id
  - type
  - status
  - title
  - rulebook
  - schema_version
  - project_id
  - domain
  - template
  - inputs
  - iteration_pattern
  - deliverables
  - exclusions
  - open_questions
  - confidence

properties:
  id:
    type: string
    pattern: "^[a-z0-9][a-z0-9-:]*$"
    description: "Document metadata ID (e.g., prj-0001:dct-plan-data-flow)."

  type:
    type: string
    const: "project"
    description: "Document type. Plans are always project documents."

  status:
    type: string
    enum: ["draft", "ready", "deprecated"]
    description: "Document status. Agent output stays draft until a human reviews it."

  title:
    type: string
    minLength: 1
    description: "Document title, used as the heading of the generated display page."

  rulebook:
    type: string
    pattern: "^((?:[a-z][a-z0-9-]*:)?[a-z0-9][a-z0-9-]*-rulebook|none)$"
    description: "Rulebook ID this document conforms to. Use none when no rulebook exists."

  part_of:
    type: array
    description: "Optional parent document IDs."
    items:
      $ref: "#/$defs/DocId"
    uniqueItems: true

  schema_version:
    type: integer
    const: 1
    description: "Plan schema version. Incremented only on breaking changes."

  project_id:
    type: string
    pattern: "^prj-[0-9]{4,}$"
    description: "Project identifier the plan belongs to (e.g., prj-0001)."

  domain:
    type: string
    pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
    description: >
      Target catalog domain. Must match the domain of the DCT template referenced by
      `template` and the <domain> part of the file name dct-plan-<domain>.yaml.

  template:
    $ref: "#/$defs/TemplateRef"

  inputs:
    type: array
    minItems: 1
    description: >
      Documents the agent actually read to reach its judgment. Every deliverable and
      variable must be traceable to one of these entries.
    items:
      $ref: "#/$defs/InputRef"

  iteration_pattern:
    type: string
    enum: ["pattern-a", "pattern-b"]
    description: >
      Template repetition pattern (dct-rulebook, 業務領域テンプレートの反復方針).
      pattern-a: copy a placeholder entry per business area and replace the placeholder
      (e.g., cdfd-_TERM_ -> cdfd-sales, cdfd-purchase).
      pattern-b: a single business area split into fixed local_ids per processing unit;
      placeholders are not used and each entry gets its own local_id.

  variables:
    type: array
    description: >
      Plan-wide placeholder values applied to every deliverable (e.g., a domain-wide
      _TERM_). Deliverable-level variables override entries with the same name.
    items:
      $ref: "#/$defs/Variable"

  deliverables:
    type: array
    description: >
      Deliverable instances the domain needs. Empty only while the plan is a scaffolded
      skeleton that no agent has filled in yet.
    items:
      $ref: "#/$defs/PlannedDeliverable"

  exclusions:
    type: array
    description: "Template entries or candidates deliberately not instantiated, with reasons."
    items:
      $ref: "#/$defs/Exclusion"

  open_questions:
    type: array
    description: >
      Undecided points. Anything the upstream documents do not ground (placeholder value,
      necessity, naming, dependency) belongs here instead of being guessed.
    items:
      $ref: "#/$defs/OpenQuestion"

  confidence:
    type: string
    enum: ["high", "medium", "low"]
    description: "Overall confidence in the plan as a whole."

  notes:
    type: string
    description: "Optional free-form note that does not fit the structured fields."

$defs:
  DocId:
    type: string
    pattern: "^[a-z0-9][a-z0-9-:]*$"
    description: "Document ID (e.g., prj-0001:dct-data-flow)."

  RepoPath:
    type: string
    pattern: "^(?!/)(?!.*(?:^|/)\\.\\.?(?:/|$))(?!.*//)(?!.*\\\\)[^\\s/]+(?:/[^\\s/]+)*$"
    description: >
      Repository-root-relative path. Absolute paths, dot segments, backslashes, duplicate
      separators, and whitespace are forbidden.

  TemplateRef:
    type: object
    additionalProperties: false
    required:
      - id
      - path
    properties:
      id:
        $ref: "#/$defs/DocId"
      path:
        $ref: "#/$defs/RepoPath"

  InputRef:
    type: object
    additionalProperties: false
    required:
      - kind
      - path
    properties:
      kind:
        type: string
        enum: ["data-flow", "upstream-deliverable", "existing-catalog", "template", "other"]
        description: >
          Input category. data-flow is the primary judgment source; existing-catalog marks
          an already generated dct-<domain>.yaml that the plan must not silently drop.
      id:
        $ref: "#/$defs/DocId"
      path:
        $ref: "#/$defs/RepoPath"
      note:
        type: string
        description: "Optional note on how this input was used."

  Variable:
    type: object
    additionalProperties: false
    required:
      - name
      - value
      - evidence
      - rationale
    properties:
      name:
        type: string
        pattern: "^[A-Z][A-Z0-9_]*$"
        description: "Placeholder name without underscores (TERM for _TERM_)."
      value:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]*$"
        description: "Replacement value in kebab-case."
      evidence:
        type: array
        minItems: 1
        uniqueItems: true
        description: "Document IDs or repository-relative paths that ground this value."
        items:
          type: string
          minLength: 1
      rationale:
        type: string
        minLength: 1
        description: "Why this value follows from the evidence."

  PlannedDeliverable:
    type: object
    additionalProperties: false
    required:
      - local_id
      - name
      - kind
      - template_local_id
      - evidence
      - rationale
      - confidence
    properties:
      local_id:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]*$"
        description: "Resolved deliverable local_id. Placeholders must already be replaced."
      name:
        type: string
        minLength: 1
        description: "Human-readable deliverable name for this instance."
      kind:
        type: string
        enum: ["work", "control", "generated"]
        description: "Deliverable kind, matching the template entry."
      template_local_id:
        type: string
        pattern: "^[a-z0-9][a-zA-Z0-9_-]*$"
        description: "local_id of the template entry this instance is derived from."
      variables:
        type: array
        description: "Placeholder values used to derive local_id from template_local_id."
        items:
          $ref: "#/$defs/Variable"
      depends_on:
        type: array
        uniqueItems: true
        description: "local_ids this instance depends on (in this plan or an existing catalog)."
        items:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]*$"
      overview:
        type: string
        description: "Optional one-sentence purpose override for this instance."
      evidence:
        type: array
        minItems: 1
        uniqueItems: true
        description: "Document IDs or repository-relative paths that justify this instance."
        items:
          type: string
          minLength: 1
      rationale:
        type: string
        minLength: 1
        description: "Why this deliverable instance is required."
      confidence:
        type: string
        enum: ["high", "medium", "low"]
        description: "Confidence in this single judgment."

  Exclusion:
    type: object
    additionalProperties: false
    required:
      - candidate
      - reason
    properties:
      candidate:
        type: string
        minLength: 1
        description: "Excluded candidate (template local_id, business area, or instance name)."
      template_local_id:
        type: string
        pattern: "^[a-z0-9][a-zA-Z0-9_-]*$"
        description: "Template entry the candidate would have come from, when applicable."
      reason:
        type: string
        minLength: 1
        description: "Why this candidate is not instantiated."

  OpenQuestion:
    type: object
    additionalProperties: false
    required:
      - topic
      - question
      - blocking
      - reason
    properties:
      topic:
        type: string
        minLength: 1
        description: "What the question is about (placeholder name, local_id, dependency)."
      question:
        type: string
        minLength: 1
        description: "The undecided point, phrased so a human can answer it."
      blocking:
        type: boolean
        description: "True when catalog generation must stop until this is answered."
      reason:
        type: string
        minLength: 1
        description: "Why the upstream documents do not settle this point."
      next_action:
        type: string
        description: "Optional concrete next step (document to write, person to ask)."
