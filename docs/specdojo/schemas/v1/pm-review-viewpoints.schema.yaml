# pm-review-viewpoints.schema.yaml
$schema: "https://json-schema.org/draft/2020-12/schema"
title: "SpecDojo Review Viewpoints YAML schema"
description: >
  Schema for the common review viewpoints file and project-scoped overlays.
  A project can inherit the common set and upsert or disable keyed entries.
type: object
additionalProperties: false

required:
  - id
  - type
  - status
  - title
  - rulebook

oneOf:
  - properties:
      type:
        const: "standard"
      categories:
        minItems: 1
      coverage_types:
        minItems: 1
      severity_levels:
        minItems: 1
      verdict_definitions:
        minItems: 1
      viewpoints:
        minItems: 1
      role_viewpoint_sets:
        minItems: 1
    required:
      - categories
      - coverage_types
      - severity_levels
      - verdict_definitions
      - viewpoints
      - role_viewpoint_sets
  - properties:
      type:
        const: "project"
      extends:
        const: "specdojo:pm-review-viewpoints"
    required: [project_id, extends]
  - properties:
      type:
        const: "project"
    required:
      - project_id
      - categories
      - coverage_types
      - severity_levels
      - verdict_definitions
      - viewpoints
      - role_viewpoint_sets
    not:
      required: [extends]

properties:
  id:
    type: string
    pattern: "^[a-z0-9][a-z0-9-:]*$"
    description: "Document metadata ID (e.g., prj-0001:pm-review-viewpoints)."

  type:
    type: string
    enum: ["standard", "project"]
    description: "Common definitions use standard; project files use project."

  status:
    type: string
    enum: ["draft", "ready", "deprecated"]
    description: "Document status."

  title:
    type: string
    minLength: 1
    description: "Document title. Equivalent to the Markdown H1; used as the heading of the generated display page."

  rulebook:
    type: string
    pattern: "^((?:[a-z][a-z0-9-]*:)?[a-z0-9][a-z0-9-]*-rulebook|none)$"
    description: "Rulebook ID this document conforms to. Use none only when no rulebook exists."

  based_on:
    type: array
    description: "Optional parent document IDs."
    items:
      type: string
      pattern: "^[a-z0-9][a-z0-9-:]*$"
    uniqueItems: true

  version:
    type: integer
    minimum: 1
    description: "Optional schema version for this viewpoints file."

  project_id:
    type: string
    pattern: "^prj-[0-9]{4,}$"
    description: "Project identifier (e.g., prj-0001)."

  extends:
    type: string
    const: "specdojo:pm-review-viewpoints"
    description: >
      Common set inherited by a project overlay. Inheritance is intentionally one level.
      Arrays in an inherited project file upsert common entries by id, or by role for
      role_viewpoint_sets.

  disabled:
    $ref: "#/$defs/DisabledEntries"

  categories:
    type: array
    description: "Review category vocabulary. Each viewpoint belongs to one category."
    items:
      $ref: "#/$defs/Category"

  coverage_types:
    type: array
    description: "Coverage type vocabulary for recording what was checked during review."
    items:
      $ref: "#/$defs/CoverageType"

  severity_levels:
    type: array
    description: "Finding severity vocabulary."
    items:
      $ref: "#/$defs/SeverityLevel"

  verdict_definitions:
    type: array
    description: "Review verdict vocabulary."
    items:
      $ref: "#/$defs/VerdictDefinition"

  viewpoints:
    type: array
    description: "Role-based review viewpoints. Each viewpoint belongs to one role and one category."
    items:
      $ref: "#/$defs/Viewpoint"

  role_viewpoint_sets:
    type: array
    description: "Mapping from Role code to the list of viewpoint IDs assigned to that role."
    items:
      $ref: "#/$defs/RoleViewpointSet"

$defs:
  RoleCode:
    type: string
    pattern: "^[A-Z][A-Z0-9_-]*$"
    description: >
      Role code. Standard codes are PO, PM, BA, ARC, DEV, QE, UX, and OPS.
      Project overlays may use an additional code defined in pm-roles.yaml.

  ArtifactKind:
    type: string
    enum: [requirements, specification, design, testing, operations]
    description: "Artifact kind that a coverage type applies to."

  Category:
    type: object
    additionalProperties: false
    required: [id, name]
    properties:
      id:
        type: string
        pattern: "^[a-z][a-z0-9_-]*$"
        description: "Category identifier (lowercase, hyphens/underscores allowed)."
      name:
        type: string
        minLength: 1
        description: "Human-readable category name."

  CoverageType:
    type: object
    additionalProperties: false
    required: [id, name, description, applies_to]
    properties:
      id:
        type: string
        pattern: "^[a-z][a-z0-9_]*$"
        description: "Coverage type identifier (lowercase, underscores allowed)."
      name:
        type: string
        minLength: 1
        description: "Human-readable coverage type name."
      description:
        type: string
        minLength: 1
        description: "What this coverage type checks."
      applies_to:
        type: array
        minItems: 1
        uniqueItems: true
        description: "Artifact kinds this coverage type is relevant for."
        items:
          $ref: "#/$defs/ArtifactKind"

  SeverityLevel:
    type: object
    additionalProperties: false
    required: [id, description]
    properties:
      id:
        type: string
        enum: [blocker, major, minor, note]
        description: "Severity identifier."
      description:
        type: string
        minLength: 1
        description: "Meaning and handling of this severity level."

  VerdictDefinition:
    type: object
    additionalProperties: false
    required: [id, description]
    properties:
      id:
        type: string
        enum: [pass, conditional_pass, changes_requested, blocked]
        description: "Verdict identifier."
      description:
        type: string
        minLength: 1
        description: "Meaning and next action for this verdict."

  Viewpoint:
    type: object
    additionalProperties: false
    required: [id, role, category, title, check, evidence, default_severity]
    properties:
      id:
        type: string
        pattern: "^vp-[a-z][a-z0-9-]*$"
        description: "Viewpoint identifier. Convention: vp-<role_lower>-<name>."
      role:
        $ref: "#/$defs/RoleCode"
        description: "Role code responsible for this viewpoint."
      category:
        type: string
        pattern: "^[a-z][a-z0-9_-]*$"
        description: "Category ID this viewpoint belongs to."
      title:
        type: string
        minLength: 1
        description: "Short title for the viewpoint."
      check:
        type: string
        minLength: 1
        description: "What to verify — the core review question."
      evidence:
        type: string
        minLength: 1
        description: "What to look at as evidence when checking."
      coverage_types:
        type: array
        minItems: 1
        uniqueItems: true
        description: "Coverage type IDs relevant to this viewpoint."
        items:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
      default_severity:
        type: string
        enum: [blocker, major, minor, note]
        description: "Default finding severity when this viewpoint fails."

  RoleViewpointSet:
    type: object
    additionalProperties: false
    required: [role, viewpoints]
    properties:
      role:
        $ref: "#/$defs/RoleCode"
        description: "Role code."
      viewpoints:
        type: array
        minItems: 1
        uniqueItems: true
        description: "Ordered list of viewpoint IDs assigned to this role."
        items:
          type: string
          pattern: "^vp-[a-z][a-z0-9-]*$"

  DisabledEntries:
    type: object
    additionalProperties: false
    description: >
      Keys removed after project upserts. The same key cannot be both upserted and disabled.
    properties:
      categories:
        $ref: "#/$defs/DisabledIds"
      coverage_types:
        $ref: "#/$defs/DisabledIds"
      severity_levels:
        $ref: "#/$defs/DisabledIds"
      verdict_definitions:
        $ref: "#/$defs/DisabledIds"
      viewpoints:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^vp-[a-z][a-z0-9-]*$"
      role_viewpoint_sets:
        type: array
        uniqueItems: true
        items:
          $ref: "#/$defs/RoleCode"

  DisabledIds:
    type: array
    uniqueItems: true
    items:
      type: string
      minLength: 1
