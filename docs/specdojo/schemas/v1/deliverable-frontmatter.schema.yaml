$schema: "https://json-schema.org/draft/2020-12/schema"
title: Deliverables Front Matter
# SpecDojo が所有する frontmatter は `specdojo:` 名前空間配下に置く。
# トップレベルは第三者ツール（VitePress 等）のキーを許容するため制限しない。
type: object
required:
  - specdojo
properties:
  specdojo:
    type: object
    unevaluatedProperties: false
    allOf:
      - $ref: "./common-frontmatter.schema.yaml"
      - type: object
        required:
          - rulebook
        properties:
          type:
            type: string
            enum:
              # SpecDojo基盤文書（専用スキーマを持たないもの）
              - template # 文書テンプレート（雛形）
              - sample # 記述例
              # プロジェクト文書
              - project # プロジェクト文書全般
              # プロダクト仕様文書
              - flow # 業務フロー・プロセス仕様
              - rule # 業務ルール仕様
              - data # データ仕様
              - ui # 画面・帳票仕様
              - api # API・外部I/F仕様
              - architecture # アーキテクチャ設計
              - test # テスト仕様・設計
              - operations # 運用設計・手順
            description: "仕様の種別（rulebook/guide/standard は各専用スキーマを使用）"
          rulebook:
            $ref: "./common-frontmatter.schema.yaml#/$defs/rulebookRef"
            description: "準拠する rulebook の ID。該当がない場合は none。"
          relations:
            type: object
            additionalProperties: false
            properties:
              satisfies:
                $ref: "./common-frontmatter.schema.yaml#/$defs/idRefArray"
                default: []
                description: "この成果物が充足する要求・要件・受入条件のID。"
              verifies:
                $ref: "./common-frontmatter.schema.yaml#/$defs/idRefArray"
                default: []
                description: "この成果物が検証する要求・仕様・受入条件のID。"
              implements:
                $ref: "./common-frontmatter.schema.yaml#/$defs/idRefArray"
                default: []
                description: "この成果物が実現する仕様・設計のID。"
            default: {}
          # 登録項目（pjr-XXXX-<topic>）の構造化フィールド。定義の正本は
          # register-item-frontmatter.schema.yaml 側にあり、そちらは必須項目と
          # 終端状態の完了日も検証する。ここでは個票が段階的に項目を持てるよう、
          # 同じ定義を参照した任意項目として許可する。
          item_type:
            $ref: "./register-item-frontmatter.schema.yaml#/$defs/ItemType"
            description: "プロジェクト登録項目の種別。pjr-*-template で使用する。"
          item_status:
            $ref: "./register-item-frontmatter.schema.yaml#/$defs/ItemStatus"
            description: "登録項目の処理状態。文書成熟度の status とは別の状態軸。"
          priority:
            $ref: "./register-item-frontmatter.schema.yaml#/$defs/Priority"
            description: "登録項目の対応優先度。"
          owner:
            type: string
            minLength: 1
            description: "登録項目の担当ロールコードまたは担当者。未定の場合は項目自体を省略する。"
          registered_on:
            $ref: "./register-item-frontmatter.schema.yaml#/$defs/Date"
            description: "登録項目を起票した日付。"
          due_on:
            oneOf:
              - $ref: "./register-item-frontmatter.schema.yaml#/$defs/Date"
              - type: "null"
            description: "登録項目の対応期限または判断期限。未定は省略し、期限なしは null。"
          completed_on:
            $ref: "./register-item-frontmatter.schema.yaml#/$defs/Date"
            description: "登録項目を完了・決定・却下した日付。"
          conclusion:
            type: string
            minLength: 1
            description: "登録項目の完了・決定・却下時の結果を1文で要約した結論。"
          size:
            type: string
            enum: ["small", "medium", "large"]
            description: "scaffold 時に選択したプロジェクトサイズ。dct-index に記録し、テンプレートの min_size フィルタの根拠とする。"
