# agent-members.schema.yaml
$schema: "https://json-schema.org/draft/2020-12/schema"
title: "SpecDojo Protected Agent Member Registry schema"
type: object
additionalProperties: false
required: [version, members]
properties:
  version:
    type: integer
    minimum: 1
  members:
    type: array
    items:
      $ref: "#/$defs/AgentMember"
    uniqueItems: true
  aliases:
    type: array
    description: >
      Backward-compatible names that refer to concrete members. alias_of may refer to
      another alias, but every chain must terminate at an enabled member.
    items:
      $ref: "#/$defs/AgentAlias"
    uniqueItems: true
$defs:
  AgentNickname:
    type: string
    pattern: "^[a-z0-9][a-z0-9_-]{0,62}$"
  RoleLabel:
    type: string
    pattern: "^[A-Z]{2,4}$"
  AgentMember:
    type: object
    additionalProperties: false
    required: [nickname, display_name, roles, type, provider, capabilities, proficiency, priority]
    properties:
      nickname:
        $ref: "#/$defs/AgentNickname"
      display_name:
        type: string
        minLength: 1
      email:
        oneOf:
          - type: string
            format: email
          - type: "null"
      roles:
        type: array
        items:
          $ref: "#/$defs/RoleLabel"
        uniqueItems: true
      type:
        const: agent
      provider:
        enum: [opencode, claude, codex, copilot, antigravity, custom]
      model:
        type: string
        minLength: 1
        description: "Provider model identifier, including its version when applicable."
      effort:
        type: string
        minLength: 1
        description: "Provider-specific reasoning effort passed when the provider supports it."
      persona:
        type: string
        minLength: 1
      focus:
        type: array
        items:
          type: string
          minLength: 1
        uniqueItems: true
      capabilities:
        type: array
        items:
          $ref: "./exec-common.schema.yaml#/$defs/Capability"
        uniqueItems: true
      proficiency:
        $ref: "./exec-common.schema.yaml#/$defs/Proficiency"
      priority:
        type: integer
        minimum: 1
      command:
        type: string
        minLength: 1
      mode:
        enum: [edit, review, report]
      stage_role:
        enum: [executor, reporter]
      disabled:
        type: boolean
      scheduler_strategy:
        enum: [critical-first, dependency-first, fifo, manual]
      note:
        type: string
  AgentAlias:
    type: object
    additionalProperties: false
    required: [nickname, alias_of]
    properties:
      nickname:
        $ref: "#/$defs/AgentNickname"
      alias_of:
        $ref: "#/$defs/AgentNickname"
