# exec-result-frontmatter.schema.yaml
$schema: "https://json-schema.org/draft/2020-12/schema"
title: "SpecDojo Exec Result frontmatter schema"
description: >
  Validates the YAML frontmatter of exec result files (edit-result and review-result).
  Result files are Markdown documents with YAML frontmatter created by exec run.
  They reside at exec/results/<task-id>-result.md under the execution path.
  The harness scaffolds the file before execution and updates status/timestamps after.
  The actor fills in the Markdown body (done_criteria checks, notes, handoff).
# SpecDojo が所有する frontmatter は `specdojo:` 名前空間配下に置く。
type: object
required:
  - specdojo
properties:
  specdojo:
    type: object
    additionalProperties: true
    required:
      - id
      - type
      - task_id
      - mode
      - status
      - project_id
      - started_at
    allOf:
      # Register-originated tasks have no predetermined target deliverable, so targets
      # cannot be resolved and is not required. Schedule tasks always carry it because
      # the commit allowlist is derived from it.
      - if:
          required:
            - origin
          properties:
            origin:
              enum: [register, job]
        else:
          required:
            - targets
          properties:
            targets: true
      - if:
          required:
            - execution
          properties:
            execution:
              const: human
        then:
          # execution: human では plan_ref を持たない。
          # ajv strict の strictRequired は allOf 配下から親の properties を参照できないため、
          # `not: {required: [plan_ref]}` ではなく properties 側で不許可を表現する。
          properties:
            plan_ref: false
        else:
          required:
            - plan_ref
          properties:
            plan_ref:
              type: string
              minLength: 1
    properties:
      id:
        type: string
        minLength: 1
        description: "Unique document ID. Format: <project-id>:xer-<stem> (edit) or <project-id>:xrr-<stem> (review). For fixed-name results the stem is the task id; for unique-named in-place results it is <slug>-<UTC>-<rand>, shared with the tied plan."

      type:
        type: string
        const: "exec-result"
        description: "Document type. Always 'exec-result'."

      task_id:
        $ref: "./exec-common.schema.yaml#/$defs/TaskId"
        description: "Task ID this result belongs to."

      mode:
        $ref: "./exec-common.schema.yaml#/$defs/TaskMode"
        description: "Work type. Matches the task mode."

      status:
        type: string
        enum: ["in_progress", "complete", "blocked"]
        description: >
          Lifecycle status managed by exec run harness.
          in_progress: scaffold created, agent running.
          complete: agent exited 0, exec complete recorded.
          blocked: agent exited non-zero, exec block recorded.

      project_id:
        $ref: "./exec-common.schema.yaml#/$defs/ProjectId"

      origin:
        $ref: "./exec-common.schema.yaml#/$defs/TaskOrigin"

      job_id:
        type: string
        pattern: "^job-[a-z0-9][a-z0-9-]*$"

      run_id:
        type: string
        pattern: "^JBR-[A-Za-z0-9-]+$"

      plan_ref:
        type: string
        minLength: 1
        description: "Relative path to the corresponding plan file. Omitted for execution: human."

      started_at:
        type: string
        format: date-time
        description: "ISO 8601 timestamp when exec run scaffolded this result and started the agent."

      completed_at:
        type: string
        format: date-time
        description: "ISO 8601 timestamp when the agent exited. Set by exec run harness."

      agent:
        $ref: "./exec-common.schema.yaml#/$defs/AgentNickname"
        description: "Actor nickname that executed this task."

      execution:
        type: string
        enum: ["agent", "human"]
        description: >
          Execution owner. Human tasks are result-only and omit plan_ref.

      approach:
        $ref: "./exec-common.schema.yaml#/$defs/Approach"
        description: >
          Carried from the scheduled task. Omitted when not declared for this phase.

      targets:
        type: array
        items:
          type: string
          minLength: 1
        minItems: 1
        description: >
          Doc ids of the documents this task targets, carried with the same rules as the
          plan frontmatter targets (first entry: target deliverable, then reference
          materials the approach may modify or confirm).
