$schema: "https://json-schema.org/draft/2020-12/schema"
title: Rulebook Front Matter
# SpecDojo が所有する frontmatter は `specdojo:` 名前空間配下に置く。
type: object
required:
  - specdojo
properties:
  specdojo:
    type: object
    unevaluatedProperties: false
    allOf:
      - $ref: "./common-frontmatter.schema.yaml"
      - type: object
        properties:
          type:
            type: string
            const: rulebook
            description: "ドキュメント種別（rulebook 固定）"
          target_format:
            type: string
            enum:
              - yaml
              - json
              - markdown
            description: "ルールの対象となるドキュメントのフォーマット"
          includes:
            type: array
            uniqueItems: true
            items:
              type: string
              pattern: "^(?:[a-z][a-z0-9-]*:)?[a-z0-9][a-z0-9-]*-rulebook$"
            description: >-
              併せて適用する rulebook の ID 配列（記法ルールなど共有部品）。
              自分自身は含めない。単一段のみ（include 先の include はたどらない）。
              sample / template / schema / target_format のアンカーは主 rulebook が保持し、
              includes 先は記法・散文の寄与のみとする。
          recipe:
            $ref: "./common-frontmatter.schema.yaml#/$defs/recipeRef"
            description: "対応する recipe の ID（fully-guided / recipe-guided の参照解決に使う）。"
          sample:
            oneOf:
              - $ref: "./common-frontmatter.schema.yaml#/$defs/sampleRef"
              - type: array
                minItems: 1
                uniqueItems: true
                items:
                  type: string
                  pattern: "^(?:[a-z][a-z0-9-]*:)?[a-z0-9][a-z0-9-]*-sample$"
            description: >-
              対応する sample の ID または ID 配列（fully-guided の参照解決に使う）。
              配列の場合、先頭をカタログ指定がない場合の既定例とする。
          template:
            $ref: "./common-frontmatter.schema.yaml#/$defs/templateRef"
            description: "対応する template の ID（fully-guided の参照解決に使う）。"
          schema:
            type: string
            description: >-
              対象成果物（target_format: yaml）を検証する JSON Schema のファイル名 stem。
              docs/specdojo/schemas/v1/<schema>.schema.yaml に解決される。'none' で検証を無効化。
              未宣言時は <local_id>.schema.yaml → <prefix>.schema.yaml の順に慣例解決する。
