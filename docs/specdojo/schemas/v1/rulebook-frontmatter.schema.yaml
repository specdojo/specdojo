$schema: "https://json-schema.org/draft/2020-12/schema"
title: Rulebook Front Matter
# SpecDojo が所有する frontmatter は `specdojo:` 名前空間配下に置く。
type: object
required:
  - specdojo
properties:
  specdojo:
    type: object
    unevaluatedProperties: false
    allOf:
      - $ref: "./common-frontmatter.schema.yaml"
      - type: object
        properties:
          type:
            type: string
            const: rulebook
            description: "ドキュメント種別（rulebook 固定）"
          target_format:
            type: string
            enum:
              - yaml
              - json
              - markdown
            description: "ルールの対象となるドキュメントのフォーマット"
          includes:
            type: array
            uniqueItems: true
            items:
              type: string
              pattern: "^(?:[a-z][a-z0-9-]*:)?[a-z0-9][a-z0-9-]*-rulebook$"
            description: >-
              併せて適用する rulebook の ID 配列（記法ルールなど共有部品）。
              自分自身は含めない。単一段のみ（include 先の include はたどらない）。
              sample / template / target_format のアンカーは主 rulebook が保持し、includes
              先は記法・散文の寄与のみとする。
          recipe:
            type: string
            pattern: "^(?:(?:[a-z][a-z0-9-]*:)?[a-z0-9][a-z0-9-]*-recipe|undecided|not-needed)$"
            description: >-
              対応する recipe の ID、要否未判断の undecided、または不要を表す not-needed。
              省略は必要だが未整備であることを表す。
          sample:
            oneOf:
              - type: string
                pattern: "^(?:(?:[a-z][a-z0-9-]*:)?[a-z0-9][a-z0-9-]*-sample|undecided|not-needed)$"
              - type: array
                minItems: 1
                uniqueItems: true
                items:
                  type: string
                  pattern: "^(?:[a-z][a-z0-9-]*:)?[a-z0-9][a-z0-9-]*-sample$"
            description: >-
              対応する sample の ID または ID 配列、要否未判断の undecided、または不要を表す
              not-needed。省略は必要だが未整備であることを表す。配列の場合、先頭を既定例とする。
          template:
            type: string
            pattern: "^(?:(?:[a-z][a-z0-9-]*:)?[a-z0-9][a-z0-9-]*-template|undecided|not-needed)$"
            description: >-
              対応する template の ID、要否未判断の undecided、または不要を表す not-needed。
              省略は必要だが未整備であることを表す。
          template_dispatch:
            type: object
            required:
              - selector
              - cases
            additionalProperties: false
            properties:
              selector:
                type: string
                pattern: "^[a-z][a-z0-9_]*$"
                description: "template を選択する成果物フィールド名"
              cases:
                type: object
                minProperties: 1
                propertyNames:
                  pattern: "^[a-z0-9][a-z0-9-]*$"
                additionalProperties:
                  type: string
                  pattern: "^(?:[a-z][a-z0-9-]*:)?[a-z0-9][a-z0-9-]*-template$"
                description: "selector の値から対応する template ID への写像"
            description: >-
              1つの rulebook が成果物フィールドの値に応じて複数 template を使い分ける場合の
              ディスパッチ宣言。template とは同時に指定しない。
        not:
          properties:
            template: {}
            template_dispatch: {}
          required:
            - template
            - template_dispatch
