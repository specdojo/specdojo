$schema: "https://json-schema.org/draft/2020-12/schema"
title: "SpecDojo External Command Interface YAML schema"
description: >
  Schema for ifx-cmd YAML documents and their template. Template placeholders are
  accepted so editor assistance works before scaffolded files are filled.
type: object
additionalProperties: false

required:
  - id
  - type
  - status
  - title
  - rulebook
  - command
  - arguments
  - streams
  - exit_codes
  - authentication
  - execution
  - error_handling

properties:
  id:
    type: string
    minLength: 1
  type:
    type: string
    enum: ["command", "template"]
  status:
    type: string
    enum: ["draft", "ready", "deprecated"]
  title:
    type: string
    minLength: 1
  rulebook:
    type: string
    pattern: "^((?:[a-z][a-z0-9-]*:)?[a-z0-9][a-z0-9-]*-rulebook|none)$"
  version:
    $ref: "#/$defs/PositiveIntegerOrPlaceholder"
  based_on:
    type: array
    items:
      type: string
    uniqueItems: true
  metadata_template:
    type: object
    additionalProperties: true

  command:
    type: object
    additionalProperties: false
    required:
      - executable
      - subcommands
      - purpose
      - shell
    properties:
      executable:
        type: string
        minLength: 1
      subcommands:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
      purpose:
        type: string
        minLength: 1
      version_constraint:
        type: string
      shell:
        $ref: "#/$defs/BooleanOrPlaceholder"

  arguments:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - name
        - kind
        - required
        - value_type
        - value_source
        - description
      properties:
        name:
          type: string
          minLength: 1
        kind:
          type: string
          enum: ["argument", "option", "_ARGUMENT_KIND_"]
        required:
          $ref: "#/$defs/BooleanOrPlaceholder"
        value_type:
          type: string
          minLength: 1
        value_source:
          type: string
          enum: ["literal", "generated", "secret", "user_input", "_ARGUMENT_VALUE_SOURCE_"]
        description:
          type: string
          minLength: 1
        example: {}

  streams:
    type: object
    additionalProperties: false
    required:
      - stdin
      - stdout
      - stderr
    properties:
      stdin:
        $ref: "#/$defs/Stream"
      stdout:
        $ref: "#/$defs/Stream"
      stderr:
        $ref: "#/$defs/Stream"

  exit_codes:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
        - code
        - meaning
        - category
        - retryable
      properties:
        code:
          $ref: "#/$defs/NonNegativeIntegerOrPlaceholder"
        meaning:
          type: string
          minLength: 1
        category:
          type: string
          enum:
            - success
            - input_error
            - authentication_error
            - authorization_error
            - permanent_failure
            - transient_failure
            - _FAILURE_CATEGORY_
        retryable:
          $ref: "#/$defs/BooleanOrPlaceholder"

  authentication:
    type: object
    additionalProperties: false
    required:
      - method
      - injection
      - secret_source
      - log_policy
    properties:
      method:
        type: string
        minLength: 1
      injection:
        type: object
        additionalProperties: false
        required:
          - mechanism
          - names
        properties:
          mechanism:
            type: string
            minLength: 1
          names:
            type: array
            minItems: 1
            items:
              type: string
              minLength: 1
      secret_source:
        type: string
        minLength: 1
      log_policy:
        type: string
        minLength: 1

  execution:
    type: object
    additionalProperties: false
    required:
      - working_directory
      - timeout_seconds
      - network_required
      - max_parallel
      - idempotency
    properties:
      working_directory:
        type: string
        minLength: 1
      timeout_seconds:
        $ref: "#/$defs/PositiveIntegerOrPlaceholder"
      network_required:
        $ref: "#/$defs/BooleanOrPlaceholder"
      max_parallel:
        $ref: "#/$defs/PositiveIntegerOrPlaceholder"
      idempotency:
        type: object
        additionalProperties: false
        required:
          - guaranteed
          - condition
        properties:
          guaranteed:
            $ref: "#/$defs/BooleanOrPlaceholder"
          condition:
            type: string
            minLength: 1

  error_handling:
    type: object
    additionalProperties: false
    required:
      - retry
      - timeout_action
      - malformed_output_action
      - authentication_failure_action
    properties:
      retry:
        type: object
        additionalProperties: false
        required:
          - on_categories
          - max_attempts
          - backoff
        properties:
          on_categories:
            type: array
            items:
              type: string
              minLength: 1
          max_attempts:
            $ref: "#/$defs/NonNegativeIntegerOrPlaceholder"
          backoff:
            type: string
            minLength: 1
      timeout_action:
        type: string
        minLength: 1
      malformed_output_action:
        type: string
        minLength: 1
      authentication_failure_action:
        type: string
        minLength: 1

$defs:
  BooleanOrPlaceholder:
    oneOf:
      - type: boolean
      - type: string
        pattern: "^_[A-Z0-9_]+_$"

  NonNegativeIntegerOrPlaceholder:
    oneOf:
      - type: integer
        minimum: 0
      - type: string
        pattern: "^_[A-Z0-9_]+_$"

  PositiveIntegerOrPlaceholder:
    oneOf:
      - type: integer
        minimum: 1
      - type: string
        pattern: "^_[A-Z0-9_]+_$"

  Stream:
    type: object
    additionalProperties: false
    required:
      - format
    properties:
      mode:
        type: string
        minLength: 1
      format:
        type: string
        minLength: 1
      encoding:
        type: string
      description:
        type: string
