# pm-members.schema.yaml
$schema: "https://json-schema.org/draft/2020-12/schema"
title: "SpecDojo Human Member Roster schema"
type: object
$comment: >
  Schema for project-local human rosters. Runnable agent definitions belong in the
  repository-wide protected agent-members.yaml file.
additionalProperties: false
required: [id, type, status, title, rulebook, version, project_id, members]
properties:
  id:
    type: string
    pattern: "^[a-z0-9][a-z0-9-:]*$"
  type:
    const: project
  status:
    enum: [draft, ready, deprecated]
  title:
    type: string
    minLength: 1
  rulebook:
    type: string
    pattern: "^((?:[a-z][a-z0-9-]*:)?[a-z0-9][a-z0-9-]*-rulebook|none)$"
  based_on:
    type: array
    items:
      type: string
      pattern: "^[a-z0-9][a-z0-9-:]*$"
    uniqueItems: true
  supersedes:
    type: array
    items:
      type: string
      pattern: "^[a-z0-9][a-z0-9-:]*$"
    uniqueItems: true
  version:
    type: integer
    minimum: 1
  project_id:
    type: string
    minLength: 1
  members:
    type: array
    items:
      $ref: "#/$defs/HumanMember"
    uniqueItems: true
  rules:
    type: array
    items:
      type: string
      minLength: 1
    uniqueItems: true
$defs:
  RoleLabel:
    type: string
    pattern: "^[A-Z]{2,4}$"
  HumanMember:
    type: object
    additionalProperties: false
    required: [nickname, display_name, roles, type]
    properties:
      nickname:
        type: string
        pattern: "^[a-z0-9][a-z0-9_-]{0,62}$"
      display_name:
        type: string
        minLength: 1
      email:
        oneOf:
          - type: string
            format: email
          - type: "null"
      roles:
        type: array
        items:
          $ref: "#/$defs/RoleLabel"
        uniqueItems: true
      type:
        const: human
      persona:
        type: string
        minLength: 1
      focus:
        type: array
        items:
          type: string
          minLength: 1
        uniqueItems: true
      scheduler_strategy:
        enum: [critical-first, dependency-first, fifo, manual]
      note:
        type: string
