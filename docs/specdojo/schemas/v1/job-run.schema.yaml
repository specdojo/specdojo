$schema: "https://json-schema.org/draft/2020-12/schema"
title: SpecDojo Job Run
type: object
additionalProperties: false
required:
  - version
  - run_id
  - job_id
  - idempotency_key
  - project_id
  - trigger
  - scheduled_at
  - created_at
  - updated_at
  - state
  - inputs
  - task
  - checkpoint_before
  - plan_ref
  - result_ref
  - attempts
properties:
  version:
    const: 1
  run_id:
    type: string
    pattern: "^JBR-[A-Za-z0-9-]+$"
  job_id:
    type: string
    pattern: "^job-[a-z0-9][a-z0-9-]*$"
  idempotency_key:
    type: string
    minLength: 1
  project_id:
    type: string
    minLength: 1
  trigger:
    enum: [manual, routine, ci]
  scheduled_at:
    type: string
    format: date-time
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  state:
    enum: [running, succeeded, failed, noop]
  inputs:
    type: object
  task:
    type: object
  checkpoint_before:
    type: object
  checkpoint_after:
    type: object
  plan_ref:
    type: string
    minLength: 1
  result_ref:
    type: string
    minLength: 1
  attempts:
    type: array
    minItems: 1
    items:
      type: object
      required: [attempt, started_at, status]
      properties:
        attempt:
          type: integer
          minimum: 1
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        status:
          enum: [running, succeeded, failed, noop]
        result_ref:
          type: string
        reason:
          type: string
