# register-item-frontmatter.schema.yaml
$schema: "https://json-schema.org/draft/2020-12/schema"
title: "SpecDojo Register Item frontmatter schema"
description: >
  Validates the YAML frontmatter of project register item files
  (pjr-XXXX-<topic>.md under controls/project-register).

  The frontmatter is the single source of truth for the structured fields of one
  register item: classification (item_type), processing status (item_status),
  priority, owner, dates, block reason and conclusion. The register list (pjr-index) is a derived
  view generated from these files, so the same field is never stored in two places.

  Conventions:
  - Undecided values are expressed by omitting the key. Table placeholders such as
    "_TODO_" and "-" belong to the rendered list, not to the frontmatter.
  - The display id (PJR-XXXX) is derived from `id`, and the title and summary are
    derived from the H1 and the body, so they are not duplicated as fields.
  - `status` is the document maturity (draft / ready / deprecated) shared by every
    deliverable. The processing status of the register item is `item_status`.
# SpecDojo が所有する frontmatter は `specdojo:` 名前空間配下に置く。
# トップレベルは第三者ツール（VitePress 等）のキーを許容するため制限しない。
type: object
required:
  - specdojo
properties:
  specdojo:
    type: object
    unevaluatedProperties: false
    allOf:
      - $ref: "./common-frontmatter.schema.yaml"
      # done / decided / rejected は register close / reject が完了日時を記入する終端状態。
      # deferred は完了日時を伴わない（register defer は日時を記録しない）ため対象外。
      - if:
          required:
            - item_status
          properties:
            item_status:
              $ref: "#/$defs/ClosedItemStatus"
        then:
          required:
            - completed_at
          # ajv strict の strictRequired は同じ subschema の properties しか参照しないため、
          # required と同じ位置で対象プロパティを宣言する。
          properties:
            completed_at: true
      - type: object
        required:
          - rulebook
          - part_of
          - item_type
          - item_status
          - priority
        properties:
          id:
            type: string
            pattern: "^[a-z][a-z0-9-]*:pjr-[0-9abcdefghjkmnpqrstvwxyz]{4}-[a-z0-9-]+$"
            description: >
              Document id in the form <project-id>:pjr-XXXX-<topic>. The 4-character
              id part uses the PJR-ID alphabet (digits and letters without
              i / l / o / u) in lower case, and the display id PJR-XXXX is derived
              from it.

          type:
            const: "project"
            description: "Document type. Register items are project documents."

          status:
            description: >
              Document maturity (draft / ready / deprecated) defined in
              common-frontmatter.schema.yaml. It tracks whether the body is settled
              and is not a mirror of item_status.

          rulebook:
            $ref: "./common-frontmatter.schema.yaml#/$defs/rulebookRef"
            description: "Rulebook the item follows. Normally specdojo:pjr-rulebook."

          part_of:
            $ref: "./common-frontmatter.schema.yaml#/$defs/idRefArray"
            type: array
            minItems: 1
            description: >
              Register the item belongs to, as [<project-id>:pjr-index]. Used to
              group items when the list view is generated.

          item_type:
            $ref: "#/$defs/ItemType"
            description: "Classification of the register item (list column: 分類)."

          item_status:
            $ref: "#/$defs/ItemStatus"
            description: "Processing status of the item (list column: ステータス)."

          priority:
            $ref: "#/$defs/Priority"
            description: "Handling priority (list column: 優先度)."

          owner:
            type: string
            minLength: 1
            description: >
              Role code defined in pm-roles.yaml (e.g. ARC, PO) or the responsible
              member. Omit the key while the owner is undecided (list column: 担当).

          registered_at:
            $ref: "#/$defs/Timestamp"
            description: >
              Instant the item was registered, in UTC. The displayed registration
              date (list column: 登録日) is derived by converting it to the project
              register timezone. Omit the key only when the registration time of a
              legacy item is unknown; newly added items always record it.

          due_on:
            oneOf:
              - $ref: "#/$defs/Date"
              - type: "null"
            description: >
              Due date for the response or the decision. It is a calendar day in the
              project register timezone, not an instant, so it stays a date. Omit the
              key while the date is undecided; use null when the item explicitly has
              no due date (list column: 期限).

          completed_at:
            $ref: "#/$defs/Timestamp"
            description: >
              Instant the item was completed, decided or rejected, in UTC. Required
              for the closed statuses and removed when the item is reopened. The
              displayed completion date (list column: 完了日) is derived by converting
              it to the project register timezone.

          block_reason:
            type: string
            minLength: 1
            description: >
              Most recent reason the item transitioned to waiting. This operational
              record is separate from conclusion so a failed execution cannot replace
              the item's final result. Append-only register events retain its changes.

          conclusion:
            type: string
            minLength: 1
            description: >
              One-sentence summary of the result at completion, decision or
              rejection. Omit the key while it is undetermined; the details stay in
              the body (list column: 結論).

          register_events:
            type: array
            items:
              $ref: "#/$defs/RegisterEvent"
            description: >
              Append-only business events for this item. Current structured values
              remain authoritative in the surrounding frontmatter; this log is the
              authoritative audit history and survives squashed Git commits.

$defs:
  ItemType:
    type: string
    enum:
      - todo
      - question
      - risk
      - issue
      - change-request
      - decision
      - note
    description: "Register item classification."

  ItemStatus:
    type: string
    enum:
      - open
      - in-progress
      - waiting
      - review
      - decided
      - done
      - deferred
      - rejected
    description: "Processing status of a register item."

  ClosedItemStatus:
    type: string
    enum:
      - decided
      - done
      - rejected
    description: >
      Statuses that record a completion date. deferred is terminal for state
      transitions but keeps no completion date.

  Priority:
    type: string
    enum:
      - high
      - medium
      - low
    description: "Handling priority of a register item."

  Date:
    type: string
    format: date
    description: >
      ISO date (YYYY-MM-DD). Write it as a quoted YAML string, because an unquoted
      date is loaded as a timestamp value instead of a string.

  Timestamp:
    type: string
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
    description: >
      RFC 3339 date-time in UTC with second precision (YYYY-MM-DDTHH:MM:SSZ).
      Storing the instant instead of a calendar day keeps the record independent of
      the display timezone. Write it as a quoted YAML string, because an unquoted
      date-time is loaded as a timestamp value instead of a string.

  RegisterEventId:
    type: string
    pattern: "^reg_[a-f0-9]{32}$"
    description: "Globally unique and immutable register event identifier."

  RegisterEventAction:
    type: string
    enum:
      - add
      - start
      - wait
      - review
      - close
      - reject
      - defer
      - reopen
      - update
      - renumber
      - migrate

  RegisterEventChange:
    type: object
    additionalProperties: false
    required:
      - field
      - from
      - to
    properties:
      field:
        type: string
        enum:
          - id
          - status
          - title
          - description
          - type
          - priority
          - owner
          - registered
          - due
          - completed
          - conclusion
          - block_reason
      from:
        type: string
      to:
        type: string

  RegisterEvent:
    type: object
    additionalProperties: false
    required:
      - v
      - id
      - ts
      - action
      - actor
      - from_status
      - to_status
      - reason
      - changes
    properties:
      v:
        const: 1
      id:
        $ref: "#/$defs/RegisterEventId"
      ts:
        $ref: "#/$defs/Timestamp"
      action:
        $ref: "#/$defs/RegisterEventAction"
      actor:
        type: string
        minLength: 1
      from_status:
        oneOf:
          - $ref: "#/$defs/ItemStatus"
          - type: "null"
      to_status:
        $ref: "#/$defs/ItemStatus"
      reason:
        type: string
        minLength: 1
      changes:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/RegisterEventChange"
      previous_event_id:
        $ref: "#/$defs/RegisterEventId"
      legacy_commit:
        type: string
        minLength: 1
