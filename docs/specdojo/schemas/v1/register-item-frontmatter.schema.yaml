# register-item-frontmatter.schema.yaml
$schema: "https://json-schema.org/draft/2020-12/schema"
title: "SpecDojo Register Item frontmatter schema"
description: >
  Validates the YAML frontmatter of project register item files
  (pjr-XXXX-<topic>.md under controls/project-register).

  The frontmatter is the single source of truth for the structured fields of one
  register item: classification (item_type), processing status (item_status),
  priority, owner, dates and conclusion. The register list (pjr-index) is a derived
  view generated from these files, so the same field is never stored in two places.

  Conventions:
  - Undecided values are expressed by omitting the key. Table placeholders such as
    "_TODO_" and "-" belong to the rendered list, not to the frontmatter.
  - The display id (PJR-XXXX) is derived from `id`, and the title and summary are
    derived from the H1 and the body, so they are not duplicated as fields.
  - `status` is the document maturity (draft / ready / deprecated) shared by every
    deliverable. The processing status of the register item is `item_status`.
# SpecDojo が所有する frontmatter は `specdojo:` 名前空間配下に置く。
# トップレベルは第三者ツール（VitePress 等）のキーを許容するため制限しない。
type: object
required:
  - specdojo
properties:
  specdojo:
    type: object
    unevaluatedProperties: false
    allOf:
      - $ref: "./common-frontmatter.schema.yaml"
      # done / decided / rejected は register close / reject が完了日を記入する終端状態。
      # deferred は完了日を伴わない（register defer は日付を記録しない）ため対象外。
      - if:
          required:
            - item_status
          properties:
            item_status:
              $ref: "#/$defs/ClosedItemStatus"
        then:
          required:
            - completed_on
          # ajv strict の strictRequired は同じ subschema の properties しか参照しないため、
          # required と同じ位置で対象プロパティを宣言する。
          properties:
            completed_on: true
      - type: object
        required:
          - rulebook
          - part_of
          - item_type
          - item_status
          - priority
          - registered_on
        properties:
          id:
            type: string
            pattern: "^[a-z][a-z0-9-]*:pjr-[0-9abcdefghjkmnpqrstvwxyz]{4}-[a-z0-9-]+$"
            description: >
              Document id in the form <project-id>:pjr-XXXX-<topic>. The 4-character
              id part uses the PJR-ID alphabet (digits and letters without
              i / l / o / u) in lower case, and the display id PJR-XXXX is derived
              from it.

          type:
            const: "project"
            description: "Document type. Register items are project documents."

          status:
            description: >
              Document maturity (draft / ready / deprecated) defined in
              common-frontmatter.schema.yaml. It tracks whether the body is settled
              and is not a mirror of item_status.

          rulebook:
            $ref: "./common-frontmatter.schema.yaml#/$defs/rulebookRef"
            description: "Rulebook the item follows. Normally specdojo:pjr-rulebook."

          part_of:
            $ref: "./common-frontmatter.schema.yaml#/$defs/idRefArray"
            type: array
            minItems: 1
            description: >
              Register the item belongs to, as [<project-id>:pjr-index]. Used to
              group items when the list view is generated.

          item_type:
            $ref: "#/$defs/ItemType"
            description: "Classification of the register item (list column: 分類)."

          item_status:
            $ref: "#/$defs/ItemStatus"
            description: "Processing status of the item (list column: ステータス)."

          priority:
            $ref: "#/$defs/Priority"
            description: "Handling priority (list column: 優先度)."

          owner:
            type: string
            minLength: 1
            description: >
              Role code defined in pm-roles.yaml (e.g. ARC, PO) or the responsible
              member. Omit the key while the owner is undecided (list column: 担当).

          registered_on:
            $ref: "#/$defs/Date"
            description: >
              Date the item was registered, in the project register timezone
              (list column: 登録日).

          due_on:
            $ref: "#/$defs/Date"
            description: >
              Due date for the response or the decision. Omit the key when there is
              no due date or it is undecided (list column: 期限).

          completed_on:
            $ref: "#/$defs/Date"
            description: >
              Date the item was completed, decided or rejected. Required for the
              closed statuses and removed when the item is reopened
              (list column: 完了日).

          conclusion:
            type: string
            minLength: 1
            description: >
              One-sentence summary of the result at completion, decision or
              rejection. Omit the key while it is undetermined; the details stay in
              the body (list column: 結論).

$defs:
  ItemType:
    type: string
    enum:
      - todo
      - question
      - risk
      - issue
      - change-request
      - decision
      - note
    description: "Register item classification."

  ItemStatus:
    type: string
    enum:
      - open
      - in-progress
      - waiting
      - review
      - decided
      - done
      - deferred
      - rejected
    description: "Processing status of a register item."

  ClosedItemStatus:
    type: string
    enum:
      - decided
      - done
      - rejected
    description: >
      Statuses that record a completion date. deferred is terminal for state
      transitions but keeps no completion date.

  Priority:
    type: string
    enum:
      - high
      - medium
      - low
    description: "Handling priority of a register item."

  Date:
    type: string
    format: date
    description: >
      ISO date (YYYY-MM-DD). Write it as a quoted YAML string, because an unquoted
      date is loaded as a timestamp value instead of a string.
