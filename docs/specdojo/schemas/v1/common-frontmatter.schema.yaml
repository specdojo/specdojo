$schema: "https://json-schema.org/draft/2020-12/schema"
title: Common Front Matter
type: object
required:
  - id
  - type
  - status

$defs:
  idRef:
    type: string
    pattern: "^[a-z0-9][a-z0-9-:]*$"
    description: "英小文字・数字・ハイフン・コロンのみ。先頭は英小文字または数字。"
  idRefArray:
    type: array
    items:
      $ref: "#/$defs/idRef"
    uniqueItems: true
  rulebookRef:
    oneOf:
      - type: string
        const: none
      - type: string
        pattern: "^(?:[a-z][a-z0-9-]*:)?[a-z0-9][a-z0-9-]*-rulebook$"
    description: "準拠する rulebook の ID。該当がない場合は none。"
  recipeRef:
    oneOf:
      - type: string
        const: none
      - type: string
        pattern: "^(?:[a-z][a-z0-9-]*:)?[a-z0-9][a-z0-9-]*-recipe$"
    description: "対応する recipe の ID。該当がない場合は none。"
  sampleRef:
    oneOf:
      - type: string
        const: none
      - type: string
        pattern: "^(?:[a-z][a-z0-9-]*:)?[a-z0-9][a-z0-9-]*-sample$"
    description: "対応する sample の ID。該当がない場合は none。"
  templateRef:
    oneOf:
      - type: string
        const: none
      - type: string
        pattern: "^(?:[a-z][a-z0-9-]*:)?[a-z0-9][a-z0-9-]*-template$"
    description: "対応する template の ID。該当がない場合は none。"
  grade:
    type: object
    additionalProperties: false
    required:
      - rubric
      - target
      - verdict
      - score
      - graded_at
      - graded_by
      - content_hash
      - categories
      - viewpoints
      - findings
    properties:
      rubric:
        type: string
        pattern: "^[a-z][a-z0-9-]*$"
      target:
        enum: [kata, deliverable]
      verdict:
        enum: [pass, needs-work, fail]
      score:
        type: integer
        minimum: 0
        maximum: 100
      graded_at:
        type: string
        format: date-time
      graded_by:
        type: string
        minLength: 1
      content_hash:
        type: string
        pattern: "^[a-f0-9]{64}$"
      categories:
        type: object
        propertyNames:
          pattern: "^[a-z][a-z0-9_-]*$"
        additionalProperties:
          type: object
          additionalProperties: false
          required: [score]
          properties:
            score:
              type: integer
              minimum: 0
              maximum: 100
      viewpoints:
        type: object
        propertyNames:
          pattern: "^vp-[a-z][a-z0-9-]*$"
        additionalProperties:
          type: object
          additionalProperties: false
          required: [level, score]
          properties:
            level:
              type: integer
              minimum: 0
              maximum: 4
            score:
              type: integer
              minimum: 0
              maximum: 100
      findings:
        type: object
        additionalProperties: false
        required: [blocker, major, minor, note]
        properties:
          blocker: { type: integer, minimum: 0 }
          major: { type: integer, minimum: 0 }
          minor: { type: integer, minimum: 0 }
          note: { type: integer, minimum: 0 }
properties:
  id:
    $ref: "#/$defs/idRef"
    description: "一意なID"
  phase:
    type: string
    enum:
      - need # 要求
      - requirement # 要件
      - specification # 仕様
      - design # 設計
      - implement # 実装
    description: "対象フェーズ"
  type:
    type: string
    description: "ドキュメント種別"
  status:
    type: string
    # draft: 作成中
    # ready: 公開済み
    # deprecated: 廃止済み
    enum: ["draft", "ready", "deprecated"]
  part_of:
    $ref: "#/$defs/idRefArray"
    default: []
  based_on:
    $ref: "#/$defs/idRefArray"
    default: []
  supersedes:
    $ref: "#/$defs/idRefArray"
    default: []
  grade:
    $ref: "#/$defs/grade"
    description: "共通 viewpoint と rubric による最新の継続品質評価。履歴ではなく冪等な状態。"
