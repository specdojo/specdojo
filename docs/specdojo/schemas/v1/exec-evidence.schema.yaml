# exec-evidence.schema.yaml
$schema: "https://json-schema.org/draft/2020-12/schema"
title: "SpecDojo executor evidence schema"
description: >
  Bounded, structured evidence collected by the runner after an executor pipeline stage.
  Redacted and bounded agent and parent-validation output logs may be referenced for failure
  investigation; raw diffs and unbounded process logs are intentionally excluded.
type: object
additionalProperties: false
required:
  - schema_version
  - task_id
  - run_id
  - stage
  - changes
  - diff_summary
  - validations
  - final_message
  - log_refs
properties:
  schema_version:
    const: 1
  task_id:
    type: string
    minLength: 1
  run_id:
    type: string
    minLength: 1
  stage:
    type: object
    additionalProperties: false
    required: [role, actor, status, started_at, completed_at, exit_code, attempts]
    properties:
      role:
        const: executor
      actor:
        type: string
        minLength: 1
      status:
        type: string
        enum: [succeeded, failed, rate_limited]
      started_at:
        type: string
        format: date-time
      completed_at:
        type: string
        format: date-time
      exit_code:
        type: [integer, "null"]
      attempts:
        type: integer
        minimum: 1
  changes:
    type: array
    maxItems: 1000
    items:
      type: object
      additionalProperties: false
      required: [path, status]
      properties:
        path:
          type: string
          minLength: 1
        status:
          type: string
          minLength: 1
  attempt_changes:
    description: >
      Files materially changed during this executor attempt. Pre-existing worktree changes are
      excluded so an interrupted first attempt can provide a lower-bound coverage set on resume.
    type: array
    maxItems: 1000
    items:
      type: object
      additionalProperties: false
      required: [path, status]
      properties:
        path:
          type: string
          minLength: 1
        status:
          type: string
          minLength: 1
  diff_summary:
    type: object
    additionalProperties: false
    required: [files_changed, summary]
    properties:
      files_changed:
        type: integer
        minimum: 0
      summary:
        type: string
        maxLength: 4000
  validations:
    type: array
    maxItems: 50
    items:
      type: object
      additionalProperties: false
      required: [command, status, summary]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
        source:
          type: string
          enum: [executor, runner]
        repo:
          type: string
          pattern: "^[a-z0-9-]+$"
          description: >
            Repository whose worktree was the cwd of a runner validation: `project` for the
            project repository or a product repository name from `projects.<id>.repos`. Recorded
            when the task spans product repositories or the validation is assigned to one.
        command:
          type: string
          minLength: 1
          maxLength: 500
        status:
          type: string
          enum: [passed, failed, not_run, not_applicable, requires_human]
          description: >
            Executor validations may use requires_human only for checks that cannot run in the
            agent sandbox. The runner preserves those checks as human handoff items without
            treating them as validation failures. Executor validations may use not_applicable
            only when the repository does not meet the check's applicability conditions, and
            must explain why in reason.
        summary:
          type: string
          maxLength: 1000
        reason:
          type: string
          minLength: 1
          maxLength: 1000
      allOf:
        - if:
            required: [source]
            properties:
              source:
                const: runner
          then:
            required: [id]
        - if:
            required: [status]
            properties:
              status:
                const: not_applicable
          then:
            required: [reason]
  target_coverage:
    description: >
      Per-target disposition reported by an executor. On resume the runner requires complete
      coverage of declared plan targets, or of the interrupted first attempt's lower-bound change
      set when a register plan declares no targets. Changed targets identify a repository-relative
      path; unchanged targets carry the reason preserved in the result.
    type: array
    maxItems: 1000
    items:
      type: object
      additionalProperties: false
      required: [target, status, reason]
      properties:
        target:
          type: string
          minLength: 1
          maxLength: 1000
        status:
          type: string
          enum: [changed, unchanged]
        path:
          type: string
          minLength: 1
          maxLength: 1000
        reason:
          type: string
          maxLength: 1000
  rate_limit_events:
    description: Runner-recorded wait/fallback history for a pinned executor.
    type: array
    items:
      type: object
      additionalProperties: false
      required: [action, from_actor, to_actor, resumed_at]
      properties:
        action:
          type: string
          enum: [wait, fallback]
        from_actor:
          type: string
          minLength: 1
        to_actor:
          type: string
          minLength: 1
        resumed_at:
          type: string
          format: date-time
        resume_at:
          type: string
          format: date-time
  final_message:
    type: string
    maxLength: 4000
  block_reason:
    description: >
      Runner-derived failure or protection reason. Reporter prose never supplies this field.
    type: string
    minLength: 1
    maxLength: 1000
  command:
    description: >
      Runner-executed deterministic Job command, stream references, and optional redacted,
      bounded stream content. stdout and stderr are optional for compatibility with evidence
      recorded before inline command output was introduced.
    type: object
    additionalProperties: false
    required: [shell, value, exit_code, stdout_ref, stderr_ref]
    properties:
      shell:
        type: string
        minLength: 1
      value:
        type: string
        minLength: 1
        maxLength: 16000
      exit_code:
        type: [integer, "null"]
      stdout_ref:
        type: string
        minLength: 1
      stderr_ref:
        type: string
        minLength: 1
      stdout:
        type: string
        maxLength: 65536
      stderr:
        type: string
        maxLength: 65536
  log_refs:
    type: array
    maxItems: 1000
    items:
      type: object
      additionalProperties: false
      required: [kind, path, bytes, truncated]
      properties:
        kind:
          enum:
            - agent-output-excerpt
            - command-stdout
            - command-stderr
            - parent-validation-output
        path:
          type: string
          minLength: 1
        bytes:
          type: integer
          minimum: 0
          maximum: 5500000
        truncated:
          type: boolean
      allOf:
        - if:
            properties:
              kind:
                const: parent-validation-output
          else:
            properties:
              bytes:
                maximum: 65536
