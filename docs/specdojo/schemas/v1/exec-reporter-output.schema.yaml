# exec-reporter-output.schema.yaml
$schema: "https://json-schema.org/draft/2020-12/schema"
title: "SpecDojo reporter output schema"
description: >
  Structured output produced by the reporter pipeline stage. The runner validates this object
  before combining it with evidence-derived facts and rendering result Markdown. The runner owns
  all result frontmatter fields, outcome, block_reason, and the authoritative changed-file list.
  Reporter descriptions carry evidence paths only as correlation keys.
oneOf:
  - $ref: "#/$defs/edit"
  - $ref: "#/$defs/review"
$defs:
  text:
    type: string
    minLength: 1
    maxLength: 4000
  edit:
    type: object
    additionalProperties: false
    required:
      - schema_version
      - mode
      - summary
      - changed_files
      - handoff
      - approach
    properties:
      schema_version:
        const: 1
      mode:
        const: edit
      summary:
        type: array
        minItems: 1
        maxItems: 100
        items:
          $ref: "#/$defs/text"
      changed_files:
        type: array
        maxItems: 1000
        items:
          type: object
          additionalProperties: false
          required: [path, summary]
          properties:
            path:
              $ref: "#/$defs/text"
            summary:
              $ref: "#/$defs/text"
      handoff:
        type: array
        maxItems: 100
        items:
          $ref: "#/$defs/text"
      approach:
        $ref: "#/$defs/text"
  review:
    type: object
    additionalProperties: false
    required:
      - schema_version
      - mode
      - grade_check
      - rationale
      - improvements
      - approach
      - verdict
    description: >
      Review does not re-grade the deliverable. It records the stored grade result it relied on,
      the rationale for the task completion judgement, improvement instructions, and a verdict
      that maps one-to-one to the acceptance viewpoints of bps-task-completion.
    properties:
      schema_version:
        const: 1
      mode:
        const: review
      grade_check:
        $ref: "#/$defs/text"
      rationale:
        type: array
        minItems: 1
        maxItems: 100
        items:
          $ref: "#/$defs/text"
      improvements:
        type: array
        maxItems: 100
        items:
          $ref: "#/$defs/text"
      approach:
        $ref: "#/$defs/text"
      verdict:
        type: string
        enum:
          - complete
          - complete-with-findings
          - incomplete
          - grade-stale
          - grade-unavailable
          - changed-during-review
