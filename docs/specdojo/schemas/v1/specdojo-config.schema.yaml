$schema: "https://json-schema.org/draft/2020-12/schema"
title: SpecDojo Config (.specdojo/specdojo.config.json)
description: >-
  Shape of .specdojo/specdojo.config.json. The CLI (src/shared/specdojo-config.ts loadConfig) is the
  authority for checks that a schema cannot express: repository names that collide with a
  project id and repository paths that do not exist.
type: object
required:
  - version
  - projects
properties:
  version:
    const: 1
  current_project:
    type: string
    minLength: 1
  agent_members_path:
    description: Repository-wide protected agent registry path.
    type: string
    pattern: "^(?!.*(?:^|/)\\.\\.(?:/|$))\\.specdojo/.+\\.ya?ml$"
  projects:
    type: object
    additionalProperties:
      $ref: "#/$defs/Project"
$defs:
  NonEmptyString:
    type: string
    pattern: "\\S"
  ParentValidationId:
    type: string
    enum:
      [
        validate-schema,
        typecheck,
        test-unit,
        test-integration,
        lint-ts,
        lint-fm,
        lint-md,
        build,
        format-check,
      ]
  ParentValidation:
    oneOf:
      - $ref: "#/$defs/ParentValidationId"
      - type: object
        additionalProperties: false
        required: [id, repo]
        properties:
          id:
            $ref: "#/$defs/ParentValidationId"
          repo:
            type: string
            pattern: "^[a-z0-9-]+$"
  Project:
    type: object
    properties:
      base_path:
        type: string
      integration_branch:
        description: >-
          Branch that receives direct project-register commits. Defaults to
          project/<project-id>/develop.
        $ref: "#/$defs/NonEmptyString"
      catalog_path:
        type: string
      schedule_path:
        $ref: "#/$defs/NonEmptyString"
      execution_path:
        $ref: "#/$defs/NonEmptyString"
      timeline_path:
        type: string
      members_path:
        type: string
      roles_path:
        type: string
      viewpoints_path:
        type: string
      project_register_path:
        type: string
      routines_path:
        type: string
      jobs_path:
        type: string
      project_context:
        type: array
        items:
          $ref: "#/$defs/NonEmptyString"
      repos:
        description: >-
          Product repositories that tasks of this project may change. The project repository is
          implicit and is not declared. Names must be unique within the project.
        type: array
        items:
          $ref: "#/$defs/Repo"
      run:
        $ref: "#/$defs/Run"
  Repo:
    type: object
    additionalProperties: false
    required:
      - name
      - path
    properties:
      name:
        description: >-
          Prefix used in targets/paths as <name>:<path>. "project" is reserved for the project
          repository worktree (<worktree_base>/<task-id>/project/).
        type: string
        pattern: "^[a-z0-9-]+$"
        not:
          const: project
      path:
        description: Repository root, relative to the SpecDojo root.
        type: string
        pattern: "\\S"
        not:
          pattern: "^(/|[A-Za-z]:[\\\\/])"
      integration_branch:
        description: Branch exec integrates into. Omit to use the repository's current branch.
        $ref: "#/$defs/NonEmptyString"
      setup:
        description: Whether exec installs dependencies and builds in the repository worktree.
        type: object
        additionalProperties: false
        properties:
          install:
            type: boolean
          build:
            type: boolean
  Run:
    type: object
    properties:
      exec_defaults:
        type: string
      agent_config:
        type: string
      parent_validations:
        description: >-
          Parent-runner validations appended, in order, to pipeline.parent_validations from this
          project's exec_defaults file. A plain ID targets the project repository; { id, repo }
          targets project or a product repository declared by this project.
        type: array
        uniqueItems: true
        items:
          $ref: "#/$defs/ParentValidation"
      worktree_base:
        type: string
      register_date_timezone:
        type: string
