name: Check register branch push
on:
  push:
    branches:
      - "project/*/register"
permissions:
  contents: read
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # project はブランチ名（project/<project-id>/register）から取る（prj-0001 と prj-0002 で共有する）。
      - name: Check register branch push
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          project="${GITHUB_REF_NAME#project/}"
          project="${project%/register}"
          node --import tsx src/specdojo.ts register branch-check --project "$project" \
            --commit "$GITHUB_SHA" --base "$BEFORE" --remote-ref "$GITHUB_REF"
