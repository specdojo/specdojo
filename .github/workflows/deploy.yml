name: Deploy VitePress site to GitHub Pages

# サイトはリリースした版の文書を公開する。main への昇格では更新せず、specdojo のリリースタグ
# （v*）の push か手動実行で更新する。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Verify the release ref
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME ($GITHUB_SHA) is not on main. Deploy a commit that has been promoted to main." >&2
            exit 1
          fi

      - name: Install Japanese fonts for mermaid
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji

      - name: Install pinned D2 CLI
        run: |
          sh .devcontainer/install-d2.sh "$RUNNER_TEMP/d2-bin"
          echo "$RUNNER_TEMP/d2-bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Install documentation site dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm --prefix packages/docs-site ci

      - name: Resolve system Chrome for puppeteer (mermaid)
        run: |
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$chrome_path" ]; then
            echo "No system Chrome/Chromium found on the runner" >&2
            exit 1
          fi
          echo "Using Chrome: $chrome_path"
          echo "PUPPETEER_SKIP_DOWNLOAD=true" >> "$GITHUB_ENV"
          echo "PUPPETEER_EXECUTABLE_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Validate D2 diagrams
        run: node tools/lint-d2.mjs

      - name: Test real D2 rendering and validation
        run: npm run test:integration -- tests/tools/d2-cli.integration.test.ts

      # 既定のヒープ（環境により約 2 GB）では VitePress のビルドがメモリ不足で落ちる
      # （2026-10-11、2,536 文書で確認。4 GB で通過）。
      - name: Build VitePress site
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
