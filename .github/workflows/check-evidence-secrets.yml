name: Check evidence for secrets

# 追跡中の実行記録（plan / result / evidence / log）に認証情報が残っていないかを検査する
# （PJR-FMA4）。hook を飛ばした commit や、hook のない環境からの push もここで止める。
# 検査のスクリプトは Node 標準だけで動くため、依存はインストールしない。
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Scan tracked execution records
        run: node tools/check-evidence-secrets.mjs --tracked
